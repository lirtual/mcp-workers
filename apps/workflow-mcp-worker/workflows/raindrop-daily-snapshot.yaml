version: 1
id: raindrop-daily-snapshot
name: Daily Raindrop snapshot
description: Fetch the latest 20 Raindrop bookmarks through the fixed read-only MCP connection.
triggers:
  - type: manual
  - type: schedule
    id: rapid-canary
    cron: "15 17 21 9 *"
    timezone: Asia/Shanghai
    misfire: latest
  - type: schedule
    id: daily-nine
    cron: "0 9 * * *"
    timezone: Asia/Shanghai
    misfire: latest
steps:
  fetch:
    uses: mcp.call
    with:
      connection: raindrop
      tool: list_raindrops
      arguments:
        collectionId: 0
        page: 0
        perPage: 20
        sort: "-created"
        skipCache: true
outputs:
  bookmarks: "${{ steps.fetch.outputs.result.structuredContent.items }}"
  count: "${{ steps.fetch.outputs.result.structuredContent.count }}"
