[package]
name = "rca-native-agent"
version = "0.0.0"
edition = "2021"
publish = false
description = "Nonproduction Rust migration candidate for the RCA native Agent"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
libc = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5"
ryu-js = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
pkcs8 = { version = "0.10", features = ["pem"] }
tempfile = "3.0"
