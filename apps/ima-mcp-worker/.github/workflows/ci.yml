name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/remove-d1-single-user

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
