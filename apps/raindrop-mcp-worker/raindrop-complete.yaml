openapi: 3.1.0
info:
  title: Raindrop.io API
  description: Restricted REST route definitions for the Raindrop MCP v3 26-tool contract (not the complete Raindrop API)
  version: 3.0.0
  contact:
    name: Raindrop.io API
    url: https://developer.raindrop.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.raindrop.io/rest/v1
    description: Raindrop.io REST API

security:
  - BearerAuth: []

paths:
  /user:
    get:
      operationId: getUserProfile
      summary: Get user profile
      description: Retrieves the authenticated user's profile information
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'

  /user/stats:
    get:
      operationId: getUserStats
      summary: Get user statistics
      description: Retrieves account-wide statistics for the authenticated user
      responses:
        '200':
          description: User statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # Collection endpoints

  /collections:
    get:
      operationId: getAllCollections
      summary: Get all collections
      description: Retrieves all collections for the authenticated user
      responses:
        '200':
          description: Collections retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /collections/childrens:
    get:
      operationId: getChildCollections
      summary: Get all child collections
      description: Retrieves child collections for the authenticated user
      responses:
        '200':
          description: Child collections retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /collection:
    post:
      operationId: createCollection
      summary: Create a new collection
      description: Creates a new collection with the specified properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /collection/{id}:
    get:
      operationId: getCollection
      summary: Get collection details
      description: Retrieves detailed information about a specific collection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Collection retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      operationId: updateCollection
      summary: Update a collection
      description: Updates properties of an existing collection
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
      responses:
        '200':
          description: Collection updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemResponse'

    delete:
      operationId: deleteCollection
      summary: Delete a collection
      description: Permanently deletes a collection and all its bookmarks
      parameters:
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Collection deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /collection/-99:
    delete:
      operationId: emptyTrash
      summary: Permanently empty current Trash
      description: Deletes all items currently in Trash; the MCP v3 tool requires explicit confirmation
      responses:
        '200':
          description: Trash emptied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /raindrops/{collectionId}:
    get:
      operationId: getBookmarksByCollection
      summary: Get bookmarks from a collection
      description: Retrieves bookmarks from a specific collection with filtering options
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
          description: Collection ID
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - name: nested
          in: query
          schema:
            type: boolean
          description: Include nested collections
      responses:
        '200':
          description: Bookmarks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarksResponse'

    put:
      operationId: batchUpdateBookmarksInCollection
      summary: Update multiple bookmarks in a collection
      description: Update properties of multiple bookmarks in a specific collection at once
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
          description: Collection ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateBookmarksRequest'
      responses:
        '200':
          description: Bookmarks updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'

    delete:
      operationId: batchDeleteBookmarksInCollection
      summary: Delete multiple bookmarks or empty collection
      description: Delete multiple bookmarks in a specific collection or empty trash/collection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
          description: Collection ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  description: Array of bookmark IDs to delete
      responses:
        '200':
          description: Bookmarks deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'

  /raindrop:
    post:
      operationId: createBookmark
      summary: Add a new bookmark
      description: Creates a new bookmark with automatic metadata extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmarkRequest'
      responses:
        '201':
          description: Bookmark created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /raindrop/{id}:
    get:
      operationId: getBookmark
      summary: Get bookmark by ID
      description: Retrieves detailed information about a specific bookmark
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      responses:
        '200':
          description: Bookmark retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkItemResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      operationId: updateBookmark
      summary: Update a bookmark
      description: Updates properties of an existing bookmark
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookmarkRequest'
      responses:
        '200':
          description: Bookmark updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkItemResponse'

  /raindrop/suggest:
    post:
      operationId: suggestForUrl
      summary: Suggest tags and collections for a new URL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link:
                  type: string
                  format: uri
      responses:
        '200':
          description: Suggestions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsResponse'

  /raindrop/{id}/suggest:
    get:
      operationId: suggestForBookmark
      summary: Suggest tags and collections for an existing bookmark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Suggestions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsResponse'

  /highlights:
    get:
      operationId: getAllHighlights
      summary: Get all highlights
      description: Retrieves all highlights from a user's bookmarks with pagination
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: perpage
          in: query
          schema:
            type: integer
            default: 25
            maximum: 50
          description: Number of highlights per page (max 50)
      responses:
        '200':
          description: Highlights retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HighlightsResponse'

  /highlights/{collectionId}:
    get:
      operationId: getHighlightsByCollection
      summary: Get all highlights in a collection
      description: Retrieves all highlights from bookmarks in a specific collection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
          description: Collection ID
        - $ref: '#/components/parameters/Page'
        - name: perpage
          in: query
          schema:
            type: integer
            default: 25
            maximum: 50
          description: Number of highlights per page (max 50)
      responses:
        '200':
          description: Collection highlights retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HighlightsResponse'

  # Tags

  /tags:
    get:
      operationId: getAllTags
      summary: Get all tags used in bookmarks
      description: Retrieves all unique tags used in the user's bookmarks
      responses:
        '200':
          description: Tags retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'

    put:
      operationId: renameOrMergeAllTagsV3
      summary: Rename or merge tags globally
      description: Rename or merge tags across all collections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagOperationRequest'
      responses:
        '200':
          description: Tag operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'

    delete:
      operationId: deleteAllTagsV3
      summary: Delete multiple tags globally
      description: Delete multiple tags from all bookmarks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: Array of tag names to delete
              required:
                - tags
      responses:
        '200':
          description: Tags deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'

  /tags/{collectionId}:
    get:
      operationId: getTagsByCollection
      summary: Get tags from a specific collection
      description: Retrieves all tags used in bookmarks within a specific collection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Collection tags retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'

    put:
      operationId: renameOrMergeCollectionTags
      summary: Rename or merge tags in a collection
      description: Rename or merge tags within a specific collection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagOperationRequest'
      responses:
        '200':
          description: Tag operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'

    delete:
      operationId: deleteCollectionTags
      summary: Delete tags from a collection
      description: Delete multiple tags from bookmarks in a specific collection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: Array of tag names to delete
              required:
                - tags
      responses:
        '200':
          description: Tags deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'

  # Import/Export


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Raindrop.io API access token

  parameters:
    CollectionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Collection ID

    BookmarkId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Bookmark ID

    SearchQuery:
      name: search
      in: query
      schema:
        type: string
      description: Search query for filtering results

    SortOrder:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - -created
          - created
          - score
          - -sort
          - title
          - -title
          - domain
          - -domain
        default: -created
      description: Sort order for results

    TagFilter:
      name: tag
      in: query
      schema:
        type: string
      description: Filter by specific tag

    ImportantFilter:
      name: important
      in: query
      schema:
        type: boolean
      description: Filter by important flag

    DuplicatesFilter:
      name: duplicates
      in: query
      schema:
        type: boolean
      description: Filter by duplicates

    BrokenFilter:
      name: broken
      in: query
      schema:
        type: boolean
      description: Filter by broken links

    NotagFilter:
      name: notag
      in: query
      schema:
        type: boolean
      description: Filter by items without tags

    HighlightFilter:
      name: highlight
      in: query
      schema:
        type: boolean
      description: Filter by presence of highlights

    DomainFilter:
      name: domain
      in: query
      schema:
        type: string
      description: Filter by domain

    CollectionFilter:
      name: collection
      in: query
      schema:
        type: integer
      description: Filter by collection ID

    PerPage:
      name: perpage
      in: query
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 50
      description: Number of items per page

    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Page number for pagination

  responses:
    BadRequestError:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedError:
      description: Unauthorized - invalid or missing access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimitError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Core entity schemas
    Collection:
      type: object
      properties:
        _id:
          type: integer
          description: Collection ID
        title:
          type: string
          description: Collection title
        description:
          type: string
          description: Collection description
        color:
          type: string
          description: Collection color theme
        count:
          type: integer
          description: Number of bookmarks in collection
        public:
          type: boolean
          description: Whether collection is public
        parent:
          type: object
          properties:
            $id:
              type: integer
          description: Parent collection reference
        expanded:
          type: boolean
          description: Whether collection is expanded in UI
        sort:
          type: string
          description: Sort order within parent
        access:
          type: object
          description: Access control settings
        created:
          type: string
          format: date-time
          description: Creation timestamp
        lastUpdate:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - _id
        - title

    Bookmark:
      type: object
      properties:
        _id:
          type: integer
          description: Bookmark ID
        link:
          type: string
          format: uri
          description: Bookmark URL
        title:
          type: string
          description: Bookmark title
        excerpt:
          type: string
          description: Bookmark description/excerpt
        note:
          type: string
          description: User notes for the bookmark
        type:
          type: string
          enum: [link, article, image, video, document, audio]
          description: Type of bookmark content
        cover:
          type: string
          format: uri
          description: Cover image URL
        tags:
          type: array
          items:
            type: string
          description: Array of tags
        important:
          type: boolean
          description: Whether bookmark is marked as important
        reminder:
          type: object
          properties:
            date:
              type: string
              format: date-time
            note:
              type: string
          description: Reminder settings
        removed:
          type: boolean
          description: Whether bookmark is in trash
        created:
          type: string
          format: date-time
          description: Creation timestamp
        lastUpdate:
          type: string
          format: date-time
          description: Last update timestamp
        domain:
          type: string
          description: Domain of the bookmark URL
        creatorRef:
          type: integer
          description: User ID of creator
        collection:
          type: object
          properties:
            $id:
              type: integer
            title:
              type: string
          description: Collection reference
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/Highlight'
          description: Text highlights for this bookmark
        media:
          type: array
          items:
            type: object
            properties:
              link:
                type: string
                format: uri
          description: List of media/covers associated with the raindrop
        cache:
          type: object
          properties:
            status:
              type: string
              enum: [ready, retry, failed]
            size:
              type: integer
            created:
              type: string
              format: date-time
          description: Details about the permanent copy (cached version)
      required:
        - _id
        - link
        - title

    Highlight:
      type: object
      properties:
        _id:
          type: string
          description: Unique highlight ID
        text:
          type: string
          description: Highlighted text content
        note:
          type: string
          description: Optional note for the highlight
        color:
          type: string
          enum: [blue, brown, cyan, gray, green, indigo, orange, pink, purple, red, teal, yellow]
          default: yellow
          description: Highlight color
        created:
          type: string
          format: date-time
          description: Creation timestamp
        lastUpdate:
          type: string
          format: date-time
          description: Last update timestamp
        title:
          type: string
          description: Title of the parent bookmark
        link:
          type: string
          format: uri
          description: URL of the parent bookmark
        domain:
          type: string
          description: Domain of the parent bookmark
        excerpt:
          type: string
          description: Context around the highlight
        tags:
          type: array
          items:
            type: string
          description: Tags from the parent bookmark
        raindrop:
          type: object
          properties:
            _id:
              type: integer
            title:
              type: string
            link:
              type: string
            collection:
              type: object
              properties:
                $id:
                  type: integer
          description: Reference to parent bookmark
      required:
        - _id
        - text

    Tag:
      type: object
      properties:
        _id:
          type: string
          description: Tag name
        count:
          type: integer
          description: Number of bookmarks with this tag
      required:
        - _id
        - count

    User:
      type: object
      properties:
        _id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
          description: User email address
        fullName:
          type: string
          description: User's full name
        avatar:
          type: string
          format: uri
          description: Avatar image URL
        pro:
          type: boolean
          description: Whether user has Pro subscription
        proExpire:
          type: string
          format: date-time
          description: Pro subscription expiration date
        registered:
          type: string
          format: date-time
          description: Registration date
        lastUpdate:
          type: string
          format: date-time
          description: Last profile update
      required:
        - _id
        - email

    # Request schemas
    CreateCollectionRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Collection title
        public:
          type: boolean
          description: Whether collection should be public
        parent:
          type: object
          properties:
            $id:
              type: integer
          description: Parent collection reference
        color:
          type: string
          description: Collection color theme
        description:
          type: string
          description: Collection description
      required:
        - title

    UpdateCollectionRequest:
      type: object
      properties:
        title:
          type: string
          description: Collection title
        public:
          type: boolean
          description: Whether collection should be public
        parent:
          type: object
          properties:
            $id:
              type: integer
          description: Parent collection reference
        color:
          type: string
          description: Collection color theme
        description:
          type: string
          description: Collection description

    ShareCollectionRequest:
      type: object
      properties:
        level:
          type: string
          enum: [view, edit, remove]
          description: Sharing permission level
        emails:
          type: array
          items:
            type: string
            format: email
          description: Email addresses to share with
      required:
        - level

    CreateBookmarkRequest:
      type: object
      properties:
        link:
          type: string
          format: uri
          description: Bookmark URL
        title:
          type: string
          description: Bookmark title (auto-extracted if not provided)
        excerpt:
          type: string
          description: Bookmark description
        note:
          type: string
          description: User notes for the bookmark
        tags:
          type: array
          items:
            type: string
          description: Array of tags
        important:
          type: boolean
          description: Whether bookmark is important
        collection:
          type: object
          properties:
            $id:
              type: integer
          description: Target collection reference
        pleaseParse:
          type: object
          description: Settings for content parsing
      required:
        - link

    UpdateBookmarkRequest:
      type: object
      properties:
        link:
          type: string
          format: uri
          description: Bookmark URL
        title:
          type: string
          description: Bookmark title
        excerpt:
          type: string
          description: Bookmark description
        note:
          type: string
          description: User notes
        tags:
          type: array
          items:
            type: string
          description: Array of tags
        important:
          type: boolean
          description: Whether bookmark is important
        collection:
          type: object
          properties:
            $id:
              type: integer
          description: Target collection reference
        highlights:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              text:
                type: string
              note:
                type: string
              color:
                type: string
                enum: [blue, brown, cyan, gray, green, indigo, orange, pink, purple, red, teal, yellow]
          description: One-element v3 highlight mutation payload
        cover:
          type: string
          format: uri
          description: Cover image URL

    BatchUpdateBookmarksRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          description: Array of bookmark IDs to update
        tags:
          type: array
          items:
            type: string
          description: Tags to set on bookmarks
        collection:
          type: object
          properties:
            $id:
              type: integer
          description: Collection to move bookmarks to
        important:
          type: boolean
          description: Whether bookmarks should be marked important
        broken:
          type: boolean
          description: Whether bookmarks should be marked as broken
      required:
        - ids

    BulkMoveBookmarksRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          description: Array of bookmark IDs to move
        collection:
          type: object
          properties:
            $id:
              type: integer
          description: Target collection
      required:
        - ids
        - collection

    BatchTagBookmarksRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          description: Array of bookmark IDs
        tags:
          type: array
          items:
            type: string
          description: Tags to add or remove
        replace:
          type: boolean
          default: false
          description: Whether to replace existing tags or add to them
      required:
        - ids
        - tags

    SetReminderRequest:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: Reminder date and time
        note:
          type: string
          description: Optional reminder note
      required:
        - date

    CreateHighlightRequest:
      type: object
      properties:
        raindrop:
          type: object
          properties:
            $id:
              type: integer
          description: Bookmark reference
        text:
          type: string
          description: Highlighted text
        note:
          type: string
          description: Optional note for the highlight
        color:
          type: string
          enum: [blue, brown, cyan, gray, green, indigo, orange, pink, purple, red, teal, yellow]
          default: yellow
          description: Highlight color
      required:
        - raindrop
        - text

    UpdateHighlightRequest:
      type: object
      properties:
        text:
          type: string
          description: Updated highlight text
        note:
          type: string
          description: Updated note
        color:
          type: string
          enum: [blue, brown, cyan, gray, green, indigo, orange, pink, purple, red, teal, yellow]
          description: Updated highlight color

    TagOperationRequest:
      type: object
      properties:
        from:
          type: string
          description: Original tag name (for rename operation)
        to:
          type: string
          description: New tag name
        tags:
          type: array
          items:
            type: string
          description: Array of tag names (for merge operation)

    ImportBookmarksRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: Bookmarks file to import
        collection:
          type: string
          description: Collection ID to import into
        format:
          type: string
          enum: [html, csv, pocket, instapaper, netscape, readwise]
          description: Format of the import file
        mode:
          type: string
          enum: [add, replace]
          default: add
          description: Import mode
        parse:
          type: boolean
          default: true
          description: Whether to parse content during import
      required:
        - file

    ImportFromUrlRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL of bookmarks file to import
        parse:
          type: boolean
          default: true
          description: Whether to parse imported bookmarks
        collection:
          type: object
          properties:
            $id:
              type: integer
            title:
              type: string
          description: Collection details to import into
      required:
        - url

    ExportBookmarksRequest:
      type: object
      properties:
        collection:
          type: integer
          description: Collection ID to export (omit for all bookmarks)
        format:
          type: string
          enum: [csv, html, pdf]
          description: Export format
        broken:
          type: boolean
          default: false
          description: Include broken bookmarks
        duplicates:
          type: boolean
          default: false
          description: Include duplicate bookmarks
      required:
        - format

    # Response schemas
    UserProfileResponse:
