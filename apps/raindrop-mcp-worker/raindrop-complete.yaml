        stats:
          type: object
          properties:
            bookmarks:
              type: integer
            collections:
              type: integer
            highlights:
              type: integer
            tags:
              type: integer
            trash:
              type: integer
      required:
        - result

    CollectionStatsResponse:
      type: object
      properties:
        result:
          type: boolean
        stats:
          type: object
          properties:
