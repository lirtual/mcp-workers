                  }
                }
                $current = Get-ScheduledTask -TaskName $taskName
                $nativeLive = @(Get-CimInstance Win32_Process -Filter "Name = 'rca-standard-windows-candidate.exe'" |
                  Where-Object { $_.ExecutablePath -and [string]::Equals($_.ExecutablePath,$nativeExe,[StringComparison]::OrdinalIgnoreCase) })
                $oldLive = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" |
                  Where-Object { $_.ExecutablePath -and [string]::Equals($_.ExecutablePath,$publishedNode,[StringComparison]::OrdinalIgnoreCase) })
                if ($current.State -ne 'Running' -or
                    [string]$current.Actions[0].Execute -cne $originalAction -or
                    [string]$current.Actions[0].Arguments -cne $originalArguments -or
                    $nativeLive.Count -ne 0 -or $oldLive.Count -ne 1 -or
                    (Get-FileHash -LiteralPath $device -Algorithm SHA256).Hash -ne $origId -or
                    (Get-FileHash -LiteralPath $key -Algorithm SHA256).Hash -ne $origKey -or
                    (Test-Path -LiteralPath $nativeJournal)) {
                  throw 'Restoration did not preserve the original Task, process and identity'
                }
                if ($interrupted) { Write-Output 'WINDOWS_NATIVE_INTERRUPTED_UPGRADE_RECOVERY_PASS' }
                else { Write-Output 'WINDOWS_NATIVE_MISSING_WSS_ROLLBACK_PASS' }
              } finally {
                if (-not $switch.HasExited) { $switch.Kill(); $null = $switch.WaitForExit(10000) }
              }
            }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'apps/remote-control-mcp-worker/agent/uninstall-windows.ps1' -Version $nativeVersion
            if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $nativeDir)) {
              throw 'Inactive Node-free candidate could not be removed safely'
            }
            $unchanged = Get-ScheduledTask -TaskName $taskName
            if ($unchanged.State -ne 'Running' -or
                [string]$unchanged.Actions[0].Execute -cne $originalAction -or
                [string]$unchanged.Actions[0].Arguments -cne $originalArguments -or
                (Get-FileHash -LiteralPath $device -Algorithm SHA256).Hash -ne $origId -or
                (Get-FileHash -LiteralPath $key -Algorithm SHA256).Hash -ne $origKey) {
              throw 'Native-only staging/removal changed the active task or identity'
            }
            Write-Output 'WINDOWS_NATIVE_ONLY_STAGE_AND_INACTIVE_UNINSTALL_PASS'

            if ((Get-FileHash -LiteralPath $device -Algorithm SHA256).Hash -ne $origId -or
                (Get-FileHash -LiteralPath $key -Algorithm SHA256).Hash -ne $origKey) {
              throw 'Windows upgrade or rollback changed protected identity'
            }
            & $program disable
            if ($LASTEXITCODE -ne 0) {
              # CI-only: isolate a CLI/private-store refusal from a native
              # Task-Scheduler backend failure without printing credentials.
              $privateScript = Join-Path $oldDir 'apps/remote-control-agent/scripts/windows-private-store.ps1'
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $privateScript -Action Check -Directory $root *> $null
              Write-Output ('CI CLEANUP PRIVATE ACL: ' + $(if ($LASTEXITCODE -eq 0) {'PASS'} else {'REFUSED'}))
              $taskBackend = Join-Path $oldDir 'apps/remote-control-agent/scripts/windows-user-task.ps1'
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $taskBackend -Action Status
              Write-Output ('CI CLEANUP TASK BACKEND: ' + $(if ($LASTEXITCODE -eq 0) {'PASS'} else {'REFUSED'}))
              throw 'Task removal failed'
            }
            $created = $false
            $status = & $program task-status | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $status.installed -ne $false) { throw 'Task remained after removal' }
            # Task Scheduler may report disabled before its launched process
            # has released the packaged executable. An in-use file must never
            # be uninstalled; verify actual process exit with a bounded readback.
            $publishedPrefix = [IO.Path]::GetFullPath($publishedDir).TrimEnd('\') + '\'
            $remainingPublished = @()
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $remainingPublished = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe' OR Name = 'rca-background.exe'" -ErrorAction Stop |
                Where-Object {
                  $executable = [string]$_.ExecutablePath
                  $executable.StartsWith($publishedPrefix,[StringComparison]::OrdinalIgnoreCase)
                })
              if ($remainingPublished.Count -eq 0) { break }
              Start-Sleep -Milliseconds 250
            }
            if ($remainingPublished.Count -ne 0) {
              throw 'Task disable left published Node runtime processes active; refuse uninstall'
            }
            $readHistory = @'
          const {DatabaseSync}=require('node:sqlite');
          const db=new DatabaseSync(process.argv[1],{readOnly:true});
          const r=db.prepare("SELECT state,argument_digest,guarded FROM receipts WHERE operation_id=?").get(process.argv[2]);
          db.close();
          if(!r||r.state!=="unknown"||r.argument_digest!=="a".repeat(64)||r.guarded!==1)process.exit(1);
          '@
            & $publishedNode -e $readHistory $history $historyId
            if ($LASTEXITCODE -ne 0) { throw 'Original guarded Unknown receipt was lost or changed' }
            Write-Output 'WINDOWS_NATIVE_UPGRADE_UNKNOWN_PRESERVED'
          } finally {
            $pendingJournal = Join-Path $root 'windows-native-upgrade.json'
            if (Test-Path -LiteralPath $pendingJournal) {
              # Failed acceptance is already a failed Job; the disposable
              # Runner may terminate without discarding uncertain state.
              Write-Output 'Native recovery journal retained for failed acceptance; preserve identity and receipts'
            } else {
              if ($created) { & $program disable }
              Remove-Item -LiteralPath $device -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $receipts -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath ($key + '.install-mode') -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Uninstall inactive native version without deleting identity or logs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'mcp-workers\remote-control'
          $sentinel = Join-Path $root 'agent-events.ndjson'
          [IO.File]::WriteAllText($sentinel, '{"utc":"2026-01-01T00:00:00.000Z","event":"stopping"}' + [char]10)
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/remote-control-mcp-worker/agent/uninstall-windows.ps1 -Version v0.1.57-rust-candidate.1
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall of inactive Rust candidate version failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/remote-control-mcp-worker/agent/uninstall-windows.ps1 -Version v0.1.56
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall of inactive published Windows Node baseline failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/remote-control-mcp-worker/agent/uninstall-windows.ps1 -Version v0.0.1-ci
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall of inactive upgrade version failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/remote-control-mcp-worker/agent/uninstall-windows.ps1 -Version v0.0.0-ci
          if ($LASTEXITCODE -ne 0) { throw 'Safe Windows runtime uninstall failed' }
          $old = Join-Path $root 'programs\v0.0.0-ci-windows-x64'
          if (Test-Path -LiteralPath $old) { throw 'Uninstalled version still exists' }
          if (-not (Test-Path -LiteralPath $sentinel)) { throw 'Windows Agent diagnostics not preserved' }
          if (-not (Test-Path -LiteralPath $root)) { throw 'Private identity directory was deleted' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/remote-control-mcp-worker/agent/uninstall-windows.ps1 -Version v0.0.0-ci
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall retry must be idempotent' }
          Remove-Item -LiteralPath $sentinel -Force
      - name: Public Windows install.ps1 offline first-install and repeat fail closed without TTY
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Offline installer acceptance requires GitHub CI' }
          $originalProfile = $env:LOCALAPPDATA
          $profile = Join-Path $env:RUNNER_TEMP 'spec24-public-onboarding-profile'
          $archive = Join-Path $env:RUNNER_TEMP 'candidate-next-version.zip'
          if (Test-Path -LiteralPath $profile) { throw 'CI public installer fixture profile already exists' }
          if (-not (Test-Path -LiteralPath $archive)) { throw 'Isolated reviewed Windows candidate is missing' }
          $null = New-Item -ItemType Directory -Path $profile
          $stdinFile = Join-Path $env:RUNNER_TEMP 'spec24-empty-input.txt'
          [IO.File]::WriteAllText($stdinFile, '')
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $root = Join-Path $profile 'mcp-workers\remote-control'
          $target = Join-Path $root 'programs\v0.0.1-ci-windows-x64'
          $args = @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass',
            '-File','apps/remote-control-mcp-worker/agent/install.ps1','-Version','v0.0.1-ci',
            '-OfflineArchive',$archive,'-ExpectedSha256',$sha)
          $env:LOCALAPPDATA = $profile
          try {
            foreach ($attempt in @(1,2)) {
              $stderrFile = Join-Path $env:RUNNER_TEMP "spec24-onboard-$attempt.err"
              $stdoutFile = Join-Path $env:RUNNER_TEMP "spec24-onboard-$attempt.out"
              $process = Start-Process -FilePath powershell.exe -ArgumentList $args `
                -RedirectStandardInput $stdinFile -RedirectStandardOutput $stdoutFile `
                -RedirectStandardError $stderrFile -NoNewWindow -PassThru -Wait
              if ($process.ExitCode -eq 0) { throw 'Installer enrolled without a real interactive terminal' }
              $diagnostic = (Get-Content -LiteralPath $stderrFile -Raw) + (Get-Content -LiteralPath $stdoutFile -Raw)
              if ($diagnostic -match '\{"target":"windows-x64"') {
                throw 'Verifier JSON leaked to public installer output'
              }
              if ($diagnostic -notmatch 'Authorization incomplete. Identity kept.') {
                # This fixture uses a disposable profile and no credentials;
                # expose only a bounded native error to diagnose the seam.
                $bounded = $diagnostic.Substring(0, [Math]::Min(1400, $diagnostic.Length))
                Write-Output ('CI_PUBLIC_INSTALL_DIAGNOSTIC: ' + $bounded)
                throw "Unexpected public installer first/repeat failure (attempt $attempt)"
              }
              if (-not (Test-Path -LiteralPath $target)) {
                throw 'Verified Windows candidate was not staged before onboarding refusal'
              }
              if (Test-Path -LiteralPath (Join-Path $root 'v2-identity.pem')) {
                throw 'Non-interactive public install created a private key'
              }
              if (Test-Path -LiteralPath (Join-Path $root 'v2-identity.pem.device-id')) {
                throw 'Non-interactive public install created a device identity'
              }
              if (Test-Path -LiteralPath (Join-Path $root 'v2-identity.pem.install-mode')) {
                throw 'Non-interactive public install persisted a grant choice'
              }
              if ($attempt -eq 1) {
                $before = (Get-FileHash -LiteralPath (Join-Path $target 'bundle.json') -Algorithm SHA256).Hash
                $programBefore = (Get-FileHash -LiteralPath (Join-Path $target 'rca.cmd') -Algorithm SHA256).Hash
              } else {
                if ((Get-FileHash -LiteralPath (Join-Path $target 'bundle.json') -Algorithm SHA256).Hash -ne $before -or
                    (Get-FileHash -LiteralPath (Join-Path $target 'rca.cmd') -Algorithm SHA256).Hash -ne $programBefore) {
                  throw 'Non-interactive repeat changed verified package files'
                }
              }
            }
            & (Join-Path $target 'bin\node.exe') (Join-Path $target 'apps\remote-control-agent\scripts\verify-windows-preview.mjs') $target
            if ($LASTEXITCODE -ne 0) { throw 'Public installer staged package fails its native inventory verifier' }
            Write-Output 'PUBLIC_WINDOWS_FIRST_AND_REPEAT_NON_TTY=PASS; owner approval untouched'
          } finally {
            $env:LOCALAPPDATA = $originalProfile
            if (Test-Path -LiteralPath $profile) {
              # Windows can briefly hold the verified fixture's node.exe after
              # the child exits. Retry only disposable RUNNER_TEMP cleanup;
              # any persistent access denial still fails this CI gate.
              for ($cleanupAttempt = 1; $cleanupAttempt -le 8; $cleanupAttempt++) {
                try {
                  Remove-Item -LiteralPath $profile -Recurse -Force -ErrorAction Stop
                  break
                } catch {
                  if ($cleanupAttempt -eq 8) { throw }
                  Start-Sleep -Milliseconds 500
                }
              }
              if (Test-Path -LiteralPath $profile) {
                throw 'Synthetic public installer profile cleanup incomplete'
              }
            }
          }
      - name: Assemble verifiable Windows release candidate (never publish)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RCA_CANDIDATE_TAG
          if ($tag -cnotmatch '^v0\.[1-9][0-9]*\.[0-9]+(?:-rust-candidate\.[1-9][0-9]*)?$') {
            throw 'Invalid candidate-only version label'
          }
          $nodeSha = 'ba4e6d110e8c1592a1ecd390f6b05f3da124b13871a5be62b341a07a853c6c32'
          $nodeBin = (Get-Command node.exe).Source
          $output = Join-Path $env:RUNNER_TEMP 'spec24-reviewed-windows-candidate'
          $rustBin = Join-Path $env:RUNNER_TEMP 'windows-rust-cargo-target/release/rca-standard-windows-candidate.exe'
          $sessionBin = Join-Path $env:RUNNER_TEMP 'windows-rust-cargo-target/release/rca-session-windows-candidate.exe'
          $rustArgs = @('--rust-agent-bin',$rustBin,'--rust-agent-sha256',(Get-FileHash -LiteralPath $rustBin -Algorithm SHA256).Hash.ToLowerInvariant(),'--artifact-profile','rust-native-only-v1','--rust-session-bin',$sessionBin,'--rust-session-sha256',(Get-FileHash -LiteralPath $sessionBin -Algorithm SHA256).Hash.ToLowerInvariant())
          # The builder independently verifies the official pinned Node binary
          # even when it is only a build input, never part of the Rust archive.
          node apps/remote-control-mcp-worker/agent/scripts/build-windows-preview.mjs --version $tag `
            --node-bin $nodeBin --node-sha256 $nodeSha `
            --background-bin (Join-Path $env:RUNNER_TEMP 'rca-background.exe') `
            --out $output @rustArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate build refused' }
          $stage = Join-Path $output "remote-control-agent-$tag-windows-x64"
          function Confirm-ReviewedArchive([string]$directory) {
            & 'apps/remote-control-mcp-worker/agent/scripts/verify-windows-native.ps1' -Root $directory -Version $tag
          }
          Confirm-ReviewedArchive $stage
          $status = & (Join-Path $stage 'rca.cmd') status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $status.identity_present -ne $false -or
              $status.mode -cne 'native-user-agent' -or $status.shell -ne $true -or
              $status.write_file -ne $true) { throw 'Windows candidate CLI contract refused' }
          $dist = Join-Path $env:RUNNER_TEMP 'spec24-windows-review-artifacts'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $name = "remote-control-agent-$tag-windows-x64.zip"
          $zip = Join-Path $dist $name
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $reopened = Join-Path $env:RUNNER_TEMP 'spec24-review-windows-reopened'
          Expand-Archive -LiteralPath $zip -DestinationPath $reopened -ErrorAction Stop
          Confirm-ReviewedArchive $reopened
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $dist 'SHA256SUMS.txt'),
            ($digest + '  ' + $name + [Environment]::NewLine))
          Write-Output "Reviewed Windows candidate $tag SHA256: $digest"
          Write-Output "Windows candidate $tag archived and verified without Release publication"

      - name: Save unpublished Windows candidate for independent review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate_tag }}-windows-x64${{ contains(inputs.candidate_tag, '-rust-candidate.') && '-native-only' || '' }}
          path: ${{ runner.temp }}/spec24-windows-review-artifacts/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
