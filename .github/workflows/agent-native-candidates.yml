name: Native Agent candidates

# Unpublished five-platform packages only. Publication is agent-release.yml.
# PR/main CI calls this with v0.0.0-ci and does not upload a promotable Release.
on:
  workflow_call:
    inputs:
      candidate_tag:
        description: Unpublished candidate label
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Unpublished candidate label; this workflow never publishes a Release
        required: true
        type: string

permissions:
  contents: read

env:
  RCA_CANDIDATE_TAG: ${{ inputs.candidate_tag }}

jobs:
  refuse-unreviewed-ref:
    name: Manual native candidates are built from main only
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a candidate dispatch that is not main
        run: echo 'Manual native candidates are built from main only' >&2; exit 1

  native-agent:
    name: Native Agent / ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned source dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm --filter remote-control-agent typecheck
      - name: Build native supervisor and test
        run: pnpm --filter remote-control-agent test
      - name: Isolated Linux one-shot immutable staging contract (no systemd effects)
        run: python3 -B apps/remote-control-mcp-worker/agent/tests/linux-stage-only.test.py
  linux-systemd-upgrade-recovery:
    name: Real systemd Linux upgrade / ${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64-glibc
            baseline_sha256: 7eb0def23325a63a426c8402f7c2ef68d8e5ae0e6739563d13a669887f386ace
          - runner: ubuntu-24.04-arm
            target: linux-arm64-glibc
            baseline_sha256: 36882e7cfa9c747ed09334bdb9933683ce60ff53549c3796ba5e1f7d6fda92aa
    env:
      SPEC914_TARGET: ${{ matrix.target }}
      SPEC914_BASELINE_SHA256: ${{ matrix.baseline_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned Agent build dependencies
        run: pnpm install --filter remote-control-agent --frozen-lockfile --ignore-scripts
      - name: Build isolated native helpers
        run: node apps/remote-control-mcp-worker/agent/scripts/build-session-supervisor.mjs
      - name: Fetch and verify immutable published Node baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d "$RUNNER_TEMP/spec914.XXXXXX")"
          echo "SPEC914_TEMP=$temp_dir" >> "$GITHUB_ENV"
          archive="$temp_dir/remote-control-agent-v0.1.56-$SPEC914_TARGET.tar.gz"
          gh release download v0.1.56 --repo lirtual/mcp-workers \
            --pattern "$(basename "$archive")" --dir "$temp_dir"
          echo "$SPEC914_BASELINE_SHA256  $archive" | sha256sum --check
          mkdir "$temp_dir/old"
          tar -xzf "$archive" -C "$temp_dir/old"
      - name: Build unpublished Rust candidate and package it beside the baseline
        shell: bash
        run: |
          set -euo pipefail
          version=v0.1.57-rust-candidate.1
          mkdir -p "$SPEC914_TEMP"/{cargo,rustup,target,build}
          docker run --rm --network bridge \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$SPEC914_TEMP/cargo:/cargo" \
            -v "$SPEC914_TEMP/rustup:/rustup" \
            -v "$SPEC914_TEMP/target:/target" \
            -v "$SPEC914_TEMP/build:/out" \
            rockylinux:9@sha256:03303863808e9cd79f0c58c833db3e5f9cde9f2abe16804a267b05dc54af86e4 \
            bash -lc '
              set -eo pipefail
              dnf -y -q install gcc ca-certificates
              export HOME=/tmp/rust-home CARGO_HOME=/cargo RUSTUP_HOME=/rustup CARGO_TARGET_DIR=/target
              mkdir -p "$HOME"
              curl --fail --silent --show-error --location --retry 3 --max-time 120 \
                --proto "=https" --tlsv1.2 https://sh.rustup.rs -o /tmp/rustup-init.sh
              sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.100.0
              export PATH="$CARGO_HOME/bin:$PATH"
              bins=(--bin rca-standard-linux-candidate)
              if [[ "$(uname -m)" == x86_64 ]]; then bins+=(--bin rca-session-linux-candidate); fi
              cargo build --locked --release \
                --manifest-path /src/apps/remote-control-mcp-worker/agent/native-rust/Cargo.toml \
                "${bins[@]}"
              install -m 0755 "$CARGO_TARGET_DIR/release/rca-standard-linux-candidate" /out/rca-standard-linux-candidate
              if [[ "$(uname -m)" == x86_64 ]]; then
                install -m 0755 "$CARGO_TARGET_DIR/release/rca-session-linux-candidate" /out/rca-session-linux-candidate
              fi
            '
          old="$SPEC914_TEMP/old"
          node_bin="$old/bin/node"
          supervisor="$old/apps/remote-control-agent/.build/session-supervisor"
          rust_agent="$SPEC914_TEMP/build/rca-standard-linux-candidate"
          # Build the actual released Node-free profile; the immutable Node archive is the rollback baseline.
          session_args=()
          if [[ "$SPEC914_TARGET" == linux-x64-glibc ]]; then
            session_bin="$SPEC914_TEMP/build/rca-session-linux-candidate"
            session_args=(--rust-session-bin "$session_bin" --rust-session-sha256 "$(sha256sum "$session_bin" | cut -d' ' -f1)")
          fi
          node "$GITHUB_WORKSPACE/apps/remote-control-mcp-worker/agent/scripts/build-v2-release.mjs" \
            --version "$version" --target "$SPEC914_TARGET" \
            --node-bin "$node_bin" --node-sha256 "$(sha256sum "$node_bin" | cut -d' ' -f1)" \
            --native "$supervisor" --native-sha256 "$(sha256sum "$supervisor" | cut -d' ' -f1)" \
            --rust-agent-bin "$rust_agent" --rust-agent-sha256 "$(sha256sum "$rust_agent" | cut -d' ' -f1)" \
            --artifact-profile rust-native-only-v1 "${session_args[@]}" --out "$SPEC914_TEMP/native-only"
          pure="$SPEC914_TEMP/native-only/remote-control-agent-$version-$SPEC914_TARGET.tar.gz"
          python3 -B -c 'import importlib.util,sys; s=importlib.util.spec_from_file_location("b",sys.argv[1]); b=importlib.util.module_from_spec(s); s.loader.exec_module(b); b.inspect_archive(sys.argv[2],sys.argv[3],sys.argv[4])' \
            apps/remote-control-mcp-worker/agent/scripts/bootstrap-v2.py "$pure" "$version" "$SPEC914_TARGET"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {inspectTarGzip} from "./apps/remote-control-mcp-worker/agent/scripts/verify-v2-release.mjs"; inspectTarGzip(readFileSync(process.argv[1]),{tag:process.argv[2],target:process.argv[3]});' \
            "$pure" "$version" "$SPEC914_TARGET"
          if tar -tzf "$pure" | grep -E '(^bin/node$|/src/|[.]mjs$|[.]js$)'; then
            echo 'Node/JavaScript slipped into native-only archive' >&2
            exit 1
          fi
          test "$(stat -c %s "$pure")" -lt "$(stat -c %s "$SPEC914_TEMP/remote-control-agent-v0.1.56-$SPEC914_TARGET.tar.gz")"
          chmod 0644 "$pure" "$SPEC914_TEMP/remote-control-agent-v0.1.56-$SPEC914_TARGET.tar.gz"
      - name: Verify actual Node-free Linux archive without development tools
        shell: bash
        run: |
          set -euo pipefail
          version=v0.1.57-rust-candidate.1
          archive="$SPEC914_TEMP/native-only/remote-control-agent-$version-$SPEC914_TARGET.tar.gz"
          agent=apps/remote-control-mcp-worker/agent
          python3 -B "$agent/scripts/validate-local-archive.py" "$archive" "$version" "$SPEC914_TARGET"
          docker pull --quiet python:3.12-slim-bookworm >/dev/null
          temp_dir="$(mktemp -d)"
          image=rca-native-offline-smoke:local
          trap 'docker image rm "$image" >/dev/null 2>&1 || true; rm -rf "$temp_dir"' EXIT
          chmod 755 "$temp_dir"
          # The official Python image installs its interpreter in /usr/local.
          # Match the production OS's fixed /usr/bin/python3 contract without
          # altering the reviewed launcher or the read-only test container.
          docker build --network none --pull=false -t "$image" -f - "$temp_dir" <<'DOCKERFILE'
          FROM python:3.12-slim-bookworm
          RUN ln -s /usr/local/bin/python3 /usr/bin/python3
          DOCKERFILE
          cp "$agent/scripts/bootstrap-v2.py" "$agent/scripts/validate-local-archive.py" "$temp_dir/"
          chmod 644 "$temp_dir/"*.py
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --tmpfs /tmp:rw,exec,mode=1777 \
            -v "$archive:/opt/agent.tar.gz:ro" \
            -v "$temp_dir:/opt/bootstrap:ro" \
            "$image" sh -ec \
            'test -x /usr/bin/python3
             for tool in node git cc; do
               if command -v "$tool" >/dev/null; then exit 11; fi
             done
             exec python3 -B /opt/bootstrap/validate-local-archive.py \
               /opt/agent.tar.gz "$1" "$2"' shell "$version" "$SPEC914_TARGET"
      - name: Kill installer after candidate activation and verify real systemd recovery
        shell: bash
        run: |
          set -euo pipefail
          test_user=rca914test
          test_uid=29091
          if getent passwd "$test_user" >/dev/null || getent passwd "$test_uid" >/dev/null; then
            echo "Disposable systemd test account or UID already exists" >&2
            exit 1
          fi
          sudo useradd --create-home --uid "$test_uid" --shell /usr/sbin/nologin "$test_user"
          cleanup() {
            sudo -u "$test_user" env HOME="/home/$test_user" XDG_RUNTIME_DIR="/run/user/$test_uid" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$test_uid/bus" \
              /usr/bin/systemctl --user disable --now remote-control-agent.service >/dev/null 2>&1 || true
            sudo loginctl disable-linger "$test_user" >/dev/null 2>&1 || true
            sudo systemctl stop "user@$test_uid.service" >/dev/null 2>&1 || true
            sudo userdel --remove "$test_user" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo loginctl enable-linger "$test_user"
          sudo systemctl start "user@$test_uid.service"
          for _ in $(seq 1 50); do
            sudo test -S "/run/user/$test_uid/bus" && break
            sleep 0.1
          done
          sudo test -S "/run/user/$test_uid/bus"
          user_env=(env HOME="/home/$test_user" XDG_RUNTIME_DIR="/run/user/$test_uid"
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$test_uid/bus")
          sudo -u "$test_user" "${user_env[@]}" /usr/bin/systemctl --user \
            set-environment "XDG_RUNTIME_DIR=/run/user/$test_uid" \
            "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$test_uid/bus"
          source_dir="$(mktemp -d /tmp/spec914-agent-source.XXXXXX)"
          chmod 0755 "$source_dir"
          sudo cp -a apps/remote-control-mcp-worker/agent/. "$source_dir/"
          sudo chown -R "$test_user:$test_user" "$source_dir"
          sudo -u "$test_user" test -r "$source_dir/tests/linux-native-only-systemd.integration.mjs"
          fixture_dir="$(mktemp -d /tmp/spec914-fixtures.XXXXXX)"
          chmod 0755 "$fixture_dir"
          old_archive="$fixture_dir/remote-control-agent-v0.1.56-$SPEC914_TARGET.tar.gz"
          install -m 0644 "$SPEC914_TEMP/remote-control-agent-v0.1.56-$SPEC914_TARGET.tar.gz" "$old_archive"
          sudo -u "$test_user" test -r "$old_archive"
          # Real old Node systemd service -> Node-free Rust attempt with NO signed
          # Worker WSS. The real old service must be restored without replaying
          # existing Unknown receipts; no production endpoint or grant involved.
          native_archive="$fixture_dir/native-only-v0.1.57-rust-candidate.1-$SPEC914_TARGET.tar.gz"
          install -m 0644 "$SPEC914_TEMP/native-only/remote-control-agent-v0.1.57-rust-candidate.1-$SPEC914_TARGET.tar.gz" "$native_archive"
          sudo -u "$test_user" test -r "$native_archive"
          sudo -u "$test_user" "${user_env[@]}" \
            RCA914_AGENT_SOURCE="$source_dir" RCA914_OLD_ARCHIVE="$old_archive" RCA914_NATIVE_ARCHIVE="$native_archive" \
            "$(node -p 'process.execPath')" --experimental-strip-types \
            "$source_dir/tests/linux-native-only-systemd.integration.mjs"
      - name: Assemble unpublished Linux Node-free artifact
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          version="$RCA_CANDIDATE_TAG"
          [[ "$version" =~ ^v0\.[1-9][0-9]*\.[0-9]+(-rust-candidate\.[1-9][0-9]*)?$ ]]
          old="$SPEC914_TEMP/old"
          node_bin="$old/bin/node"
          supervisor="$old/apps/remote-control-agent/.build/session-supervisor"
          rust_agent="$SPEC914_TEMP/build/rca-standard-linux-candidate"
          output="$RUNNER_TEMP/native-review"
          session_args=()
          if [[ "$SPEC914_TARGET" == linux-x64-glibc ]]; then
            session_bin="$SPEC914_TEMP/build/rca-session-linux-candidate"
            session_args=(--rust-session-bin "$session_bin" --rust-session-sha256 "$(sha256sum "$session_bin" | cut -d' ' -f1)")
          fi
          node apps/remote-control-mcp-worker/agent/scripts/build-v2-release.mjs \
            --version "$version" --target "$SPEC914_TARGET" \
            --node-bin "$node_bin" --node-sha256 "$(sha256sum "$node_bin" | cut -d' ' -f1)" \
            --native "$supervisor" --native-sha256 "$(sha256sum "$supervisor" | cut -d' ' -f1)" \
            --rust-agent-bin "$rust_agent" --rust-agent-sha256 "$(sha256sum "$rust_agent" | cut -d' ' -f1)" \
            --artifact-profile rust-native-only-v1 "${session_args[@]}" --out "$output"
          asset="remote-control-agent-$version-$SPEC914_TARGET.tar.gz"
          python3 -B -c 'import importlib.util,sys; s=importlib.util.spec_from_file_location("b",sys.argv[1]); b=importlib.util.module_from_spec(s); s.loader.exec_module(b); b.inspect_archive(sys.argv[2],sys.argv[3],sys.argv[4])' \
            apps/remote-control-mcp-worker/agent/scripts/bootstrap-v2.py "$output/$asset" "$version" "$SPEC914_TARGET"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {inspectTarGzip} from "./apps/remote-control-mcp-worker/agent/scripts/verify-v2-release.mjs"; inspectTarGzip(readFileSync(process.argv[1]),{tag:process.argv[2],target:process.argv[3]});' \
            "$output/$asset" "$version" "$SPEC914_TARGET"
          (cd "$output"; sha256sum "$asset" > SHA256SUMS.txt; sha256sum -c SHA256SUMS.txt)
          if [[ "$version" =~ ^v0\.[1-9][0-9]*\.[0-9]+$ ]]; then
            mkdir -p "release-candidate/$SPEC914_TARGET"
            cp -- "$output/$asset" "$output/SHA256SUMS.txt" "release-candidate/$SPEC914_TARGET/"
          fi
      - name: Save reviewed native candidate for manual Release promotion
        if: github.event_name == 'workflow_dispatch' && !contains(inputs.candidate_tag, '-rust-candidate.')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate_tag }}-${{ matrix.runner }}
          path: release-candidate/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
      - name: Save unpublished Linux Node-free review artifact
        if: github.event_name == 'workflow_dispatch' && contains(inputs.candidate_tag, '-rust-candidate.')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate_tag }}-${{ matrix.target }}-native-only
          path: |
            ${{ runner.temp }}/native-review/*.tar.gz
            ${{ runner.temp }}/native-review/SHA256SUMS.txt
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
  macos-native-candidate:
    name: Unpublished native macOS 15 / ${{ matrix.arch }} candidate
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: darwin-arm64
            uname_arch: arm64
            runner: macos-15
            node_archive_sha256: 6239d4cf92d864487ec8cd3615038f7b67e7f58b77b21cd2f09ea9fbd68065fe
          - arch: x64
            target: darwin-x64
            uname_arch: x86_64
            runner: macos-15-intel
            node_archive_sha256: 0ae5a24c24bb7d015cd816c5036b3f90f2945aa872fcf54e58da054753b3a299
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build native Darwin owned-group helper (no owner pairing)
        run: |
          set -euo pipefail
          mkdir -p apps/remote-control-mcp-worker/agent/.build
          cc -std=c11 -O2 -Wall -Wextra -Werror -fstack-protector-strong \
            apps/remote-control-mcp-worker/agent/scripts/darwin-session-supervisor.c \
            -o apps/remote-control-mcp-worker/agent/.build/darwin-session-supervisor
          chmod 700 apps/remote-control-mcp-worker/agent/.build/darwin-session-supervisor
      - name: Typecheck and verify native file/receipt seam (no owner pairing)
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 15
          pnpm --filter remote-control-agent typecheck
          cd apps/remote-control-mcp-worker/agent
          node --experimental-strip-types --test tests/macos-candidate.test.mjs tests/macos-file-tools.test.ts tests/pair-device.test.ts
          # macOS-owned child groups must not hold CI indefinitely when
          # the helper or a test faults. This is the SAME existing job.
          node -e 'const {spawnSync}=require("node:child_process"); const r=spawnSync(process.execPath,["--experimental-strip-types","--test","tests/macos-managed-sessions.test.ts"],{timeout:45000,stdio:"inherit"}); if(r.error||r.status!==0) {console.error("Native Darwin session tests failed or timed out:",r.error?.code??r.status);process.exit(1)}'

      - name: Build and inspect native unpublished CPU-specific candidate
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          archive="$temp_dir/node.tar.xz"
          curl --fail --silent --show-error --location --max-time 90 \
            --proto '=https' --tlsv1.2 \
            https://nodejs.org/dist/v24.21.0/node-v24.21.0-${{ matrix.target }}.tar.xz -o "$archive"
          echo '${{ matrix.node_archive_sha256 }}  '"$archive" | shasum -a 256 --check
          tar -xJOf "$archive" node-v24.21.0-${{ matrix.target }}/bin/node > "$temp_dir/node"
          chmod 700 "$temp_dir/node"
          test "$("$temp_dir/node" --version)" = v24.21.0
          for pass in first second; do
            "$temp_dir/node" apps/remote-control-mcp-worker/agent/scripts/build-v2-release.mjs \
              --version "$RCA_CANDIDATE_TAG" --target ${{ matrix.target }} \
              --node-bin "$temp_dir/node" \
              --node-sha256 "$(shasum -a 256 "$temp_dir/node" | awk '{print $1}')" \
              --native "$(pwd)/apps/remote-control-mcp-worker/agent/.build/darwin-session-supervisor" \
              --native-sha256 "$(shasum -a 256 apps/remote-control-mcp-worker/agent/.build/darwin-session-supervisor | awk '{print $1}')" \
              --out "$temp_dir/$pass"
          done
          asset="remote-control-agent-$RCA_CANDIDATE_TAG-${{ matrix.target }}.tar.gz"
          cmp "$temp_dir/first/$asset" "$temp_dir/second/$asset"
          mkdir "$temp_dir/unpacked"
          chmod 700 "$temp_dir/unpacked"
          tar -xzf "$temp_dir/first/$asset" -C "$temp_dir/unpacked"
          test "$("$temp_dir/unpacked/bin/node" --version)" = v24.21.0
          node -e 'const m=require(process.argv[1]); if(m.target!=="darwin-"+process.argv[3] || m.candidate_profile!=="darwin-permanent-local-v1" || m.native_supervisor!=="darwin-owned-group-v1" || m.source_commit!==process.argv[2] || m.upgrade_profile)process.exit(1)' \
            "$temp_dir/unpacked/bundle.json" "$(git rev-parse HEAD)" "${{ matrix.arch }}"
          test ! -e "$temp_dir/unpacked/apps/remote-control-agent/.build/session-supervisor"
          test -x "$temp_dir/unpacked/apps/remote-control-agent/.build/darwin-session-supervisor"
          test ! -e "$temp_dir/unpacked/apps/remote-control-agent/scripts/install-v2.mjs"
          for js in "$temp_dir/unpacked"/apps/remote-control-agent/src/*.js; do
            "$temp_dir/unpacked/bin/node" --check "$js"
          done
          home="$temp_dir/unpaired-home"
          mkdir "$home"
          chmod 700 "$home"
          if HOME="$home" "$temp_dir/unpacked/bin/node" \
              "$temp_dir/unpacked/apps/remote-control-agent/src/macos-temporary.js" \
              --endpoint https://example.invalid/ </dev/null > "$temp_dir/stdout" 2> "$temp_dir/stderr"; then
            echo 'Noninteractive candidate unexpectedly enabled a device' >&2; exit 1
          fi
          test ! -e "$home/.local"
          grep -q 'interactive owner terminal' "$temp_dir/stderr"
          python3 apps/remote-control-mcp-worker/agent/tests/packaged-install-mode-pty.py "$temp_dir/unpacked"
          # Test the extracted native runtime itself: WSS frame adapter, file
          # effects, permission denial, SQLite receipts and Unknown recovery.
          RCA_MACOS_BUNDLE_ROOT="$temp_dir/unpacked" \
            "$temp_dir/unpacked/bin/node" --test \
            apps/remote-control-mcp-worker/agent/tests/macos-packaged-runtime-smoke.mjs
          RCA_MACOS_BUNDLE_ROOT="$temp_dir/unpacked" \
            "$temp_dir/unpacked/bin/node" --experimental-strip-types --test \
            apps/remote-control-mcp-worker/agent/tests/macos-local.test.mjs \
            apps/remote-control-mcp-worker/agent/tests/macos-remote-upgrade.test.mjs
          # Offline first-stage refuses non-owner/noninteractive execution.
          if sh apps/remote-control-mcp-worker/agent/scripts/macos-local.sh install \
              --archive "$temp_dir/first/$asset" --sha256 "$(shasum -a 256 "$temp_dir/first/$asset" | awk '{print $1}')" \
              --source-sha "$(git rev-parse HEAD)" --endpoint https://example.invalid/ \
              </dev/null; then
            echo 'macOS offline bootstrap accepted a non-owner terminal' >&2; exit 1
          fi
          echo "Verified native candidate from $(git rev-parse HEAD), unpublished SHA:"
          shasum -a 256 "$temp_dir/first/$asset"
          # Save *only* an explicitly dispatched, verified candidate for
          # owner-Mac E2E. Pull-request CI never publishes/downloads assets.
          # This is a short-lived Actions artifact, NOT a GitHub Release.
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            mkdir -p "release-candidate/${{ matrix.target }}"
            cp -- "$temp_dir/first/$asset" "release-candidate/${{ matrix.target }}/"
            cp -- apps/remote-control-mcp-worker/agent/scripts/macos-local.sh \
              "release-candidate/${{ matrix.target }}/"
            (
              cd "release-candidate/${{ matrix.target }}"
              shasum -a 256 "$asset" macos-local.sh > SHA256SUMS.txt
              shasum -a 256 -c SHA256SUMS.txt
            )
          fi
          # CI runner is NOT an owner-paired real Mac. No permanent grant or public Release.
      - name: Save unpublished macOS candidate for owner-native E2E
        if: github.event_name == 'workflow_dispatch' && !contains(inputs.candidate_tag, '-rust-candidate.')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate_tag }}-${{ matrix.target }}
          path: release-candidate/${{ matrix.target }}/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0

  windows-native-preview:
    name: Native Windows full tools preview / x64
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned source dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck shared and Windows preview sources
        run: pnpm --filter remote-control-agent typecheck
      - name: Windows path, identity ACL and native full-tool smoke (isolated temp fixtures)
        shell: pwsh
        run: |
          Set-Location apps/remote-control-mcp-worker/agent
          # Match the already validated Windows Release gate: native ACL probes
          # must not contend with concurrently running full-tool Shell tests.
          node --experimental-strip-types --test --test-concurrency=4 tests/windows-v2.test.ts tests/windows-log.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows full-tool tests failed' }
          # Native PowerShell startup is load-sensitive; run this existing full-mode
          # integration test without concurrent native smoke-test processes.
          # Keep its 7-second output assertion and every original safety check.
          node --experimental-strip-types --test tests/windows-full-tools.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows process integration tests failed' }
          node --experimental-strip-types --test tests/windows-acl.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows ACL tests failed' }
          node --experimental-strip-types --test tests/windows-upgrade-pipe.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows upgrade-freeze IPC failed' }
          node --experimental-strip-types --test tests/session-rca-windows.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Windows Session runner context tests failed' }
      - name: Native Windows Session-private identity ACL (synthetic Runner fixture)
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: github-hosted
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'apps/remote-control-mcp-worker/agent/scripts/windows-session-private-store.ps1'
          $dir = Join-Path $env:RUNNER_TEMP 'session-rca'
          if (Test-Path -LiteralPath $dir) { throw 'Unexpected pre-existing Session identity fixture' }
          try {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Action Init -Directory $dir
            if ($LASTEXITCODE -ne 0) { throw 'Session identity ACL initialization failed' }
            [IO.File]::WriteAllText((Join-Path $dir 'identity.json'), '{"synthetic":true}')
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Action Seal -Directory $dir -FileName identity.json
            if ($LASTEXITCODE -ne 0) { throw 'Session identity ACL sealing failed' }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Action Check -Directory $dir
            if ($LASTEXITCODE -ne 0) { throw 'Session identity ACL check failed' }
            $invalid = Join-Path $env:RUNNER_TEMP 'not-session-rca'
            $failure = Join-Path $env:RUNNER_TEMP 'expected-session-acl-rejection.txt'
            $process = Start-Process -FilePath powershell.exe -ArgumentList @(
              '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File', $script,
              '-Action','Check','-Directory',$invalid) -NoNewWindow -Wait -PassThru -RedirectStandardError $failure
            if ($process.ExitCode -eq 0) { throw 'Unreviewed Session directory was accepted' }
          } finally {
            if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          }
      - name: New public PowerShell installer parses under Windows without executing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'apps/remote-control-mcp-worker/agent/install.ps1').Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) {
            throw ('New public installer has Windows PowerShell syntax errors: ' +
              ($parseErrors | ForEach-Object { $_.Message } | Out-String))
          }
          # The Session-only ACL helper is bundled but never executed by this parser gate.
          $sessionErrors = $null
          $sessionTokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'apps/remote-control-mcp-worker/agent/scripts/windows-session-private-store.ps1').Path,
            [ref]$sessionTokens, [ref]$sessionErrors)
          if ($sessionErrors.Count -ne 0) { throw 'Windows Session ACL helper syntax invalid' }
          $installer = Get-Content -Raw 'apps/remote-control-mcp-worker/agent/install.ps1'
          if ($installer -notmatch 'releases/latest' -or $installer -notmatch 'sha256:' -or $installer -notmatch 'SelectedReleaseSha256') {
            throw 'Public Windows installer must require the official latest Release digest'
          }
          if ($installer -match 'PinnedReleaseSha256') {
            throw 'Public Windows installer must not accept a source pin'
          }
          # Invoke only the isolated redirect validator function against
          # deliberately invalid starting origins. No HTTP request is made.
          $functionAst = $null
          $functionAst = ([System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'apps/remote-control-mcp-worker/agent/install.ps1').Path, [ref]$tokens, [ref]$parseErrors)).Find({
            param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Download-ApprovedAsset'
          }, $true)
          if (-not $functionAst) { throw 'Pinned redirect checker is missing' }
          Invoke-Expression $functionAst.Extent.Text
          foreach ($bad in @('http://github.com/lirtual/remote-control-agent/releases/download/test.zip',
            'https://127.0.0.1/internal.zip', 'https://evil.example/install.zip',
            'https://github.com/other/project/releases/download/evil.zip')) {
            $rejected = $false
            try { Download-ApprovedAsset $bad (Join-Path $env:RUNNER_TEMP 'blocked-download.zip') }
            catch { $rejected = $_.Exception.Message -like '*Unexpected GitHub Release asset redirect*' }
            if (-not $rejected -or (Test-Path (Join-Path $env:RUNNER_TEMP 'blocked-download.zip'))) {
              throw ('Untrusted Windows download origin was not blocked: ' + $bad)
            }
          }
      - name: One-command Windows upgrade decision checks (no task writes)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'apps/remote-control-mcp-worker/agent/install.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw 'Installer PowerShell syntax invalid' }
          $func = $ast.Find({
            param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-ExistingAgentVersion'
          }, $true)
          if (-not $func) { throw 'Existing device version classifier missing' }
          Invoke-Expression $func.Extent.Text
          $root = Join-Path $env:RUNNER_TEMP 'rca-fixture-programs'
          $good = Join-Path $root 'v0.1.13-windows.1-windows-x64\bin\rca-background.exe'
          if ((Get-ExistingAgentVersion $root $good) -cne 'v0.1.13-windows.1') {
            throw 'Older paired Windows task was not detected'
          }
          foreach ($bad in @(
            (Join-Path $root '..\outside\node.exe'),
            (Join-Path $root 'v0.1.15-windows-x64\unexpected.exe'),
            'C:\Windows\System32\cmd.exe'
          )) {
            $rejected = $false
            try { $null = Get-ExistingAgentVersion $root $bad }
            catch { $rejected = $true }
            if (-not $rejected) { throw 'Untrusted legacy task path was accepted' }
          }
          $source = Get-Content -LiteralPath $path -Raw
          if (-not $source.Contains('Confirm-Upgrade $Host.UI') -or
              -not $source.Contains("ReadKey('NoEcho,IncludeKeyDown')") -or
              -not $source.Contains('Upgrade? [y/N]') -or
              -not $source.Contains('Cancelled. No changes.') -or
              $source.Contains('$Host.UI.PromptForChoice') -or
              $source.Contains("Read-Host 'Upgrade this device") -or
              -not $source.Contains('& $nodeExisting $verifyExisting $target | Out-Null') -or
              -not $source.Contains('& $node $verifier $stage | Out-Null') -or
              -not $source.Contains("upgrade --version `$Version") -or
              $source.Contains('public installer never upgrades it')) {
            throw 'Installer must use a safe English-only console prompt and hide verifier JSON'
          }
          $confirm = $ast.Find({
            param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Confirm-Upgrade'
          }, $true)
          if (-not $confirm) { throw 'Upgrade confirmation function missing' }
          Invoke-Expression $confirm.Extent.Text
          $raw = [pscustomobject]@{ Key = 'n'; Fail = $false }
          $raw | Add-Member -MemberType ScriptMethod -Name ReadKey -Value {
            param($flags)
            if ($flags -ne 'NoEcho,IncludeKeyDown') { throw 'Unexpected key flags' }
            if ($this.Fail) { throw 'No interactive terminal' }
            return [pscustomobject]@{ Character = $this.Key; KeyDown = $true }
          }
          $ui = [pscustomobject]@{ RawUI = $raw }
          foreach ($key in @('n', 'N', '', [string][char]13, '?', 'x')) {
            $raw.Key = $key
            if (Confirm-Upgrade $ui) { throw "Unsafe confirmation for key '$key'" }
          }
          foreach ($key in @('y', 'Y')) {
            $raw.Key = $key
            if (-not (Confirm-Upgrade $ui)) { throw "Valid Y approval rejected" }
          }
          $raw.Fail = $true
          $denied = $false
          try { $null = Confirm-Upgrade $ui }
          catch { $denied = $true }
          if (-not $denied) { throw 'No-console failure must not approve upgrade' }

      - name: User task negative checks (never create a task)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'apps/remote-control-mcp-worker/agent/scripts/windows-user-task.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Action Status
          if ($LASTEXITCODE -ne 0) { throw 'Task status failed' }
          # A deliberate native-process error is an expected negative result.
          # Start-Process avoids treating stderr as a pwsh terminating error.
          $p = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$script,'-Action','Enable','-Endpoint','https://rca.example.test/','-Node','C:\Windows\System32\not-node.exe','-Entry','C:\Temp\windows-v2.js') -PassThru -Wait -NoNewWindow -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'expected-task-rejection.txt')
          if ($p.ExitCode -eq 0) { throw 'Untrusted native task path was accepted' }
      - name: Build native windowless scheduled launcher (no user install)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/remote-control-mcp-worker/agent/scripts/build-windows-background.ps1 -Output (Join-Path $env:RUNNER_TEMP 'rca-background.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windowless background launcher compile failed' }
      - name: Stage native Windows x64 offline candidate (no publishing)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # SHA-256 from official Node.js v24.21.0 signed release checksums.
          $official = 'ba4e6d110e8c1592a1ecd390f6b05f3da124b13871a5be62b341a07a853c6c32'
          $nodeBinary = (Get-Command node.exe).Source
          $digest = (Get-FileHash -LiteralPath $nodeBinary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $official) { throw 'Pinned Node binary SHA-256 mismatch' }
          $output = Join-Path $env:RUNNER_TEMP 'windows-preview-bundle'
          node apps/remote-control-mcp-worker/agent/scripts/build-windows-preview.mjs --version v0.0.0-ci --node-bin $nodeBinary --node-sha256 $official --background-bin (Join-Path $env:RUNNER_TEMP 'rca-background.exe') --out $output
          if ($LASTEXITCODE -ne 0) { throw 'Native bundle build failed' }
          $stage = Join-Path $output 'remote-control-agent-v0.0.0-ci-windows-x64'
          & (Join-Path $stage 'bin/node.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled native Node cannot run' }
          $entry = Join-Path $stage 'apps/remote-control-agent/src/windows-v2.js'
          $capabilities = & (Join-Path $stage 'bin/node.exe') $entry status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $capabilities.platform -cne 'win32' -or
              $capabilities.shell -ne $true -or $capabilities.write_file -ne $true) {
            throw 'Bundled Windows Agent full capability status failed'
          }
          $bundle = Get-Content -LiteralPath (Join-Path $stage 'bundle.json') -Raw | ConvertFrom-Json
          if ($bundle.upgrade_profile -cne 'paired-full-v1') { throw 'Full-tools profile not present in signed bundle' }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $output 'candidate.zip') -CompressionLevel Optimal
          $zip = Join-Path $output 'candidate.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $extracted = Join-Path $env:RUNNER_TEMP 'windows-preview-reopened'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -ErrorAction Stop
          node apps/remote-control-mcp-worker/agent/scripts/verify-windows-preview.mjs $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Reopened archive file inventory failed' }
          & (Join-Path $extracted 'rca.cmd') status
          if ($LASTEXITCODE -ne 0) { throw 'Portable rca launcher failed' }
          # CI-only offline fixture: hash verification, safe extraction, private
          # staging and bundled CLI; no pairing, task creation or cloud access.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File apps/remote-control-mcp-worker/agent/tests/fixtures/windows-stage-only.ps1 -Version v0.0.0-ci -OfflineArchive $zip -ExpectedSha256 $hash
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows offline installer failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'mcp-workers\remote-control\programs\v0.0.0-ci-windows-x64'
          & (Join-Path $installed 'rca.cmd') status
          if ($LASTEXITCODE -ne 0) { throw 'Installed bundled CLI failed' }
          $rejectRepeat = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','apps/remote-control-mcp-worker/agent/tests/fixtures/windows-stage-only.ps1','-Version','v0.0.0-ci','-OfflineArchive',$zip,'-ExpectedSha256',$hash) -Wait -PassThru -NoNewWindow -RedirectStandardError (Join-Path $output 'expected-repeat-rejection.txt')
          if ($rejectRepeat.ExitCode -eq 0) { throw 'Repeat-install unexpectedly succeeded' }
          $rejectDigest = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','apps/remote-control-mcp-worker/agent/tests/fixtures/windows-stage-only.ps1','-Version','v0.0.1-ci','-OfflineArchive',$zip,'-ExpectedSha256',('0' * 64)) -Wait -PassThru -NoNewWindow -RedirectStandardError (Join-Path $output 'expected-digest-rejection.txt')
          if ($rejectDigest.ExitCode -eq 0) { throw 'Tampered checksum accepted' }
          Write-Output "Candidate ZIP SHA256: $hash (unpublished)"

      - name: Native Windows second-version rollback candidate (GUI-free archive)
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $official = 'ba4e6d110e8c1592a1ecd390f6b05f3da124b13871a5be62b341a07a853c6c32'
          $nodeBinary = (Get-Command node.exe).Source
          if ((Get-FileHash -LiteralPath $nodeBinary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $official) {
            throw 'Untrusted Windows Node for rollback fixture'
          }
          $out = Join-Path $env:RUNNER_TEMP 'windows-preview-second-version'
          node apps/remote-control-mcp-worker/agent/scripts/build-windows-preview.mjs --version v0.0.1-ci --node-bin $nodeBinary --node-sha256 $official --background-bin (Join-Path $env:RUNNER_TEMP 'rca-background.exe') --out $out
          if ($LASTEXITCODE -ne 0) { throw 'Second-version fixture build failed' }
          $stage = Join-Path $out 'remote-control-agent-v0.0.1-ci-windows-x64'
          node apps/remote-control-mcp-worker/agent/scripts/verify-windows-preview.mjs $stage
          if ($LASTEXITCODE -ne 0) { throw 'GUI-free Windows bundle verification failed' }
          $archive = Join-Path $env:RUNNER_TEMP 'candidate-next-version.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          $reopened = Join-Path $env:RUNNER_TEMP 'windows-preview-reopened-second'
          Expand-Archive -LiteralPath $archive -DestinationPath $reopened -ErrorAction Stop
          node apps/remote-control-mcp-worker/agent/scripts/verify-windows-preview.mjs $reopened
          if ($LASTEXITCODE -ne 0) { throw 'Reopened second-version archive refused' }

          # Build a real, unpublished Windows Rust executable on the native
          # Runner and package it through the same strict Windows candidate
          # builder. The version remains an isolated CI-only fixture.
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain install failed' }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'windows-rust-cargo-target'
          cargo +1.100.0 build --locked --release --manifest-path apps/remote-control-mcp-worker/agent/native-rust/Cargo.toml --bin rca-standard-windows-candidate --bin rca-session-windows-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows Rust candidate build failed' }
          $rustBin = Join-Path $env:CARGO_TARGET_DIR 'release/rca-standard-windows-candidate.exe'
          if (-not (Test-Path -LiteralPath $rustBin -PathType Leaf)) { throw 'Windows Rust candidate binary missing' }
          # Build the released native-only profile; no mixed Node+Rust fixture.
          $nativeTag = 'v0.1.58-rust-candidate.1'
          $nativeOut = Join-Path $env:RUNNER_TEMP 'windows-native-only'
          $sessionBin = Join-Path $env:CARGO_TARGET_DIR 'release/rca-session-windows-candidate.exe'
          node apps/remote-control-mcp-worker/agent/scripts/build-windows-preview.mjs --version $nativeTag --node-bin $nodeBinary --node-sha256 $official --background-bin (Join-Path $env:RUNNER_TEMP 'rca-background.exe') --rust-agent-bin $rustBin --rust-agent-sha256 (Get-FileHash -LiteralPath $rustBin -Algorithm SHA256).Hash.ToLowerInvariant() --artifact-profile rust-native-only-v1 --rust-session-bin $sessionBin --rust-session-sha256 (Get-FileHash -LiteralPath $sessionBin -Algorithm SHA256).Hash.ToLowerInvariant() --out $nativeOut
          if ($LASTEXITCODE -ne 0) { throw 'Native-only Windows candidate build failed' }
          $nativeStage = Join-Path $nativeOut ('remote-control-agent-' + $nativeTag + '-windows-x64')
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/remote-control-mcp-worker/agent/tests/windows-zip-preflight.ps1 -Installer (Join-Path $PWD 'apps/remote-control-mcp-worker/agent/install.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Installer archive preflight contract failed' }
          $nativeVerifier = 'apps/remote-control-mcp-worker/agent/scripts/verify-windows-native.ps1'
          & $nativeVerifier -Root $nativeStage -Version $nativeTag
          # The packaged native CLI must remain offline and read-only even
          # before a device is paired; there is no bundled Node executable.
          $nativeStatus = & (Join-Path $nativeStage 'rca.cmd') status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $nativeStatus.platform -cne 'win32' -or
              $nativeStatus.identity_present -ne $false -or $null -ne $nativeStatus.device_id -or
              $nativeStatus.remote_connection -cne 'unconfirmed') {
            throw 'Unpaired native status did not preserve the offline CLI contract'
          }
          $nativeArchive = Join-Path $env:RUNNER_TEMP 'candidate-native-only.zip'
          Compress-Archive -Path (Join-Path $nativeStage '*') -DestinationPath $nativeArchive -CompressionLevel Optimal
          $nativeReopened = Join-Path $env:RUNNER_TEMP 'windows-native-only-reopened'
          Expand-Archive -LiteralPath $nativeArchive -DestinationPath $nativeReopened -ErrorAction Stop
          & $nativeVerifier -Root $nativeReopened -Version $nativeTag
          # The packaged Session entry is separately required and hashed.
          $session = Join-Path $nativeReopened 'apps/remote-control-agent/.build/rca-session-windows-candidate.exe'
          $manifestPath = Join-Path $nativeReopened 'bundle.json'
          $originalManifest = Get-Content -LiteralPath $manifestPath -Raw
          $manifest = $originalManifest | ConvertFrom-Json
          if ($manifest.session_runtime -cne 'rust-session-v1' -or -not (Test-Path -LiteralPath $session -PathType Leaf)) {
            throw 'Packaged Session runtime missing'
          }
          $manifest.PSObject.Properties.Remove('session_runtime')
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 20))
          $refused = $false
          try { & $nativeVerifier -Root $nativeReopened -Version $nativeTag } catch { $refused = $true }
          if (-not $refused) { throw 'Undeclared Session entry accepted' }
          [IO.File]::WriteAllText($manifestPath, $originalManifest)
          $saved = Join-Path $env:RUNNER_TEMP 'spec914-session-exe-saved'
          Move-Item -LiteralPath $session -Destination $saved
          try {
            $refused = $false
            try { & $nativeVerifier -Root $nativeReopened -Version $nativeTag } catch { $refused = $true }
            if (-not $refused) { throw 'Missing Session entry accepted' }
          } finally { Move-Item -LiteralPath $saved -Destination $session }
          & $nativeVerifier -Root $nativeReopened -Version $nativeTag
          # Reject a Node runtime injected into an otherwise valid inventory.
          $extraNode = Join-Path $nativeReopened 'bin/node.exe'
          [IO.File]::WriteAllText($extraNode, 'unexpected-runtime')
          $refused = $false
          try { & $nativeVerifier -Root $nativeReopened -Version $nativeTag } catch { $refused = $true }
          if (-not $refused) { throw 'Native-only verification accepted an extra Node file' }
          Remove-Item -LiteralPath $extraNode -Force
          # Reject a checksum mismatch in the actual reopened archive.
          $helper = Join-Path $nativeReopened 'bin/rca-background.exe'
          [IO.File]::AppendAllText($helper,'tamper')
          $refused = $false
          try { & $nativeVerifier -Root $nativeReopened -Version $nativeTag } catch { $refused = $true }
          if (-not $refused) { throw 'Native-only verification accepted a damaged file' }
      - name: Register and remove user-logon task with synthetic identity (no cloud calls)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Synthetic task acceptance requires isolated CI' }
          $root = Join-Path $env:LOCALAPPDATA 'mcp-workers\remote-control'
          $key = Join-Path $root 'v2-identity.pem'
          $device = $key + '.device-id'
          $program = Join-Path $env:LOCALAPPDATA 'mcp-workers\remote-control\programs\v0.0.0-ci-windows-x64\rca.cmd'
          $acl = 'apps/remote-control-mcp-worker/agent/scripts/windows-private-store.ps1'
          if (Test-Path -LiteralPath $key) { throw 'Refusing to replace an existing key' }
          if (Test-Path -LiteralPath $device) { throw 'Refusing to replace an existing ID' }
          $created = $false
          try {
            $nodeForKey = Join-Path (Split-Path -Parent $program) 'bin\\node.exe'
            $keyScript = "const {generateKeyPairSync}=require('node:crypto');require('node:fs').writeFileSync(process.argv[1],generateKeyPairSync('ed25519').privateKey.export({format:'pem',type:'pkcs8'}))"
            & $nodeForKey -e $keyScript $key
