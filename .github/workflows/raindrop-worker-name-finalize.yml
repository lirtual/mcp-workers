name: Finalize Raindrop worker naming

on:
  push:
    branches:
      - ticket/24-raindrop-worker-name-unification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ticket/24-raindrop-worker-name-unification
      - name: Patch remaining app-owned identity
        shell: python
        run: |
          from pathlib import Path
          pairs = {
              "apps/raindrop-mcp-worker/src/server.ts": [
                  ('service: "raindrop-mcp"', 'service: "raindrop-mcp-worker"'),
              ],
              "apps/raindrop-mcp-worker/tests/server.http.test.ts": [
                  ('service: "raindrop-mcp"', 'service: "raindrop-mcp-worker"'),
              ],
          }
          for filename, replacements in pairs.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one {old!r} in {filename}")
                  text = text.replace(old, new)
              path.write_text(text)

          # Fail if any known app-owned runtime identity still uses the legacy Worker name.
          checks = {
              "apps/raindrop-mcp-worker/wrangler.jsonc": ['"name": "raindrop-mcp"'],
              "apps/raindrop-mcp-worker/src/worker.ts": ['service: "raindrop-mcp"'],
              "apps/raindrop-mcp-worker/src/server.ts": ['service: "raindrop-mcp"'],
              "apps/raindrop-mcp-worker/src/services/raindropmcp.service.ts": [
                  'name: "raindrop-mcp",',
                  'name: "raindrop-mcp-server",',
              ],
              "apps/raindrop-mcp-worker/docs/cloudflare-mcp-portal.md": [
                  'raindrop-mcp Worker',
                  'Worker identity `raindrop-mcp`',
              ],
              "apps/raindrop-mcp-worker/docs/mcp-portal-acceptance-checklist.md": [
                  'raindrop-mcp Worker',
              ],
          }
          for filename, forbidden in checks.items():
              text = Path(filename).read_text()
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f"legacy Worker identity remains in {filename}: {needle}")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/raindrop-mcp-worker
          git commit -m "test(raindrop): align HTTP identity" || exit 0
          git push origin HEAD:ticket/24-raindrop-worker-name-unification
