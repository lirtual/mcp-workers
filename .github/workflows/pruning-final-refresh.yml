name: Pruning final refresh

on:
  push:
    branches:
      - ticket/pruning-14-final-acceptance

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ticket/pruning-14-final-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Remove retired STDIO comment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/raindrop-mcp-worker/src/services/raindrop.service.ts')
          text = path.read_text()
          old = '// Use project logger instead of console to avoid polluting STDIO'
          new = '// Use the application logger so request diagnostics follow the same redaction path.'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one retired comment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit refresh
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No refresh changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/raindrop-mcp-worker/src/services/raindrop.service.ts pnpm-lock.yaml
          git commit -m 'chore: refresh final pruning state'
          git push origin HEAD:ticket/pruning-14-final-acceptance
