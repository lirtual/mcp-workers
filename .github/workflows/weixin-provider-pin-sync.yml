name: Synchronize reviewed Weixin Provider pin
on:
  repository_dispatch:
    types: [reviewed_weixin_provider_release]

# This workflow is not a Worker publisher and never sends Weixin messages.
# It only requests the single existing manually guarded release.yml.
permissions:
  contents: read
  actions: write

jobs:
  verify-and-queue:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: workflow-mcp-worker
    concurrency:
      group: reviewed-weixin-provider-pin-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify independent release proof, active version and approved environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEIXIN_PROVIDER_PROOF_TOKEN: ${{ secrets.WEIXIN_PROVIDER_PROOF_TOKEN }}
          WEIXIN_ENVIRONMENT_WRITE_TOKEN: ${{ secrets.WEIXIN_ENVIRONMENT_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-reviewed-weixin-provider.mjs
