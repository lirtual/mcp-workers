name: Legacy Agent candidate

# Unpublished Legacy only; never a Standard Release input.
# PR/main CI builds same-source candidates but does not upload promotable Release assets.
on:
  workflow_call:
    inputs:
      candidate_tag:
        description: Unpublished candidate label
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Numeric Legacy bundle version; no publication
        required: true
        type: string

permissions:
  contents: read

env:
  RCA_CANDIDATE_TAG: ${{ inputs.candidate_tag }}

jobs:
  refuse-unreviewed-ref:
    name: Manual Legacy candidates are built from main only
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a candidate dispatch that is not main
        run: echo 'Manual Legacy candidates are built from main only' >&2; exit 1

  linux-legacy-candidate:
    name: Legacy Linux x64 (unpublished)
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Build and verify independent Legacy archive (no publication)
        shell: bash
        run: |
          set -euo pipefail
          version="$RCA_CANDIDATE_TAG"
          [[ "$version" =~ ^v0\.[1-9][0-9]*\.[0-9]+$ ]]
          target=linux-x64-legacy-glibc
          RCA_TEST_TEMP="$(mktemp -d "$RUNNER_TEMP/rca-legacy.XXXXXX")"
          mkdir -p "$RCA_TEST_TEMP"/{cargo,rustup,target,build}
          docker run --rm --network bridge \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RCA_TEST_TEMP/cargo:/cargo" \
            -v "$RCA_TEST_TEMP/rustup:/rustup" \
            -v "$RCA_TEST_TEMP/target:/target" \
            -v "$RCA_TEST_TEMP/build:/out" \
            rockylinux:8@sha256:bb506c7fb739275cb4af329f8ff21c558af43b4398bf1bb3d93ae417dac92732 \
            bash -lc '
              set -eo pipefail
              # Rocky 8 mirrors may expose mismatched GCC dependency revisions.
              # Refresh metadata and allow a consistent available compiler set.
              dnf -y -q --refresh --nobest install gcc ca-certificates
              gcc --version | head -1
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              export HOME=/tmp/rust-home CARGO_HOME=/cargo RUSTUP_HOME=/rustup CARGO_TARGET_DIR=/target
              mkdir -p "$HOME"
              curl --fail --silent --show-error --location --retry 3 --max-time 120 \
                --proto "=https" --tlsv1.2 https://sh.rustup.rs -o /tmp/rustup-init.sh
              sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.100.0
              export PATH="$CARGO_HOME/bin:$PATH"
              bins=(--bin rca-standard-linux-candidate)
              if [[ "$(uname -m)" == x86_64 ]]; then bins+=(--bin rca-session-linux-candidate); fi
              cargo build --locked --release \
                --manifest-path /src/apps/remote-control-mcp-worker/agent/native-rust/Cargo.toml \
                "${bins[@]}"
              cc -DRCA_LEGACY_LIVE_GROUP -std=c11 -O2 -Wall -Wextra -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=2 -Wl,-z,relro,-z,now \
                /src/apps/remote-control-mcp-worker/agent/scripts/session-supervisor.c -o /out/session-supervisor
              install -m 0755 "$CARGO_TARGET_DIR/release/rca-standard-linux-candidate" /out/rca-standard-linux-candidate
              if [[ "$(uname -m)" == x86_64 ]]; then
                install -m 0755 "$CARGO_TARGET_DIR/release/rca-session-linux-candidate" /out/rca-session-linux-candidate
              fi
            '
          supervisor="$RCA_TEST_TEMP/build/session-supervisor"
          rust_agent="$RCA_TEST_TEMP/build/rca-standard-linux-candidate"
          session_bin="$RCA_TEST_TEMP/build/rca-session-linux-candidate"
          agent=apps/remote-control-mcp-worker/agent
          output="$RCA_TEST_TEMP/legacy"
          build_bundle() {
            node "$agent/scripts/build-agent-release.mjs" \
              --version "$1" --target "$target" \
              --native "$supervisor" --native-sha256 "$(sha256sum "$supervisor" | cut -d' ' -f1)" \
              --rust-agent-bin "$rust_agent" --rust-agent-sha256 "$(sha256sum "$rust_agent" | cut -d' ' -f1)" \
              --rust-session-bin "$session_bin" --rust-session-sha256 "$(sha256sum "$session_bin" | cut -d' ' -f1)" \
              --artifact-profile rust-native-only-v1 --out "$2"
          }
          build_bundle "$version" "$output"
          archive="$output/remote-control-agent-$version-$target.tar.gz"
          python3 -B "$agent/scripts/validate-local-archive.py" "$archive" "$version" "$target"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {inspectTarGzip} from "./apps/remote-control-mcp-worker/agent/scripts/verify-agent-release.mjs"; inspectTarGzip(readFileSync(process.argv[1]),{tag:process.argv[2],target:process.argv[3]});' \
            "$archive" "$version" "$target"
          mkdir -p legacy-candidate
          cp -- "$archive" legacy-candidate/
          (cd legacy-candidate; sha256sum "$(basename "$archive")" > SHA256SUMS.txt)
          git rev-parse HEAD > legacy-candidate/source-commit.txt
          # The rollback baseline must itself admit 0550. The previously released
          # Legacy binary does not. Use a second unpublished label over the same
          # verified ELF inputs to exercise the real lifecycle without publication.
          next_version="${version%.*}.$((10#${version##*.}+1))"
          build_bundle "$next_version" "$RCA_TEST_TEMP/fixture"
          {
            echo "RCA_TEST_OLD_ARCHIVE=$archive"
            echo "RCA_TEST_NATIVE_ARCHIVE=$RCA_TEST_TEMP/fixture/remote-control-agent-$next_version-$target.tar.gz"
            echo "RCA_TEST_BASELINE_VERSION=$version"
            echo "RCA_TEST_TARGET_VERSION=$next_version"
          } >> "$GITHUB_ENV"
      - name: Exercise Root HOME 0550 on disposable systemd runner (no Owner Grant)
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_ACTIONS" = true
          test "$(getent passwd 0 | cut -d: -f6)" = /root
          test "$(sudo stat -c %u /root)" = 0
          for item in /root/.local/share/mcp-workers/remote-control \
            /root/.local/state/mcp-workers/remote-control-agent /root/.local/bin/rca \
            /root/.config/systemd/user/remote-control-agent.service{,.d,.upgrade-backup}; do
            sudo test ! -e "$item"
            sudo test ! -L "$item"
          done
          old_mode="$(sudo stat -c %a /root)"
          old_linger="$(sudo loginctl show-user 0 -p Linger --value 2>/dev/null || true)"
          old_manager="$(sudo systemctl is-active user@0.service || true)"
          manager_env=(env HOME=/root XDG_RUNTIME_DIR=/run/user/0 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/0/bus)
          cleanup() {
            sudo chmod "$old_mode" /root
            if [[ "$old_linger" != yes ]]; then sudo loginctl disable-linger root; fi
            if [[ "$old_manager" != active ]]; then sudo systemctl stop user@0.service; fi
          }
          trap cleanup EXIT
          sudo loginctl enable-linger root
          sudo systemctl start user@0.service
          for _ in $(seq 1 50); do
            sudo test -S /run/user/0/bus && break
            sleep 0.1
          done
          sudo test -S /run/user/0/bus
          state="$(sudo "${manager_env[@]}" /usr/bin/systemctl --user show remote-control-agent.service -p LoadState --value 2>/dev/null || true)"
          test "$state" = not-found
          sudo chmod 0550 /root
          agent="$GITHUB_WORKSPACE/apps/remote-control-mcp-worker/agent"
          # No inherited GitHub token or cloud endpoint is passed to the Root fixture.
          sudo env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/root \
            XDG_RUNTIME_DIR=/run/user/0 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/0/bus \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RCA_TEST_ROOT_HOME_0550=1 \
            RCA_TEST_AGENT_SOURCE="$agent" RCA_TEST_OLD_ARCHIVE="$RCA_TEST_OLD_ARCHIVE" \
            RCA_TEST_NATIVE_ARCHIVE="$RCA_TEST_NATIVE_ARCHIVE" \
            RCA_TEST_BASELINE_VERSION="$RCA_TEST_BASELINE_VERSION" RCA_TEST_TARGET_VERSION="$RCA_TEST_TARGET_VERSION" \
            "$(node -p 'process.execPath')" --experimental-strip-types "$agent/tests/linux-native-only-systemd.integration.mjs"
          test "$(sudo stat -c %a /root)" = 550
      - name: Save independent unpublished Legacy candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate_tag }}-linux-x64-legacy-glibc
          path: legacy-candidate/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
