name: Raindrop v3 Isolated Test Deploy

on:
  push:
    branches:
      - feat/raindrop-v3-core-reliability
    paths:
      - .github/workflows/raindrop-v3-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raindrop-mcp-worker-v3-test
  cancel-in-progress: false

jobs:
  deploy-test-only:
    name: Deploy isolated v3 test Worker
    environment: workflow-mcp-worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8bb496011403552e785ea1b834daffdf
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Cloudflare deploy credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing Cloudflare deployment credential"
            exit 1
          fi
          # RAINDROP_ACCESS_TOKEN is pre-provisioned directly on this exact
          # isolated Cloudflare Worker, never exported into GitHub Actions.

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check v3 application
        run: pnpm --filter raindrop-mcp-worker check

      - name: Check direct MCP smoke and lifecycle script syntax
        run: |
          node --check apps/raindrop-mcp-worker/scripts/test-direct-mcp.mjs
          node --check apps/raindrop-mcp-worker/scripts/test-direct-mcp-lifecycle.mjs

      - name: Deploy and probe ONLY the isolated v3 test Worker
        working-directory: apps/raindrop-mcp-worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/raindrop-v3-secrets-$$.json"
          trap 'rm -f "$secrets_file"' EXIT

          # Upload ONLY the per-run MCP credential; Cloudflare retains the
          # pre-existing isolated RAINDROP_ACCESS_TOKEN secret.
          # Generate the MCP transport secret per run; it is never printed.
          mcp_token="$(openssl rand -hex 32)"
          echo "::add-mask::$mcp_token"
          export mcp_token

          node --input-type=module -e '
            import fs from "node:fs";
            fs.writeFileSync(process.argv[1], JSON.stringify({
              MCP_ACCESS_TOKEN: process.env.mcp_token,
            }), { mode: 0o600 });
          ' "$secrets_file"

          pnpm exec wrangler deploy --name raindrop-mcp-worker-v3-test --keep-vars --secrets-file "$secrets_file"

          export MCP_ACCESS_TOKEN="$mcp_token"
          export RAINDROP_V3_TEST_URL="https://raindrop-mcp-worker-v3-test.aiyaya.workers.dev"
          # Direct HTTPS/JSON-RPC over /mcp, not Portal; only read-only actions.
          node scripts/test-direct-mcp.mjs
          # Run live reads first, then test only run-owned tag/highlight/bulk changes.
          # Never clear Trash or mutate pre-existing user objects.
          node scripts/test-direct-mcp-lifecycle.mjs

          echo "Direct isolated v3 MCP smoke and owned lifecycle completed (no account contents or secrets logged)."
