name: Remote desktop throwaway prototype

on:
  pull_request:
    paths:
      - ".scratch/remote-desktop-mcp/**"
      - ".github/workflows/remote-desktop-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install existing pinned workspace (no new prototype dependencies)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: State-machine tests (logic only, not real DO acceptance)
        run: node --test .scratch/remote-desktop-mcp/test/relay-state.test.mjs
      - name: Compile Cloudflare DO configuration without deploying
        run: |
          pnpm --filter workflow-mcp-worker exec wrangler deploy --dry-run \
            --config ../../.scratch/remote-desktop-mcp/wrangler.jsonc \
            --outdir /tmp/remote-desktop-prototype-173
      - name: Install isolated pinned scratch test tooling (CI only)
        run: |
          npm install --prefix .scratch/remote-desktop-mcp --no-save --no-package-lock --ignore-scripts \
            ws@8.18.3 vitest@4.1.0 @cloudflare/vitest-plugin@1.0.0 \
            @wonderwhy-er/desktop-commander@0.2.51
      - name: Exercise local workerd WebSocket + synthetic MCP (no deploy)
        run: node .scratch/remote-desktop-mcp/test/workerd-integration.mjs
      - name: Verify real pinned Desktop Commander stdio in locked-down test container
        run: |
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 1g --cpus 1 \
            --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --volume "$PWD/.scratch/remote-desktop-mcp:/prototype:ro" \
            --workdir /prototype node:24-bookworm-slim \
            node test/upstream-stdio-proof.mjs
      - name: Force Durable Object eviction and verify hibernated WebSocket
        working-directory: .scratch/remote-desktop-mcp
        run: ./node_modules/.bin/vitest run --config vitest.config.mjs
      - name: Assert no unexpected public endpoint configuration
        run: |
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(".scratch/remote-desktop-mcp/wrangler.jsonc"));if(x.workers_dev!==false||x.preview_urls!==false||x.routes||x.route) process.exit(1)'
