name: Raindrop Spec123 One-Time Live Acceptance

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed commit SHA (fail closed)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: raindrop-spec123-live-acceptance
  cancel-in-progress: false

jobs:
  spec123:
    name: Spec123 disposable-only live test
    if: ${{ github.ref == 'refs/heads/main' && inputs.approved_sha == 'e6fc4dde64dbc1ce277ed6a477c0c2e4f1e7e55d' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: raindrop-mcp-worker
    steps:
      - name: Check out exact reviewed code without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: e6fc4dde64dbc1ce277ed6a477c0c2e4f1e7e55d
          persist-credentials: false
      - name: Verify immutable tested revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e6fc4dde64dbc1ce277ed6a477c0c2e4f1e7e55d"
          echo "APPROVED_SHA_VERIFIED=e6fc4dde64dbc1ce277ed6a477c0c2e4f1e7e55d"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run only the isolated Spec123 live acceptance
        shell: bash
        env:
          RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
          RUN_DESTRUCTIVE_LIVE_TESTS: "true"
          CONFIRM_DESTRUCTIVE_LIVE_TESTS: "DELETE_ONLY_TEST_BOOKMARKS"
        run: |
          set -euo pipefail
          pnpm --filter raindrop-mcp-worker run test:live:spec123
