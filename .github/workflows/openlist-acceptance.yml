name: OpenList Driver Acceptance

# Manual-only driver and Portal flows; no scheduled checks.
# Fixture writes need explicit approval.
on:
  workflow_dispatch:
    inputs:
      confirm_disposable_write:
        description: Authorize one new folder and one tiny test file under the reviewed Koofr root
        required: true
        type: boolean
        default: false
      confirm_native_tool_tests:
        description: Also test native upload, copy, rename, move and signed link inside the fresh disposable fixture
        required: false
        type: boolean
        default: false
      confirm_high_risk_lifecycle:
        description: Single first-attempt test of share create/update/disable/enable/revoke and delete only the newly created synthetic file (requires disposable write, no native)
        required: false
        type: boolean
        default: false
      confirm_portal_registration:
        description: Separately approve registering existing OpenList MCP in One-MCP (no Worker release)
        required: false
        type: boolean
        default: false
      confirm_historical_share_read:
        description: Read-only inspection of historical synthetic share mcp_spec309_40493124967_1 (no changes)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  selection-gate:
    name: Validate exact manual approval selection (no secrets)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deny unapproved, conflicting or non-main dispatches
        shell: bash
        env:
          CURRENT_REF: ${{ github.ref }}
          APPROVE_FIXTURE_WRITE: ${{ inputs.confirm_disposable_write }}
          APPROVE_NATIVE: ${{ inputs.confirm_native_tool_tests }}
          APPROVE_HIGH_RISK: ${{ inputs.confirm_high_risk_lifecycle }}
          APPROVE_PORTAL: ${{ inputs.confirm_portal_registration }}
          APPROVE_SHARE_READ: ${{ inputs.confirm_historical_share_read }}
        run: |
          set -euo pipefail
          [[ "$CURRENT_REF" == "refs/heads/main" ]] || exit 1
          if [[ "$APPROVE_HIGH_RISK" == "true" ]]; then
            [[ "$APPROVE_FIXTURE_WRITE" == "true" &&
               "$APPROVE_NATIVE" == "false" &&
               "$APPROVE_PORTAL" == "false" &&
               "$APPROVE_SHARE_READ" == "false" &&
               "$GITHUB_RUN_ATTEMPT" == "1" ]] || exit 1
          elif [[ "$APPROVE_SHARE_READ" == "true" ]]; then
            [[ "$APPROVE_FIXTURE_WRITE" == "false" &&
               "$APPROVE_NATIVE" == "false" &&
               "$APPROVE_PORTAL" == "false" ]] || exit 1
          elif [[ "$APPROVE_PORTAL" == "true" ]]; then
            [[ "$APPROVE_FIXTURE_WRITE" == "false" &&
               "$APPROVE_NATIVE" == "false" ]] || exit 1
          else
            [[ "$APPROVE_FIXTURE_WRITE" == "true" ]] || exit 1
            [[ "$APPROVE_NATIVE" == "true" || "$APPROVE_NATIVE" == "false" ]] || exit 1
          fi
          echo "OPENLIST_ACCEPTANCE_SELECTION_VALID"

  driver-e2e:
    name: Live OpenList MCP / Koofr driver E2E (no deploy)
    needs: selection-gate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_disposable_write == true && inputs.confirm_portal_registration != true && inputs.confirm_historical_share_read != true }}
    runs-on: ubuntu-latest
    environment:
      name: openlist-mcp-worker
    timeout-minutes: 8
    concurrency:
      group: openlist-driver-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate current main and test contracts without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/main | cut -f1)" ]]
          if [[ "${{ inputs.confirm_high_risk_lifecycle }}" == "true" ]]; then [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]; fi
          node --check scripts/openlist-driver-acceptance.mjs
          node --test scripts/openlist-driver-acceptance.test.mjs
      - name: Verify real MCP tools using one fresh disposable Koofr folder
        shell: bash
        env:
          OPENLIST_DRIVER_E2E_APPROVED: ${{ inputs.confirm_disposable_write }}
          OPENLIST_NATIVE_E2E_APPROVED: ${{ inputs.confirm_native_tool_tests }}
          OPENLIST_HIGH_RISK_E2E_APPROVED: ${{ inputs.confirm_high_risk_lifecycle }}
          OPENLIST_ALLOWED_ROOTS: ${{ vars.OPENLIST_ALLOWED_ROOTS }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          OPENLIST_API_TOKEN: ${{ secrets.OPENLIST_API_TOKEN }}
        run: node scripts/openlist-driver-acceptance.mjs

  historical-share-read:
    name: Read only exact historical synthetic share (no deploy or mutations)
    needs: selection-gate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_historical_share_read == true && inputs.confirm_disposable_write != true && inputs.confirm_native_tool_tests != true && inputs.confirm_portal_registration != true && inputs.confirm_high_risk_lifecycle != true }}
    runs-on: ubuntu-latest
    environment:
      name: openlist-mcp-worker
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm exact current main and read-only tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/main | cut -f1)" ]]
          node --check scripts/openlist-production-read-smoke.mjs
          node --test scripts/openlist-production-read-smoke.test.mjs
      - name: Read sanitized state of exact historical share
        shell: bash
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          OPENLIST_ALLOWED_ROOTS: ${{ vars.OPENLIST_ALLOWED_ROOTS }}
          OPENLIST_HISTORICAL_SHARE_READ: "true"
        run: node scripts/openlist-production-read-smoke.mjs

  portal-checks:
    name: Required checks before OpenList Portal registration
    needs: selection-gate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_portal_registration == true && inputs.confirm_disposable_write != true && inputs.confirm_native_tool_tests != true }}
    uses: ./.github/workflows/ci.yml
    with:
      worker: openlist-mcp-worker

  portal-register:
    name: Register existing OpenList MCP in One-MCP (no Worker deploy)
    needs: portal-checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm_portal_registration == true &&
          inputs.confirm_disposable_write != true &&
          inputs.confirm_native_tool_tests != true &&
          needs.portal-checks.result == 'success' &&
          needs.portal-checks.outputs.release_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: openlist-mcp-worker
    concurrency:
      group: worker-release-openlist-mcp-worker
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify unchanged current main and offline registration contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/main | cut -f1)" ]]
          node --check scripts/register-openlist-portal.mjs
          node --test scripts/register-openlist-portal.test.mjs
          node --test scripts/openlist-production-read-smoke.test.mjs
      - name: Recheck live deployed OpenList binding and scope before Portal mutation
        shell: bash
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          OPENLIST_ALLOWED_ROOTS: ${{ vars.OPENLIST_ALLOWED_ROOTS }}
        run: node scripts/openlist-production-read-smoke.mjs
      - name: Register only the existing OpenList MCP server in One-MCP
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-openlist-portal.mjs
