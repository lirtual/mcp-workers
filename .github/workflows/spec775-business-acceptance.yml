name: Spec 775 business acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_business_acceptance:
        description: Authorize this Spec 775 read or the openlist republish and six business runs
        required: true
        type: boolean
        default: false
      phase:
        description: discover is read-only; accept publishes openlist and runs the six workflows
        required: true
        type: choice
        options:
          - discover
          - accept

permissions:
  contents: read

jobs:
  accept:
    name: Spec 775 business acceptance
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.actor == 'lirtual' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm_business_acceptance == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: spec775-business-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the selected acceptance phase
        env:
          SPEC775_PHASE: ${{ inputs.phase }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/workflow-mcp-worker/tests/spec775-business-acceptance.mjs
