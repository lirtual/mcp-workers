name: Register Weixin MCP Portal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: weixin-mcp-worker
    concurrency:
      group: weixin-portal-registration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate registration script and offline contract
        run: |
          node --check scripts/register-weixin-portal.mjs
          node --test scripts/register-weixin-portal.test.mjs
      - name: Attach Weixin to the existing production portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-weixin-portal.mjs
