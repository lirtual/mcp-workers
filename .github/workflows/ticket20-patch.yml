name: ticket20-patch

on:
  push:
    branches:
      - ticket/20-raindrop-lifecycle-config-cleanup
    paths:
      - .github/workflows/ticket20-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ticket/20-raindrop-lifecycle-config-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply lifecycle/config cleanup
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/ticket20_patch.py
          python3 /tmp/ticket20_patch.py
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm install --lockfile-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/raindrop-mcp-worker pnpm-lock.yaml
          git diff --cached --check
          git commit -m "refactor(raindrop): align lifecycle and explicit config"
          git push origin HEAD:ticket/20-raindrop-lifecycle-config-cleanup
