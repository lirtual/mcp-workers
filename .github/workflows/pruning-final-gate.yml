name: Pruning final static gate

on:
  push:
    branches:
      - ticket/pruning-14-final-acceptance

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pruned active tree
        shell: bash
        run: |
          set -euo pipefail

          test ! -e apps/raindrop-mcp-worker/nightwatch.conf.cjs
          test ! -e apps/raindrop-mcp-worker/scripts/auth-check.mjs
          test ! -e apps/ima-mcp-worker/original-skill
          test ! -e apps/ima-mcp-worker/companion-skill

          node - <<'NODE'
          const pkg = require('./apps/raindrop-mcp-worker/package.json');
          const all = {...pkg.dependencies, ...pkg.devDependencies};
          const forbidden = [
            '@modelcontextprotocol/sdk', 'axios', 'openai', 'zod-to-json-schema',
            '@typescript/native', 'vitest-mock-extended'
          ];
          for (const name of forbidden) {
            if (name in all) throw new Error(`retired dependency remains: ${name}`);
          }
          if (pkg.scripts['auth:check']) throw new Error('retired auth:check script remains');
          if (!pkg.scripts['test:local'].includes('cleanup_destructive.test.ts')) {
            throw new Error('destructive confirmation contract is not in local CI-safe tests');
          }
          NODE

          if grep -RInE 'process\.(env|stderr|version|platform|uptime|memoryUsage)|\bBun\b|STDIO' apps/raindrop-mcp-worker/src; then
            echo 'retired Node/Bun/STDIO assumption remains in production source' >&2
            exit 1
          fi

          if grep -Eq 'MCP_ORIGIN_TOKEN|Access assertion|workers_dev=false' apps/openlist-mcp-worker/docs/security.md; then
            echo 'OpenList security doc still describes retired ingress' >&2
            exit 1
          fi

          if grep -Eq 'reversible write|execute one .*write operation' apps/raindrop-mcp-worker/docs/mcp-portal-acceptance-checklist.md; then
            echo 'production write smoke remains in acceptance checklist' >&2
            exit 1
          fi

          if grep -RInF 'docs/spec.md' apps; then
            echo 'active app documentation still references removed docs/spec.md' >&2
            exit 1
          fi

          nested=$(find apps -type d \( -name .github -o -name .scratch -o -name .claude -o -name .codex -o -name conductor \) -print)
          if [ -n "$nested" ]; then
            echo "nested standalone repository tooling remains:" >&2
            echo "$nested" >&2
            exit 1
          fi

          for f in \
            apps/weread-mcp-worker/wrangler.jsonc \
            apps/ima-mcp-worker/wrangler.jsonc \
            apps/raindrop-mcp-worker/wrangler.jsonc \
            apps/openlist-mcp-worker/wrangler.jsonc \
            apps/instapaper-mcp-worker/wrangler.jsonc \
            apps/database-mcp-worker/wrangler.jsonc.example; do
            grep -Fq '"workers_dev": true' "$f"
            grep -Fq '"preview_urls": false' "$f"
          done

          echo 'Final pruning static gate passed.'
