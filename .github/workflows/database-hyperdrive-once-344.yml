name: One-time Aiven Hyperdrive PostgreSQL isolated schema read 344
on:
  push:
    branches: [feat/database-spec-344]
    paths: [.github/workflows/database-hyperdrive-once-344.yml]
permissions:
  contents: read
jobs:
  aiven:
    runs-on: ubuntu-latest
    environment: database-mcp-worker
    timeout-minutes: 12
    concurrency:
      group: database-344-hyperdrive-once
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PG_TEST_PASSWORD: ${{ secrets.DATABASE_TEST_POSTGRES_PASSWORD }}
      MYSQL_TEST_PASSWORD: ${{ secrets.DATABASE_TEST_MYSQL_PASSWORD }}
      CERT_ID: c9a71de0-06b0-4ea2-b2e8-2dfc27fb0d7a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Strict scope and account CA permission preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/feat/database-spec-344" ]]
          [[ "$CLOUDFLARE_ACCOUNT_ID" == "8bb496011403552e785ea1b834daffdf" ]]
          [[ -n "$PG_TEST_PASSWORD" && -n "$MYSQL_TEST_PASSWORD" && -n "$CLOUDFLARE_API_TOKEN" ]]
          node --input-type=module <<'NODE'
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/mtls_certificates/'+process.env.CERT_ID,
            {headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
             signal:AbortSignal.timeout(20000)});
          const b=await r.json().catch(()=>({}));
          console.log('ACCOUNT_CA_PREFLIGHT',JSON.stringify({http:r.status,success:b.success===true,
            ca:b.result?.ca===true,code:(b.errors||[]).map(e=>e.code)}));
          if(!r.ok||b.success!==true||b.result?.ca!==true)process.exitCode=1;
          NODE
      - name: Create isolated Hyperdrive PostgreSQL and MySQL with strict server CA verification
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/hyperdrive/configs';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'};
          const ids={};const save=()=>writeFileSync(process.env.RUNNER_TEMP+'/db344-hd-created.json',JSON.stringify(ids),{mode:0o600});
          const tests=[
            {type:'postgres',host:'postgresql-zeroverse.d.aivencloud.com',database:'database-mcp-test-postgres',
              mode:'verify-full',password:process.env.PG_TEST_PASSWORD},
            {type:'mysql',host:'mysql-zeroverse.d.aivencloud.com',database:'database-mcp-test-mysql',
              mode:'VERIFY_IDENTITY',password:process.env.MYSQL_TEST_PASSWORD}];
          for(const t of tests){
            const body={name:'db344-once-'+t.type+'-'+process.env.GITHUB_RUN_ID,
              origin:{scheme:t.type,host:t.host,port:18691,database:t.database,user:'test',password:t.password},
              mtls:{ca_certificate_id:process.env.CERT_ID,sslmode:t.mode},
              caching:{disabled:true},origin_connection_limit:5};
            const r=await fetch(base,{method:'POST',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(55000)});
            const json=await r.json().catch(()=>({}));
            if(json.result?.id){ids[t.type]=json.result.id;save();}
            const ok=r.ok && json.success===true && !!json.result?.id &&
              json.result?.mtls?.ca_certificate_id===process.env.CERT_ID &&
              json.result?.mtls?.sslmode===t.mode;
            const errorText=(json.errors||[]).map(e=>String(e.message||'').toLowerCase()).join(' ');
            const categories=['permission','certificate','tls','ssl','connection','authentication','credential','user','password','host','network','timeout','denied'].filter(k=>errorText.includes(k));
            console.log('HYPERDRIVE_CREATE',JSON.stringify({dialect:t.type,http:r.status,strict_mode_readback:ok,
              codes:(json.errors||[]).map(e=>e.code),category:categories}));
            if(!ok)throw Error('Hyperdrive verified TLS configuration not created for '+t.type);
          }
          NODE
      - name: Install existing locked worker dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deploy isolated bearer-protected test Worker, never production
        shell: bash
        run: |
          set -euo pipefail
          cd apps/database-mcp-worker
          cat > src/hyperdrive-tmp344.ts <<'TS'
          import { Client } from 'pg';
          import { createConnection } from 'mysql2/promise';
          interface HD {host:string;port:number;user:string;password:string;database:string;}
          interface Env { POSTGRES:HD;MYSQL:HD;PROBE_TOKEN:string; }
          export default {async fetch(req:Request,env:Env):Promise<Response>{
           if(req.method!=='POST'||new URL(req.url).pathname!=='/run')return new Response('Not found',{status:404});
           if(!env.PROBE_TOKEN||req.headers.get('authorization')!=='Bearer '+env.PROBE_TOKEN)return new Response('Forbidden',{status:403});
           const out:Record<string,unknown>={};
           const pg=env.POSTGRES;const client=new Client({host:pg.host,port:pg.port,user:pg.user,password:pg.password,database:pg.database,ssl:false,connectionTimeoutMillis:12000});
           try{
            await client.connect();
            const r=await client.query("SELECT nspname, has_schema_privilege(current_user, oid, 'CREATE') AS can_create, has_schema_privilege(current_user, oid, 'USAGE') AS can_use FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname <> 'information_schema'");
            const writable=r.rows.filter(x=>x.can_create===true&&x.can_use===true);
            out.postgres={schemaCount:r.rows.length, writableSchemaCount:writable.length,
             // Never write outside a preexisting and clearly dedicated test schema.
             dedicatedWritableSchemas:writable.map(x=>x.nspname).filter((v):v is string=>typeof v==='string'&&/^(?:test|test_[a-zA-Z0-9_]+|db344_[a-zA-Z0-9_]+)$/.test(v)).slice(0,10),
             publicCreate:r.rows.some(x=>x.nspname==='public'&&x.can_create===true)};
           }catch(e){out.postgres={probeFailed:true};}finally{await client.end().catch(()=>undefined);}
           const hd=env.MYSQL;let conn:Awaited<ReturnType<typeof createConnection>>|undefined;
           try{
            conn=await createConnection({host:hd.host,port:hd.port,user:hd.user,password:hd.password,database:hd.database,disableEval:true,connectTimeout:12000});
            const [rows]=await conn.query("SHOW TABLES LIKE 'db344_%'");
            out.mysql={orphanProbeTableCount:Array.isArray(rows)?rows.length:-1};
           }catch(e){out.mysql={probeFailed:true};}finally{if(conn)await conn.end().catch(()=>undefined);}
           return Response.json(out,{headers:{'Cache-Control':'no-store'}});
          }};
          TS
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import {randomBytes} from 'node:crypto';
          const ids=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/db344-hd-created.json','utf8'));
          if(!ids.postgres||!ids.mysql)throw Error('Both Hyperdrive IDs required');
          const token=randomBytes(32).toString('hex');
          writeFileSync(process.env.RUNNER_TEMP+'/db344-hd-bearer',token,{mode:0o600});
          writeFileSync(process.env.RUNNER_TEMP+'/db344-hd-secrets.json',JSON.stringify({PROBE_TOKEN:token}),{mode:0o600});
          const name='db344-hyperdrive-proof-'+process.env.GITHUB_RUN_ID;
          writeFileSync('.wrangler-db344-once.json',JSON.stringify({name,main:'src/hyperdrive-tmp344.ts',
            compatibility_date:'2026-09-12',compatibility_flags:['nodejs_compat'],
            workers_dev:true,preview_urls:false,
            hyperdrive:[{binding:'POSTGRES',id:ids.postgres},{binding:'MYSQL',id:ids.mysql}]}),{mode:0o600});
          appendFileSync(process.env.GITHUB_ENV,'DB344_HYPERDRIVE_WORKER='+name+'\n');
          NODE
          pnpm exec wrangler deploy --config .wrangler-db344-once.json \
            --secrets-file "$RUNNER_TEMP/db344-hd-secrets.json" \
            > "$RUNNER_TEMP/db344-hd-deploy.log" 2>&1 || { echo "TEMP_WORKER_DEPLOY_FAILED"; exit 1; }
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const s=readFileSync(process.env.RUNNER_TEMP+'/db344-hd-deploy.log','utf8');
          const url=s.match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev\b/)?.[0];
          if(!url)throw Error('Temporary Worker URL not found');
          appendFileSync(process.env.GITHUB_ENV,'DB344_HYPERDRIVE_URL='+url+'\n');
          NODE
      - name: Real Workers SELECT 1 plus TLS session check for both Aiven databases
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const token=readFileSync(process.env.RUNNER_TEMP+'/db344-hd-bearer','utf8');
          let body;
          for(let attempt=0;attempt<5;attempt++){
            const r=await fetch(process.env.DB344_HYPERDRIVE_URL+'/run',{
              method:'POST',headers:{authorization:'Bearer '+token},
              signal:AbortSignal.timeout(60000)});
            if(r.ok){body=await r.json();break;}
            if(![404,502,503].includes(r.status))throw Error('Worker probe response HTTP '+r.status);
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          if(!body)throw Error('Worker not reachable');
          for(const dialect of ['postgres','mysql']){
            const result=body[dialect];
            console.log('AIVEN_TEST_QUERY',JSON.stringify({dialect,...result}));
            if(!result || (dialect==='postgres' && !Number.isInteger(result.schemaCount)) || (dialect==='mysql' && result.orphanProbeTableCount!==0))process.exitCode=1;
          }
          NODE
      - name: Always delete disposable Worker and Hyperdrive configs and temporary runner secrets
        if: always()
        shell: bash
        run: |
          set +e
          cd apps/database-mcp-worker
          if [[ -f .wrangler-db344-once.json ]]; then
            pnpm exec wrangler delete --config .wrangler-db344-once.json --name "$DB344_HYPERDRIVE_WORKER" --force >/dev/null 2>&1
            echo "TEMP_WORKER_CLEANUP_ATTEMPTED"
          fi
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync,rmSync} from 'node:fs';
          const f=process.env.RUNNER_TEMP+'/db344-hd-created.json';
          if(existsSync(f)){
            const ids=JSON.parse(readFileSync(f,'utf8'));
            for(const [name,id] of Object.entries(ids)){
              try{
                const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/hyperdrive/configs/'+id,{
                  method:'DELETE',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
                  signal:AbortSignal.timeout(20000)});
                console.log('HYPERDRIVE_CLEANUP',name,r.status);
              }catch{console.log('HYPERDRIVE_CLEANUP',name,'unverified');}
            }
          }
          for(const p of [f,process.env.RUNNER_TEMP+'/db344-hd-bearer',process.env.RUNNER_TEMP+'/db344-hd-secrets.json',
             process.env.RUNNER_TEMP+'/db344-hd-deploy.log','.wrangler-db344-once.json','src/hyperdrive-tmp344.ts'])
            rmSync(p,{force:true});
          NODE
