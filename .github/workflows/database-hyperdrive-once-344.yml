name: One-time Aiven Hyperdrive full SQL proof 344
on:
  push:
    branches: [feat/database-spec-344]
    paths: [.github/workflows/database-hyperdrive-once-344.yml]
permissions:
  contents: read
jobs:
  aiven:
    runs-on: ubuntu-latest
    environment: database-mcp-worker
    timeout-minutes: 12
    concurrency:
      group: database-344-hyperdrive-once
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PG_TEST_PASSWORD: ${{ secrets.DATABASE_TEST_POSTGRES_PASSWORD }}
      MYSQL_TEST_PASSWORD: ${{ secrets.DATABASE_TEST_MYSQL_PASSWORD }}
      CERT_ID: c9a71de0-06b0-4ea2-b2e8-2dfc27fb0d7a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Strict scope and account CA permission preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/feat/database-spec-344" ]]
          [[ "$CLOUDFLARE_ACCOUNT_ID" == "8bb496011403552e785ea1b834daffdf" ]]
          [[ -n "$PG_TEST_PASSWORD" && -n "$MYSQL_TEST_PASSWORD" && -n "$CLOUDFLARE_API_TOKEN" ]]
          node --input-type=module <<'NODE'
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/mtls_certificates/'+process.env.CERT_ID,
            {headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
             signal:AbortSignal.timeout(20000)});
          const b=await r.json().catch(()=>({}));
          console.log('ACCOUNT_CA_PREFLIGHT',JSON.stringify({http:r.status,success:b.success===true,
            ca:b.result?.ca===true,code:(b.errors||[]).map(e=>e.code)}));
          if(!r.ok||b.success!==true||b.result?.ca!==true)process.exitCode=1;
          NODE
      - name: Create isolated Hyperdrive PostgreSQL and MySQL with strict server CA verification
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/hyperdrive/configs';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'};
          const ids={};const save=()=>writeFileSync(process.env.RUNNER_TEMP+'/db344-hd-created.json',JSON.stringify(ids),{mode:0o600});
          const tests=[
            {type:'postgres',host:'postgresql-zeroverse.d.aivencloud.com',database:'database-mcp-test-postgres',
              mode:'verify-full',password:process.env.PG_TEST_PASSWORD},
            {type:'mysql',host:'mysql-zeroverse.d.aivencloud.com',database:'database-mcp-test-mysql',
              mode:'VERIFY_IDENTITY',password:process.env.MYSQL_TEST_PASSWORD}];
          for(const t of tests){
            const body={name:'db344-once-'+t.type+'-'+process.env.GITHUB_RUN_ID,
              origin:{scheme:t.type,host:t.host,port:18691,database:t.database,user:'test',password:t.password},
              mtls:{ca_certificate_id:process.env.CERT_ID,sslmode:t.mode},
              caching:{disabled:true},origin_connection_limit:5};
            const r=await fetch(base,{method:'POST',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(55000)});
            const json=await r.json().catch(()=>({}));
            if(json.result?.id){ids[t.type]=json.result.id;save();}
            const ok=r.ok && json.success===true && !!json.result?.id &&
              json.result?.mtls?.ca_certificate_id===process.env.CERT_ID &&
              json.result?.mtls?.sslmode===t.mode;
            const errorText=(json.errors||[]).map(e=>String(e.message||'').toLowerCase()).join(' ');
            const categories=['permission','certificate','tls','ssl','connection','authentication','credential','user','password','host','network','timeout','denied'].filter(k=>errorText.includes(k));
            console.log('HYPERDRIVE_CREATE',JSON.stringify({dialect:t.type,http:r.status,strict_mode_readback:ok,
              codes:(json.errors||[]).map(e=>e.code),category:categories}));
            if(!ok)throw Error('Hyperdrive verified TLS configuration not created for '+t.type);
          }
          NODE
      - name: Install existing locked worker dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deploy isolated bearer-protected test Worker, never production
        shell: bash
        run: |
          set -euo pipefail
          cd apps/database-mcp-worker
          cat > src/hyperdrive-tmp344.ts <<'TS'
          import { Client as PgClient } from 'pg';
          import { createConnection as mysqlConnect } from 'mysql2/promise';
          import {
            healthCheck, queryRead, explainRead, inspectSchema,
            createTable, alterTable, createIndex, dropIndex, dropTable,
            insertRows, updateRows, deleteRows
          } from './db/index.js';
          import type { Dialect, EffectiveConnection, EffectiveWriteConnection } from './types.js';

          interface HD { connectionString: string; host: string; port: number; user: string; password: string; database: string; }
          interface Env { PROBE_TOKEN: string; POSTGRES: HD; MYSQL: HD; }
          type Check = Record<string, boolean>;
          const limits = { maxRows: 10, maxResultBytes: 50000, maxSchemaBytes: 50000, queryTimeoutMs: 12000 };
          function identity(dialect: Dialect, hd: HD): EffectiveConnection {
            return {
              config: { id: 'isolated_acceptance_' + dialect, transport: 'hyperdrive',
                configId: 'test-only', bindingName: dialect.toUpperCase() },
              transport: 'hyperdrive', dialect,
              connectionString: hd.connectionString, host: hd.host, port: hd.port,
              user: hd.user, password: hd.password, database: hd.database, limits
            };
          }
          async function tlsProof(dialect: Dialect, hd: HD): Promise<boolean> {
            if (dialect === 'postgres') {
              const client = new PgClient({
                host: hd.host, user: hd.user, password: hd.password, database: hd.database,
                port: hd.port, ssl: false, connectionTimeoutMillis: 12000
              });
              try {
                await client.connect();
                const result = await client.query<{ssl: boolean}>(
                  'SELECT ssl FROM pg_stat_ssl WHERE pid=pg_backend_pid()'
                );
                return result.rows[0]?.ssl === true;
              } finally { await client.end().catch(() => undefined); }
            }
            const client = await mysqlConnect({
              host:hd.host, user:hd.user, password:hd.password, database:hd.database, port:hd.port,
              disableEval:true,connectTimeout:12000
            });
            try {
              const [rows] = await client.query("SHOW SESSION STATUS LIKE 'Ssl_cipher'");
              return !!(Array.isArray(rows) && (rows as Array<{Value:string}>)[0]?.Value);
            } finally { await client.end().catch(() => undefined); }
          }
          async function runDialect(dialect: Dialect, hd: HD): Promise<Check> {
            const result: Check = {
              query: false, tls: false, health: false, read: false, explain: false,
              schema: false, ddl: false, insert: false, rollback: false, update: false, remove: false
            };
            const connection = identity(dialect, hd);
            const write: EffectiveWriteConnection = { ...connection, maxAffectedRows: 20 };
            const guarded: EffectiveWriteConnection = { ...connection, maxAffectedRows: 1 };
            const schema = dialect === 'postgres' ? 'public' : undefined;
            const table = 'db344_' + crypto.randomUUID().replaceAll('-', '').slice(0, 16);
            let created = false;
            let stage = 'tls';
            try {
              result.tls = await tlsProof(dialect, hd);
              stage = 'health';
              result.health = (await healthCheck(connection)).ok;
              stage = 'read';
              const read = await queryRead(connection, 'SELECT 1 AS probe', [], 3);
              result.query = read.rowCount === 1 && Number(read.rows[0]?.[0]) === 1;
              stage = 'explain';
              result.explain = (await explainRead(connection, 'SELECT 1 AS probe', [])) != null;
              // DDL scoped to one unique disposable table on dedicated test DB.
              stage = 'ddl_create';
              await createTable(connection, schema, table, [
                {name:'id', type:'integer', primaryKey:true},
                {name:'value', type:'varchar', length:80, nullable:false}
              ]);
              created = true;
              stage = 'schema';
              const description = await inspectSchema(connection, schema, table);
              result.schema = description.columns?.some(column => column.name === 'value') === true;
              stage = 'ddl_index';
              await createIndex(connection, schema, table, ['value'], false, 'db344_value_index');
              await dropIndex(connection, schema, table, 'db344_value_index');
              stage = 'ddl_alter';
              await alterTable(connection, schema, table, {
                action:'add_column', column:{name:'flag',type:'integer',default:1}
              });
              result.ddl = true;
              stage = 'insert';
              const inserted = await insertRows(write, schema, table,
                [{id:1,value:'start'}, {id:2,value:"quote' and \\ slash"}]);
              result.insert = inserted.affectedRows === 2;
              stage = 'read_special';
              const special = await queryRead(connection,
                dialect === 'postgres'
                  ? 'SELECT value FROM "'+table+'" WHERE id = $1'
                  : 'SELECT value FROM `'+table+'` WHERE id = ?',
                [2], 3);
              result.insert = result.insert && special.rowCount === 1 &&
                special.rows[0]?.[0] === "quote' and \\ slash";
              stage = 'rollback_mutation';
              let denied = false;
              try {
                await updateRows(guarded, schema, table, {value:'blocked'},
                  {id:{in:[1,2]}});
              } catch (e) {
                denied = !!(e && typeof e === 'object' && 'code' in e &&
                  (e as {code:unknown}).code === 'WRITE_LIMIT_EXCEEDED');
              }
              stage = 'rollback_verify';
              const values = await queryRead(connection,
                dialect === 'postgres'
                  ? 'SELECT value FROM "'+table+'" WHERE id IN ($1,$2) ORDER BY id'
                  : 'SELECT value FROM `'+table+'` WHERE id IN (?,?) ORDER BY id',
                [1,2], 3);
              result.rollback = denied && values.rowCount === 2 &&
                values.rows[0]?.[0] === 'start' && values.rows[1]?.[0] === "quote' and \\ slash";
              stage = 'update';
              result.update = (await updateRows(guarded,schema,table,{value:'changed'},{id:1}))
                .affectedRows === 1;
              stage = 'remove';
              result.remove = (await deleteRows(guarded,schema,table,{id:1})).affectedRows === 1;
            } catch(e) {
              const code = e && typeof e === 'object' && 'code' in e ?
                String((e as {code: unknown}).code) : 'unknown';
              throw { phase: stage, code: /^[A-Z0-9_]{1,50}$/.test(code) ? code : 'unknown' };
            } finally {
              if (created) await dropTable(connection,schema,table).catch(() => undefined);
            }
            return result;
          }
          async function inspectMysqlMode(hd: HD): Promise<Record<string,boolean>> {
            const c = await mysqlConnect({
              host:hd.host,user:hd.user,password:hd.password,database:hd.database,port:hd.port,
              disableEval:true,rowsAsArray:true,connectTimeout:12000
            });
            try {
              await c.beginTransaction();
              const [rows] = await c.query('SELECT @@SESSION.sql_mode AS mode');
              const first:unknown = Array.isArray(rows) ? rows[0] : undefined;
              const mode:unknown = Array.isArray(first) ? first[0] :
                first && typeof first === 'object' ? (first as Record<string,unknown>).mode : undefined;
              await c.rollback();
              return {
                rowsArray: Array.isArray(rows),
                rowsHaveOne: Array.isArray(rows) && rows.length === 1,
                arrayShape: Array.isArray(first),
                firstObject: !!first && typeof first === 'object',
                firstKeys: first && typeof first === 'object'
                  ? Object.keys(first).slice(0,5).map(k=>k.slice(0,35)) : [],
                modeIsNull: mode === null,
                modeIsString: typeof mode === 'string',
                modeIsObject: !!mode && typeof mode === 'object',
                forbiddenBackslashMode: typeof mode === 'string' &&
                  mode.toUpperCase().split(',').some(x=>x.trim()==='NO_BACKSLASH_ESCAPES')
              };
            } finally { await c.end().catch(()=>undefined); }
          }
          export default {
            async fetch(req: Request, env: Env): Promise<Response> {
              if (req.method !== 'POST' || new URL(req.url).pathname !== '/run')
                return new Response('Not found',{status:404});
              if (!env.PROBE_TOKEN || req.headers.get('authorization') !== 'Bearer ' + env.PROBE_TOKEN)
                return new Response('Forbidden',{status:403});
              const summary: Record<string, unknown> = {};
              for (const [name, dialect, hd] of [
                ['postgres','postgres',env.POSTGRES],
                ['mysql','mysql',env.MYSQL]
              ] as const) {
                try { summary[name] = await runDialect(dialect,hd); }
                catch(e) {
                  // Deliberately avoid surfacing DB error messages, credentials, host or SQL.
                  const code = e && typeof e === 'object' && 'code' in e
                    ? String((e as {code:unknown}).code) : 'unknown';
                  const phase = e && typeof e === 'object' && 'phase' in e
                    ? String((e as {phase:unknown}).phase) : 'unknown';
                  const modeDiagnostic = name === 'mysql'
                    ? await inspectMysqlMode(hd).catch(() => ({ modeProbeUnavailable:true }))
                    : {};
                  summary[name] = {
                    errorCode: /^[A-Z0-9_]{1,50}$/.test(code) ? code : 'unknown',
                    phase: /^[a-z_]{1,40}$/.test(phase) ? phase : 'unknown',
                    ...modeDiagnostic
                  };
                }
              }
              return Response.json(summary,{headers:{'Cache-Control':'no-store'}});
            }
          };
          TS
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import {randomBytes} from 'node:crypto';
          const ids=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/db344-hd-created.json','utf8'));
          if(!ids.postgres||!ids.mysql)throw Error('Both Hyperdrive IDs required');
          const token=randomBytes(32).toString('hex');
          writeFileSync(process.env.RUNNER_TEMP+'/db344-hd-bearer',token,{mode:0o600});
          writeFileSync(process.env.RUNNER_TEMP+'/db344-hd-secrets.json',JSON.stringify({PROBE_TOKEN:token}),{mode:0o600});
          const name='db344-hyperdrive-proof-'+process.env.GITHUB_RUN_ID;
          writeFileSync('.wrangler-db344-once.json',JSON.stringify({name,main:'src/hyperdrive-tmp344.ts',
            compatibility_date:'2026-09-12',compatibility_flags:['nodejs_compat'],
            workers_dev:true,preview_urls:false,
            hyperdrive:[{binding:'POSTGRES',id:ids.postgres},{binding:'MYSQL',id:ids.mysql}]}),{mode:0o600});
          appendFileSync(process.env.GITHUB_ENV,'DB344_HYPERDRIVE_WORKER='+name+'\n');
          NODE
          pnpm exec wrangler deploy --config .wrangler-db344-once.json \
            --secrets-file "$RUNNER_TEMP/db344-hd-secrets.json" \
            > "$RUNNER_TEMP/db344-hd-deploy.log" 2>&1 || { echo "TEMP_WORKER_DEPLOY_FAILED"; exit 1; }
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const s=readFileSync(process.env.RUNNER_TEMP+'/db344-hd-deploy.log','utf8');
          const url=s.match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev\b/)?.[0];
          if(!url)throw Error('Temporary Worker URL not found');
          appendFileSync(process.env.GITHUB_ENV,'DB344_HYPERDRIVE_URL='+url+'\n');
          NODE
      - name: Real Workers SELECT 1 plus TLS session check for both Aiven databases
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const token=readFileSync(process.env.RUNNER_TEMP+'/db344-hd-bearer','utf8');
          let body;
          for(let attempt=0;attempt<5;attempt++){
            const r=await fetch(process.env.DB344_HYPERDRIVE_URL+'/run',{
              method:'POST',headers:{authorization:'Bearer '+token},
              signal:AbortSignal.timeout(60000)});
            if(r.ok){body=await r.json();break;}
            if(![404,502,503].includes(r.status))throw Error('Worker probe response HTTP '+r.status);
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          if(!body)throw Error('Worker not reachable');
          for(const dialect of ['postgres','mysql']){
            const result=body[dialect];
            console.log('AIVEN_TEST_QUERY',JSON.stringify({dialect,...result}));
            if(!result || Object.keys(result).length !== 11 || Object.values(result).some(value=>value!==true))process.exitCode=1;
          }
          NODE
      - name: Always delete disposable Worker and Hyperdrive configs and temporary runner secrets
        if: always()
        shell: bash
        run: |
          set +e
          cd apps/database-mcp-worker
          if [[ -f .wrangler-db344-once.json ]]; then
            pnpm exec wrangler delete --config .wrangler-db344-once.json --name "$DB344_HYPERDRIVE_WORKER" --force >/dev/null 2>&1
            echo "TEMP_WORKER_CLEANUP_ATTEMPTED"
          fi
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync,rmSync} from 'node:fs';
          const f=process.env.RUNNER_TEMP+'/db344-hd-created.json';
          if(existsSync(f)){
            const ids=JSON.parse(readFileSync(f,'utf8'));
            for(const [name,id] of Object.entries(ids)){
              try{
                const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/hyperdrive/configs/'+id,{
                  method:'DELETE',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
                  signal:AbortSignal.timeout(20000)});
                console.log('HYPERDRIVE_CLEANUP',name,r.status);
              }catch{console.log('HYPERDRIVE_CLEANUP',name,'unverified');}
            }
          }
          for(const p of [f,process.env.RUNNER_TEMP+'/db344-hd-bearer',process.env.RUNNER_TEMP+'/db344-hd-secrets.json',
             process.env.RUNNER_TEMP+'/db344-hd-deploy.log','.wrangler-db344-once.json','src/hyperdrive-tmp344.ts'])
            rmSync(p,{force:true});
          NODE
