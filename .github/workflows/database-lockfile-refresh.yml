name: Database lockfile refresh

on:
  push:
    branches:
      - ticket/17-database-portal-only-auth

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ticket/17-database-portal-only-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - run: pnpm install --lockfile-only
      - run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(database): refresh workspace lockfile"
          git push origin HEAD:ticket/17-database-portal-only-auth
