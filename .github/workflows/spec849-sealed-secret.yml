# TEMPORARY migration-only workflow for Spec #849.
# Manual, Owner+main only; remove after verified Repository cutover.
name: Spec 849 temporary sealed Secret source

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: Exact canonical Secret to seal
        required: true
        type: choice
        options:
          - ACTIONS_GITHUB_DISPATCH_TOKENS
          - IMA_API_KEY
          - RAINDROP_ACCESS_TOKEN
          - SSH_ENCRYPTION_KEY
          - WORKFLOW_GITHUB_DISPATCH_TOKEN
          - WORKFLOW_MCP_PORTAL_CLIENT_SECRET
      phase:
        description: Old Environment source or new Repository source
        required: true
        type: choice
        options:
          - old
          - repository
      recipient_public_key:
        description: Ephemeral RSA public key, base64-encoded PEM (NOT private key)
        required: true
        type: string
      nonce:
        description: Unique 32-character lowercase hex request nonce
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spec849-one-time-secret-transfer
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate one-time Secret source selection
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'lirtual' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      old_environment: ${{ steps.map.outputs.old_environment }}
    steps:
      - id: map
        shell: bash
        env:
          SELECTED_SECRET: ${{ inputs.secret_name }}
          SELECTED_PHASE: ${{ inputs.phase }}
          SELECTED_NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_NONCE" =~ ^[a-f0-9]{32}$ ]]
          [[ "$SELECTED_PHASE" == 'old' || "$SELECTED_PHASE" == 'repository' ]]
          case "$SELECTED_SECRET" in
            ACTIONS_GITHUB_DISPATCH_TOKENS) old='github-actions-mcp-worker' ;;
            IMA_API_KEY) old='ima-mcp-worker' ;;
            RAINDROP_ACCESS_TOKEN) old='raindrop-mcp-worker' ;;
            SSH_ENCRYPTION_KEY) old='ssh-mcp-worker' ;;
            WORKFLOW_GITHUB_DISPATCH_TOKEN|WORKFLOW_MCP_PORTAL_CLIENT_SECRET) old='workflow-mcp-worker' ;;
            *) exit 1 ;;
          esac
          echo "old_environment=$old" >> "$GITHUB_OUTPUT"

  old-environment:
    name: Seal old Environment value, no plaintext artifact
    needs: preflight
    if: ${{ inputs.phase == 'old' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ needs.preflight.outputs.old_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Seal exact old Runner-delivered value to ephemeral public key
        env:
          SPEC849_SECRET_NAME: ${{ inputs.secret_name }}
          SPEC849_PHASE: old
          SPEC849_NONCE: ${{ inputs.nonce }}
          SPEC849_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          SPEC849_SECRET_VALUE: ${{ secrets[inputs.secret_name] }}
        run: node scripts/spec849-sealed-secret.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spec849-sealed
          path: ${{ runner.temp }}/spec849-sealed.json
          if-no-files-found: error
          retention-days: 1

  repository:
    name: Seal Repository value without Environment shadowing
    needs: preflight
    if: ${{ inputs.phase == 'repository' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deliberately NO job-level environment, to read Repository Secrets.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Seal exact Repository Runner-delivered value to ephemeral public key
        env:
          SPEC849_SECRET_NAME: ${{ inputs.secret_name }}
          SPEC849_PHASE: repository
          SPEC849_NONCE: ${{ inputs.nonce }}
          SPEC849_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          SPEC849_SECRET_VALUE: ${{ secrets[inputs.secret_name] }}
        run: node scripts/spec849-sealed-secret.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spec849-sealed
          path: ${{ runner.temp }}/spec849-sealed.json
          if-no-files-found: error
          retention-days: 1
