name: Workflow MCP Deploy

on:
  push:
    branches:
      - main
    paths:
      - apps/workflow-mcp-worker/**
      - .github/workflows/workflow-executor.yml
      - .github/workflows/workflow-mcp-deploy.yml
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Skip pre-deploy compatibility query for a brand-new empty D1
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: workflow-mcp-worker
  cancel-in-progress: false

jobs:
  deploy:
    environment: workflow-mcp-worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8bb496011403552e785ea1b834daffdf
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      WORKFLOW_MCP_D1_DATABASE_ID: 238891f8-4007-4436-890d-819d54e3e01b
      WORKFLOW_MCP_D1_DATABASE_NAME: ${{ vars.WORKFLOW_MCP_D1_DATABASE_NAME || 'workflow-mcp' }}
      WORKFLOW_MCP_WORKER_NAME: ${{ vars.WORKFLOW_MCP_WORKER_NAME || 'workflow-mcp-worker' }}
      WORKFLOW_MCP_R2_BUCKET: ${{ vars.WORKFLOW_MCP_R2_BUCKET || 'workflow-mcp-artifacts' }}
      WORKFLOW_MCP_URL: ${{ vars.WORKFLOW_MCP_URL || 'https://workflow-mcp-worker.aiyaya.workers.dev' }}
      R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate required Workflow MCP configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            WORKFLOW_MCP_D1_DATABASE_ID
            WORKFLOW_MCP_D1_DATABASE_NAME
            WORKFLOW_MCP_WORKER_NAME
            WORKFLOW_MCP_R2_BUCKET
            WORKFLOW_MCP_URL
            GITHUB_REPOSITORY
            GITHUB_REPOSITORY_ID
            R2_ACCESS_KEY_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Workflow MCP environment value: $name"
              exit 1
            fi
          done

      - name: Run application release checks
        run: pnpm --filter workflow-mcp-worker check

      - name: Build isolated Workflow MCP Wrangler config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          config="$GITHUB_WORKSPACE/apps/workflow-mcp-worker/wrangler.generated.json"
          pnpm --filter workflow-mcp-worker exec tsx scripts/build-deploy-config.ts "$config"
          echo "path=$config" >> "$GITHUB_OUTPUT"
          echo "WORKFLOW_MCP_WRANGLER_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Check persisted Worker Secret names
        shell: bash
        working-directory: apps/workflow-mcp-worker
        run: |
          set -euo pipefail
          # Read names, not values; fail closed before migrations and deploy.
          secret_names="$(pnpm exec wrangler secret list --config "$WORKFLOW_MCP_WRANGLER_CONFIG" --format json)"
          SECRET_NAMES="$secret_names" node <<'NODE'
          const names = JSON.parse(process.env.SECRET_NAMES ?? '[]');
          if (!Array.isArray(names)) throw new Error('Invalid Worker Secret inventory.');
          const present = new Set(names.map(binding => binding.name));
          const required = JSON.parse(require('node:fs').readFileSync(
            process.env.WORKFLOW_MCP_WRANGLER_CONFIG, 'utf8'
          )).secrets.required;
          const missing = required.filter(name => !present.has(name));
          if (missing.length > 0) throw new Error('Missing persisted Worker Secrets: ' + missing.join(', '));
          console.log('Required persistent runtime Secret names are configured.');
          NODE

      - name: Apply D1 migrations
        working-directory: apps/workflow-mcp-worker
        run: pnpm exec wrangler d1 migrations apply DB --remote --config "$WORKFLOW_MCP_WRANGLER_CONFIG"

      - name: Check nonterminal runtime compatibility
        if: inputs.bootstrap != true
        run: pnpm --filter workflow-mcp-worker run release:compatibility

      - name: Deploy Workflow MCP Worker
        shell: bash
        working-directory: apps/workflow-mcp-worker
        run: |
          set -euo pipefail
          # Secrets remain managed in Cloudflare; never install a CI job token.
          pnpm exec wrangler deploy --config "$WORKFLOW_MCP_WRANGLER_CONFIG"

      - name: Wait for Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$WORKFLOW_MCP_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Workflow MCP Worker did not become healthy."
          exit 1

      - name: Verify unauthenticated MCP is denied
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST "$WORKFLOW_MCP_URL/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
          if [[ "$status" != "401" ]]; then
            echo "::error::Unauthenticated MCP request returned HTTP $status; expected 401."
            exit 1
          fi

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Workflow MCP lightweight deployment"
            echo
            echo "- Worker: \`$WORKFLOW_MCP_URL\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Production credentials: preserved in Cloudflare (never copied into CI)"
            echo "- Authenticated GitHub/R2/connection verification: separate authorized acceptance"
          } >> "$GITHUB_STEP_SUMMARY"
