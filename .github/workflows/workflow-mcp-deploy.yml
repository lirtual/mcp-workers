name: Workflow MCP Deploy

on:
  push:
    branches:
      - main
    paths:
      - apps/workflow-mcp-worker/**
      - .github/workflows/workflow-executor.yml
      - .github/workflows/workflow-mcp-deploy.yml
  workflow_dispatch:
    inputs:
      source_url:
        description: Small public page used by the heavy tracer
        required: false
        default: https://example.com/
        type: string
      full_acceptance:
        description: Run the authenticated heavy GitHub/R2/MCP tracer after deploy
        required: false
        default: false
        type: boolean
      raindrop_manual_acceptance:
        description: Explicitly verify live Raindrop schema before deploy and manual Run after deploy (T16)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: workflow-mcp-worker
  cancel-in-progress: false

jobs:
  deploy:
    environment: workflow-mcp-worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8bb496011403552e785ea1b834daffdf
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      WORKFLOW_MCP_D1_DATABASE_ID: 238891f8-4007-4436-890d-819d54e3e01b
      WORKFLOW_MCP_D1_DATABASE_NAME: ${{ vars.WORKFLOW_MCP_D1_DATABASE_NAME || 'workflow-mcp' }}
      WORKFLOW_MCP_WORKER_NAME: ${{ vars.WORKFLOW_MCP_WORKER_NAME || 'workflow-mcp-worker' }}
      WORKFLOW_MCP_R2_BUCKET: ${{ vars.WORKFLOW_MCP_R2_BUCKET || 'workflow-mcp-artifacts' }}
      WORKFLOW_MCP_URL: ${{ vars.WORKFLOW_MCP_URL || 'https://workflow-mcp-worker.aiyaya.workers.dev' }}
      WORKFLOW_MCP_SOURCE_URL: ${{ inputs.source_url }}
      WORKFLOW_MCP_EVIDENCE_PATH: ${{ github.workspace }}/workflow-mcp-evidence.json
      R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate required Workflow MCP configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            WORKFLOW_MCP_D1_DATABASE_ID
            WORKFLOW_MCP_D1_DATABASE_NAME
            WORKFLOW_MCP_WORKER_NAME
            WORKFLOW_MCP_R2_BUCKET
            WORKFLOW_MCP_URL
            GITHUB_REPOSITORY
            GITHUB_REPOSITORY_ID
            R2_ACCESS_KEY_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Workflow MCP environment value: $name"
              exit 1
            fi
          done

      - name: Run application release checks
        run: pnpm --filter workflow-mcp-worker check

      - name: Build isolated Workflow MCP Wrangler config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          config="$GITHUB_WORKSPACE/apps/workflow-mcp-worker/wrangler.generated.json"
          pnpm --filter workflow-mcp-worker exec tsx scripts/build-deploy-config.ts "$config"
          echo "path=$config" >> "$GITHUB_OUTPUT"
          echo "WORKFLOW_MCP_WRANGLER_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Check persisted Worker Secret names
        shell: bash
        working-directory: apps/workflow-mcp-worker
        run: |
          set -euo pipefail
          # Read names, not values; fail closed before migrations and deploy.
          secret_names="$(pnpm exec wrangler secret list --config "$WORKFLOW_MCP_WRANGLER_CONFIG" --format json)"
          SECRET_NAMES="$secret_names" node <<'NODE'
          const names = JSON.parse(process.env.SECRET_NAMES ?? '[]');
          if (!Array.isArray(names)) throw new Error('Invalid Worker Secret inventory.');
          const present = new Set(names.map(binding => binding.name));
          const required = JSON.parse(require('node:fs').readFileSync(
            process.env.WORKFLOW_MCP_WRANGLER_CONFIG, 'utf8'
          )).secrets.required;
          const missing = required.filter(name => !present.has(name));
          if (missing.length > 0) throw new Error('Missing persisted Worker Secrets: ' + missing.join(', '));
          for (const legacy of ['R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID']) {
            if (present.has(legacy)) throw new Error(
              legacy + ' is still a legacy Secret; migrate the binding to the approved non-secret variable before deploying.'
            );
          }
          console.log('Required persistent runtime Secret names are configured.');
          NODE

      - name: Verify live Raindrop contract before any deployment mutations
        if: github.event_name == 'workflow_dispatch' && inputs.raindrop_manual_acceptance
        working-directory: apps/workflow-mcp-worker
        env:
          WORKFLOW_MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: pnpm run release:raindrop-discovery

      - name: Apply D1 migrations
        working-directory: apps/workflow-mcp-worker
        run: pnpm exec wrangler d1 migrations apply DB --remote --config "$WORKFLOW_MCP_WRANGLER_CONFIG"

      - name: Check nonterminal runtime compatibility
        run: pnpm --filter workflow-mcp-worker run release:compatibility

      - name: Deploy Workflow MCP Worker
        shell: bash
        working-directory: apps/workflow-mcp-worker
        run: |
          set -euo pipefail
          # Secrets remain managed in Cloudflare; never install a CI job token.
          pnpm exec wrangler deploy --config "$WORKFLOW_MCP_WRANGLER_CONFIG"

      - name: Wait for Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$WORKFLOW_MCP_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Workflow MCP Worker did not become healthy."
          exit 1

      - name: Probe health and unauthenticated MCP
        working-directory: apps/workflow-mcp-worker
        run: pnpm exec tsx scripts/run-release-probe.ts

      - name: Verify real Raindrop manual Run and structured result
        if: github.event_name == 'workflow_dispatch' && inputs.raindrop_manual_acceptance
        id: raindrop
        working-directory: apps/workflow-mcp-worker
        env:
          WORKFLOW_MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          WORKFLOW_MCP_RAINDROP_EVIDENCE_PATH: ${{ github.workspace }}/workflow-mcp-raindrop-evidence.json
        run: pnpm run release:raindrop-manual

      - name: Run MCP heavy and connection tracers
        if: github.event_name == 'workflow_dispatch' && inputs.full_acceptance
        id: tracer
        working-directory: apps/workflow-mcp-worker
        env:
          WORKFLOW_MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: pnpm exec tsx scripts/run-deploy-tracer.ts

      - name: Verify GitHub executor terminal evidence
        if: github.event_name == 'workflow_dispatch' && inputs.full_acceptance
        working-directory: apps/workflow-mcp-worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/verify-deploy-executor.ts

      - name: Publish deployment evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Workflow MCP deployment gate"
            echo
            echo "- Worker: \`$WORKFLOW_MCP_URL\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Heavy run: \`${{ steps.tracer.outputs.heavy_run_id || 'not-completed' }}\`"
            echo "- MCP run: \`${{ steps.tracer.outputs.mcp_run_id || 'not-completed' }}\`"
            echo "- Raindrop manual run: \`${{ steps.raindrop.outputs.raindrop_run_id || 'not-requested-or-incomplete' }}\`"
            if [[ -f "$WORKFLOW_MCP_EVIDENCE_PATH" ]]; then
              echo
              echo '```json'
              cat "$WORKFLOW_MCP_EVIDENCE_PATH"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-mcp-evidence-${{ github.run_id }}
          path: workflow-mcp-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload sanitized Raindrop acceptance evidence
        if: github.event_name == 'workflow_dispatch' && inputs.raindrop_manual_acceptance && always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-mcp-raindrop-evidence-${{ github.run_id }}
          path: workflow-mcp-raindrop-evidence.json
          if-no-files-found: warn
          retention-days: 14
