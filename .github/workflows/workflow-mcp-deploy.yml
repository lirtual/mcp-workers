name: Workflow MCP Deploy

on:
  push:
    branches:
      - main
    paths:
      - apps/workflow-mcp-worker/**
      - .github/workflows/workflow-executor.yml
      - .github/workflows/workflow-mcp-deploy.yml
  workflow_dispatch:
    inputs:
      source_url:
        description: Small public page used by the heavy tracer
        required: false
        default: https://example.com/
        type: string
      bootstrap:
        description: Skip pre-deploy compatibility query for a brand-new empty D1
        required: false
        default: false
        type: boolean
      verify_raindrop_manual:
        description: Run the authenticated Raindrop manual acceptance tracer after the heavy release gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: workflow-mcp-worker
  cancel-in-progress: false

jobs:
  deploy:
    environment: workflow-mcp-worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8bb496011403552e785ea1b834daffdf
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      WORKFLOW_MCP_D1_DATABASE_ID: 238891f8-4007-4436-890d-819d54e3e01b
      WORKFLOW_MCP_D1_DATABASE_NAME: ${{ vars.WORKFLOW_MCP_D1_DATABASE_NAME || 'workflow-mcp' }}
      WORKFLOW_MCP_WORKER_NAME: ${{ vars.WORKFLOW_MCP_WORKER_NAME || 'workflow-mcp-worker' }}
      WORKFLOW_MCP_R2_BUCKET: ${{ vars.WORKFLOW_MCP_R2_BUCKET || 'workflow-mcp-artifacts' }}
      WORKFLOW_MCP_URL: ${{ vars.WORKFLOW_MCP_URL || 'https://workflow-mcp-worker.aiyaya.workers.dev' }}
      WORKFLOW_MCP_ENABLE_SCHEDULE: ${{ vars.WORKFLOW_MCP_ENABLE_SCHEDULE || 'false' }}
      WORKFLOW_MCP_SOURCE_URL: ${{ inputs.source_url }}
      WORKFLOW_MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
      WORKFLOW_MCP_GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
      EXECUTOR_LEASE_SECRET: ${{ secrets.EXECUTOR_LEASE_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RAINDROP_MCP_ACCESS_TOKEN: ${{ secrets.RAINDROP_MCP_ACCESS_TOKEN }}
      WORKFLOW_MCP_EVIDENCE_PATH: ${{ github.workspace }}/workflow-mcp-evidence.json
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate required Workflow MCP configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            WORKFLOW_MCP_D1_DATABASE_ID
            WORKFLOW_MCP_D1_DATABASE_NAME
            WORKFLOW_MCP_WORKER_NAME
            WORKFLOW_MCP_R2_BUCKET
            WORKFLOW_MCP_URL
            GITHUB_REPOSITORY
            GITHUB_REPOSITORY_ID
            WORKFLOW_MCP_ACCESS_TOKEN
            WORKFLOW_MCP_GITHUB_ACTIONS_TOKEN
            EXECUTOR_LEASE_SECRET
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            RAINDROP_MCP_ACCESS_TOKEN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Workflow MCP environment value: $name"
              exit 1
            fi
          done
          if [[ "${WORKFLOW_MCP_ACCESS_TOKEN}" == "${EXECUTOR_LEASE_SECRET}" ]]; then
            echo "::error::MCP and lease credentials must be independent."
            exit 1
          fi
          if [[ "${WORKFLOW_MCP_GITHUB_ACTIONS_TOKEN}" == "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::GitHub Actions and Cloudflare deployment credentials must be independent."
            exit 1
          fi

      - name: Run application release checks
        run: pnpm --filter workflow-mcp-worker check

      - name: Build isolated Workflow MCP Wrangler config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          config="$GITHUB_WORKSPACE/apps/workflow-mcp-worker/wrangler.generated.json"
          pnpm --filter workflow-mcp-worker exec tsx scripts/build-deploy-config.ts "$config"
          echo "path=$config" >> "$GITHUB_OUTPUT"
          echo "WORKFLOW_MCP_WRANGLER_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Verify existing production MCP credentials
        working-directory: apps/workflow-mcp-worker
        env:
          WORKFLOW_MCP_BOOTSTRAP: ${{ inputs.bootstrap == true && 'true' || 'false' }}
        run: pnpm exec tsx scripts/verify-deploy-access.ts

      - name: Apply D1 migrations
        working-directory: apps/workflow-mcp-worker
        run: pnpm exec wrangler d1 migrations apply DB --remote --config "$WORKFLOW_MCP_WRANGLER_CONFIG"

      - name: Check nonterminal runtime compatibility
        if: inputs.bootstrap != true
        run: pnpm --filter workflow-mcp-worker run release:compatibility

      - name: Deploy Workflow MCP Worker
        shell: bash
        working-directory: apps/workflow-mcp-worker
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/workflow-mcp-worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          SECRET_FILE="$secret_file" node <<'NODE'
          const fs = require('node:fs');
          const values = {
            MCP_ACCESS_TOKEN: process.env.WORKFLOW_MCP_ACCESS_TOKEN,
            EXECUTOR_LEASE_SECRET: process.env.EXECUTOR_LEASE_SECRET,
            GITHUB_ACTIONS_TOKEN: process.env.WORKFLOW_MCP_GITHUB_ACTIONS_TOKEN,
            R2_ACCESS_KEY_ID: process.env.R2_ACCESS_KEY_ID,
            R2_SECRET_ACCESS_KEY: process.env.R2_SECRET_ACCESS_KEY,
            RAINDROP_MCP_ACCESS_TOKEN: process.env.RAINDROP_MCP_ACCESS_TOKEN
          };
          for (const [name, value] of Object.entries(values)) {
            if (!value) throw new Error('Missing secret value for ' + name);
          }
          fs.writeFileSync(process.env.SECRET_FILE, JSON.stringify(values));
          NODE
          pnpm exec wrangler deploy             --config "$WORKFLOW_MCP_WRANGLER_CONFIG"             --secrets-file "$secret_file"

      - name: Wait for Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$WORKFLOW_MCP_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Workflow MCP Worker did not become healthy."
          exit 1

      - name: Run MCP heavy and connection tracers
        id: tracer
        working-directory: apps/workflow-mcp-worker
        run: pnpm exec tsx scripts/run-deploy-tracer.ts

      - name: Verify GitHub executor terminal evidence
        working-directory: apps/workflow-mcp-worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/verify-deploy-executor.ts

      - name: Verify Raindrop manual acceptance
        if: inputs.verify_raindrop_manual == true
        id: raindrop
        working-directory: apps/workflow-mcp-worker
        run: pnpm run release:raindrop-manual

      - name: Publish deployment evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Workflow MCP deployment gate"
            echo
            echo "- Worker: \`$WORKFLOW_MCP_URL\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Heavy run: \`${{ steps.tracer.outputs.heavy_run_id || 'not-completed' }}\`"
            echo "- MCP run: \`${{ steps.tracer.outputs.mcp_run_id || 'not-completed' }}\`"
            echo "- Raindrop manual run: \`${{ steps.raindrop.outputs.raindrop_run_id || 'not-requested' }}\`"
            echo "- Raindrop manual run: \`${{ steps.tracer.outputs.raindrop_run_id || 'not-completed' }}\`"
            if [[ -f "$WORKFLOW_MCP_EVIDENCE_PATH" ]]; then
              echo
              echo '```json'
              cat "$WORKFLOW_MCP_EVIDENCE_PATH"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-mcp-evidence-${{ github.run_id }}
          path: |
            workflow-mcp-evidence.json
            workflow-mcp-raindrop-evidence.json
          if-no-files-found: warn
          retention-days: 14
