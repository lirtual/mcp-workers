name: ticket19-patch

on:
  push:
    branches:
      - ticket/19-raindrop-nonidempotent-retry
    paths:
      - .github/workflows/ticket19-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ticket/19-raindrop-nonidempotent-retry
          fetch-depth: 0
      - name: Apply retry-safety patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/ticket19_patch.py
          python3 /tmp/ticket19_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/raindrop-mcp-worker/src/services/raindrop.service.ts apps/raindrop-mcp-worker/tests/retry_safety.test.ts apps/raindrop-mcp-worker/package.json
          git diff --cached --check
          git commit -m "fix(raindrop): prevent unsafe write retries"
          git push origin HEAD:ticket/19-raindrop-nonidempotent-retry
