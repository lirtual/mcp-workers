name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      worker:
        description: Selected Worker for reusable pre-release checks
        required: false
        type: string
    outputs:
      release_ready:
        description: Explicit success of all checks required for the selected Worker
        value: ${{ jobs.release-gate.outputs.release_ready }}
      canonical_owner_email:
        description: Repository-scoped Owner mailbox, captured without Worker Environment
        value: ${{ jobs.checks.outputs.canonical_owner_email }}

permissions:
  contents: read

# Supersede only obsolete PR runs. Each main update and each manual/reusable
# release candidate gets an isolated run group and is never auto-cancelled.
concurrency:
  group: mcp-workers-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Application checks
    # Reusable CI inherits the caller event (including manual release dispatch).
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.scope.outputs.database_changed }}
      remote_control_changed: ${{ steps.scope.outputs.remote_control_changed }}
      agent_native_changed: ${{ steps.scope.outputs.agent_native_changed }}
      canonical_owner_email: ${{ steps.canonical_owner.outputs.email }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture Repository Owner values before entering a Worker Environment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.worker == 'browser-mcp-worker')
        id: canonical_owner
        shell: bash
        env:
          SOURCE_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]
          [[ ${#SOURCE_EMAIL} -le 256 ]]
          printf 'email=%s\n' "$SOURCE_EMAIL" >> "$GITHUB_OUTPUT"

      - name: Verify release and read-only dispatch gates
        run: node scripts/verify-workflow-dispatch-gates.mjs
      - name: Spec #774 isolated UU table retirement regression
        run: node --test scripts/workflow-uu-cleanup-gate.test.mjs
      - name: Spec #775 fixed Version143 recovery safety regression
        run: node --test scripts/workflow-version-restore.test.mjs

      - name: Verify shared Owner configuration ownership (offline)
        run: node --test scripts/check-shared-owner-vars.test.mjs

      - name: Verify static workflow references and release Worker fixtures
        run: node --test scripts/verify-workflow-dispatch-gates.test.mjs

      - name: Verify Workflow Portal registration contract (offline)
        run: node --test scripts/register-workflow-portal.test.mjs

      - name: Verify Browser Portal registration contract (offline)
        run: node --test scripts/register-browser-portal.test.mjs
      - name: Verify shared MCP Access policy registration gate (offline)
        run: node --test scripts/verify-mcp-access-policies.test.mjs

      - id: scope
        name: Select affected applications
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_WORKER: ${{ inputs.worker }}
          REUSABLE_WORKER: ${{ !contains(github.workflow_ref, '/.github/workflows/ci.yml@') && inputs.worker || '' }}
          MANUAL_REF: ${{ github.ref }}
        run: node scripts/select-affected-apps.mjs

      - name: No application checks required
        if: steps.scope.outputs.apps == '' && steps.scope.outputs.remote_control_changed != 'true'
        run: echo "No application checks are required for this change set."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: |
          node --version
          pnpm --version

      - name: Verify affected application selector
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/select-affected-apps.test.mjs

      - name: Verify five-platform native candidate schedule
        if: steps.scope.outputs.apps != ''
        run: node --test apps/remote-control-mcp-worker/agent/tests/native-candidate-schedule.test.mjs apps/remote-control-mcp-worker/agent/tests/release-publication-guard.test.mjs

      - name: Install workspace
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check manual release safeguards offline
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/database-catalog-stage.test.mjs scripts/database-runtime.test.mjs scripts/reviewed-weixin-provider-pin.test.mjs scripts/reviewed-actions-provider-pin.test.mjs scripts/actions-consumer-cutover-gate.test.mjs scripts/actions-cutover-prepare.test.mjs scripts/manual-worker-release.test.mjs scripts/workflow-uu-secret-cleanup.test.mjs scripts/spec733-migration-gates.test.mjs scripts/workflow-terminal-run-exception.test.mjs scripts/bootstrap-worker-secrets.test.mjs scripts/worker-release-variables.test.mjs scripts/verify-database-hyperdrive.test.mjs

      - name: Check shared portal-auth package
        if: steps.scope.outputs.portal_auth_changed == 'true'
        run: pnpm --filter @mcp-workers/portal-auth check

      - name: Run affected application checks
        timeout-minutes: 12
        if: steps.scope.outputs.apps != ''
        env:
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $APPS; do
            echo "::group::$app check"
            pnpm --filter "$app" check
            echo "::endgroup::"
          done

  agent-native-candidates:
    name: Five-platform native candidates
    needs: checks
    if: needs.checks.outputs.agent_native_changed == 'true'
    uses: ./.github/workflows/agent-native-candidates.yml
    with:
      candidate_tag: v0.0.0-ci
    permissions:
      contents: read

  database-integration:
    name: Database integration
    needs: checks
    if: needs.checks.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure ephemeral database ports
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          set -euo pipefail
          [[ "$POSTGRES_PORT" =~ ^[0-9]+$ && "$MYSQL_PORT" =~ ^[0-9]+$ ]]
          {
            echo "TEST_POSTGRES_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_READ_URL=postgres://mcp_reader:reader@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_WRITE_URL=postgres://mcp_writer:writer@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_MYSQL_ADMIN_URL=mysql://root:root@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_READ_URL=mysql://mcp_reader:reader@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_WRITE_URL=mysql://mcp_writer:writer@127.0.0.1:${MYSQL_PORT}/testdb"
          } >> "$GITHUB_ENV"

      - name: Prepare integration databases
        run: pnpm --filter database-mcp-worker exec node scripts/setup-integration.mjs

      - name: Run database integration tests
        run: pnpm --filter database-mcp-worker run test:integration

  release-gate:
    name: Required checks gate
    needs: [checks, database-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.gate.outputs.release_ready }}
    steps:
      - name: Verify application and conditional database checks
        id: gate
        shell: bash
        env:
          APP_RESULT: ${{ needs.checks.result }}
          DATABASE_CHANGED: ${{ needs.checks.outputs.database_changed }}
          DATABASE_RESULT: ${{ needs.database-integration.result }}
        run: |
          set -euo pipefail
          [[ "$APP_RESULT" == 'success' ]] || { echo 'Application checks did not succeed'; exit 1; }
          case "$DATABASE_CHANGED:$DATABASE_RESULT" in
            true:success|false:skipped)
              echo 'release_ready=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'Required database integration gate did not pass' >&2
              exit 1
              ;;
          esac
