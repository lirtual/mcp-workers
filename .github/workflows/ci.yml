name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker to check
        required: true
        type: choice
        options:
          - database-mcp-worker
          - ima-mcp-worker
          - raindrop-mcp-worker
          - remote-control-mcp-worker

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Application checks
    concurrency:
      group: ci-checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.scope.outputs.database_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Select affected applications
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$MANUAL_WORKER" in
              database-mcp-worker|ima-mcp-worker|raindrop-mcp-worker|remote-control-mcp-worker)
                selected=("$MANUAL_WORKER")
                ;;
              *)
                echo "Unsupported manual worker: $MANUAL_WORKER" >&2
                exit 1
                ;;
            esac
            changed_files=()
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="$PR_BASE_SHA"
            else
              base_sha="$BEFORE_SHA"
            fi

            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              # A new branch or the repository's first push has no previous commit.
              # Treat every tracked file in the new revision as changed.
              mapfile -t changed_files < <(git ls-tree -r --name-only "$GITHUB_SHA")
            else
              mapfile -t changed_files < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
            fi
          fi
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          apps=(
            database-mcp-worker
            ima-mcp-worker
            raindrop-mcp-worker
            remote-control-mcp-worker
          )

          check_all=false
          portal_auth_changed=false
          for file in "${changed_files[@]}"; do
            if [[ "$file" == packages/portal-auth/* ]]; then
              portal_auth_changed=true
            fi
            case "$file" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|packages/*|.github/workflows/ci.yml|scripts/manual-worker-release*)
                check_all=true
                ;;
            esac
          done

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            selected=()
            if [[ "$check_all" == "true" ]]; then
              selected=("${apps[@]}")
            else
              for app in "${apps[@]}"; do
                for file in "${changed_files[@]}"; do
                  if [[ "$file" == "apps/$app/"* ]]; then
                    selected+=("$app")
                    break
                  fi
                done
              done
            fi
          fi

          selected_text="${selected[*]-}"
          echo "apps=$selected_text" >> "$GITHUB_OUTPUT"
          echo "portal_auth_changed=$portal_auth_changed" >> "$GITHUB_OUTPUT"

          database_changed=false
          for app in "${selected[@]}"; do
            if [[ "$app" == "database-mcp-worker" ]]; then
              database_changed=true
              break
            fi
          done
          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo "No application checks are required for this change set."
          else
            echo "Selected applications: $selected_text"
          fi
          echo "Portal auth package changed: $portal_auth_changed"

      - name: No application checks required
        if: steps.scope.outputs.apps == ''
        run: echo "No application checks are required for this change set."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.apps != ''
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.apps != ''
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        if: steps.scope.outputs.apps != ''
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        if: steps.scope.outputs.apps != ''
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check manual release safeguards offline
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/manual-worker-release.test.mjs

      - name: Check shared portal-auth package
        if: steps.scope.outputs.portal_auth_changed == 'true'
        run: pnpm --filter @mcp-workers/portal-auth check

      - name: Run affected application checks
        if: steps.scope.outputs.apps != ''
        env:
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $APPS; do
            echo "::group::$app check"
            pnpm --filter "$app" check
            echo "::endgroup::"
          done

  database-integration:
    name: Database integration
    needs: checks
    if: needs.checks.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure ephemeral database ports
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          set -euo pipefail
          [[ "$POSTGRES_PORT" =~ ^[0-9]+$ && "$MYSQL_PORT" =~ ^[0-9]+$ ]]
          {
            echo "TEST_POSTGRES_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_READ_URL=postgres://mcp_reader:reader@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_WRITE_URL=postgres://mcp_writer:writer@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_MYSQL_ADMIN_URL=mysql://root:root@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_READ_URL=mysql://mcp_reader:reader@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_WRITE_URL=mysql://mcp_writer:writer@127.0.0.1:${MYSQL_PORT}/testdb"
          } >> "$GITHUB_ENV"

      - name: Prepare integration databases
        run: pnpm --filter database-mcp-worker exec node scripts/setup-integration.mjs

      - name: Run database integration tests
        run: pnpm --filter database-mcp-worker run test:integration

  deploy:
    name: Manual Raindrop release (no auto deploy)
    needs: [checks, database-integration]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.worker == 'raindrop-mcp-worker' && needs.checks.result == 'success' && needs.database-integration.result == 'skipped' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: release-${{ inputs.worker }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_WORKER: raindrop-mcp-worker
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate trusted current main (no deployment credentials)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]] || exit 1
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Dispatch revision is no longer main HEAD" >&2
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cloudflare release preflight (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/manual-worker-release.mjs preflight "$RELEASE_WORKER"

      - name: Recheck main immediately before publication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale; nothing published" >&2
            exit 1
          }

      - name: Publish selected Raindrop Worker
        working-directory: apps/raindrop-mcp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Verify active release and required bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/manual-worker-release.mjs readback "$RELEASE_WORKER"

