name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.scope.outputs.database_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify shared MCP entry contract
        run: node --test scripts/mcp-entry-contract.test.mjs

      - id: scope
        name: Select affected applications
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          apps=(
            database-mcp-worker
            ima-mcp-worker
            instapaper-mcp-worker
            openlist-mcp-worker
            raindrop-mcp-worker
            weread-mcp-worker
            workflow-mcp-worker
          )

          check_all=false
          portal_auth_changed=false
          for file in "${changed_files[@]}"; do
            if [[ "$file" == packages/portal-auth/* ]]; then
              portal_auth_changed=true
            fi
            case "$file" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|packages/*|.github/workflows/ci.yml)
                check_all=true
                ;;
            esac
          done

          selected=()
          if [[ "$check_all" == "true" ]]; then
            selected=("${apps[@]}")
          else
            workflow_control_plane_changed=false
            for file in "${changed_files[@]}"; do
              case "$file" in
                .github/workflows/workflow-executor.yml|.github/workflows/workflow-mcp-deploy.yml)
                  workflow_control_plane_changed=true
                  ;;
              esac
            done

            for app in "${apps[@]}"; do
              if [[ "$app" == "workflow-mcp-worker" && "$workflow_control_plane_changed" == "true" ]]; then
                selected+=("$app")
                continue
              fi
              for file in "${changed_files[@]}"; do
                if [[ "$file" == "apps/$app/"* ]]; then
                  selected+=("$app")
                  break
                fi
              done
            done
          fi

          selected_text="${selected[*]-}"
          echo "apps=$selected_text" >> "$GITHUB_OUTPUT"
          echo "portal_auth_changed=$portal_auth_changed" >> "$GITHUB_OUTPUT"

          database_changed=false
          for app in "${selected[@]}"; do
            if [[ "$app" == "database-mcp-worker" ]]; then
              database_changed=true
              break
            fi
          done
          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo "No application checks are required for this change set."
          else
            echo "Selected applications: $selected_text"
          fi
          echo "Portal auth package changed: $portal_auth_changed"

      - name: No application checks required
        if: steps.scope.outputs.apps == ''
        run: echo "No application checks are required for this change set."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.apps != ''
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.apps != ''
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        if: steps.scope.outputs.apps != ''
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        if: steps.scope.outputs.apps != ''
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check shared portal-auth package
        if: steps.scope.outputs.portal_auth_changed == 'true'
        run: pnpm --filter @mcp-workers/portal-auth check

      - name: Run affected application checks
        if: steps.scope.outputs.apps != ''
        env:
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $APPS; do
            echo "::group::$app check"
            pnpm --filter "$app" check
            echo "::endgroup::"
          done

  database-integration:
    name: Database integration
    needs: checks
    if: needs.checks.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:55432/testdb
      TEST_POSTGRES_READ_URL: postgres://mcp_reader:reader@127.0.0.1:55432/testdb
      TEST_POSTGRES_WRITE_URL: postgres://mcp_writer:writer@127.0.0.1:55432/testdb
      TEST_MYSQL_ADMIN_URL: mysql://root:root@127.0.0.1:53306/testdb
      TEST_MYSQL_READ_URL: mysql://mcp_reader:reader@127.0.0.1:53306/testdb
      TEST_MYSQL_WRITE_URL: mysql://mcp_writer:writer@127.0.0.1:53306/testdb
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare integration databases
        run: pnpm --filter database-mcp-worker exec node scripts/setup-integration.mjs

      - name: Run database integration tests
        run: pnpm --filter database-mcp-worker run test:integration
