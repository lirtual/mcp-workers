name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      worker:
        description: Selected Worker for reusable pre-release checks
        required: false
        type: string
    outputs:
      release_ready:
        description: Explicit success of all checks required for the selected Worker
        value: ${{ jobs.release-gate.outputs.release_ready }}
      canonical_owner_email:
        description: Repository-scoped Owner mailbox, captured from Repository Variables
        value: ${{ jobs.checks.outputs.canonical_owner_email }}
      canonical_workflow_executor_repository:
        description: Sole repository-scoped Workflow GitHub executor, captured from Repository Variables
        value: ${{ jobs.checks.outputs.canonical_workflow_executor_repository }}

permissions:
  contents: read

# Supersede only obsolete PR runs. Each main update and each manual/reusable
# release candidate gets an isolated run group and is never auto-cancelled.
concurrency:
  group: mcp-workers-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Application checks
    # Reusable CI inherits the caller event (including manual release dispatch).
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.scope.outputs.database_changed }}
      remote_control_changed: ${{ steps.scope.outputs.remote_control_changed }}
      agent_native_changed: ${{ steps.scope.outputs.agent_native_changed }}
      rust_candidate_changed: ${{ steps.scope.outputs.rust_candidate_changed }}
      canonical_owner_email: ${{ steps.canonical_owner.outputs.email }}
      canonical_workflow_executor_repository: ${{ steps.canonical_workflow_executor.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture Repository Owner values
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.worker == 'browser-mcp-worker')
        id: canonical_owner
        shell: bash
        env:
          SOURCE_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]
          [[ ${#SOURCE_EMAIL} -le 256 ]]
          printf 'email=%s\n' "$SOURCE_EMAIL" >> "$GITHUB_OUTPUT"

      - name: Capture sole Repository Workflow executor source
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.worker == 'workflow-mcp-worker'
        id: canonical_workflow_executor
        env:
          SOURCE_REPOSITORY: ${{ vars.WORKFLOW_GITHUB_ACTION_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/workflow-github-executor.mjs validate-source "$SOURCE_REPOSITORY"
          printf 'repository=%s\n' "$SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Verify release and read-only dispatch gates
        run: node scripts/verify-workflow-dispatch-gates.mjs

      - name: Verify shared Owner configuration ownership (offline)
        run: node --test scripts/check-shared-owner-vars.test.mjs

      - name: Verify static workflow references and release Worker fixtures
        run: node --test scripts/verify-workflow-dispatch-gates.test.mjs

      - name: Verify Workflow Portal registration contract (offline)
        run: node --test scripts/register-workflow-portal.test.mjs

      - name: Verify Browser Portal registration contract (offline)
        run: node --test scripts/register-browser-portal.test.mjs
      - name: Verify shared MCP Access policy registration gate (offline)
        run: node --test scripts/verify-mcp-access-policies.test.mjs

      - id: scope
        name: Select affected applications
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_WORKER: ${{ inputs.worker }}
          REUSABLE_WORKER: ${{ !contains(github.workflow_ref, '/.github/workflows/ci.yml@') && inputs.worker || '' }}
          MANUAL_REF: ${{ github.ref }}
        run: node scripts/select-affected-apps.mjs

      - name: No application checks required
        if: steps.scope.outputs.apps == '' && steps.scope.outputs.remote_control_changed != 'true'
        run: echo "No application checks are required for this change set."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: |
          node --version
          pnpm --version

      - name: Verify affected application selector
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/select-affected-apps.test.mjs

      - name: Verify five-platform native candidate schedule
        if: steps.scope.outputs.apps != ''
        run: node --test apps/remote-control-mcp-worker/agent/tests/native-candidate-schedule.test.mjs apps/remote-control-mcp-worker/agent/tests/release-publication-guard.test.mjs

      - name: Install workspace
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check manual release safeguards offline
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/database-catalog-stage.test.mjs scripts/database-runtime.test.mjs scripts/reviewed-actions-provider-pin.test.mjs scripts/actions-consumer-cutover-gate.test.mjs scripts/actions-cutover-prepare.test.mjs scripts/manual-worker-release.test.mjs scripts/workflow-release-schema-selection.test.mjs scripts/spec733-migration-gates.test.mjs scripts/bootstrap-worker-secrets.test.mjs scripts/worker-release-variables.test.mjs scripts/verify-database-hyperdrive.test.mjs

      - name: Check shared portal-auth package
        if: steps.scope.outputs.portal_auth_changed == 'true'
        run: pnpm --filter @mcp-workers/portal-auth check

      - name: Run affected application checks
        timeout-minutes: 12
        if: steps.scope.outputs.apps != ''
        env:
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $APPS; do
            echo "::group::$app check"
            pnpm --filter "$app" check
            echo "::endgroup::"
          done

  agent-native-candidates:
    name: Five-platform native candidates
    # Rust-only packaging uses a stable product-version shape; PR artifacts remain unuploaded.
    needs: checks
    if: needs.checks.outputs.agent_native_changed == 'true'
    uses: ./.github/workflows/agent-native-candidates.yml
    with:
      candidate_tag: v0.1.60
    permissions:
      contents: read

  rust-agent-candidate:
    # This is only the unshipped Rust core. Native installation, managed process
    # ownership, WSS Owner pairing, upgrade and Release require separate gates.
    name: RCA Rust core (nonproduction) / ${{ matrix.os }}
    needs: checks
    if: needs.checks.outputs.rust_candidate_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Match the existing Node candidate's Standard physical runners.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Check Rust formatting
        if: matrix.os == 'ubuntu-24.04'
        working-directory: apps/remote-control-mcp-worker/agent/native-rust
        run: cargo fmt --all -- --check
      - name: Compile and lint Rust core for host OS (no Agent package)
        working-directory: apps/remote-control-mcp-worker/agent/native-rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Unix Rust core tests on host OS (no Owner identity)
        if: runner.os != 'Windows'
        timeout-minutes: 8
        working-directory: apps/remote-control-mcp-worker/agent/native-rust
        # A hung platform-specific test must leave a bounded CI failure with
        # enough progress output to identify the last running test binary.
        run: cargo test --locked --all-targets -- --nocapture
      - name: Run Windows-supported Rust core and owner-private SQLite ACL checks
        if: runner.os == 'Windows'
        timeout-minutes: 8
        working-directory: apps/remote-control-mcp-worker/agent/native-rust
        # Exercise real NTFS ACLs, signed localhost WSS with receipt-protected
        # Windows Job sessions, and verified Owner cleanup on disposable runners.
        # Installed-state migration remains Gate 1.
        run: >-
          cargo test --locked --lib
          --test golden_digest --test golden_identity --test heartbeat_session
          --test loopback_session --test native_browse --test native_read
          --test native_read_wss --test reconnect_transport --test windows_private_state
          --test windows_job --test windows_output --test windows_managed
          --test windows_managed_wss --test windows_cli
          --test session_enrollment --test session_transport_env
          -- --nocapture
      - name: Verify receipt isolation and ownership on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 3
        working-directory: apps/remote-control-mcp-worker/agent/native-rust
        run: cargo test --locked --test native_file_wss receipt_runtime_ -- --nocapture
      - name: Verify Linux owned-group and Standard CLI cleanup on disposable host
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          node apps/remote-control-mcp-worker/agent/scripts/build-session-supervisor.mjs
          RCA_NATIVE_SUPERVISOR_BIN="$GITHUB_WORKSPACE/apps/remote-control-mcp-worker/agent/.build/session-supervisor" \
            cargo test --manifest-path apps/remote-control-mcp-worker/agent/native-rust/Cargo.toml \
            --locked --test linux_supervisor --test native_process_wss --test native_file_wss --test standard_linux_wss -- --ignored --nocapture
          RCA_NATIVE_SUPERVISOR_BIN="$GITHUB_WORKSPACE/apps/remote-control-mcp-worker/agent/.build/session-supervisor" \
            cargo test --manifest-path apps/remote-control-mcp-worker/agent/native-rust/Cargo.toml \
            --locked --test linux_managed secure_stdin_suppresses_echo_and_preserves_unrelated_output -- --ignored
      - name: Verify Darwin owned-group and signed managed WSS on disposable host
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fstack-protector-strong \
            apps/remote-control-mcp-worker/agent/scripts/darwin-session-supervisor.c \
            -o "$RUNNER_TEMP/rca-darwin-supervisor"
          chmod 700 "$RUNNER_TEMP/rca-darwin-supervisor"
          RCA_DARWIN_SUPERVISOR_BIN="$RUNNER_TEMP/rca-darwin-supervisor" \
            cargo test --manifest-path apps/remote-control-mcp-worker/agent/native-rust/Cargo.toml \
            --locked --test darwin_supervisor --test native_process --test native_process_wss --test native_file_wss --test cli_managed -- --ignored --nocapture
      - uses: pnpm/action-setup@v4
        if: runner.os == 'macOS'
        with:
          version: 10.17.1
          run_install: false
      - name: Install pinned macOS package-builder dependencies
        if: runner.os == 'macOS'
        run: pnpm install --filter remote-control-agent --frozen-lockfile --ignore-scripts
      - name: Build and exercise unpublished macOS Rust candidate package
        if: runner.os == 'macOS'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              target=darwin-arm64
              ;;
            x86_64)
              target=darwin-x64
              ;;
            *) echo "Unsupported Darwin architecture" >&2; exit 1 ;;
          esac
          source_root="$GITHUB_WORKSPACE/apps/remote-control-mcp-worker/agent"
          supervisor="$RUNNER_TEMP/rca-darwin-supervisor"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fstack-protector-strong \
            "$source_root/scripts/darwin-session-supervisor.c" -o "$supervisor"
          chmod 700 "$supervisor"
          cargo build --locked --release --manifest-path \
            "$source_root/native-rust/Cargo.toml" --bin rca-standard-darwin-candidate
          node_bin="$(realpath "$(command -v node)")"
          rust_agent="$source_root/native-rust/target/release/rca-standard-darwin-candidate"
          out="$RUNNER_TEMP/rca-darwin-reference"
          mkdir -m 700 -p "$out"
          node "$source_root/scripts/build-agent-release.mjs" \
            --version v0.1.57-rust-candidate.1 --target "$target" \
            --node-bin "$node_bin" --node-sha256 "$(shasum -a 256 "$node_bin" | cut -d' ' -f1)" \
            --native "$supervisor" --native-sha256 "$(shasum -a 256 "$supervisor" | cut -d' ' -f1)" \
            --rust-agent-bin "$rust_agent" \
            --rust-agent-sha256 "$(shasum -a 256 "$rust_agent" | cut -d' ' -f1)" \
            --out "$out"
          # Native-only acceptance: build from these same verified native
          # binaries and independently inspect and read the exact inventory.
          native_out="$RUNNER_TEMP/rca-darwin-native"
          node "$source_root/scripts/build-agent-release.mjs" \
            --version v0.1.60 --target "$target" \
            --artifact-profile rust-native-only-v1 \
            --native "$supervisor" --native-sha256 "$(shasum -a 256 "$supervisor" | cut -d' ' -f1)" \
            --rust-agent-bin "$rust_agent" \
            --rust-agent-sha256 "$(shasum -a 256 "$rust_agent" | cut -d' ' -f1)" \
            --out "$native_out"
          native_archive="$native_out/remote-control-agent-v0.1.60-$target.tar.gz"
          node --input-type=module - "$source_root/scripts/verify-agent-release.mjs" "$native_archive" "$target" <<'JS'
          import {readFileSync} from 'node:fs';
          const [verifier,archive,target]=process.argv.slice(2);
          const {inspectTarGzip}=await import(verifier);
          inspectTarGzip(readFileSync(archive),{tag:'v0.1.60',target});
          JS
          native_unpacked="$native_out/unpacked"
          mkdir -m 700 "$native_unpacked"
          tar -xzf "$native_archive" -C "$native_unpacked"
          test "$("$native_unpacked/apps/remote-control-agent/.build/rca-standard-darwin-candidate" \
            --verify-bundle v0.1.60 "$target")" = "$(git rev-parse HEAD)"
          # Exercise the extracted Rust executable, not the source or old Node manager.
          native_cli="$native_unpacked/apps/remote-control-agent/.build/rca-standard-darwin-candidate"
          cli_home="$native_out/cli-home"
          mkdir -m 700 "$cli_home"
          test "$(HOME="$cli_home" "$native_cli" --version)" = v0.1.60
          HOME="$cli_home" "$native_cli" --help > "$native_out/help.txt"
          grep -q 'status' "$native_out/help.txt"
          grep -q 'uninstall' "$native_out/help.txt"
          grep -q 'pair' "$native_out/help.txt"
          if HOME="$cli_home" "$native_cli" pair </dev/null > "$native_out/pair.txt" 2>&1; then
            echo 'Noninteractive pair unexpectedly accepted' >&2; exit 1
          fi
          grep -q 'Pair requires a local owner terminal' "$native_out/pair.txt"
          HOME="$cli_home" "$native_cli" status --json > "$native_out/status.json"
          HOME="$cli_home" "$native_cli" doctor --json > "$native_out/doctor.json"
          node --input-type=module - "$native_out/status.json" "$native_out/doctor.json" <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const [status,doctor]=process.argv.slice(2).map(p=>JSON.parse(readFileSync(p,'utf8')));
          assert.notEqual(status.installed,true);
          assert.equal(status.signed_wss,'unconfirmed');
          assert.equal(status.cloud_authorization,'unconfirmed');
          assert.deepEqual(doctor.status,status);
          assert.ok(Array.isArray(doctor.findings));
          JS
          if HOME="$cli_home" "$native_cli" </dev/null > "$native_out/menu.txt" 2>&1; then
            echo 'Noninteractive menu unexpectedly accepted' >&2; exit 1
          fi
          grep -q 'Interactive menu requires a local terminal' "$native_out/menu.txt"
          python3 - "$native_cli" "$cli_home" <<'PYMENU'
          import os, pty, subprocess, sys
          for selection, expected in [(b'0\n', 0), (b'\n', 0), (b'99\n', 1)]:
              master, slave = pty.openpty()
              child = subprocess.Popen([sys.argv[1]], stdin=slave, stdout=slave,
                  stderr=slave, env={**os.environ, 'HOME': sys.argv[2]})
              try:
                  os.write(master, selection)
                  assert child.wait(timeout=5) == expected
              finally:
                  if child.poll() is None:
                      child.kill()
                      child.wait(timeout=5)
                  os.close(master)
                  os.close(slave)
          PYMENU
          test -z "$(ls -A "$cli_home")"
          # Native-only local upgrade/recovery, disposable stopped state.
          native_old_out="$RUNNER_TEMP/rca-darwin-native-old"
          node "$source_root/scripts/build-agent-release.mjs" \
            --version v0.1.59 --target "$target" \
            --artifact-profile rust-native-only-v1 \
            --native "$supervisor" --native-sha256 "$(shasum -a 256 "$supervisor" | cut -d' ' -f1)" \
            --rust-agent-bin "$rust_agent" \
            --rust-agent-sha256 "$(shasum -a 256 "$rust_agent" | cut -d' ' -f1)" \
            --out "$native_old_out"
          RCA_MACOS_NATIVE_BASELINE_ARCHIVE="$native_old_out/remote-control-agent-v0.1.59-$target.tar.gz" \
            RCA_MACOS_NATIVE_CANDIDATE_ROOT="$native_unpacked" \
            RCA_MACOS_NATIVE_CANDIDATE_ARCHIVE="$native_archive" \
            node --test "$source_root/tests/macos-native-local-lifecycle.integration.mjs"
          archive="$out/remote-control-agent-v0.1.57-rust-candidate.1-$target.tar.gz"
          unpacked="$out/unpacked"
          mkdir -m 700 "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          RCA_MACOS_BUNDLE_ROOT="$unpacked" node --test \
            "$source_root/tests/macos-local.test.mjs" \
            "$source_root/tests/macos-remote-upgrade.test.mjs"
          # Unpublished Rust baseline to a newer unpublished Rust candidate.
          # This does not read GitHub Latest and does not change the release guard.
          rust_old_out="$RUNNER_TEMP/rca-darwin-rust-old"
          mkdir -m 700 -p "$rust_old_out"
          node "$source_root/scripts/build-agent-release.mjs" \
            --version v0.1.56-rust-candidate.1 --target "$target" \
            --node-bin "$node_bin" --node-sha256 "$(shasum -a 256 "$node_bin" | cut -d' ' -f1)" \
            --native "$supervisor" --native-sha256 "$(shasum -a 256 "$supervisor" | cut -d' ' -f1)" \
            --rust-agent-bin "$rust_agent" \
            --rust-agent-sha256 "$(shasum -a 256 "$rust_agent" | cut -d' ' -f1)" \
            --out "$rust_old_out"
          rust_old="$rust_old_out/unpacked"
          mkdir -m 700 "$rust_old"
          tar -xzf "$rust_old_out/remote-control-agent-v0.1.56-rust-candidate.1-$target.tar.gz" -C "$rust_old"
          RCA_MACOS_RUST_BASELINE_ROOT="$rust_old" \
            RCA_MACOS_RUST_CANDIDATE_ROOT="$unpacked" \
            node --test \
            "$source_root/tests/macos-launchd-rust-to-rust-recovery.integration.mjs"

  database-integration:
    name: Database integration
    needs: checks
    if: needs.checks.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure ephemeral database ports
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          set -euo pipefail
          [[ "$POSTGRES_PORT" =~ ^[0-9]+$ && "$MYSQL_PORT" =~ ^[0-9]+$ ]]
          {
            echo "TEST_POSTGRES_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_READ_URL=postgres://mcp_reader:reader@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_WRITE_URL=postgres://mcp_writer:writer@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_MYSQL_ADMIN_URL=mysql://root:root@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_READ_URL=mysql://mcp_reader:reader@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_WRITE_URL=mysql://mcp_writer:writer@127.0.0.1:${MYSQL_PORT}/testdb"
          } >> "$GITHUB_ENV"

      - name: Prepare integration databases
        run: pnpm --filter database-mcp-worker exec node scripts/setup-integration.mjs

      - name: Run database integration tests
        run: pnpm --filter database-mcp-worker run test:integration

  release-gate:
    name: Required checks gate
    needs: [checks, database-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.gate.outputs.release_ready }}
    steps:
      - name: Verify application and conditional database checks
        id: gate
        shell: bash
        env:
          APP_RESULT: ${{ needs.checks.result }}
          DATABASE_CHANGED: ${{ needs.checks.outputs.database_changed }}
          DATABASE_RESULT: ${{ needs.database-integration.result }}
        run: |
          set -euo pipefail
          [[ "$APP_RESULT" == 'success' ]] || { echo 'Application checks did not succeed'; exit 1; }
          case "$DATABASE_CHANGED:$DATABASE_RESULT" in
            true:success|false:skipped)
              echo 'release_ready=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'Required database integration gate did not pass' >&2
              exit 1
              ;;
          esac
