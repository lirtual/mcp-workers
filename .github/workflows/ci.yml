name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      worker:
        description: Select Worker to deploy to production
        required: true
        type: choice
        options:
          - database-mcp-worker
          - ima-mcp-worker
          - raindrop-mcp-worker
          - remote-control-mcp-worker

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Application checks
    concurrency:
      group: ci-checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.scope.outputs.database_changed }}
      remote_control_changed: ${{ steps.scope.outputs.remote_control_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Select affected applications
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_WORKER: ${{ inputs.worker }}
          MANUAL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$MANUAL_REF" == "refs/heads/main" ]] || { echo "Manual runs require main" >&2; exit 1; }
            case "$MANUAL_WORKER" in
              database-mcp-worker|ima-mcp-worker|raindrop-mcp-worker|remote-control-mcp-worker)
                selected=("$MANUAL_WORKER")
                ;;
              *)
                echo "Unsupported manual worker: $MANUAL_WORKER" >&2
                exit 1
                ;;
            esac
            changed_files=()
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="$PR_BASE_SHA"
            else
              base_sha="$BEFORE_SHA"
            fi

            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              # A new branch or the repository's first push has no previous commit.
              # Treat every tracked file in the new revision as changed.
              mapfile -t changed_files < <(git ls-tree -r --name-only "$GITHUB_SHA")
            else
              mapfile -t changed_files < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
            fi
          fi
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          apps=(
            database-mcp-worker
            ima-mcp-worker
            raindrop-mcp-worker
            remote-control-mcp-worker
          )

          check_all=false
          portal_auth_changed=false
          for file in "${changed_files[@]}"; do
            if [[ "$file" == packages/portal-auth/* ]]; then
              portal_auth_changed=true
            fi
            case "$file" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|packages/*|.github/workflows/ci.yml|scripts/manual-worker-release*)
                check_all=true
                ;;
            esac
          done

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            selected=()
            if [[ "$check_all" == "true" ]]; then
              selected=("${apps[@]}")
            else
              for app in "${apps[@]}"; do
                for file in "${changed_files[@]}"; do
                  if [[ "$file" == "apps/$app/"* ]]; then
                    selected+=("$app")
                    break
                  fi
                done
              done
            fi
          fi

          remote_control_changed="$check_all"
          if [[ "$remote_control_changed" != "true" ]]; then
            for file in "${changed_files[@]}"; do
              if [[ "$file" == apps/remote-control-agent/* || "$file" == apps/remote-control-mcp-worker/* ]]; then
                remote_control_changed=true
                break
              fi
            done
          fi
          echo "remote_control_changed=$remote_control_changed" >> "$GITHUB_OUTPUT"

          selected_text="${selected[*]-}"
          echo "apps=$selected_text" >> "$GITHUB_OUTPUT"
          echo "portal_auth_changed=$portal_auth_changed" >> "$GITHUB_OUTPUT"

          database_changed=false
          for app in "${selected[@]}"; do
            if [[ "$app" == "database-mcp-worker" ]]; then
              database_changed=true
              break
            fi
          done
          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo "No application checks are required for this change set."
          else
            echo "Selected applications: $selected_text"
          fi
          echo "Portal auth package changed: $portal_auth_changed"

      - name: No application checks required
        if: steps.scope.outputs.apps == '' && steps.scope.outputs.remote_control_changed != 'true'
        run: echo "No application checks are required for this change set."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check manual release safeguards offline
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/manual-worker-release.test.mjs

      - name: Check shared portal-auth package
        if: steps.scope.outputs.portal_auth_changed == 'true'
        run: pnpm --filter @mcp-workers/portal-auth check

      - name: Check Remote Control Agent and Worker
        if: steps.scope.outputs.remote_control_changed == 'true'
        run: |
          set -euo pipefail
          pnpm --filter @mcp-workers/remote-control-agent typecheck
          pnpm --filter @mcp-workers/remote-control-agent test
          pnpm --filter remote-control-mcp-worker typecheck
          pnpm --filter remote-control-mcp-worker test

      - name: Cross-check Worker against pinned public Agent source
        if: steps.scope.outputs.remote_control_changed == 'true'
        env:
          PUBLIC_AGENT_SHA: b11ee0dd6571a8f9597785daa0297a9a98ae61cf
        run: |
          set -euo pipefail
          # Anonymous public checkout, pinned to a reviewed immutable commit;
          # never trust a mutable public branch for private Worker CI.
          fixture="$(mktemp -d)"
          git init -q "$fixture/public"
          git -C "$fixture/public" fetch --quiet --depth=1 \
            https://github.com/lirtual/remote-control-agent.git "$PUBLIC_AGENT_SHA"
          git -C "$fixture/public" checkout -q --detach FETCH_HEAD
          test "$(git -C "$fixture/public" rev-parse HEAD)" = "$PUBLIC_AGENT_SHA"
          mv apps/remote-control-agent "$fixture/private-agent"
          trap 'rm -rf apps/remote-control-agent; mv "$fixture/private-agent" apps/remote-control-agent' EXIT
          cp -a "$fixture/public/apps/remote-control-agent" apps/remote-control-agent
          # Workspace pnpm dependencies were already installed for the private
          # Agent, and the app occupies the same relative location.
          cp -a "$fixture/private-agent/node_modules" apps/remote-control-agent/node_modules
          node apps/remote-control-agent/scripts/build-session-supervisor.mjs
          pnpm --filter remote-control-mcp-worker typecheck
          pnpm --filter remote-control-mcp-worker test

      - name: Run affected application checks
        if: steps.scope.outputs.apps != ''
        env:
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $APPS; do
            echo "::group::$app check"
            pnpm --filter "$app" check
            echo "::endgroup::"
          done

  database-integration:
    name: Database integration
    needs: checks
    if: needs.checks.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure ephemeral database ports
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          set -euo pipefail
          [[ "$POSTGRES_PORT" =~ ^[0-9]+$ && "$MYSQL_PORT" =~ ^[0-9]+$ ]]
          {
            echo "TEST_POSTGRES_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_READ_URL=postgres://mcp_reader:reader@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_WRITE_URL=postgres://mcp_writer:writer@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_MYSQL_ADMIN_URL=mysql://root:root@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_READ_URL=mysql://mcp_reader:reader@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_WRITE_URL=mysql://mcp_writer:writer@127.0.0.1:${MYSQL_PORT}/testdb"
          } >> "$GITHUB_ENV"

      - name: Prepare integration databases
        run: pnpm --filter database-mcp-worker exec node scripts/setup-integration.mjs

      - name: Run database integration tests
        run: pnpm --filter database-mcp-worker run test:integration

  deploy:
    name: Manual selected Worker release
    needs: [checks, database-integration]
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          needs.checks.result == 'success' &&
          ((inputs.worker == 'database-mcp-worker' && needs.database-integration.result == 'success') ||
           (inputs.worker != 'database-mcp-worker' && needs.database-integration.result == 'skipped')) &&
          (inputs.worker == 'raindrop-mcp-worker' ||
           inputs.worker == 'ima-mcp-worker' ||
           inputs.worker == 'database-mcp-worker' ||
           inputs.worker == 'remote-control-mcp-worker') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: worker-release-${{ inputs.worker }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SELECTED_WORKER: ${{ inputs.worker }}
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current trusted main without deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Manual dispatch source no longer matches main HEAD" >&2
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cloudflare release preflight (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REMOTE_CONTROL_VPC_SERVICE_ID: ${{ vars.REMOTE_CONTROL_VPC_SERVICE_ID }}
        run: node scripts/manual-worker-release.mjs preflight "$SELECTED_WORKER"

      - name: Recheck current main inside acquired release lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale; nothing published" >&2
            exit 1
          }

      - name: Publish exactly selected Worker
        id: publish
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REMOTE_CONTROL_VPC_SERVICE_ID: ${{ vars.REMOTE_CONTROL_VPC_SERVICE_ID }}
        run: |
          set -euo pipefail
          case "$SELECTED_WORKER" in
            raindrop-mcp-worker|ima-mcp-worker|database-mcp-worker|remote-control-mcp-worker) ;;
            *) echo "Invalid Worker target" >&2; exit 1 ;;
          esac
          log="$(mktemp)"
          chmod 600 "$log"
          cleanup() {
            rm -f "$log"
            if [[ "$SELECTED_WORKER" == "remote-control-mcp-worker" ]]; then
              rm -f apps/remote-control-mcp-worker/.wrangler-release.jsonc
            fi
          }
          trap cleanup EXIT
          config_args=()
          if [[ "$SELECTED_WORKER" == "remote-control-mcp-worker" ]]; then
            node scripts/manual-worker-release.mjs prepare-remote "$SELECTED_WORKER"
            config_args=(--config .wrangler-release.jsonc)
          fi
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale immediately before publication" >&2
            exit 1
          }
          if ! (cd "apps/$SELECTED_WORKER" && pnpm exec wrangler deploy "${config_args[@]}") >"$log" 2>&1; then
            echo "Wrangler deploy failed (stage=deploy); no automated rollback attempted" >&2
            # Report only a whitelisted error code and a bounded, sanitized summary.
            # Never print raw Wrangler output (may contain secrets or configuration).
            node scripts/manual-worker-release.mjs diagnostic "$log"
            exit 1
          fi
          deployed_version="$(node scripts/manual-worker-release.mjs version "$log")"
          echo "version_id=$deployed_version" >> "$GITHUB_OUTPUT"
          echo "Wrangler reported a version ID; verifying Cloudflare active deployment next"

      - name: Verify exact active version and required production bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REMOTE_CONTROL_VPC_SERVICE_ID: ${{ vars.REMOTE_CONTROL_VPC_SERVICE_ID }}
          EXPECTED_VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: node scripts/manual-worker-release.mjs readback "$SELECTED_WORKER"

      - name: Check existing public health endpoint
        if: inputs.worker == 'ima-mcp-worker' || inputs.worker == 'raindrop-mcp-worker'
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' "https://${SELECTED_WORKER}.aiyaya.workers.dev/health")"
          [[ "$status" == "200" ]] || { echo "Health check failed (HTTP $status)" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const worker = process.argv[2];
            if (!body || (worker === "ima-mcp-worker" ? body.ok !== true : body.status !== "healthy")) process.exit(1);
          ' "$response" "$SELECTED_WORKER" || { echo "Health check failed (invalid response)" >&2; exit 1; }
          echo "Existing health endpoint verified (HTTP 200)"

      - name: Check unauthenticated MCP surface without credentials
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}'             --header 'Content-Type: application/json'             --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'             "https://${SELECTED_WORKER}.aiyaya.workers.dev/mcp")"
          case "$status" in
            401|403) echo "Unauthenticated MCP request denied (HTTP $status); human Portal acceptance still required" ;;
            *) echo "Unexpected unauthenticated MCP status: $status" >&2; exit 1 ;;
          esac
