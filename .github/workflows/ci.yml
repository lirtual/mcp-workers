name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      worker:
        description: Spec 476 candidate checks only
        required: true
        type: choice
        options:
          - database-mcp-worker
      candidate_sha:
        description: Exact prepared candidate commit
        required: true
        type: string
  workflow_call:
    inputs:
      worker:
        description: Selected Worker for reusable pre-release checks
        required: false
        type: string
    outputs:
      release_ready:
        description: Explicit success of all checks required for the selected Worker
        value: ${{ jobs.release-gate.outputs.release_ready }}
      canonical_access_team_domain:
        description: Repository-scoped Owner Access team, captured without Worker Environment
        value: ${{ jobs.checks.outputs.canonical_access_team_domain }}
      canonical_owner_email:
        description: Repository-scoped Owner mailbox, captured without Worker Environment
        value: ${{ jobs.checks.outputs.canonical_owner_email }}

permissions:
  contents: read

# Supersede only obsolete PR runs. Each main update and each manual/reusable
# release candidate gets an isolated run group and is never auto-cancelled.
concurrency:
  group: mcp-workers-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Application checks
    # Reusable CI inherits the caller event (including manual release dispatch).
    if: ${{ github.event_name != 'workflow_dispatch' || !contains(github.workflow_ref, '/.github/workflows/ci.yml@') || (github.repository == 'lirtual/mcp-workers' && github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' && startsWith(github.ref, 'refs/heads/db476-')) }}
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.scope.outputs.database_changed }}
      remote_control_changed: ${{ steps.scope.outputs.remote_control_changed }}
      canonical_access_team_domain: ${{ steps.canonical_owner.outputs.team }}
      canonical_owner_email: ${{ steps.canonical_owner.outputs.email }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture Repository Owner values before entering a Worker Environment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.worker == 'browser-mcp-worker' || inputs.worker == 'database-mcp-worker')
        id: canonical_owner
        shell: bash
        env:
          SOURCE_TEAM: ${{ vars.ACCESS_TEAM_DOMAIN }}
          SOURCE_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TEAM" =~ ^[a-z0-9-]+\.cloudflareaccess\.com$ ]]
          [[ "$SOURCE_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]
          [[ ${#SOURCE_TEAM} -le 256 && ${#SOURCE_EMAIL} -le 256 ]]
          printf 'team=%s\nemail=%s\n' "$SOURCE_TEAM" "$SOURCE_EMAIL" >> "$GITHUB_OUTPUT"

      - name: Verify candidate provenance
        if: github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/ci.yml@')
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/db476-[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$CANDIDATE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          # Before running any candidate scripts, prove they and this workflow
          # are unchanged from current main; only two non-executable blobs differ.
          git fetch --no-tags origin main
          parent=$(git rev-parse refs/remotes/origin/main)
          [[ "$(git show -s --format=%P HEAD)" == "$parent" ]]
          expected=$'M\tapps/database-mcp-worker/hyperdrive-bindings.json\nM\tapps/database-mcp-worker/wrangler.jsonc'
          [[ "$(git diff --no-renames --name-status "$parent" HEAD)" == "$expected" ]]
          for file in apps/database-mcp-worker/{hyperdrive-bindings.json,wrangler.jsonc}; do
            [[ "$(git ls-tree HEAD -- "$file")" == 100644* ]]
          done

      - name: Verify release and read-only dispatch gates
        run: node scripts/verify-workflow-dispatch-gates.mjs

      - name: Verify shared Owner configuration ownership (offline)
        run: node --test scripts/check-shared-owner-vars.test.mjs

      - name: Verify static workflow references and release Worker fixtures
        run: node --test scripts/verify-workflow-dispatch-gates.test.mjs

      - name: Verify Workflow Portal registration contract (offline)
        run: node --test scripts/register-workflow-portal.test.mjs

      - name: Verify Browser Portal registration contract (offline)
        run: node --test scripts/register-browser-portal.test.mjs
      - name: Verify shared MCP Access policy registration gate (offline)
        run: node --test scripts/verify-mcp-access-policies.test.mjs

      - id: scope
        name: Select affected applications
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_WORKER: ${{ inputs.worker }}
          REUSABLE_WORKER: ${{ !contains(github.workflow_ref, '/.github/workflows/ci.yml@') && inputs.worker || '' }}
          MANUAL_REF: ${{ github.ref }}
        run: node scripts/select-affected-apps.mjs

      - name: No application checks required
        if: steps.scope.outputs.apps == '' && steps.scope.outputs.remote_control_changed != 'true'
        run: echo "No application checks are required for this change set."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: |
          node --version
          pnpm --version

      - name: Verify affected application selector
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/select-affected-apps.test.mjs

      - name: Stage pinned public Agent source (test-only)
        if: steps.scope.outputs.remote_control_changed == 'true'
        run: bash scripts/stage-public-remote-control-agent.sh

      - name: Install workspace
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check manual release safeguards offline
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/reviewed-weixin-provider-pin.test.mjs scripts/reviewed-actions-provider-pin.test.mjs scripts/actions-consumer-cutover-gate.test.mjs scripts/actions-cutover-prepare.test.mjs scripts/manual-worker-release.test.mjs scripts/spec733-migration-gates.test.mjs scripts/workflow-terminal-run-exception.test.mjs scripts/bootstrap-worker-secrets.test.mjs scripts/worker-release-variables.test.mjs scripts/database-owner-access.test.mjs scripts/activate-database-hyperdrive.test.mjs scripts/verify-database-hyperdrive.test.mjs scripts/database-registry-readiness-344.test.mjs scripts/database-fresh-readiness-344.test.mjs scripts/probe-database-github-dispatch.test.mjs scripts/prepare-database-hyperdrive-476.test.mjs scripts/prepare-database-hyperdrive-unbind-476.test.mjs scripts/apply-database-hyperdrive-476.test.mjs scripts/finalize-database-hyperdrive-476.test.mjs scripts/retire-database-hyperdrive.test.mjs scripts/check-database-hyperdrive-rotation-476.test.mjs scripts/rotate-database-hyperdrive-476.test.mjs scripts/probe-database-origin-476.test.mjs

      - name: Check shared portal-auth package
        if: steps.scope.outputs.portal_auth_changed == 'true'
        run: pnpm --filter @mcp-workers/portal-auth check

      - name: Verify pinned public Agent fixture for Worker
        if: steps.scope.outputs.remote_control_changed == 'true'
        run: |
          set -euo pipefail
          test "$(cat apps/remote-control-agent/.pinned-public-source)" = "0bcc22fcd84ab000d57c3978ffe93c14314b6f9e"
          # Public Agent native tests belong to the upstream immutable release CI.
          # Run private Worker compatibility checks exactly once in the
          # existing affected-application `remote-control-mcp-worker check`.

      - name: Run affected application checks
        timeout-minutes: 12
        if: steps.scope.outputs.apps != ''
        env:
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $APPS; do
            echo "::group::$app check"
            pnpm --filter "$app" check
            echo "::endgroup::"
          done

  database-integration:
    name: Database integration
    needs: checks
    if: needs.checks.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure ephemeral database ports
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          set -euo pipefail
          [[ "$POSTGRES_PORT" =~ ^[0-9]+$ && "$MYSQL_PORT" =~ ^[0-9]+$ ]]
          {
            echo "TEST_POSTGRES_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_READ_URL=postgres://mcp_reader:reader@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_WRITE_URL=postgres://mcp_writer:writer@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_MYSQL_ADMIN_URL=mysql://root:root@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_READ_URL=mysql://mcp_reader:reader@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_WRITE_URL=mysql://mcp_writer:writer@127.0.0.1:${MYSQL_PORT}/testdb"
          } >> "$GITHUB_ENV"

      - name: Prepare integration databases
        run: pnpm --filter database-mcp-worker exec node scripts/setup-integration.mjs

      - name: Run database integration tests
        run: pnpm --filter database-mcp-worker run test:integration

      - name: Verify isolated Wrangler D1 lifecycle and in-flight protection
        run: node --test apps/database-mcp-worker/scripts/d1-drain-wrangler.test.mjs


  release-gate:
    name: Required checks gate
    needs: [checks, database-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.gate.outputs.release_ready }}
    steps:
      - name: Verify application and conditional database checks
        id: gate
        shell: bash
        env:
          APP_RESULT: ${{ needs.checks.result }}
          DATABASE_CHANGED: ${{ needs.checks.outputs.database_changed }}
          DATABASE_RESULT: ${{ needs.database-integration.result }}
        run: |
          set -euo pipefail
          [[ "$APP_RESULT" == 'success' ]] || { echo 'Application checks did not succeed'; exit 1; }
          case "$DATABASE_CHANGED:$DATABASE_RESULT" in
            true:success|false:skipped)
              echo 'release_ready=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'Required database integration gate did not pass' >&2
              exit 1
              ;;
          esac
