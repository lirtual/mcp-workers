name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      worker:
        description: Select Worker for release or read-only acceptance
        required: true
        type: choice
        options:
          - database-mcp-worker
          - ima-mcp-worker
          - raindrop-mcp-worker
          - ssh-mcp-worker
          - remote-control-mcp-worker
          - github-actions-mcp-worker
          - workflow-mcp-worker
      smoke_only:
        description: Run authenticated S1 production smoke only (no deploy; select workflow-mcp-worker)
        required: false
        type: boolean
        default: false
      s3_production_smoke:
        description: With smoke_only, verify approved S3 Echo, real GitHub Job and scoped D1 cleanup
        required: false
        type: boolean
        default: false
      s2_production_smoke:
        description: With smoke_only, execute one read-only S2 Workflow via production Portal and clean D1 test records
        required: false
        type: boolean
        default: false
      deploy_to_production:
        description: EXPLICIT approval to deploy the selected Worker (never use with probe/test inputs)
        required: false
        type: boolean
        default: false
      enable_workflow_s2:
        description: Separately enable Workflow MCP S2 read-only through production Portal (requires deploy_to_production)
        required: false
        type: boolean
        default: false
      enable_workflow_s3:
        description: Separately enable fixed S3 GitHub Echo (requires deploy + S2)
        required: false
        type: boolean
        default: false
      workflow_portal_register:
        description: Add existing Workflow MCP to existing One-MCP Portal (no Worker deploy)
        required: false
        type: boolean
        default: false
      confirm_workflow_stage_disable:
        description: Explicitly approve disabling currently enabled S2/S3 stages on a Workflow production release
        required: false
        type: boolean
        default: false
      s2_portal_probe:
        description: Read-only S2 Portal acceptance from existing Environment secrets (no deploy)
        required: false
        type: boolean
        default: false
      s2_portal_target:
        description: Portal for the read-only S2 probe (no deployment)
        required: false
        type: choice
        options:
          - test
          - production
        default: test
      s2_cloud_e2e:
        description: Create, test and delete isolated S2 Worker, Workflow and D1 (never production)
        required: false
        type: boolean
        default: false
      s3_oidc_probe:
        description: Real GitHub OIDC and disposable Cloudflare D1 Claim/Callback (no production)
        required: false
        type: boolean
        default: false
      s3_full_dispatch:
        description: Test isolated S3 REST dispatch to independent GitHub Job (no production)
        required: false
        type: boolean
        default: false
      s3_auth_compare:
        description: Test GitHub Runner vs disposable Worker token/GET/invalid-branch authorization (no real Job)
        required: false
        type: boolean
        default: false
      s3_product_e2e:
        description: Isolated Workflow MCP Plan with test Portal read and independent S3 Job (no production)
        required: false
        type: boolean
        default: false
      s3_dedicated_name:
        description: Exact pre-authorized random disposable S3 Worker name (dedicated executor acceptance only)
        required: false
        type: string
        default: ''
      s3_cleanup_name:
        description: Exact ephemeral workflow-s3-plan-XXXXXXXXXX resource to remove
        required: false
        type: string
        default: ''
      s3_executor_worker:
        description: Internal S3 test-only echo executor, called by coordinator
        required: false
        type: boolean
        default: false
      worker_name:
        description: Pinned isolated S3 Worker name
        required: false
        type: string
      attempt_id:
        description: Internal S3 opaque Attempt ID
        required: false
        type: string
      dispatch_id:
        description: Internal S3 opaque Dispatch ID
        required: false
        type: string
      capability_id:
        description: Internal S3 registered capability
        required: false
        type: string

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Application checks
    # The S2 test-only dispatch is not a production Worker selection.
    # Normal push/PR and main release checks are unchanged.
    if: >-
      ${{ !(github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/wip/workflow-s2-public-readonly' &&
            (inputs.s2_portal_probe == true || inputs.s2_cloud_e2e == true)) &&
          !(github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/wip/workflow-s3-github-executor' &&
            (inputs.s3_oidc_probe == true ||
             inputs.s3_full_dispatch == true ||
             inputs.s3_auth_compare == true ||
             inputs.s3_product_e2e == true ||
             inputs.s3_cleanup_name != '' ||
             inputs.s3_executor_worker == true)) }}
    concurrency:
      group: ci-checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.scope.outputs.database_changed }}
      remote_control_changed: ${{ steps.scope.outputs.remote_control_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release and read-only dispatch gates
        run: node scripts/verify-workflow-dispatch-gates.mjs

      - name: Verify Workflow Portal registration contract (offline)
        run: node --test scripts/register-workflow-portal.test.mjs

      - id: scope
        name: Select affected applications
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_WORKER: ${{ inputs.worker }}
          MANUAL_REF: ${{ github.ref }}
        run: node scripts/select-affected-apps.mjs

      - name: No application checks required
        if: steps.scope.outputs.apps == '' && steps.scope.outputs.remote_control_changed != 'true'
        run: echo "No application checks are required for this change set."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: |
          node --version
          pnpm --version

      - name: Verify affected application selector
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/select-affected-apps.test.mjs

      - name: Stage pinned public Agent source (test-only)
        if: steps.scope.outputs.remote_control_changed == 'true'
        run: bash scripts/stage-public-remote-control-agent.sh

      - name: Install workspace
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check manual release safeguards offline
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/manual-worker-release.test.mjs scripts/bootstrap-worker-secrets.test.mjs scripts/worker-release-variables.test.mjs scripts/verify-s3-release-token.test.mjs

      - name: Check shared portal-auth package
        if: steps.scope.outputs.portal_auth_changed == 'true'
        run: pnpm --filter @mcp-workers/portal-auth check

      - name: Verify pinned public Agent fixture for Worker
        if: steps.scope.outputs.remote_control_changed == 'true'
        run: |
          set -euo pipefail
          test "$(cat apps/remote-control-agent/.pinned-public-source)" = "4d58ffe33e560d6f5f1c375aacf02a774b51a6c0"
          # Public Agent native tests belong to the upstream immutable release CI.
          # Run private Worker compatibility checks exactly once in the
          # existing affected-application `remote-control-mcp-worker check`.

      - name: Run affected application checks
        timeout-minutes: 12
        if: steps.scope.outputs.apps != ''
        env:
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $APPS; do
            echo "::group::$app check"
            pnpm --filter "$app" check
            echo "::endgroup::"
          done

  database-integration:
    name: Database integration
    needs: checks
    if: needs.checks.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure ephemeral database ports
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          set -euo pipefail
          [[ "$POSTGRES_PORT" =~ ^[0-9]+$ && "$MYSQL_PORT" =~ ^[0-9]+$ ]]
          {
            echo "TEST_POSTGRES_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_READ_URL=postgres://mcp_reader:reader@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_WRITE_URL=postgres://mcp_writer:writer@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_MYSQL_ADMIN_URL=mysql://root:root@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_READ_URL=mysql://mcp_reader:reader@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_WRITE_URL=mysql://mcp_writer:writer@127.0.0.1:${MYSQL_PORT}/testdb"
          } >> "$GITHUB_ENV"

      - name: Prepare integration databases
        run: pnpm --filter database-mcp-worker exec node scripts/setup-integration.mjs

      - name: Run database integration tests
        run: pnpm --filter database-mcp-worker run test:integration

  deploy:
    name: Manual selected Worker release
    needs: [checks, database-integration]
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.deploy_to_production == true &&
          (inputs.enable_workflow_s2 != true || inputs.worker == 'workflow-mcp-worker') &&
          (inputs.enable_workflow_s3 != true ||
            (inputs.worker == 'workflow-mcp-worker' && inputs.enable_workflow_s2 == true)) &&
          (inputs.confirm_workflow_stage_disable != true || inputs.worker == 'workflow-mcp-worker') &&
          inputs.smoke_only != true &&
          inputs.workflow_portal_register != true &&
          inputs.s2_production_smoke != true &&
          inputs.s3_production_smoke != true &&
          inputs.s2_portal_probe != true &&
          inputs.s2_cloud_e2e != true &&
          inputs.s3_oidc_probe != true &&
          inputs.s3_full_dispatch != true &&
          inputs.s3_auth_compare != true &&
          inputs.s3_product_e2e != true &&
          inputs.s3_cleanup_name == '' &&
          inputs.s3_dedicated_name == '' &&
          inputs.s3_executor_worker != true &&
          needs.checks.result == 'success' &&
          ((inputs.worker == 'database-mcp-worker' && needs.database-integration.result == 'success') ||
           (inputs.worker != 'database-mcp-worker' && needs.database-integration.result == 'skipped')) &&
          (inputs.worker == 'raindrop-mcp-worker' ||
           inputs.worker == 'ima-mcp-worker' ||
           inputs.worker == 'database-mcp-worker' ||
           inputs.worker == 'ssh-mcp-worker' ||
           inputs.worker == 'remote-control-mcp-worker' ||
           inputs.worker == 'github-actions-mcp-worker' ||
           inputs.worker == 'workflow-mcp-worker') }}
    runs-on: ubuntu-latest
    # A GitHub Environment is a Worker-scoped configuration namespace, not a
    # staging/production selector. Only manual dispatch on main can deploy.
    environment:
      name: ${{ inputs.worker }}
    concurrency:
      group: worker-release-${{ inputs.worker }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SELECTED_WORKER: ${{ inputs.worker }}
      WORKFLOW_S2_RELEASE: ${{ inputs.enable_workflow_s2 }}
      WORKFLOW_S3_RELEASE: ${{ inputs.enable_workflow_s3 }}
      WORKFLOW_ALLOW_STAGE_DISABLE: ${{ inputs.confirm_workflow_stage_disable }}
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current trusted main without deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Manual dispatch source no longer matches main HEAD" >&2
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Stage pinned public Agent source (remote-control release only)
        if: inputs.worker == 'remote-control-mcp-worker'
        run: bash scripts/stage-public-remote-control-agent.sh

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cloudflare release preflight (read-only)
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/manual-worker-release.mjs preflight "$SELECTED_WORKER"

      # GitHub Secrets are the source of truth for all selected Workers, on every
      # explicitly authorized manual release, not just during bootstrap.
      - name: Verify fixed S3 registered executor configuration before release
        if: inputs.worker == 'workflow-mcp-worker' && inputs.enable_workflow_s3 == true
        shell: bash
        env:
          S3_CALLBACK_ORIGIN: ${{ vars.S3_CALLBACK_ORIGIN }}
          S3_GITHUB_AUDIENCE: ${{ vars.S3_GITHUB_AUDIENCE }}
        run: |
          set -euo pipefail
          [[ "$S3_CALLBACK_ORIGIN" == 'https://workflow.lirtual.dpdns.org' ]] || exit 1
          [[ "$S3_GITHUB_AUDIENCE" == 'workflow-s3-claim:production' ]] || exit 1
          echo "S3 registered executor origin/audience confirmed (values withheld)"

      - name: Stage selected Worker Secrets for every release
        shell: bash
        env:
          # GitHub automatically uses same-name Environment Secrets over
          # Repository Secrets. Values are scoped to this one staging step.
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
          DATABASE_CONFIG: ${{ secrets.DATABASE_CONFIG }}
          MCP_BROKER_TOKEN: ${{ secrets.MCP_BROKER_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          S2_PORTAL_CLIENT_ID: ${{ secrets.S2_PORTAL_CLIENT_ID }}
          S2_PORTAL_CLIENT_SECRET: ${{ secrets.S2_PORTAL_CLIENT_SECRET }}
          S3_GITHUB_TOKEN: ${{ secrets.S3_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/bootstrap-worker-secrets.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-secrets.json"

      - name: Stage approved Worker variables
        shell: bash
        env:
          RAINDROP_RATE_LIMIT_MAX_RETRIES: ${{ vars.RAINDROP_RATE_LIMIT_MAX_RETRIES }}
          IMA_BASE_URL: ${{ vars.IMA_BASE_URL }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          MAX_ROWS: ${{ vars.MAX_ROWS }}
          MAX_RESULT_BYTES: ${{ vars.MAX_RESULT_BYTES }}
          MAX_SCHEMA_BYTES: ${{ vars.MAX_SCHEMA_BYTES }}
          QUERY_TIMEOUT_MS: ${{ vars.QUERY_TIMEOUT_MS }}
          MAX_WRITE_AFFECTED_ROWS: ${{ vars.MAX_WRITE_AFFECTED_ROWS }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/worker-release-variables.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-variables.txt"

      - name: Verify dedicated S3 GitHub token without executable dispatch
        if: inputs.worker == 'workflow-mcp-worker' && inputs.enable_workflow_s3 == true
        env:
          S3_GITHUB_TOKEN: ${{ secrets.S3_GITHUB_TOKEN }}
        run: node scripts/verify-s3-release-token.mjs

      - name: Recheck current main inside acquired release lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale; nothing published" >&2
            exit 1
          }

      - name: Verify S1 private Fixture and remote D1 readiness
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          S1_FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          node scripts/manual-worker-release.mjs fixture-check workflow-mcp-worker
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-worker --remote --json --command \
            "SELECT
             (SELECT count(*) FROM d1_migrations) AS migration_count,
             (SELECT count(*) FROM d1_migrations WHERE name='0001_s1.sql') AS migration_v1,
             (SELECT count(*) FROM d1_migrations WHERE name='0002_native_complete_seen.sql') AS migration_v2,
             (SELECT count(*) FROM d1_migrations WHERE name='0003_s3_attempt_claim.sql') AS migration_v3,
             (SELECT count(*) FROM d1_migrations WHERE name='0004_s3_callback_receipts.sql') AS migration_v4,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='step_attempts') AS attempt_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='callback_receipts') AS receipt_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='native_complete_seen_at') AS native_column,
             (SELECT count(*) FROM runs WHERE outcome NOT IN ('succeeded','failed','cancelled')) AS active_runs,
             (SELECT count(*) FROM runs) AS run_count,
             (SELECT count(*) FROM workflows) AS workflow_count") |
            node scripts/manual-worker-release.mjs d1-check workflow-mcp-worker

      # Only the existing production release lock and GitHub Environment can
      # apply the two already-reviewed additive S3 tables. This changes the
      # schema, not S3_ENABLED, the GitHub executor or any existing Run.
      - name: Apply additive Workflow D1 migrations (S3 remains disabled)
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_REQUIRE_S3_SCHEMA: 'true'
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 migrations apply workflow-mcp-worker --remote)
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-worker --remote --json --command "SELECT
              (SELECT count(*) FROM d1_migrations) AS migration_count,
              (SELECT count(*) FROM d1_migrations WHERE name='0001_s1.sql') AS migration_v1,
              (SELECT count(*) FROM d1_migrations WHERE name='0002_native_complete_seen.sql') AS migration_v2,
              (SELECT count(*) FROM d1_migrations WHERE name='0003_s3_attempt_claim.sql') AS migration_v3,
              (SELECT count(*) FROM d1_migrations WHERE name='0004_s3_callback_receipts.sql') AS migration_v4,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='step_attempts') AS attempt_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='callback_receipts') AS receipt_table,
              (SELECT count(*) FROM pragma_table_info('runs') WHERE name='native_complete_seen_at') AS native_column,
              (SELECT count(*) FROM runs WHERE outcome NOT IN ('succeeded','failed','cancelled')) AS active_runs,
              (SELECT count(*) FROM runs) AS run_count,
              (SELECT count(*) FROM workflows) AS workflow_count") |
            node scripts/manual-worker-release.mjs d1-check workflow-mcp-worker

      - name: Deploy existing private S1 read-only Fixture
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # pnpm exec resets cwd to the workspace package root, not tests/fixtures.
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler deploy --config tests/fixtures/wrangler.jsonc)

      - name: Read back private S1 Fixture public-route isolation
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/manual-worker-release.mjs fixture-readback workflow-mcp-worker

      - name: Publish exactly selected Worker
        id: publish
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          case "$SELECTED_WORKER" in
            raindrop-mcp-worker|ima-mcp-worker|database-mcp-worker|ssh-mcp-worker|remote-control-mcp-worker|github-actions-mcp-worker|workflow-mcp-worker) ;;
            *) echo "Invalid Worker target" >&2; exit 1 ;;
          esac
          log="$(mktemp)"
          chmod 600 "$log"
          cleanup() {
            rm -f "$log"
          }
          trap cleanup EXIT
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale immediately before publication" >&2
            exit 1
          }
          # Fail closed if any selected Worker Secret is absent. Wrangler
          # atomically uploads the staged values with the selected deployment,
          # including existing Workers; unspecified secrets are preserved.
          test -s "$RUNNER_TEMP/mcp-worker-secrets.json"
          deploy_args=(--secrets-file "$RUNNER_TEMP/mcp-worker-secrets.json")
          test -f "$RUNNER_TEMP/mcp-worker-variables.txt"
          while IFS= read -r variable_pair; do
            deploy_args+=(--var "$variable_pair")
          done < "$RUNNER_TEMP/mcp-worker-variables.txt"
          if ! (cd "apps/$SELECTED_WORKER" && pnpm exec wrangler deploy "${deploy_args[@]}") >"$log" 2>&1; then
            echo "Wrangler deploy failed (stage=deploy); no automated rollback attempted" >&2
            # Report only a whitelisted error code and a bounded, sanitized summary.
            # Never print raw Wrangler output (may contain secrets or configuration).
            node scripts/manual-worker-release.mjs diagnostic "$log"
            exit 1
          fi
          deployed_version="$(node scripts/manual-worker-release.mjs version "$log")"
          echo "version_id=$deployed_version" >> "$GITHUB_OUTPUT"
          echo "Wrangler reported a version ID; verifying Cloudflare active deployment next"

      - name: Remove temporary deployment configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mcp-worker-secrets.json" "$RUNNER_TEMP/mcp-worker-variables.txt"

      - name: Verify exact active version and required production bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: node scripts/manual-worker-release.mjs readback "$SELECTED_WORKER"

      - name: Check existing public health endpoint
        if: inputs.worker == 'ima-mcp-worker' || inputs.worker == 'raindrop-mcp-worker' || inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          health_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/health"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            health_endpoint="https://workflow.lirtual.dpdns.org/health"
          fi
          max_attempts=1
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' "$health_endpoint")"
            if [[ "$status" == 404 && "$attempt" -lt "$max_attempts" ]]; then
              sleep 5
              continue
            fi
            break
          done
          [[ "$status" == "200" ]] || { echo "Health check failed (HTTP $status)" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const worker = process.argv[2];
            if (!body || (worker === "workflow-mcp-worker" ? (body.ok !== true || body.scope !== "s1" || body.service !== "workflow-mcp-worker") : worker === "ima-mcp-worker" ? body.ok !== true : body.status !== "healthy")) process.exit(1);
          ' "$response" "$SELECTED_WORKER" || { echo "Health check failed (invalid response)" >&2; exit 1; }
          echo "Existing health endpoint verified (HTTP 200)"

      - name: Check unauthenticated MCP surface without credentials
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          # A new Workers.dev hostname may briefly return 404 after the first publish.
          # Do not retry any non-404 status or hide a persistent routing failure.
          max_attempts=1
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          if [[ "$SELECTED_WORKER" == "github-actions-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          mcp_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/mcp"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            mcp_endpoint="https://workflow.lirtual.dpdns.org/mcp"
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              "$mcp_endpoint")"
            case "$status" in
              401|403)
                echo "Unauthenticated MCP request denied (HTTP $status); human Portal acceptance still required"
                exit 0
                ;;
              404)
                if ((attempt < max_attempts)); then
                  echo "New Workers.dev route not yet visible (HTTP 404; attempt $attempt/$max_attempts)"
                  sleep 5
                  continue
                fi
                ;;
            esac
            echo "Unexpected unauthenticated MCP status: $status" >&2
            exit 1
          done

  workflow-s1-smoke:
    name: Authenticated S1 production smoke (no deploy)
    needs: [checks]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.worker == 'workflow-mcp-worker' &&
          inputs.smoke_only == true &&
          inputs.deploy_to_production != true &&
          (inputs.s2_production_smoke != true || inputs.enable_workflow_s2 != true) &&
          (inputs.s2_production_smoke != true || inputs.s3_production_smoke != true) &&
          inputs.enable_workflow_s3 != true &&
          needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: workflow-s1-production-smoke
      cancel-in-progress: false
    env:
      MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKFLOW_S2_SMOKE: ${{ inputs.s2_production_smoke }}
      WORKFLOW_S3_SMOKE: ${{ inputs.s3_production_smoke }}
      S3_GITHUB_TOKEN: ${{ secrets.S3_GITHUB_TOKEN }}
      S2_PORTAL_CLIENT_ID: ${{ secrets.S2_PORTAL_CLIENT_ID }}
      S2_PORTAL_CLIENT_SECRET: ${{ secrets.S2_PORTAL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify authenticated S1/S2/S3 production and remove randomized test records
        run: node apps/workflow-mcp-worker/tests/production-smoke.mjs

