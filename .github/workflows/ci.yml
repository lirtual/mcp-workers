name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      worker:
        description: Selected Worker for reusable pre-release checks
        required: false
        type: string
    outputs:
      release_ready:
        description: Explicit success of all checks required for the selected Worker
        value: ${{ jobs.release-gate.outputs.release_ready }}

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Application checks
    concurrency:
      group: ci-checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}-${{ inputs.worker || 'affected' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.scope.outputs.database_changed }}
      remote_control_changed: ${{ steps.scope.outputs.remote_control_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release and read-only dispatch gates
        run: node scripts/verify-workflow-dispatch-gates.mjs

      - name: Verify static workflow references and release Worker fixtures
        run: node --test scripts/verify-workflow-dispatch-gates.test.mjs

      - name: Verify Workflow Portal registration contract (offline)
        run: node --test scripts/register-workflow-portal.test.mjs

      - name: Verify Email Portal registration contract (offline)
        run: node --test scripts/register-email-portal.test.mjs

      - name: Verify HTTP Portal registration contract (offline)
        run: node --test scripts/register-http-portal.test.mjs
      - name: Verify OpenList Portal registration contract (offline)
        run: node --test scripts/register-openlist-portal.test.mjs
      - name: Verify Weixin Portal registration contract (offline)
        run: node --test scripts/register-weixin-portal.test.mjs
      - name: Verify shared MCP Access policy registration gate (offline)
        run: node --test scripts/verify-mcp-access-policies.test.mjs
      - name: Verify OpenList read-only release acceptance contract (offline)
        run: node --test scripts/openlist-production-read-smoke.test.mjs
      - name: Verify OpenList upstream production integrity contract (offline)
        run: node --test scripts/openlist-upstream-integrity.test.mjs
      - name: Verify OpenList driver acceptance contract (offline)
        run: node --test scripts/openlist-driver-acceptance.test.mjs

      - id: scope
        name: Select affected applications
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_WORKER: ${{ inputs.worker }}
          REUSABLE_WORKER: ${{ inputs.worker }}
          MANUAL_REF: ${{ github.ref }}
        run: node scripts/select-affected-apps.mjs

      - name: No application checks required
        if: steps.scope.outputs.apps == '' && steps.scope.outputs.remote_control_changed != 'true'
        run: echo "No application checks are required for this change set."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: |
          node --version
          pnpm --version

      - name: Verify affected application selector
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/select-affected-apps.test.mjs

      - name: Stage pinned public Agent source (test-only)
        if: steps.scope.outputs.remote_control_changed == 'true'
        run: bash scripts/stage-public-remote-control-agent.sh

      - name: Install workspace
        if: steps.scope.outputs.apps != '' || steps.scope.outputs.remote_control_changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check manual release safeguards offline
        if: steps.scope.outputs.apps != ''
        run: node --test scripts/manual-worker-release.test.mjs scripts/bootstrap-worker-secrets.test.mjs scripts/worker-release-variables.test.mjs scripts/database-prep-344.test.mjs

      - name: Check shared portal-auth package
        if: steps.scope.outputs.portal_auth_changed == 'true'
        run: pnpm --filter @mcp-workers/portal-auth check

      - name: Verify pinned public Agent fixture for Worker
        if: steps.scope.outputs.remote_control_changed == 'true'
        run: |
          set -euo pipefail
          test "$(cat apps/remote-control-agent/.pinned-public-source)" = "3ef5a9c4d8741cba89b28f525dab4692826482f8"
          # Public Agent native tests belong to the upstream immutable release CI.
          # Run private Worker compatibility checks exactly once in the
          # existing affected-application `remote-control-mcp-worker check`.

      - name: Run affected application checks
        timeout-minutes: 12
        if: steps.scope.outputs.apps != ''
        env:
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          set -euo pipefail
          for app in $APPS; do
            echo "::group::$app check"
            pnpm --filter "$app" check
            echo "::endgroup::"
          done

  database-integration:
    name: Database integration
    needs: checks
    if: needs.checks.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure ephemeral database ports
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          set -euo pipefail
          [[ "$POSTGRES_PORT" =~ ^[0-9]+$ && "$MYSQL_PORT" =~ ^[0-9]+$ ]]
          {
            echo "TEST_POSTGRES_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_READ_URL=postgres://mcp_reader:reader@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_POSTGRES_WRITE_URL=postgres://mcp_writer:writer@127.0.0.1:${POSTGRES_PORT}/testdb"
            echo "TEST_MYSQL_ADMIN_URL=mysql://root:root@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_READ_URL=mysql://mcp_reader:reader@127.0.0.1:${MYSQL_PORT}/testdb"
            echo "TEST_MYSQL_WRITE_URL=mysql://mcp_writer:writer@127.0.0.1:${MYSQL_PORT}/testdb"
          } >> "$GITHUB_ENV"

      - name: Prepare integration databases
        run: pnpm --filter database-mcp-worker exec node scripts/setup-integration.mjs

      - name: Run database integration tests
        run: pnpm --filter database-mcp-worker run test:integration


  release-gate:
    name: Required checks gate
    needs: [checks, database-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.gate.outputs.release_ready }}
    steps:
      - name: Verify application and conditional database checks
        id: gate
        shell: bash
        env:
          APP_RESULT: ${{ needs.checks.result }}
          DATABASE_CHANGED: ${{ needs.checks.outputs.database_changed }}
          DATABASE_RESULT: ${{ needs.database-integration.result }}
        run: |
          set -euo pipefail
          [[ "$APP_RESULT" == 'success' ]] || { echo 'Application checks did not succeed'; exit 1; }
          case "$DATABASE_CHANGED:$DATABASE_RESULT" in
            true:success|false:skipped)
              echo 'release_ready=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'Required database integration gate did not pass' >&2
              exit 1
              ;;
          esac
