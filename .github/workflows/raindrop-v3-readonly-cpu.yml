name: Raindrop v3 Read-only CPU Probe

on:
  push:
    branches:
      - feat/raindrop-v3-core-reliability
    paths:
      - .github/workflows/raindrop-v3-readonly-cpu.yml

permissions:
  contents: read

concurrency:
  group: raindrop-mcp-worker-v3-test
  cancel-in-progress: false

jobs:
  deploy-and-read-only:
    name: Deploy current v3 and run direct read-only MCP checks
    environment: workflow-mcp-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8bb496011403552e785ea1b834daffdf
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check isolated deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing Cloudflare deploy credential"
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate current v3 source before deployment
        run: pnpm --filter raindrop-mcp-worker check

      - name: Deploy isolated Worker and run READ-ONLY MCP probe
        working-directory: apps/raindrop-mcp-worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/raindrop-v3-readonly-secrets-$$.json"
          trap 'rm -f "$secrets_file"' EXIT

          # Never read or export the user-supplied Raindrop credential. Keep
          # the existing isolated RAINDROP_ACCESS_TOKEN Cloudflare Secret.
          mcp_token="$(openssl rand -hex 32)"
          echo "::add-mask::$mcp_token"
          export mcp_token
          node --input-type=module -e '
            import fs from "node:fs";
            fs.writeFileSync(process.argv[1], JSON.stringify({
              MCP_ACCESS_TOKEN: process.env.mcp_token,
            }), { mode: 0o600 });
          ' "$secrets_file"

          # This exact name is deliberately separate from the production Worker.
          pnpm exec wrangler deploy --name raindrop-mcp-worker-v3-test --keep-vars --secrets-file "$secrets_file"

          export MCP_ACCESS_TOKEN="$mcp_token"
          export RAINDROP_V3_TEST_URL="https://raindrop-mcp-worker-v3-test.aiyaya.workers.dev"

          # This script invokes ONLY health, auth rejection, initialize,
          # tools/list, diagnostics, collection_list and raindrop_list.
          # Do not add lifecycle, tag writes, Trash or mutation scripts.
          node scripts/test-direct-mcp.mjs
          echo "PASS: current v3 deployed to isolated Worker; read-only direct MCP probe completed."
