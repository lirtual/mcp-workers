             (SELECT count(*) FROM d1_migrations WHERE name='0002_native_complete_seen.sql') AS migration_v2,
             (SELECT count(*) FROM d1_migrations WHERE name='0003_s3_attempt_claim.sql') AS migration_v3,
             (SELECT count(*) FROM d1_migrations WHERE name='0004_s3_callback_receipts.sql') AS migration_v4,
             (SELECT count(*) FROM d1_migrations WHERE name='0005_github_workflow_check.sql') AS migration_v5,
             (SELECT count(*) FROM d1_migrations WHERE name='0006_action_attempt_capabilities.sql') AS migration_v6,
             (SELECT count(*) FROM d1_migrations WHERE name='0007_session_executions.sql') AS migration_v7,
             (SELECT count(*) FROM d1_migrations WHERE name='0008_session_locator.sql') AS migration_v8,
              (SELECT count(*) FROM d1_migrations WHERE name='0009_fixed_sessions.sql') AS migration_v9,
              (SELECT count(*) FROM d1_migrations WHERE name='0010_session_runtime_data.sql') AS migration_v10,
             (SELECT count(*) FROM d1_migrations WHERE name='0011_awaited_child_capacity.sql') AS migration_v11,
             (SELECT count(*) FROM d1_migrations WHERE name='0012_event_wait_receipts.sql') AS migration_v12,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='wait_event_receipts') AS event_receipts_table,
             (SELECT count(*) FROM d1_migrations WHERE name='0013_cloudflare_action_invocations.sql') AS migration_v13,
              (SELECT count(*) FROM d1_migrations WHERE name='0014_workflow_deletion.sql') AS migration_v14,
              (SELECT count(*) FROM d1_migrations WHERE name='0015_runtime_approval.sql') AS migration_v15,
              (SELECT count(*) FROM d1_migrations WHERE name='0016_portal_connection_revocation.sql') AS migration_v16,
              (SELECT count(*) FROM d1_migrations WHERE name='0017_http_connection_auth.sql') AS migration_v17,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='http_connection_auth') AS http_auth_table,
              (SELECT count(*) FROM d1_migrations WHERE name='0018_cloudflare_action_migration_fence.sql') AS migration_v18,
              (SELECT count(*) FROM d1_migrations WHERE name='0019_session_rca_duration.sql') AS migration_v19,
              (SELECT count(*) FROM d1_migrations WHERE name='0020_github_action_main_sha.sql') AS migration_v20,
              (SELECT count(*) FROM d1_migrations WHERE name='0021_retire_uu_session_data.sql') AS migration_v21,
              (SELECT count(*) FROM pragma_table_info('step_attempts') WHERE name='resolved_sha') AS resolved_sha_column,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_gate') AS cloudflare_gate_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='portal_connection_auth') AS portal_auth_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='mcp_dispatch_fences') AS mcp_fence_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approval_gates') AS approval_gates_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approvals') AS approvals_table,
              (SELECT count(*) FROM pragma_table_info('workflows') WHERE name='deleted_at') AS deleted_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_invocations') AS invocations_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_cancellations') AS cloudflare_cancel_table,
             (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='session_url') AS locator_column,
              (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='fixed_key') AS fixed_column,
              (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='rca_duration_minutes') AS rca_duration_column,
              (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='session_active_fixed_keys') AS fixed_index,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_runtime_data') AS runtime_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='capacity_weight') AS capacity_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_run_id') AS parent_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_step_id') AS parent_step_column,
             (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='runs_one_awaited_child_per_step') AS child_index,
             (SELECT count(*) FROM sqlite_master WHERE type='trigger'
               AND name='runs_top_level_capacity_guard') AS capacity_guard_trigger,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='child_cancellations') AS child_cancel_table,
             (SELECT count(*) FROM pragma_table_info('child_cancellations') WHERE name='termination_attempted_at') AS child_terminate_fence_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_executions') AS session_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='github_action_cancellations') AS cancellation_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='step_attempts') AS attempt_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='callback_receipts') AS receipt_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='native_complete_seen_at') AS native_column,
             (SELECT count(*) FROM runs WHERE outcome NOT IN ('succeeded','failed','cancelled') AND id <> '$WORKFLOW_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SECOND_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_THIRD_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FOURTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FIFTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SIXTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SEVENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_EIGHTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_NINTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_TENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_ELEVENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_TWELFTH_TERMINAL_RUN_ID') AS active_runs,
              (SELECT count(*) FROM session_executions WHERE state != 'terminated') AS active_sessions,
             (SELECT count(*) FROM runs) AS run_count,
             (SELECT count(*) FROM workflows) AS workflow_count") |
            node scripts/manual-worker-release.mjs d1-check workflow-mcp-worker

      # Only the existing production release lock and GitHub Environment can
      # apply the reviewed Action capability and Session lifecycle migrations. This changes the
      # schema without changing any running instance.
      - name: Enforce original all-Workflow migration gate before any ordinary D1 writes
        if: inputs.worker == 'workflow-mcp-worker' && inputs.workflow_code_only != true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          query="$(node scripts/manual-worker-release.mjs migration-sql workflow-mcp-worker)"
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "$query") |
            node scripts/manual-worker-release.mjs migration-check workflow-mcp-worker

      - name: Prevent normal Workflow release from applying pending UU DROP
        if: inputs.worker == 'workflow-mcp-worker' && inputs.workflow_code_only != true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command \
              "SELECT count(*) AS v21_applied FROM d1_migrations WHERE name='0021_retire_uu_session_data.sql'") |
            node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
              const j=JSON.parse(s);
              if(!Array.isArray(j)||j.length!==1||j[0]?.success!==true||
                j[0]?.results?.length!==1||j[0].results[0]?.v21_applied!==1)
                process.exit(1);
              console.log("Only the isolated retirement job may first apply 0021");
            })'

      - name: Apply complete Workflow D1 migrations
        if: inputs.worker == 'workflow-mcp-worker' && inputs.workflow_code_only != true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_REQUIRE_COMPLETE_SCHEMA: 'true'
          WORKFLOW_TERMINAL_RUN_ID: ${{ steps.terminal.outputs.terminal_run_id }}
          WORKFLOW_SECOND_TERMINAL_RUN_ID: ${{ steps.terminal_second.outputs.second_terminal_run_id }}
          WORKFLOW_THIRD_TERMINAL_RUN_ID: ${{ steps.terminal_third.outputs.third_terminal_run_id }}
          WORKFLOW_FOURTH_TERMINAL_RUN_ID: ${{ steps.terminal_fourth.outputs.fourth_terminal_run_id }}
          WORKFLOW_FIFTH_TERMINAL_RUN_ID: ${{ steps.terminal_fifth.outputs.fifth_terminal_run_id }}
          WORKFLOW_SIXTH_TERMINAL_RUN_ID: ${{ steps.terminal_sixth.outputs.sixth_terminal_run_id }}
          WORKFLOW_SEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_seventh.outputs.seventh_terminal_run_id }}
          WORKFLOW_EIGHTH_TERMINAL_RUN_ID: ${{ steps.terminal_eighth.outputs.eighth_terminal_run_id }}
          WORKFLOW_NINTH_TERMINAL_RUN_ID: ${{ steps.terminal_ninth.outputs.ninth_terminal_run_id }}
          WORKFLOW_TENTH_TERMINAL_RUN_ID: ${{ steps.terminal_tenth.outputs.tenth_terminal_run_id }}
          WORKFLOW_ELEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_eleventh.outputs.eleventh_terminal_run_id }}
          WORKFLOW_TWELFTH_TERMINAL_RUN_ID: ${{ steps.terminal_twelfth.outputs.twelfth_terminal_run_id }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 migrations apply workflow-mcp-db --remote)
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "SELECT
              (SELECT count(*) FROM d1_migrations) AS migration_count,
              (SELECT count(*) FROM d1_migrations WHERE name='0001_s1.sql') AS migration_v1,
              (SELECT count(*) FROM d1_migrations WHERE name='0002_native_complete_seen.sql') AS migration_v2,
              (SELECT count(*) FROM d1_migrations WHERE name='0003_s3_attempt_claim.sql') AS migration_v3,
              (SELECT count(*) FROM d1_migrations WHERE name='0004_s3_callback_receipts.sql') AS migration_v4,
             (SELECT count(*) FROM d1_migrations WHERE name='0005_github_workflow_check.sql') AS migration_v5,
             (SELECT count(*) FROM d1_migrations WHERE name='0006_action_attempt_capabilities.sql') AS migration_v6,
             (SELECT count(*) FROM d1_migrations WHERE name='0007_session_executions.sql') AS migration_v7,
             (SELECT count(*) FROM d1_migrations WHERE name='0008_session_locator.sql') AS migration_v8,
              (SELECT count(*) FROM d1_migrations WHERE name='0009_fixed_sessions.sql') AS migration_v9,
              (SELECT count(*) FROM d1_migrations WHERE name='0010_session_runtime_data.sql') AS migration_v10,
             (SELECT count(*) FROM d1_migrations WHERE name='0011_awaited_child_capacity.sql') AS migration_v11,
             (SELECT count(*) FROM d1_migrations WHERE name='0012_event_wait_receipts.sql') AS migration_v12,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='wait_event_receipts') AS event_receipts_table,
             (SELECT count(*) FROM d1_migrations WHERE name='0013_cloudflare_action_invocations.sql') AS migration_v13,
              (SELECT count(*) FROM d1_migrations WHERE name='0014_workflow_deletion.sql') AS migration_v14,
              (SELECT count(*) FROM d1_migrations WHERE name='0015_runtime_approval.sql') AS migration_v15,
              (SELECT count(*) FROM d1_migrations WHERE name='0016_portal_connection_revocation.sql') AS migration_v16,
              (SELECT count(*) FROM d1_migrations WHERE name='0017_http_connection_auth.sql') AS migration_v17,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='http_connection_auth') AS http_auth_table,
              (SELECT count(*) FROM d1_migrations WHERE name='0018_cloudflare_action_migration_fence.sql') AS migration_v18,
              (SELECT count(*) FROM d1_migrations WHERE name='0019_session_rca_duration.sql') AS migration_v19,
              (SELECT count(*) FROM d1_migrations WHERE name='0020_github_action_main_sha.sql') AS migration_v20,
              (SELECT count(*) FROM d1_migrations WHERE name='0021_retire_uu_session_data.sql') AS migration_v21,
              (SELECT count(*) FROM pragma_table_info('step_attempts') WHERE name='resolved_sha') AS resolved_sha_column,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_gate') AS cloudflare_gate_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='portal_connection_auth') AS portal_auth_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='mcp_dispatch_fences') AS mcp_fence_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approval_gates') AS approval_gates_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approvals') AS approvals_table,
              (SELECT count(*) FROM pragma_table_info('workflows') WHERE name='deleted_at') AS deleted_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_invocations') AS invocations_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_cancellations') AS cloudflare_cancel_table,
             (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='session_url') AS locator_column,
              (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='fixed_key') AS fixed_column,
              (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='rca_duration_minutes') AS rca_duration_column,
              (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='session_active_fixed_keys') AS fixed_index,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_runtime_data') AS runtime_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='capacity_weight') AS capacity_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_run_id') AS parent_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_step_id') AS parent_step_column,
             (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='runs_one_awaited_child_per_step') AS child_index,
             (SELECT count(*) FROM sqlite_master WHERE type='trigger'
               AND name='runs_top_level_capacity_guard') AS capacity_guard_trigger,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='child_cancellations') AS child_cancel_table,
             (SELECT count(*) FROM pragma_table_info('child_cancellations') WHERE name='termination_attempted_at') AS child_terminate_fence_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_executions') AS session_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='github_action_cancellations') AS cancellation_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='step_attempts') AS attempt_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='callback_receipts') AS receipt_table,
              (SELECT count(*) FROM pragma_table_info('runs') WHERE name='native_complete_seen_at') AS native_column,
              (SELECT count(*) FROM runs WHERE outcome NOT IN ('succeeded','failed','cancelled') AND id <> '$WORKFLOW_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SECOND_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_THIRD_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FOURTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FIFTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SIXTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SEVENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_EIGHTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_NINTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_TENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_ELEVENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_TWELFTH_TERMINAL_RUN_ID') AS active_runs,
              (SELECT count(*) FROM session_executions WHERE state != 'terminated') AS active_sessions,
              (SELECT count(*) FROM runs) AS run_count,
              (SELECT count(*) FROM workflows) AS workflow_count") |
            node scripts/manual-worker-release.mjs d1-check workflow-mcp-worker

      - name: Verify code-only Workflow D1 gate at publication (Ready Sessions preserved)
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_TERMINAL_RUN_ID: ${{ steps.terminal.outputs.terminal_run_id }}
          WORKFLOW_SECOND_TERMINAL_RUN_ID: ${{ steps.terminal_second.outputs.second_terminal_run_id }}
          WORKFLOW_THIRD_TERMINAL_RUN_ID: ${{ steps.terminal_third.outputs.third_terminal_run_id }}
          WORKFLOW_FOURTH_TERMINAL_RUN_ID: ${{ steps.terminal_fourth.outputs.fourth_terminal_run_id }}
          WORKFLOW_FIFTH_TERMINAL_RUN_ID: ${{ steps.terminal_fifth.outputs.fifth_terminal_run_id }}
          WORKFLOW_SIXTH_TERMINAL_RUN_ID: ${{ steps.terminal_sixth.outputs.sixth_terminal_run_id }}
          WORKFLOW_SEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_seventh.outputs.seventh_terminal_run_id }}
          WORKFLOW_EIGHTH_TERMINAL_RUN_ID: ${{ steps.terminal_eighth.outputs.eighth_terminal_run_id }}
          WORKFLOW_NINTH_TERMINAL_RUN_ID: ${{ steps.terminal_ninth.outputs.ninth_terminal_run_id }}
          WORKFLOW_TENTH_TERMINAL_RUN_ID: ${{ steps.terminal_tenth.outputs.tenth_terminal_run_id }}
          WORKFLOW_ELEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_eleventh.outputs.eleventh_terminal_run_id }}
          WORKFLOW_TWELFTH_TERMINAL_RUN_ID: ${{ steps.terminal_twelfth.outputs.twelfth_terminal_run_id }}
        run: |
          set -euo pipefail
          query="$(node scripts/manual-worker-release.mjs migration-sql workflow-mcp-worker)"
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "$query") |
            node scripts/manual-worker-release.mjs code-release-check workflow-mcp-worker

      # Read-only native Hyperdrive checks: reviewed bindings, strict origin TLS
      # and disabled query caching. Database has no runtime D1 dependency.
      - name: Verify Database Hyperdrive TLS, CA, origin and cache before publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-database-hyperdrive.mjs

      # Browser activation retains its independent exact-domain Owner Access policy.
      - name: Verify Browser Profile Activation Access (read-only)
        if: inputs.worker == 'browser-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/manual-worker-release.mjs identity-recheck "$SELECTED_WORKER"

      - name: Recheck unified Actions Worker before Workflow publication (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs recheck

      # Read-only release gate; the old native instance admission MUST be
      # independently quiesced before binding switch. Frozen D1 alone is insufficient.
      - name: Verify unified Actions binding transition (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command               "SELECT (SELECT state FROM cloudflare_action_gate WHERE id=1) AS gate_state") |
            node scripts/actions-consumer-cutover-gate.mjs

      - name: Publish exactly selected Worker
        id: publish
        shell: bash
        env:
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DATABASE_EXPECTED_RELEASE_SHA: ${{ inputs.database_expected_release_sha }}
          WORKFLOW_CODE_ONLY: ${{ inputs.workflow_code_only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          if [[ "$SELECTED_WORKER" == 'database-mcp-worker' ]]; then
            [[ "$DATABASE_EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$GITHUB_SHA" == "$DATABASE_EXPECTED_RELEASE_SHA" ]]
          fi
          case "$SELECTED_WORKER" in
            browser-mcp-worker|raindrop-mcp-worker|ima-mcp-worker|database-mcp-worker|ssh-mcp-worker|remote-control-mcp-worker|github-actions-mcp-worker|workflow-mcp-worker) ;;
            *) echo "Invalid Worker target" >&2; exit 1 ;;
          esac
          log="$(mktemp)"
          chmod 600 "$log"
          cleanup() {
            rm -f "$log"
          }
          trap cleanup EXIT
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale immediately before publication" >&2
            exit 1
          }
          if [[ "$WORKFLOW_CODE_ONLY" == "true" ]]; then
            [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]] || exit 1
            [[ ! -e "$RUNNER_TEMP/mcp-worker-secrets.json" ]] || { echo 'Code-only release must not stage Secrets' >&2; exit 1; }
            # Wrangler retains deployed Secrets automatically; keep plain Variables
            # without re-uploading either, after existing read-only binding gates.
            deploy_args=(--keep-vars)
          else
            # Existing releases always restage exactly the approved GitHub Secrets.
            test -s "$RUNNER_TEMP/mcp-worker-secrets.json"
            deploy_args=(--secrets-file "$RUNNER_TEMP/mcp-worker-secrets.json")
            test -f "$RUNNER_TEMP/mcp-worker-variables.txt"
            while IFS= read -r variable_pair; do
              deploy_args+=(--var "$variable_pair")
            done < "$RUNNER_TEMP/mcp-worker-variables.txt"
          fi
          if ! (cd "apps/$SELECTED_WORKER" && pnpm exec wrangler deploy "${deploy_args[@]}") >"$log" 2>&1; then
            echo "Wrangler deploy failed (stage=deploy); no automated rollback attempted" >&2
            # Report only a whitelisted error code and a bounded, sanitized summary.
            # Never print raw Wrangler output (may contain secrets or configuration).
            node scripts/manual-worker-release.mjs diagnostic "$log"
            exit 1
          fi
          deployed_version="$(node scripts/manual-worker-release.mjs version "$log")"
          echo "version_id=$deployed_version" >> "$GITHUB_OUTPUT"
          echo "Wrangler reported a version ID; verifying Cloudflare active deployment next"

      - name: Remove temporary deployment configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mcp-worker-secrets.json" "$RUNNER_TEMP/mcp-worker-variables.txt"

      - name: Verify exact active version and required production bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_VERSION_ID: ${{ steps.publish.outputs.version_id }}
          BROWSER_REMEMBERED_IDLE_DAYS: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_REMEMBERED_IDLE_DAYS || '' }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_MCP_PORTAL_CLIENT_ID || '' }}
          WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES || '' }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
        run: node scripts/manual-worker-release.mjs readback "$SELECTED_WORKER"

      - name: Verify Workflow pin matches deployed Actions Worker (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs postflight

      # First transition only. Do not reopen admission until the active
      # Consumer version, single Actions Service Binding and Provider pin
      # have already been independently read back; all plans remain paused.
      - name: Verify frozen Action gate and paused unified runtime before activation (read-only)
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_old_ingress_quiesced == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-preflight

      - name: Reopen only the now-verified unified Action admission gate
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_old_ingress_quiesced == true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command               "UPDATE cloudflare_action_gate SET state='open',changed_at=unixepoch()*1000 WHERE id=1 AND state='frozen'") > /dev/null

      - name: Verify only unified admission reopened and all Workflow plans still paused (read-only)
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_old_ingress_quiesced == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-postflight

      - name: Remove temporary Actions pin proof
        if: always() && inputs.worker == 'workflow-mcp-worker'
        run: rm -f "$RUNNER_TEMP/actions-provider-version.txt"

      - name: Verify Database Hyperdrive TLS, CA, origin and cache after publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-database-hyperdrive.mjs

      - name: Check existing public health endpoint
        if: inputs.worker == 'ima-mcp-worker' || inputs.worker == 'raindrop-mcp-worker' || inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          health_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/health"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            health_endpoint="https://workflow.lirtual.dpdns.org/health"
          fi
          max_attempts=1
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' "$health_endpoint")"
            if [[ "$status" == 404 && "$attempt" -lt "$max_attempts" ]]; then
              sleep 5
              continue
            fi
            break
          done
          [[ "$status" == "200" ]] || { echo "Health check failed (HTTP $status)" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const worker = process.argv[2];
            if (!body || (worker === "workflow-mcp-worker" ? (body.ok !== true || body.scope !== "workflow" || body.service !== "workflow-mcp-worker") : worker === "ima-mcp-worker" ? body.ok !== true : body.status !== "healthy")) process.exit(1);
          ' "$response" "$SELECTED_WORKER" || { echo "Health check failed (invalid response)" >&2; exit 1; }
          echo "Existing health endpoint verified (HTTP 200)"

      - name: Check unauthenticated MCP surface without credentials
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          # A new Workers.dev hostname may briefly return 404 after the first publish.
          # Do not retry any non-404 status or hide a persistent routing failure.
          max_attempts=1
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          if [[ "$SELECTED_WORKER" == "github-actions-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          mcp_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/mcp"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            mcp_endpoint="https://workflow.lirtual.dpdns.org/mcp"
          elif [[ "$SELECTED_WORKER" == "browser-mcp-worker" ]]; then
            mcp_endpoint="https://browser.lirtual.dpdns.org/mcp"
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              "$mcp_endpoint")"
            case "$status" in
              401|403)
                echo "Unauthenticated MCP request denied (HTTP $status); human Portal acceptance still required"
                exit 0
                ;;
              404)
                if ((attempt < max_attempts)); then
                  echo "New Workers.dev route not yet visible (HTTP 404; attempt $attempt/$max_attempts)"
                  sleep 5
                  continue
                fi
                ;;
            esac
            echo "Unexpected unauthenticated MCP status: $status" >&2
            exit 1
          done

      - name: Register production Browser MCP with existing One-MCP Portal
        if: inputs.worker == 'browser-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-browser-portal.mjs

  workflow-uu-table-retirement:
    name: Spec #774 single-table UU retirement (no Worker deployment)
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' && github.actor == 'lirtual' &&
          inputs.worker == 'workflow-mcp-worker' &&
          inputs.uu_cleanup_approved == true &&
          inputs.deploy_to_production == false && inputs.browser_access_readonly != true &&
          inputs.workflow_code_only != true &&
          inputs.uu_session_secret_cleanup != true &&
          inputs.legacy_secret_cleanup_mode == 'none' &&
          inputs.actions_migration_prepare != true &&
          inputs.actions_gate_reopen != true &&
          inputs.actions_old_ingress_quiesced != true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: worker-release-workflow-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UU_CLEANUP_APPROVED: ${{ inputs.uu_cleanup_approved }}
      UU_CLEANUP_EXPECTED_SHA: ${{ inputs.uu_cleanup_expected_sha }}
      UU_CLEANUP_EXPECTED_ACTIVE_VERSION: ${{ inputs.uu_cleanup_expected_active_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Owner-reviewed source before credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$UU_CLEANUP_EXPECTED_SHA" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove isolated empty UU table and unchanged history (read-only)
        id: preflight
        run: node scripts/workflow-uu-cleanup-gate.mjs before
      - name: Apply exactly pending 0021 via normal Wrangler D1 migration registry
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          node scripts/workflow-uu-cleanup-gate.mjs before
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 migrations apply workflow-mcp-db --remote)
      - name: Independently verify UU table absent and historical data unchanged
        if: ${{ always() && steps.preflight.outcome == 'success' &&
                 (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure') }}
        run: node scripts/workflow-uu-cleanup-gate.mjs after

  legacy-secret-cleanup:
    name: Spec 733/774 protected versioned Secret cleanup
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.deploy_to_production == true && inputs.browser_access_readonly != true &&
          needs.checks.result == 'success' && needs.checks.outputs.release_ready == 'true' &&
          (
            (
              (inputs.legacy_secret_cleanup_mode == 'prepare' || inputs.legacy_secret_cleanup_mode == 'publish') &&
              inputs.workflow_code_only != true &&
              (inputs.worker == 'ssh-mcp-worker' || inputs.worker == 'workflow-mcp-worker' || inputs.worker == 'database-mcp-worker')
            ) ||
            (
              inputs.legacy_secret_cleanup_mode == 'restore' && inputs.worker == 'workflow-mcp-worker' &&
              (
                (inputs.uu_session_secret_cleanup == true && inputs.workflow_code_only != true) ||
                (inputs.workflow_code_only == true && inputs.uu_session_secret_cleanup != true)
              )
            )
          ) &&
          inputs.actions_old_ingress_quiesced != true &&
          inputs.actions_migration_prepare != true && inputs.actions_gate_reopen != true &&
          inputs.uu_cleanup_approved != true }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.worker }}
    concurrency:
      group: worker-release-${{ inputs.worker }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SELECTED_WORKER: ${{ inputs.worker }}
      LEGACY_CLEANUP_MODE: ${{ inputs.legacy_secret_cleanup_mode }}
      UU_SESSION_SECRET_CLEANUP: ${{ inputs.uu_session_secret_cleanup }}
      WORKFLOW_CODE_ONLY: ${{ inputs.workflow_code_only }}
      EXPECTED_SOURCE_SHA: ${{ inputs.legacy_cleanup_expected_sha }}
      EXPECTED_ACTIVE_VERSION: ${{ inputs.legacy_cleanup_expected_active_version }}
      CANDIDATE_VERSION_ID: ${{ inputs.legacy_cleanup_candidate_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Owner-approved exact main, mode and Worker before credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          [[ "$EXPECTED_ACTIVE_VERSION" =~ ^[a-f0-9-]{36}$ ]]
          case "$SELECTED_WORKER:$LEGACY_CLEANUP_MODE" in
            ssh-mcp-worker:prepare|ssh-mcp-worker:publish|workflow-mcp-worker:prepare|workflow-mcp-worker:publish|workflow-mcp-worker:restore|database-mcp-worker:prepare|database-mcp-worker:publish) ;;
            *) exit 1 ;;
          esac
          if [[ "$UU_SESSION_SECRET_CLEANUP" == 'true' ]]; then
            [[ "$SELECTED_WORKER" == 'workflow-mcp-worker' &&
               "${{ inputs.workflow_code_only }}" != 'true' &&
               "${{ inputs.actions_migration_prepare }}" != 'true' &&
               "${{ inputs.actions_gate_reopen }}" != 'true' &&
               "${{ inputs.actions_old_ingress_quiesced }}" != 'true' ]] || {
              echo 'UU Secret cleanup is limited to the existing protected Workflow Worker release' >&2
              exit 1
            }
          fi
          if [[ "$LEGACY_CLEANUP_MODE" == 'restore' && "$UU_SESSION_SECRET_CLEANUP" == 'true' ]]; then
            [[ "$WORKFLOW_CODE_ONLY" != 'true' &&
               "$SELECTED_WORKER" == 'workflow-mcp-worker' &&
               "$EXPECTED_ACTIVE_VERSION" == '3f27e9ca-790c-4ec9-914e-cb4204a736e6' &&
               "$CANDIDATE_VERSION_ID" == '414da2d7-a16f-4ce6-9350-013ad4f7166a' ]]
          fi
          if [[ "$LEGACY_CLEANUP_MODE" == 'restore' && "$WORKFLOW_CODE_ONLY" == 'true' ]]; then
            [[ "$UU_SESSION_SECRET_CLEANUP" != 'true' &&
               "$SELECTED_WORKER" == 'workflow-mcp-worker' &&
               "$CANDIDATE_VERSION_ID" == '3f27e9ca-790c-4ec9-914e-cb4204a736e6' &&
               "$EXPECTED_ACTIVE_VERSION" != '3f27e9ca-790c-4ec9-914e-cb4204a736e6' ]]
          fi
          if [[ "$LEGACY_CLEANUP_MODE" == 'prepare' ]]; then
            [[ -z "$CANDIDATE_VERSION_ID" ]]
          else
            [[ "$CANDIDATE_VERSION_ID" =~ ^[a-f0-9-]{36}$ && "$CANDIDATE_VERSION_ID" != "$EXPECTED_ACTIVE_VERSION" ]]
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate active version, exact Secret inventory and Workflow quiescence (read-only)
        if: inputs.uu_session_secret_cleanup != true && inputs.workflow_code_only != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ vars.WORKFLOW_MCP_PORTAL_CLIENT_ID }}
          WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ vars.WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
        run: node scripts/legacy-secret-cleanup.mjs preflight "$SELECTED_WORKER"

      - name: Verify scoped UU Secret retirement and original historical proof (read-only)
        if: inputs.uu_session_secret_cleanup == true && inputs.legacy_secret_cleanup_mode != 'restore'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/workflow-uu-secret-cleanup.mjs preflight "$SELECTED_WORKER"

      - name: Create one unpublished version removing only reviewed legacy Secrets
        if: inputs.legacy_secret_cleanup_mode == 'prepare'
        id: prepare
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          file="$(mktemp --suffix=.json)"
          log="$(mktemp)"
          chmod 600 "$file" "$log"
          trap 'rm -f "$file" "$log"' EXIT
          if [[ "$SELECTED_WORKER" == 'ssh-mcp-worker' ]]; then
            printf '%s\n' '{"ENCRYPTION_KEY":null}' > "$file"
          elif [[ "$SELECTED_WORKER" == 'workflow-mcp-worker' &&
               "$UU_SESSION_SECRET_CLEANUP" == 'true' ]]; then
            printf '%s\n' '{"WORKFLOW_SESSION_RUNTIME_DATA_KEY":null}' > "$file"
          elif [[ "$SELECTED_WORKER" == 'workflow-mcp-worker' ]]; then
            printf '%s\n' '{"MCP_PORTAL_CLIENT_SECRET":null,"SESSION_RUNTIME_DATA_KEY":null}' > "$file"
          else
            printf '%s\n' '{"DATABASE_ENCRYPTION_KEY":null,"DATABASE_GITHUB_ACTIONS_TOKEN":null,"DATABASE_KEY_ID":null}' > "$file"
          fi
          # Unlike wrangler secret delete, versions secret bulk never deploys the candidate.
          if ! (cd "apps/$SELECTED_WORKER" && pnpm exec wrangler versions secret bulk "$file" \
              --name "$SELECTED_WORKER" --message 'Reviewed version-only Secret cleanup candidate; not deployed' >"$log" 2>&1); then
            # Emit only a bounded error-code classification, never the raw Wrangler log.
            node scripts/manual-worker-release.mjs diagnostic "$log" prepare || true
            echo "Candidate creation failed/unknown; do not retry; inspect Worker version inventory read-only" >&2
            exit 1
          fi
          candidate="$(node scripts/manual-worker-release.mjs version "$log")"
          echo "candidate_version_id=$candidate" >> "$GITHUB_OUTPUT"

      - name: Verify unpublished candidate and unchanged 100% active version
        if: inputs.legacy_secret_cleanup_mode == 'prepare' && inputs.uu_session_secret_cleanup != true
        env:
          CANDIDATE_VERSION_ID: ${{ steps.prepare.outputs.candidate_version_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ vars.WORKFLOW_MCP_PORTAL_CLIENT_ID }}
          WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ vars.WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
        run: node scripts/legacy-secret-cleanup.mjs candidate "$SELECTED_WORKER"

      - name: Verify scoped unpublished UU Secret candidate and unchanged active version
        if: inputs.legacy_secret_cleanup_mode == 'prepare' && inputs.uu_session_secret_cleanup == true
        env:
          CANDIDATE_VERSION_ID: ${{ steps.prepare.outputs.candidate_version_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/workflow-uu-secret-cleanup.mjs candidate "$SELECTED_WORKER"

      - name: Revalidate reviewed candidate immediately before production promotion
        if: inputs.legacy_secret_cleanup_mode == 'publish'
        env:
          CANDIDATE_VERSION_ID: ${{ inputs.legacy_cleanup_candidate_version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ vars.WORKFLOW_MCP_PORTAL_CLIENT_ID }}
          WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ vars.WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          if [[ "$UU_SESSION_SECRET_CLEANUP" == 'true' ]]; then
            node scripts/workflow-uu-secret-cleanup.mjs preflight "$SELECTED_WORKER"
          else
            node scripts/legacy-secret-cleanup.mjs preflight "$SELECTED_WORKER"
            node scripts/legacy-secret-cleanup.mjs candidate "$SELECTED_WORKER"
          fi

      - name: Verify exact Version 143 to 142 restore conditions (read-only)
        if: inputs.legacy_secret_cleanup_mode == 'restore' && inputs.uu_session_secret_cleanup == true && inputs.workflow_code_only != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/workflow-uu-secret-cleanup.mjs restore-preflight "$SELECTED_WORKER"

      - name: Verify code-only Version 143 restore conditions (read-only)
        if: inputs.legacy_secret_cleanup_mode == 'restore' && inputs.workflow_code_only == true && inputs.uu_session_secret_cleanup != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/workflow-version-restore.mjs preflight "$SELECTED_WORKER"

      - name: Deploy only the independently approved candidate to 100 percent
        if: inputs.legacy_secret_cleanup_mode == 'publish' || inputs.legacy_secret_cleanup_mode == 'restore'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          log="$(mktemp)"
          chmod 600 "$log"
          trap 'rm -f "$log"' EXIT
          if ! (cd "apps/$SELECTED_WORKER" && pnpm exec wrangler versions deploy \
            "$CANDIDATE_VERSION_ID@100" --yes) >"$log" 2>&1; then
            node scripts/manual-worker-release.mjs diagnostic "$log" deploy || true
            echo "Candidate promotion failed/unknown; read active deployment before any action" >&2
            exit 1
          fi

      - name: Verify exact live version, retained canonical bindings and old Secret absence
        if: inputs.legacy_secret_cleanup_mode == 'publish' && inputs.uu_session_secret_cleanup != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_VERSION_ID: ${{ inputs.legacy_cleanup_candidate_version }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ vars.WORKFLOW_MCP_PORTAL_CLIENT_ID }}
          WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ vars.WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
          DATABASE_MAX_ROWS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_ROWS || '' }}
          DATABASE_MAX_RESULT_BYTES: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_RESULT_BYTES || '' }}
          DATABASE_MAX_SCHEMA_BYTES: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_SCHEMA_BYTES || '' }}
          DATABASE_QUERY_TIMEOUT_MS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_QUERY_TIMEOUT_MS || '' }}
          DATABASE_MAX_WRITE_AFFECTED_ROWS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_WRITE_AFFECTED_ROWS || '' }}
        run: node scripts/manual-worker-release.mjs cleanup-readback "$SELECTED_WORKER"

      - name: Verify UU Secret removed from the exact 100 percent active version
        if: inputs.legacy_secret_cleanup_mode == 'publish' && inputs.uu_session_secret_cleanup == true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANDIDATE_VERSION_ID: ${{ inputs.legacy_cleanup_candidate_version }}
        run: node scripts/workflow-uu-secret-cleanup.mjs readback "$SELECTED_WORKER"

      - name: Verify exact Version 142 restored to 100 percent (read-only)
        if: inputs.legacy_secret_cleanup_mode == 'restore' && inputs.uu_session_secret_cleanup == true && inputs.workflow_code_only != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/workflow-uu-secret-cleanup.mjs restore-readback "$SELECTED_WORKER"

      - name: Verify exact Version 143 restored to 100 percent (read-only)
        if: inputs.legacy_secret_cleanup_mode == 'restore' && inputs.workflow_code_only == true && inputs.uu_session_secret_cleanup != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/workflow-version-restore.mjs readback "$SELECTED_WORKER"
