name: Release Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Select Worker to deploy to production
        required: true
        type: choice
        options:
          - browser-mcp-worker
          - database-mcp-worker
          - ima-mcp-worker
          - raindrop-mcp-worker
          - ssh-mcp-worker
          - remote-control-mcp-worker
          - github-actions-mcp-worker
          - http-mcp-worker
          - workflow-mcp-worker
      database_hyperdrive_apply_id:
        description: 'Database only: Owner final confirmation operation UUID (protected merge and release request)'
        required: false
        type: string
        default: ''
      database_hyperdrive_prepare_id:
        description: 'Database only: Owner-confirmed unbound Hyperdrive preparation operation UUID (no Worker deployment)'
        required: false
        type: string
        default: ''
      database_hyperdrive_enable_approved:
        description: 'Database only: protected strict-TLS Hyperdrive activation after binding and Owner disabled reference'
        required: false
        type: boolean
        default: false
      database_hyperdrive_retire_approved:
        description: 'Database only: retire a disabled Hyperdrive D1 ID after a separately verified unbinding release'
        required: false
        type: boolean
        default: false
      database_hyperdrive_id:
        description: 'Database enable/retire: exact disabled logical connection ID'
        required: false
        type: string
        default: ''
      database_hyperdrive_revision:
        description: 'Database enable/retire: expected disabled revision'
        required: false
        type: string
        default: ''
      database_hyperdrive_rotation_mode:
        description: 'Database only: Owner read-only rotation eligibility (credentials or ca), no writes'
        required: false
        type: string
        default: ''
      database_expected_release_sha:
        description: 'Database production release: exact Owner-reviewed main commit SHA'
        required: false
        type: string
        default: ''
      actions_migration_prepare:
        description: 'Spec #21: prepare only the frozen Workflow D1 0018 gate, without Worker deployment'
        type: boolean
        required: false
        default: false
      actions_old_ingress_quiesced:
        description: Workflow first cutover only - Owner verified legacy admissions are stopped independently (not a technical substitute)
        type: boolean
        required: false
        default: false
      deploy_to_production:
        description: Explicit approval to publish exactly the selected Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  database-hyperdrive-prepare:
    name: Owner-approved Hyperdrive preparation (no deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.deploy_to_production == false && inputs.database_hyperdrive_prepare_id != '' && inputs.database_hyperdrive_apply_id == '' &&
          inputs.database_hyperdrive_enable_approved != true &&
          inputs.database_hyperdrive_retire_approved != true && inputs.database_hyperdrive_rotation_mode == '' }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Owner to current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare an isolated unbound candidate and bounded PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          DATABASE_KEY_ID: ${{ vars.DATABASE_KEY_ID }}
          DATABASE_GITHUB_ACTIONS_TOKEN: ${{ secrets.DATABASE_GITHUB_ACTIONS_TOKEN }}
          DATABASE_HYPERDRIVE_OPERATION_ID: ${{ inputs.database_hyperdrive_prepare_id }}
        run: node scripts/prepare-database-hyperdrive-476.mjs

  database-hyperdrive-apply:
    name: Owner final Hyperdrive confirmation (protected merge and release request)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.deploy_to_production == false && inputs.database_hyperdrive_apply_id != '' &&
          inputs.database_hyperdrive_prepare_id == '' &&
          inputs.database_hyperdrive_enable_approved != true && inputs.database_hyperdrive_retire_approved != true &&
          inputs.database_hyperdrive_id == '' && inputs.database_hyperdrive_revision == '' &&
          inputs.database_expected_release_sha == '' && inputs.database_hyperdrive_rotation_mode == '' }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Owner to current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact PR, required checks and merge eligibility before requesting existing release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABASE_GITHUB_ACTIONS_TOKEN: ${{ secrets.DATABASE_GITHUB_ACTIONS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_HYPERDRIVE_OPERATION_ID: ${{ inputs.database_hyperdrive_apply_id }}
        run: node scripts/apply-database-hyperdrive-476.mjs

  database-hyperdrive-enable:
    name: Protected Hyperdrive Owner activation (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.database_hyperdrive_enable_approved == true &&
          inputs.deploy_to_production == false && inputs.database_hyperdrive_prepare_id == '' && inputs.database_hyperdrive_apply_id == '' &&
          inputs.database_hyperdrive_retire_approved != true &&
          inputs.database_hyperdrive_id != '' && inputs.database_hyperdrive_revision != '' && inputs.database_hyperdrive_rotation_mode == '' }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Owner to current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Cloudflare TLS, D1 CAS and live Worker health before activation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          DATABASE_ACTIVATION_ID: ${{ inputs.database_hyperdrive_id }}
          DATABASE_ACTIVATION_REVISION: ${{ inputs.database_hyperdrive_revision }}
        run: node scripts/activate-database-hyperdrive.mjs

  database-hyperdrive-credentials:
    name: Owner-confirmed isolated Hyperdrive password update (no deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.deploy_to_production == false &&
          inputs.database_hyperdrive_rotation_mode == 'credentials_apply' &&
          inputs.database_hyperdrive_prepare_id != '' && inputs.database_hyperdrive_apply_id == '' &&
          inputs.database_hyperdrive_id == '' && inputs.database_hyperdrive_revision == '' &&
          inputs.database_expected_release_sha == '' &&
          inputs.database_hyperdrive_enable_approved != true && inputs.database_hyperdrive_retire_approved != true }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Owner to exact current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Install existing read-only MySQL/PostgreSQL probe drivers
        run: pnpm install --frozen-lockfile --filter database-mcp-worker...
      - name: Recheck isolation, attempt password update and require independent SQL verification
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          DATABASE_KEY_ID: ${{ vars.DATABASE_KEY_ID }}
          DATABASE_HYPERDRIVE_OPERATION_ID: ${{ inputs.database_hyperdrive_prepare_id }}
        run: node scripts/rotate-database-hyperdrive-476.mjs

  database-hyperdrive-rotation-check:
    name: Check Hyperdrive rotation safety (read-only, no deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.deploy_to_production == false &&
          (inputs.database_hyperdrive_rotation_mode == 'credentials' || inputs.database_hyperdrive_rotation_mode == 'ca') &&
          inputs.database_hyperdrive_id != '' && inputs.database_hyperdrive_revision != '' &&
          inputs.database_hyperdrive_prepare_id == '' && inputs.database_hyperdrive_apply_id == '' &&
          inputs.database_expected_release_sha == '' &&
          inputs.database_hyperdrive_enable_approved != true && inputs.database_hyperdrive_retire_approved != true }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Owner to current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect disabled D1, current Workers and rollback references only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_ROTATION_MODE: ${{ inputs.database_hyperdrive_rotation_mode }}
          DATABASE_ROTATION_ID: ${{ inputs.database_hyperdrive_id }}
          DATABASE_ROTATION_REVISION: ${{ inputs.database_hyperdrive_revision }}
        run: node scripts/check-database-hyperdrive-rotation-476.mjs

  database-hyperdrive-retire:
    name: Protected Hyperdrive D1 identity retirement (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.database_hyperdrive_retire_approved == true &&
          inputs.deploy_to_production == false && inputs.database_hyperdrive_prepare_id == '' && inputs.database_hyperdrive_apply_id == '' &&
          inputs.database_hyperdrive_enable_approved != true &&
          inputs.database_hyperdrive_id != '' && inputs.database_hyperdrive_revision != '' && inputs.database_hyperdrive_rotation_mode == '' }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Owner to current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stage safe source unbinding as Draft PR, or prove source already unbound
        id: unbind
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABASE_GITHUB_ACTIONS_TOKEN: ${{ secrets.DATABASE_GITHUB_ACTIONS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_RETIRE_ID: ${{ inputs.database_hyperdrive_id }}
          DATABASE_RETIRE_REVISION: ${{ inputs.database_hyperdrive_revision }}
        run: node scripts/prepare-database-hyperdrive-unbind-476.mjs
      - name: Retire only disabled, released and proven-unbound D1 reference
        if: steps.unbind.outputs.action == 'retire'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_RETIRE_ID: ${{ inputs.database_hyperdrive_id }}
          DATABASE_RETIRE_REVISION: ${{ inputs.database_hyperdrive_revision }}
        run: node scripts/retire-database-hyperdrive.mjs

  workflow-actions-migration-prepare:
    name: First Actions D1 cutover preparation (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'workflow-mcp-worker' &&
          inputs.deploy_to_production == false && inputs.actions_migration_prepare == true &&
          inputs.actions_old_ingress_quiesced == true }}
    runs-on: ubuntu-latest
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: worker-release-workflow-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact current main without release credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify all Published Workflows paused, all old Runs terminal and all native instances drained (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs preflight
      - name: Apply existing Workflow D1 migrations and freeze only 0018 admission gate (no release)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 migrations apply workflow-mcp-db --remote)
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "UPDATE cloudflare_action_gate SET state='frozen',changed_at=unixepoch()*1000 WHERE id=1 AND state='open'") > /dev/null
      - name: Independently verify migration, frozen gate and continued quiescence (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs postflight

  checks:
    name: Pre-release checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_production == true && inputs.database_hyperdrive_prepare_id == '' && inputs.database_hyperdrive_enable_approved != true && inputs.database_hyperdrive_retire_approved != true && inputs.actions_migration_prepare != true && inputs.database_hyperdrive_rotation_mode == '' }}
    uses: ./.github/workflows/ci.yml
    with:
      worker: ${{ inputs.worker }}

  deploy:
    name: Manual selected Worker release
    needs: checks
    outputs:
      version_id: ${{ steps.publish.outputs.version_id }}
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' &&
          inputs.deploy_to_production == true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' && inputs.actions_migration_prepare != true && inputs.database_hyperdrive_rotation_mode == '' &&
          (inputs.worker == 'raindrop-mcp-worker' ||
           inputs.worker == 'browser-mcp-worker' ||
           inputs.worker == 'ima-mcp-worker' ||
           inputs.worker == 'database-mcp-worker' ||
           inputs.worker == 'ssh-mcp-worker' ||
           inputs.worker == 'remote-control-mcp-worker' ||
           inputs.worker == 'github-actions-mcp-worker' ||
           inputs.worker == 'http-mcp-worker' ||
           inputs.worker == 'workflow-mcp-worker') }}
    runs-on: ubuntu-latest
    # A GitHub Environment is a Worker-scoped configuration namespace, not a
    # staging/production selector. Only manual dispatch on main can deploy.
    environment:
      name: ${{ inputs.worker }}
    concurrency:
      group: worker-release-${{ inputs.worker }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # Verify prior checked native completion after 404.
    env:
      SELECTED_WORKER: ${{ inputs.worker }}
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current trusted main without deployment credentials
        env:
          DATABASE_EXPECTED_RELEASE_SHA: ${{ inputs.database_expected_release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_ACTOR" == "lirtual" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Manual dispatch source no longer matches main HEAD" >&2
            exit 1
          }
          if [[ "$SELECTED_WORKER" == 'database-mcp-worker' ]]; then
            [[ "$DATABASE_EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$GITHUB_SHA" == "$DATABASE_EXPECTED_RELEASE_SHA" ]] || {
              echo 'Database release source differs from Owner-reviewed SHA' >&2
              exit 1
            }
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Stage pinned public Agent source (remote-control release only)
        if: inputs.worker == 'remote-control-mcp-worker'
        run: bash scripts/stage-public-remote-control-agent.sh

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and verify shared Browser extension artifact
        if: inputs.worker == 'browser-mcp-worker'
        run: |
          python3 scripts/build-browser-extension.py --out-dir "$RUNNER_TEMP/browser-extension"
          python3 scripts/stage-browser-distribution.py --artifact-dir "$RUNNER_TEMP/browser-extension" --out-dir apps/browser-mcp-worker/.build/public --require-clean

      - name: Retain Browser ZIP and provenance for separately authorized GitHub Release publication
        if: inputs.worker == 'browser-mcp-worker'
        uses: actions/upload-artifact@v4
        with:
          name: browser-mcp-extension-${{ github.sha }}
          path: ${{ runner.temp }}/browser-extension/*.zip*
          include-hidden-files: true
          if-no-files-found: error

      - name: Cloudflare release preflight (read-only)
        id: preflight
        env:
          HTTP_CREDENTIALS_JSON: ${{ inputs.worker == 'http-mcp-worker' && secrets.HTTP_CREDENTIALS_JSON || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/manual-worker-release.mjs preflight "$SELECTED_WORKER"

      # GitHub Secrets are the source of truth for all selected Workers, on every
      # explicitly authorized manual release, not just during bootstrap.
      - name: Stage selected Worker Secrets for every release
        shell: bash
        env:
          # GitHub automatically uses same-name Environment Secrets over
          # Repository Secrets. Values are scoped to this one staging step.
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          DATABASE_ENCRYPTION_KEY: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_ENCRYPTION_KEY || '' }}
          DATABASE_GITHUB_ACTIONS_TOKEN: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_GITHUB_ACTIONS_TOKEN || '' }}
          DATABASE_KEY_ID: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_KEY_ID || '' }}
          DATABASE_ENCRYPTION_PREVIOUS_KEY: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_ENCRYPTION_PREVIOUS_KEY || '' }}
          DATABASE_PREVIOUS_KEY_ID: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_PREVIOUS_KEY_ID || '' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ACTIONS_GITHUB_DISPATCH_TOKENS: ${{ secrets.ACTIONS_GITHUB_DISPATCH_TOKENS }}
          HTTP_CREDENTIALS_JSON: ${{ inputs.worker == 'http-mcp-worker' && secrets.HTTP_CREDENTIALS_JSON || '' }}
          MCP_PORTAL_CLIENT_SECRET: ${{ secrets.MCP_PORTAL_CLIENT_SECRET }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          SESSION_RUNTIME_DATA_KEY: ${{ secrets.SESSION_RUNTIME_DATA_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/bootstrap-worker-secrets.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-secrets.json"

      - name: Stage approved Worker variables
        shell: bash
        env:
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
