name: Release Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Select Worker to deploy to production
        required: true
        type: choice
        options:
          - browser-mcp-worker
          - database-mcp-worker
          - ima-mcp-worker
          - raindrop-mcp-worker
          - ssh-mcp-worker
          - remote-control-mcp-worker
          - github-actions-mcp-worker
          - workflow-mcp-worker
      database_expected_release_sha:
        description: 'Database production release: exact Owner-reviewed main commit SHA'
        required: false
        type: string
        default: ''
      actions_migration_prepare:
        description: 'Spec #21: prepare only the frozen Workflow D1 0018 gate, without Worker deployment'
        type: boolean
        required: false
        default: false
      actions_gate_reopen:
        description: 'Spec #54: reopen the existing frozen Actions admission gate without Worker release'
        type: boolean
        required: false
        default: false
      actions_expected_provider_version:
        description: 'Gate-only recovery: exact reviewed live Bark-only Provider version'
        type: string
        required: false
        default: ''
      actions_expected_consumer_version:
        description: 'Gate-only recovery: exact reviewed live Consumer version'
        type: string
        required: false
        default: ''
      actions_old_ingress_quiesced:
        description: Workflow first cutover only - Owner verified legacy admissions are stopped independently (not a technical substitute)
        type: boolean
        required: false
        default: false
      workflow_code_only:
        description: 'Workflow Worker only: deploy code with existing D1 schema and Secrets/Variables preserved; no D1 migrations or secret upload'
        required: false
        type: boolean
        default: false
      uu_cleanup_approved:
        description: 'Spec774: authorize destructive empty UU table only, no Worker publish'
        type: boolean
        required: false
        default: false
      uu_cleanup_expected_sha:
        description: 'Spec774: exact independently reviewed main SHA'
        type: string
        required: false
        default: ''
      uu_cleanup_expected_active_version:
        description: 'Spec774: exact active Version 143 UUID'
        type: string
        required: false
        default: ''
      uu_session_secret_cleanup:
        description: 'Spec 774: separately authorized one-key UU runtime Secret retirement via existing versioned Prepare/Publish'
        required: false
        type: boolean
        default: false
      legacy_secret_cleanup_mode:
        description: 'Spec 733/774: none, Prepare, reviewed candidate Publish, or exact Workflow 143 to 142 restore'
        required: true
        type: choice
        options:
          - none
          - prepare
          - publish
          - restore
        default: none
      legacy_cleanup_expected_sha:
        description: 'Spec 733: exact Owner-reviewed main SHA for cleanup'
        required: false
        type: string
        default: ''
      legacy_cleanup_expected_active_version:
        description: 'Spec 733: exact active Worker baseline version UUID'
        required: false
        type: string
        default: ''
      legacy_cleanup_candidate_version:
        description: 'Spec 733 publish only: exact separately approved prepared candidate UUID'
        required: false
        type: string
        default: ''
      browser_access_readonly:
        description: 'Spec804: Browser-only read-only release Runner permission and active identity preflight; never publishes'
        required: false
        type: boolean
        default: false
      deploy_to_production:
        description: Explicit approval to publish exactly the selected Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  workflow-actions-migration-prepare:
    name: First Actions D1 cutover preparation (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.workflow_code_only != true && inputs.worker == 'workflow-mcp-worker' &&
          inputs.deploy_to_production == false && inputs.browser_access_readonly != true && inputs.actions_migration_prepare == true &&
          inputs.actions_gate_reopen != true && inputs.actions_old_ingress_quiesced == true &&
          inputs.uu_session_secret_cleanup != true && inputs.uu_cleanup_approved != true }}
    runs-on: ubuntu-latest
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: worker-release-workflow-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact current main without release credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify all Published Workflows paused, all old Runs terminal and all native instances drained (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs preflight
      - name: Block legacy Actions migration preparation with staged destructive 0021
        run: |
          set -euo pipefail
          [[ ! -f apps/workflow-mcp-worker/migrations/0021_retire_uu_session_data.sql ]] ||
            { echo 'Spec774 UU DROP requires its isolated job' >&2; exit 1; }

      - name: Apply existing Workflow D1 migrations and freeze only 0018 admission gate (no release)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 migrations apply workflow-mcp-db --remote)
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "UPDATE cloudflare_action_gate SET state='frozen',changed_at=unixepoch()*1000 WHERE id=1 AND state='open'") > /dev/null
      - name: Independently verify migration, frozen gate and continued quiescence (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs postflight

  workflow-actions-gate-reopen:
    name: Reopen reviewed Workflow Actions gate (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.workflow_code_only != true && inputs.worker == 'workflow-mcp-worker' &&
          inputs.deploy_to_production == false && inputs.browser_access_readonly != true && inputs.actions_migration_prepare != true &&
          inputs.actions_gate_reopen == true && inputs.actions_old_ingress_quiesced == true &&
          inputs.uu_session_secret_cleanup != true && inputs.uu_cleanup_approved != true &&
          inputs.actions_expected_provider_version != '' && inputs.actions_expected_consumer_version != '' &&
          inputs.database_expected_release_sha == '' }}
    runs-on: ubuntu-latest
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: worker-release-workflow-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify exact Secret-free Provider, Consumer deployment and Pin (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_EXPECTED_PROVIDER_VERSION: ${{ inputs.actions_expected_provider_version }}
          ACTIONS_EXPECTED_CONSUMER_VERSION: ${{ inputs.actions_expected_consumer_version }}
        run: |
          node --input-type=module -e '
            import {inspectGateRecovery} from "./scripts/reviewed-actions-provider-pin.mjs";
            const e=process.env;
            await inspectGateRecovery(e.CLOUDFLARE_ACCOUNT_ID,e.CLOUDFLARE_API_TOKEN,
              e.ACTIONS_EXPECTED_PROVIDER_VERSION,e.ACTIONS_EXPECTED_CONSUMER_VERSION);
            console.log("Exact active Bark-only Provider, Consumer and Pin verified; read-only");
          '
      - name: Verify frozen gate, paused Workflows and native drain (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-preflight
      - name: Reopen exactly the existing frozen admission gate (no release)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "UPDATE cloudflare_action_gate SET state='open',changed_at=unixepoch()*1000 WHERE id=1 AND state='frozen'") > /dev/null
      - name: Verify gate open, unchanged paused Workflows and native drain (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-postflight

  checks:
    name: Pre-release checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.deploy_to_production == true ||
       (inputs.browser_access_readonly == true && inputs.worker == 'browser-mcp-worker' && inputs.deploy_to_production == false) ||
       (inputs.uu_cleanup_approved == true && inputs.deploy_to_production == false)) &&
      inputs.actions_migration_prepare != true && inputs.actions_gate_reopen != true }}
    uses: ./.github/workflows/ci.yml
    with:
      worker: ${{ inputs.worker }}

  browser-access-readonly:
    name: Browser Access protected Runner read-only permission proof
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.actor == 'lirtual' && github.ref == 'refs/heads/main' &&
          inputs.worker == 'browser-mcp-worker' && inputs.browser_access_readonly == true &&
          inputs.deploy_to_production == false &&
          inputs.legacy_secret_cleanup_mode == 'none' &&
          inputs.actions_migration_prepare != true && inputs.actions_gate_reopen != true &&
          inputs.uu_session_secret_cleanup != true && inputs.uu_cleanup_approved != true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: browser-mcp-worker
    concurrency:
      group: worker-release-browser-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact main with no publish capability
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Compare Owner email to independent Repository source
        env:
          CANONICAL_OWNER_EMAIL: ${{ needs.checks.outputs.canonical_owner_email }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/check-shared-owner-vars.mjs browser-mcp-worker
      - name: Verify real Runner Organization permission and active Browser identity (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/manual-worker-release.mjs preflight browser-mcp-worker

  deploy:
    name: Manual selected Worker release
    needs: checks
    outputs:
      version_id: ${{ steps.publish.outputs.version_id }}
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' &&
          inputs.deploy_to_production == true &&
          inputs.browser_access_readonly != true &&
          inputs.legacy_secret_cleanup_mode == 'none' &&
          inputs.uu_session_secret_cleanup != true &&
          inputs.uu_cleanup_approved != true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' && inputs.actions_migration_prepare != true && inputs.actions_gate_reopen != true && (inputs.worker == 'raindrop-mcp-worker' ||
           inputs.worker == 'browser-mcp-worker' ||
           inputs.worker == 'ima-mcp-worker' ||
           inputs.worker == 'database-mcp-worker' ||
           inputs.worker == 'ssh-mcp-worker' ||
           inputs.worker == 'remote-control-mcp-worker' ||
           inputs.worker == 'github-actions-mcp-worker' ||
           inputs.worker == 'workflow-mcp-worker') }}
    runs-on: ubuntu-latest
    # A GitHub Environment is a Worker-scoped configuration namespace, not a
    # staging/production selector. Only manual dispatch on main can deploy.
    environment:
      name: ${{ inputs.worker }}
    concurrency:
      group: worker-release-${{ inputs.worker }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # Verify prior checked native completion after 404.
    env:
      SELECTED_WORKER: ${{ inputs.worker }}
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate current trusted main without deployment credentials
        env:
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DATABASE_EXPECTED_RELEASE_SHA: ${{ inputs.database_expected_release_sha }}
          WORKFLOW_CODE_ONLY: ${{ inputs.workflow_code_only }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_ACTOR" == "lirtual" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Manual dispatch source no longer matches main HEAD" >&2
            exit 1
          }
          if [[ "$WORKFLOW_CODE_ONLY" == "true" ]]; then
            [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$ACTIONS_OLD_INGRESS_QUIESCED" != "true" ]] || {
              echo "Code-only release accepts only existing Workflow Worker without admission-gate changes" >&2
              exit 1
            }
          fi
          if [[ "$SELECTED_WORKER" == 'database-mcp-worker' ]]; then
            [[ "$DATABASE_EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$GITHUB_SHA" == "$DATABASE_EXPECTED_RELEASE_SHA" ]] || {
              echo 'Database release source differs from Owner-reviewed SHA' >&2
              exit 1
            }
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Fail-closed RCA idle-grant rollback compatibility check
        if: inputs.worker == 'remote-control-mcp-worker'
        # Explicit release on main only; no additional deployment or state mutation.
        run: node --experimental-strip-types scripts/check-rca-idle-release.mjs

      - name: Stage pinned public Agent source (remote-control release only)
        if: inputs.worker == 'remote-control-mcp-worker'
        run: bash scripts/stage-public-remote-control-agent.sh

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and verify shared Browser extension artifact
        if: inputs.worker == 'browser-mcp-worker'
        run: |
          python3 scripts/build-browser-extension.py --out-dir "$RUNNER_TEMP/browser-extension"
          python3 scripts/stage-browser-distribution.py --artifact-dir "$RUNNER_TEMP/browser-extension" --out-dir apps/browser-mcp-worker/.build/public --require-clean

      - name: Retain Browser ZIP and provenance for separately authorized GitHub Release publication
        if: inputs.worker == 'browser-mcp-worker'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-mcp-extension-${{ github.sha }}
          path: ${{ runner.temp }}/browser-extension/*.zip*
          include-hidden-files: true
          if-no-files-found: error

      - name: Cloudflare release preflight (read-only)
        id: preflight
        env:
          WORKFLOW_CODE_ONLY: ${{ inputs.workflow_code_only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_MCP_PORTAL_CLIENT_ID || '' }}
          WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES || '' }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
        run: node scripts/manual-worker-release.mjs preflight "$SELECTED_WORKER"

      # SSH/Workflow GitHub Environment Secrets now use canonical runtime names.
      # Only the selected Worker stages its canonical Secret, without legacy aliases.
      # Workflow code-only releases use deployed Secrets (read-only inventory),
      # never stage or re-upload their values.
      - name: Compare selected Worker effective Owner identity to Repository source
        if: inputs.worker == 'browser-mcp-worker'
        env:
          CANONICAL_OWNER_EMAIL: ${{ needs.checks.outputs.canonical_owner_email }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/check-shared-owner-vars.mjs "$SELECTED_WORKER"

      - name: Stage selected Worker Secrets for every release
        if: inputs.worker != 'workflow-mcp-worker' || inputs.workflow_code_only != true
        shell: bash
        env:
          # GitHub automatically uses same-name Environment Secrets over
          # Repository Secrets. Values are scoped to this one staging step.
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          SSH_ENCRYPTION_KEY: ${{ inputs.worker == 'ssh-mcp-worker' && secrets.SSH_ENCRYPTION_KEY || '' }}
          ACTIONS_GITHUB_DISPATCH_TOKENS: ${{ secrets.ACTIONS_GITHUB_DISPATCH_TOKENS }}
          WORKFLOW_MCP_PORTAL_CLIENT_SECRET: ${{ inputs.worker == 'workflow-mcp-worker' && secrets.WORKFLOW_MCP_PORTAL_CLIENT_SECRET || '' }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
          DATABASE_B2B_PASSWORD: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_B2B_PASSWORD || '' }}
          DATABASE_SCRAPE_RELAY_PASSWORD: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_SCRAPE_RELAY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/bootstrap-worker-secrets.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-secrets.json"

      - name: Stage approved Worker variables
        shell: bash
        env:
          OWNER_EMAIL: ${{ (inputs.worker == 'browser-mcp-worker') && vars.OWNER_EMAIL || '' }}
          BROWSER_REMEMBERED_IDLE_DAYS: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_REMEMBERED_IDLE_DAYS || '' }}
          RCA_PERMANENT_IDLE_DAYS: ${{ inputs.worker == 'remote-control-mcp-worker' && vars.RCA_PERMANENT_IDLE_DAYS || '' }}
          RAINDROP_RATE_LIMIT_MAX_RETRIES: ${{ vars.RAINDROP_RATE_LIMIT_MAX_RETRIES }}
          IMA_BASE_URL: ${{ vars.IMA_BASE_URL }}
          IMA_CLIENT_ID: ${{ vars.IMA_CLIENT_ID }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_MCP_PORTAL_CLIENT_ID || '' }}
          # The Provider pin is resolved read-only after the existing environment approval,
          # not copied from a potentially stale GitHub Environment variable.
          DATABASE_MAX_ROWS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_ROWS || '' }}
          DATABASE_MAX_RESULT_BYTES: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_RESULT_BYTES || '' }}
          DATABASE_MAX_SCHEMA_BYTES: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_SCHEMA_BYTES || '' }}
          DATABASE_QUERY_TIMEOUT_MS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_QUERY_TIMEOUT_MS || '' }}
          DATABASE_MAX_WRITE_AFFECTED_ROWS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_WRITE_AFFECTED_ROWS || '' }}
          # GitHub reserves GITHUB_* variable names; translate our reviewed
          # GitHub Environment variable into the Worker's runtime binding.
          WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES || '' }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
          DATABASE_B2B_PASSWORD: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_B2B_PASSWORD || '' }}
          DATABASE_SCRAPE_RELAY_PASSWORD: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_SCRAPE_RELAY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/worker-release-variables.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-variables.txt"

