          WORKFLOW_TENTH_TERMINAL_RUN_ID: ${{ steps.terminal_tenth.outputs.tenth_terminal_run_id }}
          WORKFLOW_ELEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_eleventh.outputs.eleventh_terminal_run_id }}
          WORKFLOW_TWELFTH_TERMINAL_RUN_ID: ${{ steps.terminal_twelfth.outputs.twelfth_terminal_run_id }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command \
            "SELECT
             (SELECT count(*) FROM d1_migrations) AS migration_count,
             (SELECT count(*) FROM d1_migrations WHERE name='0001_s1.sql') AS migration_v1,
             (SELECT count(*) FROM d1_migrations WHERE name='0002_native_complete_seen.sql') AS migration_v2,
             (SELECT count(*) FROM d1_migrations WHERE name='0003_s3_attempt_claim.sql') AS migration_v3,
             (SELECT count(*) FROM d1_migrations WHERE name='0004_s3_callback_receipts.sql') AS migration_v4,
             (SELECT count(*) FROM d1_migrations WHERE name='0005_github_workflow_check.sql') AS migration_v5,
             (SELECT count(*) FROM d1_migrations WHERE name='0006_action_attempt_capabilities.sql') AS migration_v6,
             (SELECT count(*) FROM d1_migrations WHERE name='0007_session_executions.sql') AS migration_v7,
             (SELECT count(*) FROM d1_migrations WHERE name='0008_session_locator.sql') AS migration_v8,
              (SELECT count(*) FROM d1_migrations WHERE name='0009_fixed_sessions.sql') AS migration_v9,
              (SELECT count(*) FROM d1_migrations WHERE name='0010_session_runtime_data.sql') AS migration_v10,
             (SELECT count(*) FROM d1_migrations WHERE name='0011_awaited_child_capacity.sql') AS migration_v11,
             (SELECT count(*) FROM d1_migrations WHERE name='0012_event_wait_receipts.sql') AS migration_v12,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='wait_event_receipts') AS event_receipts_table,
             (SELECT count(*) FROM d1_migrations WHERE name='0013_cloudflare_action_invocations.sql') AS migration_v13,
              (SELECT count(*) FROM d1_migrations WHERE name='0014_workflow_deletion.sql') AS migration_v14,
              (SELECT count(*) FROM d1_migrations WHERE name='0015_runtime_approval.sql') AS migration_v15,
              (SELECT count(*) FROM d1_migrations WHERE name='0016_portal_connection_revocation.sql') AS migration_v16,
              (SELECT count(*) FROM d1_migrations WHERE name='0017_http_connection_auth.sql') AS migration_v17,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='http_connection_auth') AS http_auth_table,
              (SELECT count(*) FROM d1_migrations WHERE name='0018_cloudflare_action_migration_fence.sql') AS migration_v18,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_gate') AS cloudflare_gate_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='portal_connection_auth') AS portal_auth_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='mcp_dispatch_fences') AS mcp_fence_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approval_gates') AS approval_gates_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approvals') AS approvals_table,
              (SELECT count(*) FROM pragma_table_info('workflows') WHERE name='deleted_at') AS deleted_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_invocations') AS invocations_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_cancellations') AS cloudflare_cancel_table,
             (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='session_url') AS locator_column,
              (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='fixed_key') AS fixed_column,
              (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='session_active_fixed_keys') AS fixed_index,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_runtime_data') AS runtime_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='capacity_weight') AS capacity_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_run_id') AS parent_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_step_id') AS parent_step_column,
             (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='runs_one_awaited_child_per_step') AS child_index,
             (SELECT count(*) FROM sqlite_master WHERE type='trigger'
               AND name='runs_top_level_capacity_guard') AS capacity_guard_trigger,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='child_cancellations') AS child_cancel_table,
             (SELECT count(*) FROM pragma_table_info('child_cancellations') WHERE name='termination_attempted_at') AS child_terminate_fence_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_executions') AS session_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='github_action_cancellations') AS cancellation_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='step_attempts') AS attempt_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='callback_receipts') AS receipt_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='native_complete_seen_at') AS native_column,
             (SELECT count(*) FROM runs WHERE outcome NOT IN ('succeeded','failed','cancelled') AND id <> '$WORKFLOW_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SECOND_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_THIRD_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FOURTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FIFTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SIXTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SEVENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_EIGHTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_NINTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_TENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_ELEVENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_TWELFTH_TERMINAL_RUN_ID') AS active_runs,
              (SELECT count(*) FROM session_executions WHERE state != 'terminated') AS active_sessions,
             (SELECT count(*) FROM runs) AS run_count,
             (SELECT count(*) FROM workflows) AS workflow_count") |
            node scripts/manual-worker-release.mjs d1-check workflow-mcp-worker

      # Only the existing production release lock and GitHub Environment can
      # apply the reviewed Action capability and Session lifecycle migrations. This changes the
      # schema without changing any running instance.
      - name: Apply complete Workflow D1 migrations
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_REQUIRE_COMPLETE_SCHEMA: 'true'
          WORKFLOW_TERMINAL_RUN_ID: ${{ steps.terminal.outputs.terminal_run_id }}
          WORKFLOW_SECOND_TERMINAL_RUN_ID: ${{ steps.terminal_second.outputs.second_terminal_run_id }}
          WORKFLOW_THIRD_TERMINAL_RUN_ID: ${{ steps.terminal_third.outputs.third_terminal_run_id }}
          WORKFLOW_FOURTH_TERMINAL_RUN_ID: ${{ steps.terminal_fourth.outputs.fourth_terminal_run_id }}
          WORKFLOW_FIFTH_TERMINAL_RUN_ID: ${{ steps.terminal_fifth.outputs.fifth_terminal_run_id }}
          WORKFLOW_SIXTH_TERMINAL_RUN_ID: ${{ steps.terminal_sixth.outputs.sixth_terminal_run_id }}
          WORKFLOW_SEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_seventh.outputs.seventh_terminal_run_id }}
          WORKFLOW_EIGHTH_TERMINAL_RUN_ID: ${{ steps.terminal_eighth.outputs.eighth_terminal_run_id }}
          WORKFLOW_NINTH_TERMINAL_RUN_ID: ${{ steps.terminal_ninth.outputs.ninth_terminal_run_id }}
          WORKFLOW_TENTH_TERMINAL_RUN_ID: ${{ steps.terminal_tenth.outputs.tenth_terminal_run_id }}
          WORKFLOW_ELEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_eleventh.outputs.eleventh_terminal_run_id }}
          WORKFLOW_TWELFTH_TERMINAL_RUN_ID: ${{ steps.terminal_twelfth.outputs.twelfth_terminal_run_id }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 migrations apply workflow-mcp-db --remote)
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "SELECT
              (SELECT count(*) FROM d1_migrations) AS migration_count,
              (SELECT count(*) FROM d1_migrations WHERE name='0001_s1.sql') AS migration_v1,
              (SELECT count(*) FROM d1_migrations WHERE name='0002_native_complete_seen.sql') AS migration_v2,
              (SELECT count(*) FROM d1_migrations WHERE name='0003_s3_attempt_claim.sql') AS migration_v3,
              (SELECT count(*) FROM d1_migrations WHERE name='0004_s3_callback_receipts.sql') AS migration_v4,
             (SELECT count(*) FROM d1_migrations WHERE name='0005_github_workflow_check.sql') AS migration_v5,
             (SELECT count(*) FROM d1_migrations WHERE name='0006_action_attempt_capabilities.sql') AS migration_v6,
             (SELECT count(*) FROM d1_migrations WHERE name='0007_session_executions.sql') AS migration_v7,
             (SELECT count(*) FROM d1_migrations WHERE name='0008_session_locator.sql') AS migration_v8,
              (SELECT count(*) FROM d1_migrations WHERE name='0009_fixed_sessions.sql') AS migration_v9,
              (SELECT count(*) FROM d1_migrations WHERE name='0010_session_runtime_data.sql') AS migration_v10,
             (SELECT count(*) FROM d1_migrations WHERE name='0011_awaited_child_capacity.sql') AS migration_v11,
             (SELECT count(*) FROM d1_migrations WHERE name='0012_event_wait_receipts.sql') AS migration_v12,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='wait_event_receipts') AS event_receipts_table,
             (SELECT count(*) FROM d1_migrations WHERE name='0013_cloudflare_action_invocations.sql') AS migration_v13,
              (SELECT count(*) FROM d1_migrations WHERE name='0014_workflow_deletion.sql') AS migration_v14,
              (SELECT count(*) FROM d1_migrations WHERE name='0015_runtime_approval.sql') AS migration_v15,
              (SELECT count(*) FROM d1_migrations WHERE name='0016_portal_connection_revocation.sql') AS migration_v16,
              (SELECT count(*) FROM d1_migrations WHERE name='0017_http_connection_auth.sql') AS migration_v17,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='http_connection_auth') AS http_auth_table,
              (SELECT count(*) FROM d1_migrations WHERE name='0018_cloudflare_action_migration_fence.sql') AS migration_v18,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_gate') AS cloudflare_gate_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='portal_connection_auth') AS portal_auth_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='mcp_dispatch_fences') AS mcp_fence_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approval_gates') AS approval_gates_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approvals') AS approvals_table,
              (SELECT count(*) FROM pragma_table_info('workflows') WHERE name='deleted_at') AS deleted_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_invocations') AS invocations_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_cancellations') AS cloudflare_cancel_table,
             (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='session_url') AS locator_column,
              (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='fixed_key') AS fixed_column,
              (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='session_active_fixed_keys') AS fixed_index,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_runtime_data') AS runtime_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='capacity_weight') AS capacity_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_run_id') AS parent_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_step_id') AS parent_step_column,
             (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='runs_one_awaited_child_per_step') AS child_index,
             (SELECT count(*) FROM sqlite_master WHERE type='trigger'
               AND name='runs_top_level_capacity_guard') AS capacity_guard_trigger,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='child_cancellations') AS child_cancel_table,
             (SELECT count(*) FROM pragma_table_info('child_cancellations') WHERE name='termination_attempted_at') AS child_terminate_fence_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_executions') AS session_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='github_action_cancellations') AS cancellation_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='step_attempts') AS attempt_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='callback_receipts') AS receipt_table,
              (SELECT count(*) FROM pragma_table_info('runs') WHERE name='native_complete_seen_at') AS native_column,
              (SELECT count(*) FROM runs WHERE outcome NOT IN ('succeeded','failed','cancelled') AND id <> '$WORKFLOW_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SECOND_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_THIRD_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FOURTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FIFTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SIXTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SEVENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_EIGHTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_NINTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_TENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_ELEVENTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_TWELFTH_TERMINAL_RUN_ID') AS active_runs,
              (SELECT count(*) FROM session_executions WHERE state != 'terminated') AS active_sessions,
              (SELECT count(*) FROM runs) AS run_count,
              (SELECT count(*) FROM workflows) AS workflow_count") |
            node scripts/manual-worker-release.mjs d1-check workflow-mcp-worker

      - name: Verify code-only Workflow D1 gate at publication (Ready Sessions preserved)
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_TERMINAL_RUN_ID: ${{ steps.terminal.outputs.terminal_run_id }}
          WORKFLOW_SECOND_TERMINAL_RUN_ID: ${{ steps.terminal_second.outputs.second_terminal_run_id }}
          WORKFLOW_THIRD_TERMINAL_RUN_ID: ${{ steps.terminal_third.outputs.third_terminal_run_id }}
          WORKFLOW_FOURTH_TERMINAL_RUN_ID: ${{ steps.terminal_fourth.outputs.fourth_terminal_run_id }}
          WORKFLOW_FIFTH_TERMINAL_RUN_ID: ${{ steps.terminal_fifth.outputs.fifth_terminal_run_id }}
          WORKFLOW_SIXTH_TERMINAL_RUN_ID: ${{ steps.terminal_sixth.outputs.sixth_terminal_run_id }}
          WORKFLOW_SEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_seventh.outputs.seventh_terminal_run_id }}
          WORKFLOW_EIGHTH_TERMINAL_RUN_ID: ${{ steps.terminal_eighth.outputs.eighth_terminal_run_id }}
          WORKFLOW_NINTH_TERMINAL_RUN_ID: ${{ steps.terminal_ninth.outputs.ninth_terminal_run_id }}
          WORKFLOW_TENTH_TERMINAL_RUN_ID: ${{ steps.terminal_tenth.outputs.tenth_terminal_run_id }}
          WORKFLOW_ELEVENTH_TERMINAL_RUN_ID: ${{ steps.terminal_eleventh.outputs.eleventh_terminal_run_id }}
          WORKFLOW_TWELFTH_TERMINAL_RUN_ID: ${{ steps.terminal_twelfth.outputs.twelfth_terminal_run_id }}
        run: |
          set -euo pipefail
          query="$(node scripts/manual-worker-release.mjs migration-sql workflow-mcp-worker)"
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "$query") |
            node scripts/manual-worker-release.mjs code-release-check workflow-mcp-worker

      # Strictly read-only. A selected Database release cannot proceed if the
      # approved D1 schema is missing; migration/import are separate actions.
      - name: Verify Database D1 schema and fresh registry before publication (read-only)
        if: inputs.worker == 'database-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          query="$(node scripts/manual-worker-release.mjs database-d1-sql database-mcp-worker)"
          (cd apps/database-mcp-worker &&
            pnpm exec wrangler d1 execute database-mcp-registry --remote --json --command "$query") |
            node scripts/manual-worker-release.mjs database-d1-check database-mcp-worker

      - name: Verify fresh Database D1 and existing registry (read-only)
        if: inputs.worker == 'database-mcp-worker'
        env:
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          DATABASE_KEY_ID: ${{ vars.DATABASE_KEY_ID }}
          DATABASE_ENCRYPTION_PREVIOUS_KEY: ${{ secrets.DATABASE_ENCRYPTION_PREVIOUS_KEY }}
          DATABASE_PREVIOUS_KEY_ID: ${{ vars.DATABASE_PREVIOUS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/database-fresh-readiness-344.mjs

      # Read-only Hyperdrive API check against immutable reviewed source.
      # Never log the response body (origin identity may be sensitive).
      - name: Verify Database Hyperdrive TLS, CA, origin and cache before publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-database-hyperdrive.mjs

      # Read-only Access inventory. Do not publish an Owner configuration page
      # unless Cloudflare already enforces the exact-domain, exact-email policy.
      - name: Verify Database Owner Access policy before publication (read-only)
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/database-owner-access.mjs

      # Exercise the exact GitHub Environment PAT on the real GitHub API before
      # publishing the Database Worker. One no-deploy workflow_dispatch is safe:
      # all mutating jobs are skipped, so this cannot recurse or alter databases.
      # This prevents a Secret-presence-only CI pass masking 403 permissions.
      - name: Verify Database Owner GitHub Actions dispatch before publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          DATABASE_GITHUB_ACTIONS_TOKEN: ${{ secrets.DATABASE_GITHUB_ACTIONS_TOKEN }}
        run: node scripts/probe-database-github-dispatch.mjs

      - name: Verify Browser Unknown Review and Profile Activation Access (read-only)
        if: inputs.worker == 'browser-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BROWSER_APPROVAL_ORIGIN: ${{ vars.BROWSER_APPROVAL_ORIGIN }}
          BROWSER_ACCESS_ISSUER: ${{ vars.BROWSER_ACCESS_ISSUER }}
          BROWSER_ACCESS_AUDIENCE: ${{ vars.BROWSER_ACCESS_AUDIENCE }}
          BROWSER_OWNER_EMAIL: ${{ vars.BROWSER_OWNER_EMAIL }}
          BROWSER_APPROVAL_ISOLATION: ${{ vars.BROWSER_APPROVAL_ISOLATION }}
          BROWSER_ACTIVATION_AUDIENCE: ${{ vars.BROWSER_ACTIVATION_AUDIENCE }}
          BROWSER_ACTIVATION_ORIGIN: ${{ vars.BROWSER_ACTIVATION_ORIGIN }}
        run: node scripts/browser-owner-access.mjs

      - name: Recheck unified Actions Worker before Workflow publication (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs recheck

      # Read-only release gate; the old native instance admission MUST be
      # independently quiesced before binding switch. Frozen D1 alone is insufficient.
      - name: Verify unified Actions binding transition (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command               "SELECT (SELECT state FROM cloudflare_action_gate WHERE id=1) AS gate_state") |
            node scripts/actions-consumer-cutover-gate.mjs

      - name: Publish exactly selected Worker
        id: publish
        shell: bash
        env:
          DATABASE_EXPECTED_RELEASE_SHA: ${{ inputs.database_expected_release_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          if [[ "$SELECTED_WORKER" == 'database-mcp-worker' ]]; then
            [[ "$DATABASE_EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$GITHUB_SHA" == "$DATABASE_EXPECTED_RELEASE_SHA" ]]
          fi
          case "$SELECTED_WORKER" in
            browser-mcp-worker|raindrop-mcp-worker|ima-mcp-worker|database-mcp-worker|ssh-mcp-worker|remote-control-mcp-worker|github-actions-mcp-worker|http-mcp-worker|workflow-mcp-worker) ;;
            *) echo "Invalid Worker target" >&2; exit 1 ;;
          esac
          log="$(mktemp)"
          chmod 600 "$log"
          cleanup() {
            rm -f "$log"
          }
          trap cleanup EXIT
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale immediately before publication" >&2
            exit 1
          }
          # Fail closed if any selected Worker Secret is absent. Wrangler
          # atomically uploads the staged values with the selected deployment,
          # including existing Workers; unspecified secrets are preserved.
          test -s "$RUNNER_TEMP/mcp-worker-secrets.json"
          deploy_args=(--secrets-file "$RUNNER_TEMP/mcp-worker-secrets.json")
          test -f "$RUNNER_TEMP/mcp-worker-variables.txt"
          while IFS= read -r variable_pair; do
            deploy_args+=(--var "$variable_pair")
          done < "$RUNNER_TEMP/mcp-worker-variables.txt"
          if ! (cd "apps/$SELECTED_WORKER" && pnpm exec wrangler deploy "${deploy_args[@]}") >"$log" 2>&1; then
            echo "Wrangler deploy failed (stage=deploy); no automated rollback attempted" >&2
            # Report only a whitelisted error code and a bounded, sanitized summary.
            # Never print raw Wrangler output (may contain secrets or configuration).
            node scripts/manual-worker-release.mjs diagnostic "$log"
            exit 1
          fi
          deployed_version="$(node scripts/manual-worker-release.mjs version "$log")"
          echo "version_id=$deployed_version" >> "$GITHUB_OUTPUT"
          echo "Wrangler reported a version ID; verifying Cloudflare active deployment next"

      - name: Remove temporary deployment configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mcp-worker-secrets.json" "$RUNNER_TEMP/mcp-worker-variables.txt"

      - name: Verify exact active version and required production bindings
        env:
          HTTP_CREDENTIALS_JSON: ${{ inputs.worker == 'http-mcp-worker' && secrets.HTTP_CREDENTIALS_JSON || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_VERSION_ID: ${{ steps.publish.outputs.version_id }}
          BROWSER_APPROVAL_EXPECTED: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_APPROVAL_ISOLATION || '' }}
          BROWSER_ACTIVATION_EXPECTED: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_ACTIVATION_AUDIENCE || '' }}
        run: node scripts/manual-worker-release.mjs readback "$SELECTED_WORKER"

      - name: Verify Workflow pin matches deployed Actions Worker (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs postflight

      # First transition only. Do not reopen admission until the active
      # Consumer version, single Actions Service Binding and Provider pin
      # have already been independently read back; all plans remain paused.
      - name: Verify frozen Action gate and paused unified runtime before activation (read-only)
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_old_ingress_quiesced == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-preflight

      - name: Reopen only the now-verified unified Action admission gate
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_old_ingress_quiesced == true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command               "UPDATE cloudflare_action_gate SET state='open',changed_at=unixepoch()*1000 WHERE id=1 AND state='frozen'") > /dev/null

      - name: Verify only unified admission reopened and all Workflow plans still paused (read-only)
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_old_ingress_quiesced == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_OLD_INGRESS_QUIESCED: ${{ inputs.actions_old_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-postflight

      - name: Remove temporary Actions pin proof
        if: always() && inputs.worker == 'workflow-mcp-worker'
        run: rm -f "$RUNNER_TEMP/actions-provider-version.txt"

      - name: Verify Database Hyperdrive TLS, CA, origin and cache after publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-database-hyperdrive.mjs

      - name: Check existing public health endpoint
        if: inputs.worker == 'ima-mcp-worker' || inputs.worker == 'raindrop-mcp-worker' || inputs.worker == 'workflow-mcp-worker' || inputs.worker == 'http-mcp-worker'
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          health_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/health"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            health_endpoint="https://workflow.lirtual.dpdns.org/health"
          fi
          max_attempts=1
          if [[ ("$SELECTED_WORKER" == "workflow-mcp-worker" || "$SELECTED_WORKER" == "http-mcp-worker") && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' "$health_endpoint")"
            if [[ "$status" == 404 && "$attempt" -lt "$max_attempts" ]]; then
              sleep 5
              continue
            fi
            break
          done
          [[ "$status" == "200" ]] || { echo "Health check failed (HTTP $status)" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const worker = process.argv[2];
            if (!body || ((worker === "http-mcp-worker") ? (body.ok !== true || body.service !== worker) : worker === "workflow-mcp-worker" ? (body.ok !== true || body.scope !== "workflow" || body.service !== "workflow-mcp-worker") : worker === "ima-mcp-worker" ? body.ok !== true : body.status !== "healthy")) process.exit(1);
          ' "$response" "$SELECTED_WORKER" || { echo "Health check failed (invalid response)" >&2; exit 1; }
          echo "Existing health endpoint verified (HTTP 200)"

      - name: Check unauthenticated MCP surface without credentials
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          # A new Workers.dev hostname may briefly return 404 after the first publish.
          # Do not retry any non-404 status or hide a persistent routing failure.
          max_attempts=1
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          if [[ ("$SELECTED_WORKER" == "http-mcp-worker") && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          if [[ "$SELECTED_WORKER" == "github-actions-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          mcp_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/mcp"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            mcp_endpoint="https://workflow.lirtual.dpdns.org/mcp"
          elif [[ "$SELECTED_WORKER" == "browser-mcp-worker" ]]; then
            mcp_endpoint="https://browser.lirtual.dpdns.org/mcp"
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              "$mcp_endpoint")"
            case "$status" in
              401|403)
                echo "Unauthenticated MCP request denied (HTTP $status); human Portal acceptance still required"
                exit 0
                ;;
              404)
                if ((attempt < max_attempts)); then
                  echo "New Workers.dev route not yet visible (HTTP 404; attempt $attempt/$max_attempts)"
                  sleep 5
                  continue
                fi
                ;;
            esac
            echo "Unexpected unauthenticated MCP status: $status" >&2
            exit 1
          done

      - name: Register production HTTP MCP with existing One-MCP Portal
        if: inputs.worker == 'http-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-http-portal.mjs

      - name: Register production Browser MCP with existing One-MCP Portal
        if: inputs.worker == 'browser-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-browser-portal.mjs

  database-hyperdrive-finalize:
    name: Verify published Hyperdrive and hand off disabled D1 reference
    needs: deploy
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.deploy_to_production == true && needs.deploy.result == 'success' &&
          inputs.database_hyperdrive_apply_id != '' && inputs.database_expected_release_sha != '' &&
          inputs.database_hyperdrive_prepare_id == '' && inputs.database_hyperdrive_enable_approved != true &&
          inputs.database_hyperdrive_retire_approved != true && inputs.database_hyperdrive_id == '' &&
          inputs.database_hyperdrive_revision == '' && inputs.database_hyperdrive_rotation_mode == '' }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile exact published version before disabled handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_HYPERDRIVE_OPERATION_ID: ${{ inputs.database_hyperdrive_apply_id }}
          DATABASE_EXPECTED_RELEASE_SHA: ${{ inputs.database_expected_release_sha }}
          EXPECTED_VERSION_ID: ${{ needs.deploy.outputs.version_id }}
          DATABASE_RELEASE_ENVIRONMENT: database-mcp-worker
        run: node scripts/finalize-database-hyperdrive-476.mjs
