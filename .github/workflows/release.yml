name: Release Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Select Worker to deploy to production
        required: true
        type: choice
        options:
          - browser-mcp-worker
          - mcp-gateway-worker
          - database-mcp-worker
          - ima-mcp-worker
          - raindrop-mcp-worker
          - ssh-mcp-worker
          - remote-control-mcp-worker
          - github-actions-mcp-worker
          - workflow-mcp-worker
      database_expected_release_sha:
        description: 'Database production release: exact Owner-reviewed main commit SHA'
        required: false
        type: string
        default: ''
      actions_gate_freeze:
        description: 'Freeze the existing Workflow Actions gate, without Worker deployment or schema migration'
        type: boolean
        required: false
        default: false
      actions_gate_reopen:
        description: 'Spec #54: reopen the existing frozen Actions admission gate without Worker release'
        type: boolean
        required: false
        default: false
      actions_expected_provider_version:
        description: 'Gate-only recovery: exact reviewed live unified Provider version'
        type: string
        required: false
        default: ''
      actions_expected_consumer_version:
        description: 'Gate-only recovery: exact reviewed live Consumer version'
        type: string
        required: false
        default: ''
      actions_ingress_quiesced:
        description: Owner verified Workflow admissions are stopped independently for maintenance (not a technical substitute)
        type: boolean
        required: false
        default: false
      workflow_code_only:
        description: 'Workflow Worker only: deploy code and approved Portal endpoint pin; preserve other Variables/Secrets, no D1 migrations or secret upload'
        required: false
        type: boolean
        default: false
      browser_access_readonly:
        description: 'Spec804: Browser-only read-only release Runner permission and active identity preflight; never publishes'
        required: false
        type: boolean
        default: false
      deploy_to_production:
        description: Explicit approval to publish exactly the selected Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  workflow-actions-gate-freeze:
    name: Freeze existing Workflow Actions gate (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.workflow_code_only != true && inputs.worker == 'workflow-mcp-worker' &&
          inputs.deploy_to_production == false && inputs.browser_access_readonly != true && inputs.actions_gate_freeze == true &&
          inputs.actions_gate_reopen != true && inputs.actions_ingress_quiesced == true }}
    runs-on: ubuntu-latest
    concurrency:
      group: worker-release-workflow-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact current main without release credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify all Published Workflows paused, all old Runs terminal and all native instances drained (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs preflight
      - name: Verify strict Workflow execution drain before gate freeze (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/manual-worker-release.mjs workflow-freeze-check workflow-mcp-worker

      - name: Freeze only the existing Actions admission gate (no release or migration)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "UPDATE cloudflare_action_gate SET state='frozen',changed_at=unixepoch()*1000 WHERE id=1 AND state='open'") > /dev/null
      - name: Independently verify frozen gate and continued quiescence (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs postflight

  workflow-actions-gate-reopen:
    name: Reopen reviewed Workflow Actions gate (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.workflow_code_only != true && inputs.worker == 'workflow-mcp-worker' &&
          inputs.deploy_to_production == false && inputs.browser_access_readonly != true && inputs.actions_gate_freeze != true &&
          inputs.actions_gate_reopen == true && inputs.actions_ingress_quiesced == true &&
          inputs.actions_expected_provider_version != '' && inputs.actions_expected_consumer_version != '' &&
          inputs.database_expected_release_sha == '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: worker-release-workflow-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify exact Secret-free Provider, Consumer deployment and Pin (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_EXPECTED_PROVIDER_VERSION: ${{ inputs.actions_expected_provider_version }}
          ACTIONS_EXPECTED_CONSUMER_VERSION: ${{ inputs.actions_expected_consumer_version }}
        run: |
          node --input-type=module -e '
            import {inspectGateRecovery} from "./scripts/reviewed-actions-provider-pin.mjs";
            const e=process.env;
            await inspectGateRecovery(e.CLOUDFLARE_ACCOUNT_ID,e.CLOUDFLARE_API_TOKEN,
              e.ACTIONS_EXPECTED_PROVIDER_VERSION,e.ACTIONS_EXPECTED_CONSUMER_VERSION);
            console.log("Exact active unified Provider, v23 Consumer and authentication boundary verified; read-only");
          '
      - name: Verify frozen gate, paused Workflows and native drain (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-preflight
      - name: Verify strict v23 execution readiness before gate-only recovery (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: node scripts/manual-worker-release.mjs workflow-check workflow-mcp-worker

      - name: Reopen exactly the existing frozen admission gate (no release)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "UPDATE cloudflare_action_gate SET state='open',changed_at=unixepoch()*1000 WHERE id=1 AND state='frozen'") > /dev/null
      - name: Verify gate open, unchanged paused Workflows and native drain (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-postflight

  checks:
    name: Pre-release checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.deploy_to_production == true ||
       (inputs.browser_access_readonly == true && inputs.worker == 'browser-mcp-worker' && inputs.deploy_to_production == false)) &&
      inputs.actions_gate_freeze != true && inputs.actions_gate_reopen != true }}
    uses: ./.github/workflows/ci.yml
    with:
      worker: ${{ inputs.worker }}

  browser-access-readonly:
    name: Browser Access protected Runner read-only permission proof
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.actor == 'lirtual' && github.ref == 'refs/heads/main' &&
          inputs.worker == 'browser-mcp-worker' && inputs.browser_access_readonly == true &&
          inputs.deploy_to_production == false &&
          inputs.actions_gate_freeze != true && inputs.actions_gate_reopen != true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: worker-release-browser-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact main with no publish capability
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Compare Owner email to independent Repository source
        env:
          CANONICAL_OWNER_EMAIL: ${{ needs.checks.outputs.canonical_owner_email }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/check-shared-owner-vars.mjs browser-mcp-worker
      - name: Verify real Runner Organization permission and active Browser identity (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/manual-worker-release.mjs preflight browser-mcp-worker

  deploy:
    name: Manual selected Worker release
    needs: checks
    outputs:
      version_id: ${{ steps.publish.outputs.version_id }}
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' &&
          inputs.deploy_to_production == true &&
          inputs.browser_access_readonly != true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' && inputs.actions_gate_freeze != true && inputs.actions_gate_reopen != true && (inputs.worker == 'raindrop-mcp-worker' ||
           inputs.worker == 'mcp-gateway-worker' ||
           inputs.worker == 'browser-mcp-worker' ||
           inputs.worker == 'ima-mcp-worker' ||
           inputs.worker == 'database-mcp-worker' ||
           inputs.worker == 'ssh-mcp-worker' ||
           inputs.worker == 'remote-control-mcp-worker' ||
           inputs.worker == 'github-actions-mcp-worker' ||
           inputs.worker == 'workflow-mcp-worker') }}
    runs-on: ubuntu-latest
    # Only reviewed manual dispatch on main can publish the selected Worker.
    concurrency:
      group: worker-release-${{ inputs.worker }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # Verify prior checked native completion after 404.
    env:
      SELECTED_WORKER: ${{ inputs.worker }}
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate current trusted main without deployment credentials
        env:
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DATABASE_EXPECTED_RELEASE_SHA: ${{ inputs.database_expected_release_sha }}
          WORKFLOW_CODE_ONLY: ${{ inputs.workflow_code_only }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_ACTOR" == "lirtual" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Manual dispatch source no longer matches main HEAD" >&2
            exit 1
          }
          if [[ "$WORKFLOW_CODE_ONLY" == "true" ]]; then
            [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$ACTIONS_INGRESS_QUIESCED" != "true" ]] || {
              echo "Code-only release accepts only existing Workflow Worker without admission-gate changes" >&2
              exit 1
            }
          fi
          if [[ "$SELECTED_WORKER" == 'database-mcp-worker' ]]; then
            [[ "$DATABASE_EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$GITHUB_SHA" == "$DATABASE_EXPECTED_RELEASE_SHA" ]] || {
              echo 'Database release source differs from Owner-reviewed SHA' >&2
              exit 1
            }
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Fail-closed RCA idle-grant rollback compatibility check
        if: inputs.worker == 'remote-control-mcp-worker'
        # Explicit release on main only; no additional deployment or state mutation.
        run: node --experimental-strip-types scripts/check-rca-idle-release.mjs

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and verify shared Browser extension artifact
        if: inputs.worker == 'browser-mcp-worker'
        run: |
          python3 scripts/build-browser-extension.py --out-dir "$RUNNER_TEMP/browser-extension"
          python3 scripts/stage-browser-distribution.py --artifact-dir "$RUNNER_TEMP/browser-extension" --out-dir apps/browser-mcp-worker/.build/public --require-clean

      - name: Retain Browser ZIP and provenance for separately authorized GitHub Release publication
        if: inputs.worker == 'browser-mcp-worker'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-mcp-extension-${{ github.sha }}
          path: ${{ runner.temp }}/browser-extension/*.zip*
          include-hidden-files: true
          if-no-files-found: error

      - name: Cloudflare release preflight (read-only)
        id: preflight
        env:
          WORKFLOW_CODE_ONLY: ${{ inputs.workflow_code_only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_MCP_PORTAL_CLIENT_ID || '' }}
          WORKFLOW_GITHUB_ACTION_REPOSITORY: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_GITHUB_ACTION_REPOSITORY || '' }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ inputs.worker == 'workflow-mcp-worker' && secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN || '' }}
          CANONICAL_WORKFLOW_EXECUTOR_REPOSITORY: ${{ needs.checks.outputs.canonical_workflow_executor_repository }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
        run: node scripts/manual-worker-release.mjs preflight "$SELECTED_WORKER"

      # SSH/Workflow Repository Secrets use canonical runtime binding names.
      # Only the selected Worker stages its canonical Secret, without legacy aliases.
      # Workflow code-only releases use deployed Secrets (read-only inventory),
      # never stage or re-upload their values.
      - name: Compare selected Worker effective Owner identity to Repository source
        if: inputs.worker == 'browser-mcp-worker'
        env:
          CANONICAL_OWNER_EMAIL: ${{ needs.checks.outputs.canonical_owner_email }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/check-shared-owner-vars.mjs "$SELECTED_WORKER"

      - name: Stage selected Worker Secrets for every release
        if: inputs.worker != 'workflow-mcp-worker' || inputs.workflow_code_only != true
        shell: bash
        env:
          # Repository Secrets and Variables are staged only for the selected Worker.
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          RAINDROP_ACCESS_TOKEN: ${{ inputs.worker == 'raindrop-mcp-worker' && secrets.RAINDROP_ACCESS_TOKEN || '' }}
          CLERK_SECRET_KEY: ${{ inputs.worker == 'mcp-gateway-worker' && secrets.CLERK_SECRET_KEY || '' }}
          MCP_GATEWAY_PORTAL_CLIENT_SECRET: ${{ inputs.worker == 'mcp-gateway-worker' && secrets.MCP_GATEWAY_PORTAL_CLIENT_SECRET || '' }}
          IMA_API_KEY: ${{ inputs.worker == 'ima-mcp-worker' && secrets.IMA_API_KEY || '' }}
          SSH_ENCRYPTION_KEY: ${{ inputs.worker == 'ssh-mcp-worker' && secrets.SSH_ENCRYPTION_KEY || '' }}
          ACTIONS_GITHUB_DISPATCH_TOKENS: ${{ inputs.worker == 'github-actions-mcp-worker' && secrets.ACTIONS_GITHUB_DISPATCH_TOKENS || '' }}
          WORKFLOW_MCP_PORTAL_CLIENT_SECRET: ${{ inputs.worker == 'workflow-mcp-worker' && secrets.WORKFLOW_MCP_PORTAL_CLIENT_SECRET || '' }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ inputs.worker == 'workflow-mcp-worker' && secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN || '' }}
          WORKFLOW_GITHUB_DROP_PUBLIC_KEY: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_GITHUB_DROP_PUBLIC_KEY || '' }}
          WORKFLOW_GITHUB_DROP_RECEIPT_PRIVATE_KEY: ${{ inputs.worker == 'workflow-mcp-worker' && secrets.WORKFLOW_GITHUB_DROP_RECEIPT_PRIVATE_KEY || '' }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
          DATABASE_B2B_PASSWORD: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_B2B_PASSWORD || '' }}
          DATABASE_SCRAPE_RELAY_PASSWORD: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_SCRAPE_RELAY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/bootstrap-worker-secrets.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-secrets.json"

      - name: Stage approved Worker variables
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ (inputs.worker == 'browser-mcp-worker') && vars.OWNER_EMAIL || '' }}
          BROWSER_REMEMBERED_IDLE_DAYS: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_REMEMBERED_IDLE_DAYS || '' }}
          RCA_PERMANENT_IDLE_DAYS: ${{ inputs.worker == 'remote-control-mcp-worker' && vars.RCA_PERMANENT_IDLE_DAYS || '' }}
          RAINDROP_RATE_LIMIT_MAX_RETRIES: ${{ vars.RAINDROP_RATE_LIMIT_MAX_RETRIES }}
          CLERK_PILOT_PUBLISHABLE_KEY: ${{ (inputs.worker == 'mcp-gateway-worker' || inputs.worker == 'remote-control-mcp-worker') && vars.CLERK_PILOT_PUBLISHABLE_KEY || '' }}
          CLERK_PILOT_OWNER_USER_ID: ${{ (inputs.worker == 'mcp-gateway-worker' || inputs.worker == 'remote-control-mcp-worker') && vars.CLERK_PILOT_OWNER_USER_ID || '' }}
          CLERK_PILOT_ISSUER: ${{ (inputs.worker == 'mcp-gateway-worker' || inputs.worker == 'remote-control-mcp-worker') && vars.CLERK_PILOT_ISSUER || '' }}
          IMA_BASE_URL: ${{ vars.IMA_BASE_URL }}
          IMA_CLIENT_ID: ${{ vars.IMA_CLIENT_ID }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_MCP_PORTAL_CLIENT_ID || '' }}
          MCP_GATEWAY_PORTAL_CLIENT_ID: ${{ inputs.worker == 'mcp-gateway-worker' && vars.MCP_GATEWAY_PORTAL_CLIENT_ID || '' }}
          # The Provider pin is resolved read-only after the existing Owner/main preflight,
          # not copied from a stale manually maintained GitHub Variable.
          DATABASE_MAX_ROWS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_ROWS || '' }}
          DATABASE_MAX_RESULT_BYTES: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_RESULT_BYTES || '' }}
          DATABASE_MAX_SCHEMA_BYTES: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_SCHEMA_BYTES || '' }}
          DATABASE_QUERY_TIMEOUT_MS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_QUERY_TIMEOUT_MS || '' }}
          DATABASE_MAX_WRITE_AFFECTED_ROWS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_MAX_WRITE_AFFECTED_ROWS || '' }}
          # GitHub reserves GITHUB_* variable names; translate our reviewed
          # Repository variable into the selected Worker's runtime binding.
          WORKFLOW_GITHUB_ACTION_REPOSITORY: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_GITHUB_ACTION_REPOSITORY || '' }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
          DATABASE_B2B_PASSWORD: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_B2B_PASSWORD || '' }}
          DATABASE_SCRAPE_RELAY_PASSWORD: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_SCRAPE_RELAY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/worker-release-variables.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-variables.txt"

      - name: Pin the reviewed unified Actions Worker (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs stage

      - name: Recheck current main inside acquired release lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale; nothing published" >&2
            exit 1
          }

      # A strict maintenance release alone may perform the one-time v22 -> v23 cutover.
      # Compatible releases require v23 and do not invoke historical adapters or write D1.
      - name: Prepare strict Workflow cutover and record recovery point (read-only)
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_ingress_quiesced == true && inputs.workflow_code_only != true
        id: workflow_schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/actions-cutover-prepare.mjs activate-preflight
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 time-travel info workflow-mcp-db --json) > "$RUNNER_TEMP/workflow-cutover-bookmark.json"
          node scripts/manual-worker-release.mjs workflow-prepare workflow-mcp-worker

      - name: Apply only the reviewed v23 Workflow D1 migration
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_ingress_quiesced == true && inputs.workflow_code_only != true && steps.workflow_schema.outputs.apply_required == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          node scripts/manual-worker-release.mjs workflow-cutover-recheck workflow-mcp-worker
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 migrations apply workflow-mcp-db --remote)

      - name: Conditionally backfill terminal facts and independently verify v23
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_ingress_quiesced == true && inputs.workflow_code_only != true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          node scripts/manual-worker-release.mjs workflow-backfill workflow-mcp-worker

      # Read-only native Hyperdrive checks: reviewed bindings, strict origin TLS
      # and disabled query caching. Database has no runtime D1 dependency.
      - name: Verify Database Hyperdrive TLS, CA, origin and cache before publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-database-hyperdrive.mjs

      # Browser activation retains its independent exact-domain Owner Access policy.
      - name: Verify Browser Profile Activation Access (read-only)
        if: inputs.worker == 'browser-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/manual-worker-release.mjs identity-recheck "$SELECTED_WORKER"

      # The verified executor identity is recorded in the protected preflight
      # state. Reverify repo ID, CI Workflow ID and unchanged old active-version
      # baseline immediately before publication; no mutable runtime override.
      - name: Recheck Workflow GitHub executor and unchanged baseline (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_GITHUB_ACTION_REPOSITORY: ${{ vars.WORKFLOW_GITHUB_ACTION_REPOSITORY }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
        run: node scripts/manual-worker-release.mjs identity-recheck "$SELECTED_WORKER"

      - name: Recheck unified Actions Worker before Workflow publication (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs recheck

      # Verify the current unified Provider and the existing gate; this is not a drain proof.
      - name: Verify current unified Actions binding and gate (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command               "SELECT (SELECT state FROM cloudflare_action_gate WHERE id=1) AS gate_state") |
            node scripts/actions-consumer-cutover-gate.mjs

      - name: Publish exactly selected Worker
        id: publish
        shell: bash
        env:
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DATABASE_EXPECTED_RELEASE_SHA: ${{ inputs.database_expected_release_sha }}
          WORKFLOW_CODE_ONLY: ${{ inputs.workflow_code_only }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          if [[ "$SELECTED_WORKER" == 'database-mcp-worker' ]]; then
            [[ "$DATABASE_EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$GITHUB_SHA" == "$DATABASE_EXPECTED_RELEASE_SHA" ]]
          fi
          case "$SELECTED_WORKER" in
            mcp-gateway-worker|browser-mcp-worker|raindrop-mcp-worker|ima-mcp-worker|database-mcp-worker|ssh-mcp-worker|remote-control-mcp-worker|github-actions-mcp-worker|workflow-mcp-worker) ;;
            *) echo "Invalid Worker target" >&2; exit 1 ;;
          esac
          log="$(mktemp)"
          chmod 600 "$log"
          cleanup() {
            rm -f "$log"
          }
          trap cleanup EXIT
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale immediately before publication" >&2
            exit 1
          }
          if [[ "$WORKFLOW_CODE_ONLY" == "true" ]]; then
            [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]] || exit 1
            [[ ! -e "$RUNNER_TEMP/mcp-worker-secrets.json" ]] || { echo 'Code-only release must not stage Secrets' >&2; exit 1; }
            # Wrangler retains existing Secrets and unrelated Variables. Explicitly
            # override only the reviewed Portal endpoint that a hostname cutover requires.
            mapfile -t portal_pins < <(grep '^WORKFLOW_MCP_PORTAL_ENDPOINT:' "$RUNNER_TEMP/mcp-worker-variables.txt" || true)
            [[ ${#portal_pins[@]} -eq 1 && "${portal_pins[0]}" == 'WORKFLOW_MCP_PORTAL_ENDPOINT:https://mcp-portal.lirtual.dpdns.org/mcp' ]] || {
              echo 'Workflow code-only Portal endpoint pin missing or drifted' >&2
              exit 1
            }
            deploy_args=(--keep-vars --var "${portal_pins[0]}")
          else
            # Existing releases always restage exactly the approved GitHub Secrets.
            test -s "$RUNNER_TEMP/mcp-worker-secrets.json"
            deploy_args=(--secrets-file "$RUNNER_TEMP/mcp-worker-secrets.json")
            test -f "$RUNNER_TEMP/mcp-worker-variables.txt"
            while IFS= read -r variable_pair; do
              deploy_args+=(--var "$variable_pair")
            done < "$RUNNER_TEMP/mcp-worker-variables.txt"
          fi
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            node scripts/manual-worker-release.mjs workflow-check workflow-mcp-worker
          fi
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          if ! (cd "apps/$SELECTED_WORKER" && pnpm exec wrangler deploy "${deploy_args[@]}") >"$log" 2>&1; then
            echo "Wrangler deploy failed (stage=deploy); no automated rollback attempted" >&2
            # Report only a whitelisted error code and a bounded, sanitized summary.
            # Never print raw Wrangler output (may contain secrets or configuration).
            node scripts/manual-worker-release.mjs diagnostic "$log"
            exit 1
          fi
          deployed_version="$(node scripts/manual-worker-release.mjs version "$log")"
          echo "version_id=$deployed_version" >> "$GITHUB_OUTPUT"
          echo "Wrangler reported a version ID; verifying Cloudflare active deployment next"

      - name: Remove temporary deployment configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mcp-worker-secrets.json" "$RUNNER_TEMP/mcp-worker-variables.txt"

      - name: Verify exact active version and required production bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_VERSION_ID: ${{ steps.publish.outputs.version_id }}
          CLERK_PILOT_PUBLISHABLE_KEY: ${{ inputs.worker == 'remote-control-mcp-worker' && vars.CLERK_PILOT_PUBLISHABLE_KEY || '' }}
          CLERK_PILOT_OWNER_USER_ID: ${{ inputs.worker == 'remote-control-mcp-worker' && vars.CLERK_PILOT_OWNER_USER_ID || '' }}
          CLERK_PILOT_ISSUER: ${{ inputs.worker == 'remote-control-mcp-worker' && vars.CLERK_PILOT_ISSUER || '' }}
          BROWSER_REMEMBERED_IDLE_DAYS: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_REMEMBERED_IDLE_DAYS || '' }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_MCP_PORTAL_CLIENT_ID || '' }}
          WORKFLOW_GITHUB_ACTION_REPOSITORY: ${{ inputs.worker == 'workflow-mcp-worker' && vars.WORKFLOW_GITHUB_ACTION_REPOSITORY || '' }}
          DATABASE_CONNECTIONS: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_CONNECTIONS || '' }}
          DB_HOST: ${{ inputs.worker == 'database-mcp-worker' && vars.DB_HOST || '' }}
        run: node scripts/manual-worker-release.mjs readback "$SELECTED_WORKER"

      - name: Verify Workflow pin matches deployed Actions Worker (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs postflight

      - name: Remove temporary Workflow release proof files
        if: always() && inputs.worker == 'workflow-mcp-worker'
        run: rm -f "$RUNNER_TEMP/actions-provider-version.txt" "$RUNNER_TEMP/workflow-cutover-bookmark.json" "$RUNNER_TEMP/workflow-cutover-proof.json"

      - name: Verify Database Hyperdrive TLS, CA, origin and cache after publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-database-hyperdrive.mjs

      - name: Check existing public health endpoint
        if: inputs.worker == 'ima-mcp-worker' || inputs.worker == 'raindrop-mcp-worker' || inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          health_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/health"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            health_endpoint="https://workflow.lirtual.dpdns.org/health"
          fi
          max_attempts=1
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' "$health_endpoint")"
            if [[ "$status" == 404 && "$attempt" -lt "$max_attempts" ]]; then
              sleep 5
              continue
            fi
            break
          done
          [[ "$status" == "200" ]] || { echo "Health check failed (HTTP $status)" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const worker = process.argv[2];
            if (!body || (worker === "workflow-mcp-worker" ? (body.ok !== true || body.scope !== "workflow" || body.service !== "workflow-mcp-worker" || body.execution_terminal_proof_schema !== 23) : worker === "ima-mcp-worker" ? body.ok !== true : body.status !== "healthy")) process.exit(1);
          ' "$response" "$SELECTED_WORKER" || { echo "Health check failed (invalid response)" >&2; exit 1; }
          echo "Existing health endpoint verified (HTTP 200)"

      - name: Check unauthenticated MCP surface without credentials
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          # A new public route may briefly return 404 after the first publish.
          # Do not retry any non-404 status or hide a persistent routing failure.
          max_attempts=1
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          if [[ "$SELECTED_WORKER" == "github-actions-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          if [[ "$SELECTED_WORKER" == "mcp-gateway-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          mcp_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/mcp"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            mcp_endpoint="https://workflow.lirtual.dpdns.org/mcp"
          elif [[ "$SELECTED_WORKER" == "browser-mcp-worker" ]]; then
            mcp_endpoint="https://browser.lirtual.dpdns.org/mcp"
          elif [[ "$SELECTED_WORKER" == "mcp-gateway-worker" ]]; then
            # Read the same single reviewed Wrangler route used to derive GATEWAY_ORIGIN.
            mcp_endpoint="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { gatewayOriginFromConfig } from "./scripts/worker-release-variables.mjs";
              const config = JSON.parse(readFileSync("apps/mcp-gateway-worker/wrangler.jsonc", "utf8"));
              process.stdout.write(gatewayOriginFromConfig(config) + "/mcp/raindrop");
            ')"
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              "$mcp_endpoint")"
            case "$status" in
              401|403)
                echo "Unauthenticated MCP request denied (HTTP $status); human Portal acceptance still required"
                exit 0
                ;;
              404)
                if ((attempt < max_attempts)); then
                  echo "New MCP route not yet visible (HTTP 404; attempt $attempt/$max_attempts)"
                  sleep 5
                  continue
                fi
                ;;
            esac
            echo "Unexpected unauthenticated MCP status: $status" >&2
            exit 1
          done

      # Frozen maintenance only. Do not reopen admission until the active
      # Consumer version, single Actions Service Binding and Provider pin
      # have already been independently read back; all plans remain paused.
      - name: Verify frozen Action gate and paused unified runtime before activation (read-only)
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_ingress_quiesced == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: node scripts/manual-worker-release.mjs workflow-check workflow-mcp-worker

      - name: Reopen only the now-verified unified Action admission gate
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_ingress_quiesced == true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command               "UPDATE cloudflare_action_gate SET state='open',changed_at=unixepoch()*1000 WHERE id=1 AND state='frozen'") > /dev/null

      - name: Verify only unified admission reopened and all Workflow plans still paused (read-only)
        if: inputs.worker == 'workflow-mcp-worker' && inputs.actions_ingress_quiesced == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIONS_INGRESS_QUIESCED: ${{ inputs.actions_ingress_quiesced }}
        run: node scripts/actions-cutover-prepare.mjs activate-postflight

      - name: Register production Browser MCP with existing One-MCP Portal
        if: inputs.worker == 'browser-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-browser-portal.mjs
