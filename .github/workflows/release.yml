name: Release Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Select Worker to deploy to production
        required: true
        type: choice
        options:
          - browser-mcp-worker
          - database-mcp-worker
          - email-mcp-worker
          - ima-mcp-worker
          - raindrop-mcp-worker
          - ssh-mcp-worker
          - remote-control-mcp-worker
          - github-actions-mcp-worker
          - http-mcp-worker
          - workflow-mcp-worker
      database_hyperdrive_enable_approved:
        description: 'Database only: protected strict-TLS Hyperdrive activation after binding and Owner disabled reference'
        required: false
        type: boolean
        default: false
      database_hyperdrive_enable_id:
        description: 'Database Hyperdrive activation only: exact disabled connection ID'
        required: false
        type: string
        default: ''
      database_hyperdrive_enable_revision:
        description: 'Database Hyperdrive activation only: current disabled revision'
        required: false
        type: string
        default: ''
      database_hyperdrive_retire_approved:
        description: 'Database only: retire a disabled Hyperdrive D1 ID after a separately verified unbinding release'
        required: false
        type: boolean
        default: false
      database_hyperdrive_retire_id:
        description: 'Database retirement only: exact disabled and unbound logical ID'
        required: false
        type: string
        default: ''
      database_hyperdrive_retire_revision:
        description: 'Database retirement only: expected disabled revision'
        required: false
        type: string
        default: ''
      deploy_to_production:
        description: Explicit approval to publish exactly the selected Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  database-hyperdrive-enable:
    name: Protected Hyperdrive Owner activation (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.database_hyperdrive_enable_approved == true &&
          inputs.deploy_to_production == false &&
          inputs.database_hyperdrive_retire_approved != true &&
          inputs.database_hyperdrive_enable_id != '' && inputs.database_hyperdrive_enable_revision != '' }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Owner to current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Cloudflare TLS, D1 CAS and live Worker health before activation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          DATABASE_ACTIVATION_ID: ${{ inputs.database_hyperdrive_enable_id }}
          DATABASE_ACTIVATION_REVISION: ${{ inputs.database_hyperdrive_enable_revision }}
        run: node scripts/activate-database-hyperdrive.mjs

  database-hyperdrive-retire:
    name: Protected Hyperdrive D1 identity retirement (no Worker deployment)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.worker == 'database-mcp-worker' &&
          inputs.database_hyperdrive_retire_approved == true &&
          inputs.deploy_to_production == false &&
          inputs.database_hyperdrive_enable_approved != true &&
          inputs.database_hyperdrive_retire_id != '' && inputs.database_hyperdrive_retire_revision != '' }}
    runs-on: ubuntu-latest
    environment:
      name: database-mcp-worker
    concurrency:
      group: worker-release-database-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Owner to current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'lirtual' && "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retire only disabled and fully unbound D1 Hyperdrive reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_RETIRE_ID: ${{ inputs.database_hyperdrive_retire_id }}
          DATABASE_RETIRE_REVISION: ${{ inputs.database_hyperdrive_retire_revision }}
        run: node scripts/retire-database-hyperdrive.mjs

  checks:
    name: Pre-release checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_production == true }}
    uses: ./.github/workflows/ci.yml
    with:
      worker: ${{ inputs.worker }}

  deploy:
    name: Manual selected Worker release
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.deploy_to_production == true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' &&
          (inputs.worker == 'raindrop-mcp-worker' ||
           inputs.worker == 'browser-mcp-worker' ||
           inputs.worker == 'ima-mcp-worker' ||
           inputs.worker == 'database-mcp-worker' ||
           inputs.worker == 'email-mcp-worker' ||
           inputs.worker == 'ssh-mcp-worker' ||
           inputs.worker == 'remote-control-mcp-worker' ||
           inputs.worker == 'github-actions-mcp-worker' ||
           inputs.worker == 'http-mcp-worker' ||
           inputs.worker == 'workflow-mcp-worker') }}
    runs-on: ubuntu-latest
    # A GitHub Environment is a Worker-scoped configuration namespace, not a
    # staging/production selector. Only manual dispatch on main can deploy.
    environment:
      name: ${{ inputs.worker }}
    concurrency:
      group: worker-release-${{ inputs.worker }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # Verify prior checked native completion after 404.
    env:
      SELECTED_WORKER: ${{ inputs.worker }}
      RELEASE_STATE_FILE: /tmp/worker-release-state.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current trusted main without deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Manual dispatch source no longer matches main HEAD" >&2
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Stage pinned public Agent source (remote-control release only)
        if: inputs.worker == 'remote-control-mcp-worker'
        run: bash scripts/stage-public-remote-control-agent.sh

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and verify shared Browser extension artifact
        if: inputs.worker == 'browser-mcp-worker'
        run: |
          python3 scripts/build-browser-extension.py --out-dir "$RUNNER_TEMP/browser-extension"
          python3 scripts/build-browser-extension.py --verify "$RUNNER_TEMP/browser-extension/browser-mcp-extension-v0.2.0.zip"

      - name: Retain Browser ZIP and provenance for separately authorized GitHub Release publication
        if: inputs.worker == 'browser-mcp-worker'
        uses: actions/upload-artifact@v4
        with:
          name: browser-mcp-extension-${{ github.sha }}
          path: ${{ runner.temp }}/browser-extension/*.zip*
          include-hidden-files: true
          if-no-files-found: error

      - name: Cloudflare release preflight (read-only)
        id: preflight
        env:
          HTTP_CREDENTIALS_JSON: ${{ inputs.worker == 'http-mcp-worker' && secrets.HTTP_CREDENTIALS_JSON || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/manual-worker-release.mjs preflight "$SELECTED_WORKER"

      # GitHub Secrets are the source of truth for all selected Workers, on every
      # explicitly authorized manual release, not just during bootstrap.
      - name: Stage selected Worker Secrets for every release
        shell: bash
        env:
          # GitHub automatically uses same-name Environment Secrets over
          # Repository Secrets. Values are scoped to this one staging step.
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          MAIL_ENCRYPTION_KEY: ${{ secrets.MAIL_ENCRYPTION_KEY }}
          RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          DATABASE_ENCRYPTION_KEY: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_ENCRYPTION_KEY || '' }}
          DATABASE_GITHUB_ACTIONS_TOKEN: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_GITHUB_ACTIONS_TOKEN || '' }}
          DATABASE_KEY_ID: ${{ inputs.worker == 'database-mcp-worker' && vars.DATABASE_KEY_ID || '' }}
          DATABASE_ENCRYPTION_PREVIOUS_KEY: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_ENCRYPTION_PREVIOUS_KEY || '' }}
          DATABASE_PREVIOUS_KEY_ID: ${{ inputs.worker == 'database-mcp-worker' && secrets.DATABASE_PREVIOUS_KEY_ID || '' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ACTIONS_GITHUB_DISPATCH_TOKENS: ${{ secrets.ACTIONS_GITHUB_DISPATCH_TOKENS }}
          HTTP_CREDENTIALS_JSON: ${{ inputs.worker == 'http-mcp-worker' && secrets.HTTP_CREDENTIALS_JSON || '' }}
          MCP_PORTAL_CLIENT_SECRET: ${{ secrets.MCP_PORTAL_CLIENT_SECRET }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          SESSION_RUNTIME_DATA_KEY: ${{ secrets.SESSION_RUNTIME_DATA_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/bootstrap-worker-secrets.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-secrets.json"

      - name: Stage approved Worker variables
        shell: bash
        env:
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          BROWSER_APPROVAL_ORIGIN: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_APPROVAL_ORIGIN || '' }}
          BROWSER_ACCESS_ISSUER: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_ACCESS_ISSUER || '' }}
          BROWSER_ACCESS_AUDIENCE: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_ACCESS_AUDIENCE || '' }}
          BROWSER_OWNER_EMAIL: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_OWNER_EMAIL || '' }}
          BROWSER_APPROVAL_ISOLATION: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_APPROVAL_ISOLATION || '' }}
          BROWSER_ACTIVATION_AUDIENCE: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_ACTIVATION_AUDIENCE || '' }}
          BROWSER_ACTIVATION_ORIGIN: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_ACTIVATION_ORIGIN || '' }}
          RAINDROP_RATE_LIMIT_MAX_RETRIES: ${{ vars.RAINDROP_RATE_LIMIT_MAX_RETRIES }}
          IMA_BASE_URL: ${{ vars.IMA_BASE_URL }}
          IMA_CLIENT_ID: ${{ vars.IMA_CLIENT_ID }}
          MCP_PORTAL_CLIENT_ID: ${{ vars.MCP_PORTAL_CLIENT_ID }}
          # The Provider pin is resolved read-only after the existing environment approval,
          # not copied from a potentially stale GitHub Environment variable.
          MAX_ROWS: ${{ vars.MAX_ROWS }}
          MAX_RESULT_BYTES: ${{ vars.MAX_RESULT_BYTES }}
          MAX_SCHEMA_BYTES: ${{ vars.MAX_SCHEMA_BYTES }}
          QUERY_TIMEOUT_MS: ${{ vars.QUERY_TIMEOUT_MS }}
          MAX_WRITE_AFFECTED_ROWS: ${{ vars.MAX_WRITE_AFFECTED_ROWS }}
          # GitHub reserves GITHUB_* variable names; translate our reviewed
          # GitHub Environment variable into the Worker's runtime binding.
          GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ vars.WORKFLOW_ACTION_APPROVED_REPOSITORIES }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/worker-release-variables.mjs "$SELECTED_WORKER" "$RUNNER_TEMP/mcp-worker-variables.txt"

      - name: Pin the reviewed unified Actions Worker (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs stage

      - name: Recheck current main inside acquired release lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale; nothing published" >&2
            exit 1
          }

      # One known October 26 history record retains indeterminate business
      # outcome. Verify *live* native Cloudflare + GitHub physical termination
      # and exact D1 identity before excluding it from migration counters.
      # Do not include any other Run; no business history is rewritten.
      - name: Verify historical terminal Run proof (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        id: terminal
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "
            SELECT id,outcome,start_state,error_code FROM runs
              WHERE id='47739981-0534-4966-8034-1e79c1d17481';
            SELECT run_id,step_id,status,error_code FROM run_steps
              WHERE run_id='47739981-0534-4966-8034-1e79c1d17481';
            SELECT run_id,step_id,state FROM session_executions
              WHERE run_id='47739981-0534-4966-8034-1e79c1d17481';
            SELECT run_id,step_id,state,repository,owner_run_id,owner_run_attempt,candidate_run_id,candidate_run_attempt
              FROM step_attempts WHERE run_id='47739981-0534-4966-8034-1e79c1d17481'
          ") | node scripts/workflow-terminal-run-exception.mjs

      # This owner-confirmed Weixin delivery remains indeterminate in machine
      # receipts. Only its exact terminal D1, native and GitHub evidence may
      # exclude it from release counters; no resend or history mutation.
      - name: Verify second terminal E2E Run proof (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        id: terminal_second
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TERMINAL_PROOF_KIND: second
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "
            SELECT id,outcome,start_state,error_code FROM runs
              WHERE id='8e0a94a7-136f-41fd-b839-211c9a60ad49';
            SELECT run_id,step_id,status,error_code FROM run_steps
              WHERE run_id='8e0a94a7-136f-41fd-b839-211c9a60ad49' ORDER BY step_id;
            SELECT run_id,step_id,state FROM session_executions
              WHERE run_id='8e0a94a7-136f-41fd-b839-211c9a60ad49';
            SELECT run_id,step_id,state,repository,owner_run_id,owner_run_attempt,candidate_run_id,candidate_run_attempt
              FROM step_attempts WHERE run_id='8e0a94a7-136f-41fd-b839-211c9a60ad49';
            SELECT run_id,step_id,invocation_id,binding_generation,deployment_id
              FROM cloudflare_action_invocations WHERE run_id='8e0a94a7-136f-41fd-b839-211c9a60ad49'
          ") | node scripts/workflow-terminal-run-exception.mjs

      # Third exact Owner-confirmed machine-unknown E2E: proof is independent
      # and fail-closed. No send/receipt mutation or generic release exception.
      - name: Verify third terminal E2E Run proof (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        id: terminal_third
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TERMINAL_PROOF_KIND: third
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "
            SELECT id,outcome,start_state,error_code FROM runs
              WHERE id='9da5816a-e7d9-481a-8203-3a2036534563';
            SELECT run_id,step_id,status,error_code FROM run_steps
              WHERE run_id='9da5816a-e7d9-481a-8203-3a2036534563' ORDER BY step_id;
            SELECT run_id,step_id,state FROM session_executions
              WHERE run_id='9da5816a-e7d9-481a-8203-3a2036534563';
            SELECT run_id,step_id,state,repository,owner_run_id,owner_run_attempt,candidate_run_id,candidate_run_attempt
              FROM step_attempts WHERE run_id='9da5816a-e7d9-481a-8203-3a2036534563';
            SELECT run_id,step_id,invocation_id,binding_generation,deployment_id
              FROM cloudflare_action_invocations WHERE run_id='9da5816a-e7d9-481a-8203-3a2036534563'
          ") | node scripts/workflow-terminal-run-exception.mjs

      # Fourth exact Owner-confirmed machine-unknown E2E: proof is independent
      # and fail-closed. No send/receipt mutation or generic release exception.
      - name: Verify fourth terminal E2E Run proof (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        id: terminal_fourth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TERMINAL_PROOF_KIND: fourth
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "
            SELECT id,outcome,start_state,error_code FROM runs
              WHERE id='22625b58-e260-4988-81b6-04352a2d5f11';
            SELECT run_id,step_id,status,error_code FROM run_steps
              WHERE run_id='22625b58-e260-4988-81b6-04352a2d5f11' ORDER BY step_id;
            SELECT run_id,step_id,state FROM session_executions
              WHERE run_id='22625b58-e260-4988-81b6-04352a2d5f11';
            SELECT run_id,step_id,state,repository,owner_run_id,owner_run_attempt,candidate_run_id,candidate_run_attempt
              FROM step_attempts WHERE run_id='22625b58-e260-4988-81b6-04352a2d5f11';
            SELECT run_id,step_id,invocation_id,binding_generation,deployment_id
              FROM cloudflare_action_invocations WHERE run_id='22625b58-e260-4988-81b6-04352a2d5f11'
          ") | node scripts/workflow-terminal-run-exception.mjs

      # Fifth exact Owner-confirmed machine-unknown E2E: proof is independent
      # and fail-closed. No send/receipt mutation or generic release exception.
      - name: Verify fifth terminal E2E Run proof (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        id: terminal_fifth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TERMINAL_PROOF_KIND: fifth
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "
            SELECT id,outcome,start_state,error_code FROM runs
              WHERE id='a1970556-a529-46c2-9bb1-81980b51557e';
            SELECT run_id,step_id,status,error_code FROM run_steps
              WHERE run_id='a1970556-a529-46c2-9bb1-81980b51557e' ORDER BY step_id;
            SELECT run_id,step_id,state FROM session_executions
              WHERE run_id='a1970556-a529-46c2-9bb1-81980b51557e';
            SELECT run_id,step_id,state,repository,owner_run_id,owner_run_attempt,candidate_run_id,candidate_run_attempt
              FROM step_attempts WHERE run_id='a1970556-a529-46c2-9bb1-81980b51557e';
            SELECT run_id,step_id,invocation_id,binding_generation,deployment_id
              FROM cloudflare_action_invocations WHERE run_id='a1970556-a529-46c2-9bb1-81980b51557e'
          ") | node scripts/workflow-terminal-run-exception.mjs

      # Sixth exact Owner-confirmed machine-unknown E2E: proof is independent
      # and fail-closed. No send/receipt mutation or generic release exception.
      - name: Verify sixth terminal E2E Run proof (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        id: terminal_sixth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TERMINAL_PROOF_KIND: sixth
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "
            SELECT id,outcome,start_state,error_code FROM runs
              WHERE id='3e312105-b40e-49ea-a037-c3359074be2b';
            SELECT run_id,step_id,status,error_code FROM run_steps
              WHERE run_id='3e312105-b40e-49ea-a037-c3359074be2b' ORDER BY step_id;
            SELECT run_id,step_id,state FROM session_executions
              WHERE run_id='3e312105-b40e-49ea-a037-c3359074be2b';
            SELECT run_id,step_id,state,repository,owner_run_id,owner_run_attempt,candidate_run_id,candidate_run_attempt
              FROM step_attempts WHERE run_id='3e312105-b40e-49ea-a037-c3359074be2b';
            SELECT run_id,step_id,invocation_id,binding_generation,deployment_id
              FROM cloudflare_action_invocations WHERE run_id='3e312105-b40e-49ea-a037-c3359074be2b'
          ") | node scripts/workflow-terminal-run-exception.mjs

      - name: Verify Workflow release configuration and remote D1 readiness
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
          WORKFLOW_TERMINAL_RUN_ID: ${{ steps.terminal.outputs.terminal_run_id }}
          WORKFLOW_SECOND_TERMINAL_RUN_ID: ${{ steps.terminal_second.outputs.second_terminal_run_id }}
          WORKFLOW_THIRD_TERMINAL_RUN_ID: ${{ steps.terminal_third.outputs.third_terminal_run_id }}
          WORKFLOW_FOURTH_TERMINAL_RUN_ID: ${{ steps.terminal_fourth.outputs.fourth_terminal_run_id }}
          WORKFLOW_FIFTH_TERMINAL_RUN_ID: ${{ steps.terminal_fifth.outputs.fifth_terminal_run_id }}
          WORKFLOW_SIXTH_TERMINAL_RUN_ID: ${{ steps.terminal_sixth.outputs.sixth_terminal_run_id }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker && pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command \
            "SELECT
             (SELECT count(*) FROM d1_migrations) AS migration_count,
             (SELECT count(*) FROM d1_migrations WHERE name='0001_s1.sql') AS migration_v1,
             (SELECT count(*) FROM d1_migrations WHERE name='0002_native_complete_seen.sql') AS migration_v2,
             (SELECT count(*) FROM d1_migrations WHERE name='0003_s3_attempt_claim.sql') AS migration_v3,
             (SELECT count(*) FROM d1_migrations WHERE name='0004_s3_callback_receipts.sql') AS migration_v4,
             (SELECT count(*) FROM d1_migrations WHERE name='0005_github_workflow_check.sql') AS migration_v5,
             (SELECT count(*) FROM d1_migrations WHERE name='0006_action_attempt_capabilities.sql') AS migration_v6,
             (SELECT count(*) FROM d1_migrations WHERE name='0007_session_executions.sql') AS migration_v7,
             (SELECT count(*) FROM d1_migrations WHERE name='0008_session_locator.sql') AS migration_v8,
              (SELECT count(*) FROM d1_migrations WHERE name='0009_fixed_sessions.sql') AS migration_v9,
              (SELECT count(*) FROM d1_migrations WHERE name='0010_session_runtime_data.sql') AS migration_v10,
             (SELECT count(*) FROM d1_migrations WHERE name='0011_awaited_child_capacity.sql') AS migration_v11,
             (SELECT count(*) FROM d1_migrations WHERE name='0012_event_wait_receipts.sql') AS migration_v12,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='wait_event_receipts') AS event_receipts_table,
             (SELECT count(*) FROM d1_migrations WHERE name='0013_cloudflare_action_invocations.sql') AS migration_v13,
              (SELECT count(*) FROM d1_migrations WHERE name='0014_workflow_deletion.sql') AS migration_v14,
              (SELECT count(*) FROM d1_migrations WHERE name='0015_runtime_approval.sql') AS migration_v15,
              (SELECT count(*) FROM d1_migrations WHERE name='0016_portal_connection_revocation.sql') AS migration_v16,
              (SELECT count(*) FROM d1_migrations WHERE name='0017_cloudflare_action_migration_fence.sql') AS migration_v17,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_gate') AS cloudflare_gate_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='portal_connection_auth') AS portal_auth_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='mcp_dispatch_fences') AS mcp_fence_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approval_gates') AS approval_gates_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approvals') AS approvals_table,
              (SELECT count(*) FROM pragma_table_info('workflows') WHERE name='deleted_at') AS deleted_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_invocations') AS invocations_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_cancellations') AS cloudflare_cancel_table,
             (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='session_url') AS locator_column,
              (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='fixed_key') AS fixed_column,
              (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='session_active_fixed_keys') AS fixed_index,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_runtime_data') AS runtime_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='capacity_weight') AS capacity_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_run_id') AS parent_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_step_id') AS parent_step_column,
             (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='runs_one_awaited_child_per_step') AS child_index,
             (SELECT count(*) FROM sqlite_master WHERE type='trigger'
               AND name='runs_top_level_capacity_guard') AS capacity_guard_trigger,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='child_cancellations') AS child_cancel_table,
             (SELECT count(*) FROM pragma_table_info('child_cancellations') WHERE name='termination_attempted_at') AS child_terminate_fence_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_executions') AS session_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='github_action_cancellations') AS cancellation_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='step_attempts') AS attempt_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='callback_receipts') AS receipt_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='native_complete_seen_at') AS native_column,
             (SELECT count(*) FROM runs WHERE outcome NOT IN ('succeeded','failed','cancelled') AND id <> '$WORKFLOW_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SECOND_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_THIRD_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FOURTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FIFTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SIXTH_TERMINAL_RUN_ID') AS active_runs,
              (SELECT count(*) FROM session_executions WHERE state != 'terminated') AS active_sessions,
             (SELECT count(*) FROM runs) AS run_count,
             (SELECT count(*) FROM workflows) AS workflow_count") |
            node scripts/manual-worker-release.mjs d1-check workflow-mcp-worker

      - name: Apply isolated Email D1 schema from reviewed migration
        if: inputs.worker == 'email-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          (cd apps/email-mcp-worker && pnpm exec wrangler d1 migrations apply email-mcp-db --remote)
          # Never query or log mailbox credentials; validate schema only.
          output="$(cd apps/email-mcp-worker && pnpm exec wrangler d1 execute email-mcp-db --remote --json --command \
            "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='mail_accounts') AS accounts_table, \
                    (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='send_attempts') AS attempts_table")"
          printf '%s' "$output" | node -e '
            let raw="";process.stdin.on("data",c=>raw+=c).on("end",()=>{
              const d=JSON.parse(raw);
              if (!Array.isArray(d)||d.length!==1||!d[0].success||
                  d[0].results?.[0]?.accounts_table!==1||d[0].results?.[0]?.attempts_table!==1)
                process.exit(1);
              console.log("Email production D1 schema verified; no mailbox rows read");
            });'

      # Only the existing production release lock and GitHub Environment can
      # apply the reviewed Action capability and Session lifecycle migrations. This changes the
      # schema without changing any running instance.
      - name: Apply complete Workflow D1 migrations
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_REQUIRE_COMPLETE_SCHEMA: 'true'
          WORKFLOW_TERMINAL_RUN_ID: ${{ steps.terminal.outputs.terminal_run_id }}
          WORKFLOW_SECOND_TERMINAL_RUN_ID: ${{ steps.terminal_second.outputs.second_terminal_run_id }}
          WORKFLOW_THIRD_TERMINAL_RUN_ID: ${{ steps.terminal_third.outputs.third_terminal_run_id }}
          WORKFLOW_FOURTH_TERMINAL_RUN_ID: ${{ steps.terminal_fourth.outputs.fourth_terminal_run_id }}
          WORKFLOW_FIFTH_TERMINAL_RUN_ID: ${{ steps.terminal_fifth.outputs.fifth_terminal_run_id }}
          WORKFLOW_SIXTH_TERMINAL_RUN_ID: ${{ steps.terminal_sixth.outputs.sixth_terminal_run_id }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 migrations apply workflow-mcp-db --remote)
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "SELECT
              (SELECT count(*) FROM d1_migrations) AS migration_count,
              (SELECT count(*) FROM d1_migrations WHERE name='0001_s1.sql') AS migration_v1,
              (SELECT count(*) FROM d1_migrations WHERE name='0002_native_complete_seen.sql') AS migration_v2,
              (SELECT count(*) FROM d1_migrations WHERE name='0003_s3_attempt_claim.sql') AS migration_v3,
              (SELECT count(*) FROM d1_migrations WHERE name='0004_s3_callback_receipts.sql') AS migration_v4,
             (SELECT count(*) FROM d1_migrations WHERE name='0005_github_workflow_check.sql') AS migration_v5,
             (SELECT count(*) FROM d1_migrations WHERE name='0006_action_attempt_capabilities.sql') AS migration_v6,
             (SELECT count(*) FROM d1_migrations WHERE name='0007_session_executions.sql') AS migration_v7,
             (SELECT count(*) FROM d1_migrations WHERE name='0008_session_locator.sql') AS migration_v8,
              (SELECT count(*) FROM d1_migrations WHERE name='0009_fixed_sessions.sql') AS migration_v9,
              (SELECT count(*) FROM d1_migrations WHERE name='0010_session_runtime_data.sql') AS migration_v10,
             (SELECT count(*) FROM d1_migrations WHERE name='0011_awaited_child_capacity.sql') AS migration_v11,
             (SELECT count(*) FROM d1_migrations WHERE name='0012_event_wait_receipts.sql') AS migration_v12,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='wait_event_receipts') AS event_receipts_table,
             (SELECT count(*) FROM d1_migrations WHERE name='0013_cloudflare_action_invocations.sql') AS migration_v13,
              (SELECT count(*) FROM d1_migrations WHERE name='0014_workflow_deletion.sql') AS migration_v14,
              (SELECT count(*) FROM d1_migrations WHERE name='0015_runtime_approval.sql') AS migration_v15,
              (SELECT count(*) FROM d1_migrations WHERE name='0016_portal_connection_revocation.sql') AS migration_v16,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='portal_connection_auth') AS portal_auth_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='mcp_dispatch_fences') AS mcp_fence_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approval_gates') AS approval_gates_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='runtime_approvals') AS approvals_table,
              (SELECT count(*) FROM pragma_table_info('workflows') WHERE name='deleted_at') AS deleted_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_invocations') AS invocations_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='cloudflare_action_cancellations') AS cloudflare_cancel_table,
             (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='session_url') AS locator_column,
              (SELECT count(*) FROM pragma_table_info('session_executions') WHERE name='fixed_key') AS fixed_column,
              (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='session_active_fixed_keys') AS fixed_index,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_runtime_data') AS runtime_table,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='capacity_weight') AS capacity_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_run_id') AS parent_column,
             (SELECT count(*) FROM pragma_table_info('runs') WHERE name='parent_step_id') AS parent_step_column,
             (SELECT count(*) FROM sqlite_master WHERE type='index' AND name='runs_one_awaited_child_per_step') AS child_index,
             (SELECT count(*) FROM sqlite_master WHERE type='trigger'
               AND name='runs_top_level_capacity_guard') AS capacity_guard_trigger,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='child_cancellations') AS child_cancel_table,
             (SELECT count(*) FROM pragma_table_info('child_cancellations') WHERE name='termination_attempted_at') AS child_terminate_fence_column,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='session_executions') AS session_table,
             (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='github_action_cancellations') AS cancellation_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='step_attempts') AS attempt_table,
              (SELECT count(*) FROM sqlite_master WHERE type='table' AND name='callback_receipts') AS receipt_table,
              (SELECT count(*) FROM pragma_table_info('runs') WHERE name='native_complete_seen_at') AS native_column,
              (SELECT count(*) FROM runs WHERE outcome NOT IN ('succeeded','failed','cancelled') AND id <> '$WORKFLOW_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SECOND_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_THIRD_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FOURTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_FIFTH_TERMINAL_RUN_ID' AND id <> '$WORKFLOW_SIXTH_TERMINAL_RUN_ID') AS active_runs,
              (SELECT count(*) FROM session_executions WHERE state != 'terminated') AS active_sessions,
              (SELECT count(*) FROM runs) AS run_count,
              (SELECT count(*) FROM workflows) AS workflow_count") |
            node scripts/manual-worker-release.mjs d1-check workflow-mcp-worker

      - name: Verify code-only Workflow D1 gate at publication (Ready Sessions preserved)
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKFLOW_TERMINAL_RUN_ID: ${{ steps.terminal.outputs.terminal_run_id }}
          WORKFLOW_SECOND_TERMINAL_RUN_ID: ${{ steps.terminal_second.outputs.second_terminal_run_id }}
          WORKFLOW_THIRD_TERMINAL_RUN_ID: ${{ steps.terminal_third.outputs.third_terminal_run_id }}
          WORKFLOW_FOURTH_TERMINAL_RUN_ID: ${{ steps.terminal_fourth.outputs.fourth_terminal_run_id }}
          WORKFLOW_FIFTH_TERMINAL_RUN_ID: ${{ steps.terminal_fifth.outputs.fifth_terminal_run_id }}
          WORKFLOW_SIXTH_TERMINAL_RUN_ID: ${{ steps.terminal_sixth.outputs.sixth_terminal_run_id }}
        run: |
          set -euo pipefail
          query="$(node scripts/manual-worker-release.mjs migration-sql workflow-mcp-worker)"
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command "$query") |
            node scripts/manual-worker-release.mjs code-release-check workflow-mcp-worker

      # Strictly read-only. A selected Database release cannot proceed if the
      # approved D1 schema is missing; migration/import are separate actions.
      - name: Verify Database D1 schema and fresh registry before publication (read-only)
        if: inputs.worker == 'database-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          query="$(node scripts/manual-worker-release.mjs database-d1-sql database-mcp-worker)"
          (cd apps/database-mcp-worker &&
            pnpm exec wrangler d1 execute database-mcp-registry --remote --json --command "$query") |
            node scripts/manual-worker-release.mjs database-d1-check database-mcp-worker

      - name: Verify fresh Database D1 and existing registry (read-only)
        if: inputs.worker == 'database-mcp-worker'
        env:
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          DATABASE_KEY_ID: ${{ vars.DATABASE_KEY_ID }}
          DATABASE_ENCRYPTION_PREVIOUS_KEY: ${{ secrets.DATABASE_ENCRYPTION_PREVIOUS_KEY }}
          DATABASE_PREVIOUS_KEY_ID: ${{ vars.DATABASE_PREVIOUS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/database-fresh-readiness-344.mjs

      # Read-only Hyperdrive API check against immutable reviewed source.
      # Never log the response body (origin identity may be sensitive).
      - name: Verify Database Hyperdrive TLS, CA, origin and cache before publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-database-hyperdrive.mjs

      # Read-only Access inventory. Do not publish an Owner configuration page
      # unless Cloudflare already enforces the exact-domain, exact-email policy.
      - name: Verify Database Owner Access policy before publication (read-only)
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/database-owner-access.mjs

      # Exercise the exact GitHub Environment PAT on the real GitHub API before
      # publishing the Database Worker. One no-deploy workflow_dispatch is safe:
      # all mutating jobs are skipped, so this cannot recurse or alter databases.
      # This prevents a Secret-presence-only CI pass masking 403 permissions.
      - name: Verify Database Owner GitHub Actions dispatch before publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          DATABASE_GITHUB_ACTIONS_TOKEN: ${{ secrets.DATABASE_GITHUB_ACTIONS_TOKEN }}
        run: node scripts/probe-database-github-dispatch.mjs

      - name: Verify Browser Owner Approval and Profile Activation Access (read-only)
        if: inputs.worker == 'browser-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BROWSER_APPROVAL_ORIGIN: ${{ vars.BROWSER_APPROVAL_ORIGIN }}
          BROWSER_ACCESS_ISSUER: ${{ vars.BROWSER_ACCESS_ISSUER }}
          BROWSER_ACCESS_AUDIENCE: ${{ vars.BROWSER_ACCESS_AUDIENCE }}
          BROWSER_OWNER_EMAIL: ${{ vars.BROWSER_OWNER_EMAIL }}
          BROWSER_APPROVAL_ISOLATION: ${{ vars.BROWSER_APPROVAL_ISOLATION }}
          BROWSER_ACTIVATION_AUDIENCE: ${{ vars.BROWSER_ACTIVATION_AUDIENCE }}
          BROWSER_ACTIVATION_ORIGIN: ${{ vars.BROWSER_ACTIVATION_ORIGIN }}
        run: node scripts/browser-owner-access.mjs

      - name: Recheck unified Actions Worker before Workflow publication (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs recheck

      # First legacy-to-ACTIONS cutover MUST have a frozen D1 dispatch gate.
      # This read-only check cannot prove old native Workflow instances drained;
      # physical drain remains a separately documented release prerequisite.
      - name: Verify Actions binding transition has an atomic D1 fence (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          (cd apps/workflow-mcp-worker &&
            pnpm exec wrangler d1 execute workflow-mcp-db --remote --json --command \
              "SELECT (SELECT state FROM cloudflare_action_gate WHERE id=1) AS gate_state") |
            node scripts/actions-consumer-cutover-gate.mjs

      - name: Publish exactly selected Worker
        id: publish
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          case "$SELECTED_WORKER" in
            browser-mcp-worker|raindrop-mcp-worker|ima-mcp-worker|database-mcp-worker|email-mcp-worker|ssh-mcp-worker|remote-control-mcp-worker|github-actions-mcp-worker|http-mcp-worker|workflow-mcp-worker) ;;
            *) echo "Invalid Worker target" >&2; exit 1 ;;
          esac
          log="$(mktemp)"
          chmod 600 "$log"
          cleanup() {
            rm -f "$log"
          }
          trap cleanup EXIT
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]] || {
            echo "Source became stale immediately before publication" >&2
            exit 1
          }
          # Fail closed if any selected Worker Secret is absent. Wrangler
          # atomically uploads the staged values with the selected deployment,
          # including existing Workers; unspecified secrets are preserved.
          test -s "$RUNNER_TEMP/mcp-worker-secrets.json"
          deploy_args=(--secrets-file "$RUNNER_TEMP/mcp-worker-secrets.json")
          test -f "$RUNNER_TEMP/mcp-worker-variables.txt"
          while IFS= read -r variable_pair; do
            deploy_args+=(--var "$variable_pair")
          done < "$RUNNER_TEMP/mcp-worker-variables.txt"
          if ! (cd "apps/$SELECTED_WORKER" && pnpm exec wrangler deploy "${deploy_args[@]}") >"$log" 2>&1; then
            echo "Wrangler deploy failed (stage=deploy); no automated rollback attempted" >&2
            # Report only a whitelisted error code and a bounded, sanitized summary.
            # Never print raw Wrangler output (may contain secrets or configuration).
            node scripts/manual-worker-release.mjs diagnostic "$log"
            exit 1
          fi
          deployed_version="$(node scripts/manual-worker-release.mjs version "$log")"
          echo "version_id=$deployed_version" >> "$GITHUB_OUTPUT"
          echo "Wrangler reported a version ID; verifying Cloudflare active deployment next"

      - name: Remove temporary deployment configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mcp-worker-secrets.json" "$RUNNER_TEMP/mcp-worker-variables.txt"

      - name: Verify exact active version and required production bindings
        env:
          HTTP_CREDENTIALS_JSON: ${{ inputs.worker == 'http-mcp-worker' && secrets.HTTP_CREDENTIALS_JSON || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_VERSION_ID: ${{ steps.publish.outputs.version_id }}
          BROWSER_APPROVAL_EXPECTED: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_APPROVAL_ISOLATION || '' }}
          BROWSER_ACTIVATION_EXPECTED: ${{ inputs.worker == 'browser-mcp-worker' && vars.BROWSER_ACTIVATION_AUDIENCE || '' }}
        run: node scripts/manual-worker-release.mjs readback "$SELECTED_WORKER"

      - name: Verify Workflow pin matches actual unified Actions Worker (read-only)
        if: inputs.worker == 'workflow-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reviewed-actions-provider-pin.mjs postflight

      - name: Remove temporary Provider pin proof
        if: always() && inputs.worker == 'workflow-mcp-worker'
        run: rm -f "$RUNNER_TEMP/actions-provider-version.txt"

      - name: Verify Database Hyperdrive TLS, CA, origin and cache after publication
        if: inputs.worker == 'database-mcp-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-database-hyperdrive.mjs

      - name: Register production Email MCP with existing One-MCP Portal
        if: inputs.worker == 'email-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-email-portal.mjs

      - name: Validate connected Email account via production read-only IMAP
        if: inputs.worker == 'email-mcp-worker'
        shell: bash
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/email-production-read-smoke.mjs

      - name: Check existing public health endpoint
        if: inputs.worker == 'ima-mcp-worker' || inputs.worker == 'raindrop-mcp-worker' || inputs.worker == 'workflow-mcp-worker' || inputs.worker == 'http-mcp-worker'
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          health_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/health"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            health_endpoint="https://workflow.lirtual.dpdns.org/health"
          fi
          max_attempts=1
          if [[ ("$SELECTED_WORKER" == "workflow-mcp-worker" || "$SELECTED_WORKER" == "http-mcp-worker") && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' "$health_endpoint")"
            if [[ "$status" == 404 && "$attempt" -lt "$max_attempts" ]]; then
              sleep 5
              continue
            fi
            break
          done
          [[ "$status" == "200" ]] || { echo "Health check failed (HTTP $status)" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const worker = process.argv[2];
            if (!body || ((worker === "http-mcp-worker") ? (body.ok !== true || body.service !== worker) : worker === "workflow-mcp-worker" ? (body.ok !== true || body.scope !== "workflow" || body.service !== "workflow-mcp-worker") : worker === "ima-mcp-worker" ? body.ok !== true : body.status !== "healthy")) process.exit(1);
          ' "$response" "$SELECTED_WORKER" || { echo "Health check failed (invalid response)" >&2; exit 1; }
          echo "Existing health endpoint verified (HTTP 200)"

      - name: Check unauthenticated MCP surface without credentials
        shell: bash
        env:
          FIRST_DEPLOY: ${{ steps.preflight.outputs.bootstrap }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          # A new Workers.dev hostname may briefly return 404 after the first publish.
          # Do not retry any non-404 status or hide a persistent routing failure.
          max_attempts=1
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          if [[ ("$SELECTED_WORKER" == "http-mcp-worker") && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          if [[ "$SELECTED_WORKER" == "github-actions-mcp-worker" && "$FIRST_DEPLOY" == "true" ]]; then
            max_attempts=12
          fi
          mcp_endpoint="https://${SELECTED_WORKER}.aiyaya.workers.dev/mcp"
          if [[ "$SELECTED_WORKER" == "workflow-mcp-worker" ]]; then
            mcp_endpoint="https://workflow.lirtual.dpdns.org/mcp"
          elif [[ "$SELECTED_WORKER" == "browser-mcp-worker" ]]; then
            mcp_endpoint="https://browser.lirtual.dpdns.org/mcp"
          elif [[ "$SELECTED_WORKER" == "email-mcp-worker" ]]; then
            mcp_endpoint="https://email-mcp.lirtual.dpdns.org/mcp"
          fi
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status="$(curl --silent --show-error --max-time 12 --output "$response" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              "$mcp_endpoint")"
            case "$status" in
              401|403)
                echo "Unauthenticated MCP request denied (HTTP $status); human Portal acceptance still required"
                exit 0
                ;;
              404)
                if ((attempt < max_attempts)); then
                  echo "New Workers.dev route not yet visible (HTTP 404; attempt $attempt/$max_attempts)"
                  sleep 5
                  continue
                fi
                ;;
            esac
            echo "Unexpected unauthenticated MCP status: $status" >&2
            exit 1
          done

      - name: Register production HTTP MCP with existing One-MCP Portal
        if: inputs.worker == 'http-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-http-portal.mjs

      - name: Register production Browser MCP with existing One-MCP Portal
        if: inputs.worker == 'browser-mcp-worker'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-browser-portal.mjs
