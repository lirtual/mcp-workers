name: Release Gate Contract Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  non_database:
    uses: ./.github/workflows/ci.yml
    with:
      worker: ima-mcp-worker

  database:
    uses: ./.github/workflows/ci.yml
    with:
      worker: database-mcp-worker

  verify:
    needs: [non_database, database]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check both reusable CI result paths without deployment
        env:
          SIMPLE_RESULT: ${{ needs.non_database.result }}
          SIMPLE_READY: ${{ needs.non_database.outputs.release_ready }}
          DATABASE_RESULT: ${{ needs.database.result }}
          DATABASE_READY: ${{ needs.database.outputs.release_ready }}
        run: |
          set -euo pipefail
          [[ "$SIMPLE_RESULT" == success && "$SIMPLE_READY" == true ]]
          [[ "$DATABASE_RESULT" == success && "$DATABASE_READY" == true ]]
