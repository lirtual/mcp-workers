name: Workflow MCP Staging Gate

on:
  push:
    branches:
      - main
    paths:
      - apps/workflow-mcp-worker/**
      - .github/workflows/workflow-executor.yml
      - .github/workflows/workflow-executor-staging.yml
      - .github/workflows/workflow-mcp-staging.yml
  workflow_dispatch:
    inputs:
      source_url:
        description: Small public page used by the heavy tracer
        required: false
        default: https://example.com/
        type: string
      bootstrap:
        description: Skip pre-deploy compatibility query for a brand-new empty staging D1
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: workflow-mcp-staging
  cancel-in-progress: false

jobs:
  staging:
    environment: workflow-mcp-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8bb496011403552e785ea1b834daffdf
      WORKFLOW_MCP_STAGING_D1_DATABASE_ID: 8e0763e4-e6a6-4559-9928-709652404a1e
      WORKFLOW_MCP_STAGING_D1_DATABASE_NAME: ${{ vars.WORKFLOW_MCP_STAGING_D1_DATABASE_NAME || 'workflow-mcp-staging' }}
      WORKFLOW_MCP_STAGING_WORKER_NAME: ${{ vars.WORKFLOW_MCP_STAGING_WORKER_NAME || 'workflow-mcp-worker-staging' }}
      WORKFLOW_MCP_STAGING_R2_BUCKET: ${{ vars.WORKFLOW_MCP_STAGING_R2_BUCKET || 'workflow-mcp-artifacts-staging' }}
      WORKFLOW_MCP_STAGING_URL: ${{ vars.WORKFLOW_MCP_STAGING_URL || 'https://workflow-mcp-worker-staging.aiyaya.workers.dev' }}
      WORKFLOW_MCP_STAGING_SOURCE_URL: ${{ inputs.source_url }}
      STAGING_EVIDENCE_PATH: ${{ github.workspace }}/workflow-mcp-staging-evidence.json
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          node --version
          pnpm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate ephemeral staging credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing staging environment value: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          access_token="$(openssl rand -hex 32)"
          lease_secret="$(openssl rand -hex 32)"
          trigger_token="$(openssl rand -hex 32)"
          account_verify_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          user_verify_url="https://api.cloudflare.com/client/v4/user/tokens/verify"
          account_body="$RUNNER_TEMP/cloudflare-account-token-verify.json"
          user_body="$RUNNER_TEMP/cloudflare-user-token-verify.json"

          account_status="$(curl --silent --show-error --output "$account_body" --write-out '%{http_code}' \
            "$account_verify_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if [[ "$account_status" == "200" ]]; then
            token_json="$(cat "$account_body")"
            token_owner="account"
          else
            user_status="$(curl --silent --show-error --output "$user_body" --write-out '%{http_code}' \
              "$user_verify_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            if [[ "$user_status" == "200" ]]; then
              token_json="$(cat "$user_body")"
              token_owner="user"
            else
              account_error="$(node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const e=x.errors?.[0]; process.stdout.write(e ? String(e.code)+': '+String(e.message) : 'unknown')" "$account_body" 2>/dev/null || echo unknown)"
              user_error="$(node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const e=x.errors?.[0]; process.stdout.write(e ? String(e.code)+': '+String(e.message) : 'unknown')" "$user_body" 2>/dev/null || echo unknown)"
              echo "::error::Cloudflare token verification failed (account HTTP $account_status, $account_error; user HTTP $user_status, $user_error)."
              exit 1
            fi
          fi
          rm -f "$account_body" "$user_body"
          r2_access_key_id="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.success||!x.result?.id||x.result.status!=='active') process.exit(1); process.stdout.write(x.result.id)" "$token_json")"
          echo "Cloudflare token verified as $token_owner-owned."
          r2_secret_access_key="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')"

          echo "::add-mask::$access_token"
          echo "::add-mask::$lease_secret"
          echo "::add-mask::$trigger_token"
          echo "::add-mask::$r2_access_key_id"
          echo "::add-mask::$r2_secret_access_key"
          echo "WORKFLOW_MCP_STAGING_ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"
          echo "EXECUTOR_LEASE_SECRET=$lease_secret" >> "$GITHUB_ENV"
          echo "TRIGGER_SMOKE_WEBHOOK_TOKEN=$trigger_token" >> "$GITHUB_ENV"
          echo "R2_ACCESS_KEY_ID=$r2_access_key_id" >> "$GITHUB_ENV"
          echo "R2_SECRET_ACCESS_KEY=$r2_secret_access_key" >> "$GITHUB_ENV"

      - name: Validate required staging configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            WORKFLOW_MCP_STAGING_D1_DATABASE_ID
            WORKFLOW_MCP_STAGING_D1_DATABASE_NAME
            WORKFLOW_MCP_STAGING_WORKER_NAME
            WORKFLOW_MCP_STAGING_R2_BUCKET
            WORKFLOW_MCP_STAGING_URL
            WORKFLOW_MCP_STAGING_ACCESS_TOKEN
            EXECUTOR_LEASE_SECRET
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            TRIGGER_SMOKE_WEBHOOK_TOKEN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing staging environment value: $name"
              exit 1
            fi
          done

      - name: Run application release checks
        run: pnpm --filter workflow-mcp-worker check

      - name: Build isolated staging Wrangler config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          config="$GITHUB_WORKSPACE/apps/workflow-mcp-worker/wrangler.staging.generated.json"
          pnpm --filter workflow-mcp-worker exec tsx scripts/build-staging-config.ts "$config"
          echo "path=$config" >> "$GITHUB_OUTPUT"
          echo "WORKFLOW_MCP_WRANGLER_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Apply staging D1 migrations
        working-directory: apps/workflow-mcp-worker
        run: pnpm exec wrangler d1 migrations apply DB --remote --config "$WORKFLOW_MCP_WRANGLER_CONFIG"

      - name: Check nonterminal runtime compatibility
        if: inputs.bootstrap != true
        run: pnpm --filter workflow-mcp-worker run release:compatibility

      - name: Deploy isolated staging Worker
        working-directory: apps/workflow-mcp-worker
        run: pnpm exec wrangler deploy --config "$WORKFLOW_MCP_WRANGLER_CONFIG"

      - name: Install staging Worker secrets
        shell: bash
        working-directory: apps/workflow-mcp-worker
        env:
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/workflow-mcp-staging-secrets.json"
          SECRET_FILE="$secret_file" node <<'NODE'
          const fs = require('node:fs');
          const values = {
            MCP_ACCESS_TOKEN: process.env.WORKFLOW_MCP_STAGING_ACCESS_TOKEN,
            SMOKE_READONLY_MCP_TOKEN: process.env.WORKFLOW_MCP_STAGING_ACCESS_TOKEN,
            TRIGGER_SMOKE_WEBHOOK_TOKEN: process.env.TRIGGER_SMOKE_WEBHOOK_TOKEN,
            EXECUTOR_LEASE_SECRET: process.env.EXECUTOR_LEASE_SECRET,
            GITHUB_ACTIONS_TOKEN: process.env.GITHUB_ACTIONS_TOKEN,
            R2_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            R2_ACCESS_KEY_ID: process.env.R2_ACCESS_KEY_ID,
            R2_SECRET_ACCESS_KEY: process.env.R2_SECRET_ACCESS_KEY
          };
          for (const [name, value] of Object.entries(values)) {
            if (!value) throw new Error('Missing secret value for ' + name);
          }
          fs.writeFileSync(process.env.SECRET_FILE, JSON.stringify(values));
          NODE
          pnpm exec wrangler secret bulk "$secret_file" --config "$WORKFLOW_MCP_WRANGLER_CONFIG"
          rm -f "$secret_file"

      - name: Wait for staging health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$WORKFLOW_MCP_STAGING_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Staging Worker did not become healthy."
          exit 1

      - name: Run MCP heavy and connection tracers
        id: tracer
        working-directory: apps/workflow-mcp-worker
        run: pnpm exec tsx scripts/run-staging-tracer.ts

      - name: Verify GitHub executor terminal evidence
        working-directory: apps/workflow-mcp-worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/verify-staging-executor.ts

      - name: Publish staging evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Workflow MCP staging gate"
            echo
            echo "- Worker: \`$WORKFLOW_MCP_STAGING_URL\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Heavy run: \`${{ steps.tracer.outputs.heavy_run_id || 'not-completed' }}\`"
            echo "- MCP run: \`${{ steps.tracer.outputs.mcp_run_id || 'not-completed' }}\`"
            if [[ -f "$STAGING_EVIDENCE_PATH" ]]; then
              echo
              echo '```json'
              cat "$STAGING_EVIDENCE_PATH"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-mcp-staging-evidence-${{ github.run_id }}
          path: workflow-mcp-staging-evidence.json
          if-no-files-found: warn
          retention-days: 14
