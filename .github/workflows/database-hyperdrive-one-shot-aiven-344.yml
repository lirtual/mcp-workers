            const data=await r.json().catch(()=>({}));const id=String(data.result?.id||'absent');
            identity={http:r.status,token_id_digest:createHash('sha256').update(id).digest('hex').slice(0,16)};
          }catch{identity={error:'identity_check_failed'};}
          try{
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/8bb496011403552e785ea1b834daffdf/mtls_certificates/c9a71de0-06b0-4ea2-b2e8-2dfc27fb0d7a',{headers:h,signal:AbortSignal.timeout(12000)});
            const data=await r.json().catch(()=>({}));
            cert={http:r.status,success:data.success===true,codes:(data.errors||[]).map(e=>e.code).slice(0,2)};
          }catch{cert={error:'certificate_check_failed'};}
          console.log('effective_scope',JSON.stringify({identity,cert,secret_inputs_present:{
             cloudflare:!!t,pg:!!process.env.AIVEN_PG_PASSWORD,mysql:!!process.env.AIVEN_MYSQL_PASSWORD}}));
