name: One-time Aiven Hyperdrive scope diagnostic
on:
  push:
    branches: [feat/database-spec-344]
    paths: [.github/workflows/database-hyperdrive-one-shot-aiven-344.yml]
permissions:
  contents: read
jobs:
  repository-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AIVEN_PG_PASSWORD: ${{ secrets.DATABASE_TEST_POSTGRES_PASSWORD }}
      AIVEN_MYSQL_PASSWORD: ${{ secrets.DATABASE_TEST_MYSQL_PASSWORD }}
      - name: Compare effective token identity and CA access without revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const t=process.env.CLOUDFLARE_API_TOKEN||'';
          const h={authorization:'Bearer '+t};
          let identity,cert;
          try{
            const r=await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify',{headers:h,signal:AbortSignal.timeout(12000)});
            const data=await r.json().catch(()=>({}));const id=String(data.result?.id||'absent');
            identity={http:r.status,token_id_digest:createHash('sha256').update(id).digest('hex').slice(0,16)};
          }catch{identity={error:'identity_check_failed'};}
          try{
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/8bb496011403552e785ea1b834daffdf/mtls_certificates/c9a71de0-06b0-4ea2-b2e8-2dfc27fb0d7a',{headers:h,signal:AbortSignal.timeout(12000)});
            const data=await r.json().catch(()=>({}));
            cert={http:r.status,success:data.success===true,codes:(data.errors||[]).map(e=>e.code).slice(0,2)};
          }catch{cert={error:'certificate_check_failed'};}
          console.log('effective_scope',JSON.stringify({identity,cert,secret_inputs_present:{
             cloudflare:!!t,pg:!!process.env.AIVEN_PG_PASSWORD,mysql:!!process.env.AIVEN_MYSQL_PASSWORD}}));
          NODE
  environment-scope:
    runs-on: ubuntu-latest
    environment: database-mcp-worker
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
