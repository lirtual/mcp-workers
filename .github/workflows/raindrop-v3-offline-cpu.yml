name: Raindrop Offline CPU Profile

on:
  push:
    branches:
      - feat/raindrop-v3-core-reliability
    paths:
      - .github/workflows/raindrop-v3-offline-cpu.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Measure offline MCP construction and read-only Worker CPU
        run: pnpm --filter raindrop-mcp-worker exec vitest run tests/v3_cpu_profile.test.ts --reporter=verbose
