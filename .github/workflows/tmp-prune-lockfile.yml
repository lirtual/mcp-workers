name: Temporary pruning lockfile refresh

on:
  push:
    branches:
      - ticket/prune-09-raindrop-retire-alt-runtimes

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: refresh lockfile after Raindrop runtime pruning'
          git push
