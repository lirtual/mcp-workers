name: Workflow Acceptance

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: Acceptance type (legacy cleanup readback is GET-only; portal-register can write)
        required: true
        type: choice
        options:
          - production-native
          - production-child
          - production-mcp
          - production-http
          - production-github
          - production-action-task
          - production-webhook
          - production-retired-tools
          - portal-readonly
          - github-action-result-cloud
          - portal-register
          - legacy-cleanup-readonly-ssh
          - legacy-cleanup-readonly-workflow
          - secret-rename-seal-ssh
          - secret-rename-verify-ssh
          - secret-rename-seal-workflow
          - secret-rename-verify-workflow
      confirm_portal_write:
        description: Explicitly authorize production Portal configuration changes (portal-register only)
        required: true
        type: boolean
        default: false
      secret_rename_public_key:
        description: Public key of the selected GitHub Environment, not a credential (seal only)
        type: string
        required: false
        default: ''
      secret_rename_public_key_id:
        description: Public key ID of the selected GitHub Environment (seal only)
        type: string
        required: false
        default: ''
      cleanup_expected_version:
        description: Cleanup readback only - exact reviewed active Worker version UUID
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  # One-time controlled original-value transfer. These jobs never write GitHub Secrets.
  # Remove after the encrypted admin handoff and independent parity check (or an abort).
  secret-rename-seal:
    name: Seal selected original Secret for GitHub Environment (no credential writes)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.confirm_portal_write == false &&
          contains(fromJSON('["secret-rename-seal-ssh","secret-rename-seal-workflow"]'), inputs.test_type) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.test_type == 'secret-rename-seal-ssh' && 'ssh-mcp-worker' || 'workflow-mcp-worker' }}
    concurrency:
      group: worker-release-${{ inputs.test_type == 'secret-rename-seal-ssh' && 'ssh-mcp-worker' || 'workflow-mcp-worker' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify trusted main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - name: Seal original SSH key (ciphertext only)
        if: inputs.test_type == 'secret-rename-seal-ssh'
        env:
          SPEC733_OLD_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SPEC733_PUBLIC_KEY: ${{ inputs.secret_rename_public_key }}
          SPEC733_PUBLIC_KEY_ID: ${{ inputs.secret_rename_public_key_id }}
        run: python3 scripts/ssh-secret-real-migration.py seal "$RUNNER_TEMP/spec733-original-sealed.json"
      - name: Seal original Workflow Portal Secret (ciphertext only)
        if: inputs.test_type == 'secret-rename-seal-workflow'
        env:
          SPEC733_WORKFLOW_SECRET_KIND: portal
          SPEC733_OLD_SECRET: ${{ secrets.MCP_PORTAL_CLIENT_SECRET }}
          SPEC733_PUBLIC_KEY: ${{ inputs.secret_rename_public_key }}
          SPEC733_PUBLIC_KEY_ID: ${{ inputs.secret_rename_public_key_id }}
        run: python3 scripts/workflow-secret-real-migration.py seal "$RUNNER_TEMP/spec733-original-sealed.json"
      - name: Upload public-key encrypted-only artifact (one-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spec733-${{ inputs.test_type }}-${{ github.run_id }}
          path: ${{ runner.temp }}/spec733-original-sealed.json
          if-no-files-found: error
          retention-days: 1

  secret-rename-verify:
    name: Compare protected old/new original Secret bytes (no content or digest)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.confirm_portal_write == false &&
          contains(fromJSON('["secret-rename-verify-ssh","secret-rename-verify-workflow"]'), inputs.test_type) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.test_type == 'secret-rename-verify-ssh' && 'ssh-mcp-worker' || 'workflow-mcp-worker' }}
    concurrency:
      group: worker-release-${{ inputs.test_type == 'secret-rename-verify-ssh' && 'ssh-mcp-worker' || 'workflow-mcp-worker' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify trusted main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - name: Compare original/new SSH key bytes (Pass/Fail only)
        if: inputs.test_type == 'secret-rename-verify-ssh'
        env:
          SPEC733_OLD_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SPEC733_NEW_KEY: ${{ secrets.SSH_ENCRYPTION_KEY }}
        run: python3 scripts/ssh-secret-real-migration.py verify -
      - name: Compare original/new Portal Secret bytes (Pass/Fail only)
        if: inputs.test_type == 'secret-rename-verify-workflow'
        env:
          SPEC733_WORKFLOW_SECRET_KIND: portal
          SPEC733_OLD_SECRET: ${{ secrets.MCP_PORTAL_CLIENT_SECRET }}
          SPEC733_NEW_SECRET: ${{ secrets.WORKFLOW_MCP_PORTAL_CLIENT_SECRET }}
        run: python3 scripts/workflow-secret-real-migration.py verify -

  legacy-secret-cleanup-readback:
    name: Spec 733 legacy Secret cleanup inventory (GET only)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'lirtual' && inputs.confirm_portal_write == false &&
          contains(fromJSON('["legacy-cleanup-readonly-ssh","legacy-cleanup-readonly-workflow"]'), inputs.test_type) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.test_type == 'legacy-cleanup-readonly-ssh' && 'ssh-mcp-worker' || 'workflow-mcp-worker' }}
    concurrency:
      group: worker-release-${{ inputs.test_type == 'legacy-cleanup-readonly-ssh' && 'ssh-mcp-worker' || 'workflow-mcp-worker' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify exact trusted main and old Secret absence (read-only)
        env:
          SELECTED_WORKER: ${{ inputs.test_type == 'legacy-cleanup-readonly-ssh' && 'ssh-mcp-worker' || 'workflow-mcp-worker' }}
          EXPECTED_VERSION_ID: ${{ inputs.cleanup_expected_version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ vars.WORKFLOW_MCP_PORTAL_CLIENT_ID }}
          WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES: ${{ vars.WORKFLOW_GITHUB_ACTION_APPROVED_REPOSITORIES }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
          [[ "$EXPECTED_VERSION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          node scripts/manual-worker-release.mjs cleanup-readback "$SELECTED_WORKER"

  checks:
    name: Pre-acceptance checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["production-native","production-child","production-mcp","production-http","production-github","production-action-task","production-webhook","production-retired-tools","portal-register"]'), inputs.test_type) }}
    uses: ./.github/workflows/ci.yml
    with:
      worker: workflow-mcp-worker

  workflow-production-smoke:
    name: Authenticated Workflow production smoke (no deploy)
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          contains(fromJSON('["production-native","production-child","production-mcp","production-http","production-github","production-action-task","production-webhook","production-retired-tools"]'), inputs.test_type) &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: workflow-production-smoke
      cancel-in-progress: false
    env:
      MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKFLOW_CHILD_SMOKE: ${{ inputs.test_type == 'production-child' }}
      WORKFLOW_MCP_SMOKE: ${{ inputs.test_type == 'production-mcp' }}
      WORKFLOW_HTTP_SMOKE: ${{ inputs.test_type == 'production-http' }}
      WORKFLOW_GITHUB_SMOKE: ${{ inputs.test_type == 'production-github' }}
      WORKFLOW_ACTION_TASK_SMOKE: ${{ inputs.test_type == 'production-action-task' }}
      WORKFLOW_WEBHOOK_SMOKE: ${{ inputs.test_type == 'production-webhook' }}
      WORKFLOW_RETIRED_TOOLS_SMOKE: ${{ inputs.test_type == 'production-retired-tools' }}
      WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
      WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ vars.WORKFLOW_MCP_PORTAL_CLIENT_ID }}
      WORKFLOW_MCP_PORTAL_CLIENT_SECRET: ${{ secrets.WORKFLOW_MCP_PORTAL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify authenticated Workflow/MCP/GitHub production and remove randomized test records
        run: |
          if [[ "$WORKFLOW_CHILD_SMOKE" == "true" ]]; then
            node apps/workflow-mcp-worker/tests/production-child-smoke.mjs
          else
            node apps/workflow-mcp-worker/tests/production-smoke.mjs
          fi

  workflow-mcp-portal-probe:
    name: Authenticated MCP Portal read-only check (no deploy)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.test_type == 'portal-readonly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: workflow-mcp-worker
    env:
      WORKFLOW_MCP_PORTAL_CLIENT_ID: ${{ vars.WORKFLOW_MCP_PORTAL_CLIENT_ID }}
      WORKFLOW_MCP_PORTAL_CLIENT_SECRET: ${{ secrets.WORKFLOW_MCP_PORTAL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Workflow-only Portal MCP authentication, tools/list, and workflow_list
        run: node --experimental-strip-types apps/workflow-mcp-worker/tests/mcp-portal-acceptance.mjs

  workflow-github-action-result-cloud:
    name: Real GitHub OIDC + isolated D1 Task result (no production)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.test_type == 'github-action-result-cloud' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: workflow-mcp-worker
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: workflow-action-result-isolated
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify actual Task ingress with real GitHub JWT and disposable D1
        run: node --experimental-strip-types apps/workflow-mcp-worker/tests/github-action-result-cloud.mjs

  workflow-portal-register:
    name: Register existing Workflow MCP in One-MCP Portal (no Worker deploy)
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.test_type == 'portal-register' &&
          inputs.confirm_portal_write == true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: worker-release-workflow-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify current trusted main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - name: Register and verify existing Workflow MCP upstream
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-workflow-portal.mjs
