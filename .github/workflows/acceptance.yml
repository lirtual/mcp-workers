name: Workflow Acceptance

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: Acceptance type (Portal registration changes production configuration)
        required: true
        type: choice
        options:
          - production-native
          - production-mcp
          - production-github
          - production-action-task
          - production-webhook
          - production-session-data
          - portal-readonly
          - github-action-result-cloud
          - portal-register
      session_run_id:
        description: Existing temporary Spec 288 Windows Run ID; never contains sensitive values
        type: string
        required: false
      expected_session_state:
        description: Expected owner-only Session read status
        type: choice
        options:
          - ready
          - unavailable
        default: ready
        required: false
      confirm_portal_write:
        description: Explicitly authorize production Portal configuration changes (portal-register only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  checks:
    name: Pre-acceptance checks
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["production-native","production-mcp","production-github","production-action-task","production-webhook","production-session-data","portal-register"]'), inputs.test_type) }}
    uses: ./.github/workflows/ci.yml
    with:
      worker: workflow-mcp-worker

  workflow-production-smoke:
    name: Authenticated Workflow production smoke (no deploy)
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          contains(fromJSON('["production-native","production-mcp","production-github","production-action-task","production-webhook","production-session-data"]'), inputs.test_type) &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: workflow-production-smoke
      cancel-in-progress: false
    env:
      MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKFLOW_MCP_SMOKE: ${{ inputs.test_type == 'production-mcp' }}
      WORKFLOW_GITHUB_SMOKE: ${{ inputs.test_type == 'production-github' }}
      WORKFLOW_ACTION_TASK_SMOKE: ${{ inputs.test_type == 'production-action-task' }}
      WORKFLOW_WEBHOOK_SMOKE: ${{ inputs.test_type == 'production-webhook' }}
      WORKFLOW_SESSION_DATA_SMOKE: ${{ inputs.test_type == 'production-session-data' }}
      WORKFLOW_SESSION_DATA_RUN_ID: ${{ inputs.session_run_id }}
      WORKFLOW_SESSION_DATA_EXPECTED_STATUS: ${{ inputs.expected_session_state }}
      WORKFLOW_GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_DISPATCH_TOKEN }}
      MCP_PORTAL_CLIENT_ID: ${{ vars.MCP_PORTAL_CLIENT_ID }}
      MCP_PORTAL_CLIENT_SECRET: ${{ secrets.MCP_PORTAL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify authenticated Workflow/MCP/GitHub production and remove randomized test records
        run: node apps/workflow-mcp-worker/tests/production-smoke.mjs

  workflow-mcp-portal-probe:
    name: Authenticated MCP Portal read-only check (no deploy)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.test_type == 'portal-readonly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: workflow-mcp-worker
    env:
      MCP_PORTAL_CLIENT_ID: ${{ vars.MCP_PORTAL_CLIENT_ID }}
      MCP_PORTAL_CLIENT_SECRET: ${{ secrets.MCP_PORTAL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read-only MCP discovery and one IMA list call
        run: node --experimental-strip-types apps/workflow-mcp-worker/tests/mcp-portal-acceptance.mjs

  workflow-github-action-result-cloud:
    name: Real GitHub OIDC + isolated D1 Task result (no production)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.test_type == 'github-action-result-cloud' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: workflow-mcp-worker
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: workflow-action-result-isolated
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify actual Task ingress with real GitHub JWT and disposable D1
        run: node --experimental-strip-types apps/workflow-mcp-worker/tests/github-action-result-cloud.mjs

  workflow-portal-register:
    name: Register existing Workflow MCP in One-MCP Portal (no Worker deploy)
    needs: checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.test_type == 'portal-register' &&
          inputs.confirm_portal_write == true &&
          needs.checks.result == 'success' &&
          needs.checks.outputs.release_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: workflow-mcp-worker
    concurrency:
      group: worker-release-workflow-mcp-worker
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify current trusted main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git ls-remote origin refs/heads/main | cut -f1)" ]]
      - name: Register and verify existing Workflow MCP upstream
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: node scripts/register-workflow-portal.mjs
