name: One-time Hyperdrive CA visibility check
on:
  push:
    branches: [feat/database-spec-344]
    paths: [.github/workflows/database-hyperdrive-ca-proof-344.yml]
permissions:
  contents: read
jobs:
  certificate-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify repository global Token can read the uploaded test CA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/8bb496011403552e785ea1b834daffdf';
          const header={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const paths=[
            ['ca_certificate',base+'/mtls_certificates/c9a71de0-06b0-4ea2-b2e8-2dfc27fb0d7a'],
            ['ca_list',base+'/mtls_certificates'],
            ['hyperdrive_list',base+'/hyperdrive/configs']
          ];
          for(const [name,url] of paths){
            try{
              const r=await fetch(url,{headers:header,signal:AbortSignal.timeout(10000)});
              const body=await r.json().catch(()=>({}));
              console.log(name,JSON.stringify({http:r.status,success:body.success===true,codes:(body.errors||[]).map(x=>x.code)}));
            }catch{console.log(name,'request_error');}
          }
          NODE
