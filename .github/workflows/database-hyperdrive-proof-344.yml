name: Database #344 disposable Hyperdrive Aiven proof
on:
  push:
    branches:
      - feat/database-spec-344
    paths:
      - .github/workflows/database-hyperdrive-proof-344.yml
permissions:
  contents: read
jobs:
  hyperdrive-aiven-only:
    name: Aiven-only certificate-verified Hyperdrive smoke
    runs-on: ubuntu-latest
    environment: database-mcp-worker
    timeout-minutes: 12
    concurrency:
      group: database-344-hyperdrive-proof
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PG_PASSWORD: ${{ secrets.DATABASE_TEST_POSTGRES_PASSWORD }}
      MYSQL_PASSWORD: ${{ secrets.DATABASE_TEST_MYSQL_PASSWORD }}
      CA_CERTIFICATE_ID: c9a71de0-06b0-4ea2-b2e8-2dfc27fb0d7a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate isolated test inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/feat/database-spec-344" ]]
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]
          [[ -n "$PG_PASSWORD" && -n "$MYSQL_PASSWORD" && -n "$CA_CERTIFICATE_ID" ]]
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create two disposable Hyperdrive configurations with strict CA and hostname verification
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const file = process.env.RUNNER_TEMP + '/db344-hd-ids.json';
          const ids = {};
          const save = () => writeFileSync(file, JSON.stringify(ids), {mode:0o600});
          const origins = [
            { label: 'postgres', scheme:'postgres', database:'database-mcp-test-postgres',
              host:'postgresql-zeroverse.d.aivencloud.com', password:process.env.PG_PASSWORD, sslmode:'verify-full' },
            { label: 'mysql', scheme:'mysql', database:'database-mcp-test-mysql',
              host:'mysql-zeroverse.d.aivencloud.com', password:process.env.MYSQL_PASSWORD, sslmode:'VERIFY_IDENTITY' }
          ];
          for (const origin of origins) {
            const body = {
              name: 'db344-hd-' + origin.label + '-' + process.env.GITHUB_RUN_ID,
              origin: {scheme:origin.scheme, database:origin.database, host:origin.host,
                port:18691, user:'test', password:origin.password},
              mtls:{ca_certificate_id:process.env.CA_CERTIFICATE_ID,sslmode:origin.sslmode},
              caching:{disabled:true}, origin_connection_limit:5
            };
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/hyperdrive/configs', {
              method:'POST',
              headers:{authorization:'Bearer '+apiToken,'content-type':'application/json'},
              body:JSON.stringify(body), signal:AbortSignal.timeout(30000)
            });
            const json = await response.json().catch(()=>({}));
            if(!response.ok || !json.success || !json.result?.id)
              throw Error('Hyperdrive '+origin.label+' create failed: HTTP '+response.status+
                ' code '+String(json.errors?.[0]?.code ?? 'unknown'));
            ids[origin.label] = json.result.id;
            save();
            if(json.result.mtls?.sslmode !== origin.sslmode ||
               json.result.mtls?.ca_certificate_id !== process.env.CA_CERTIFICATE_ID)
              throw Error('Hyperdrive '+origin.label+' TLS configuration readback mismatch');
            console.log(origin.label+': strict TLS configuration created and read back');
          }
          NODE
      - name: Deploy isolated bearer-protected Hyperdrive probe Worker
        shell: bash
        run: |
          set -euo pipefail
          cd apps/database-mcp-worker
          cat > src/hyperdrive-proof-344.ts <<'TS'
          import { Client } from 'pg';
          import mysql from 'mysql2/promise';
          interface Env {
            PROBE_TOKEN: string;
            HD_PG: { connectionString: string };
            HD_MYSQL: { connectionString: string };
          }
          export default {
            async fetch(request: Request, env: Env): Promise<Response> {
              if (request.method !== 'POST' || new URL(request.url).pathname !== '/run')
                return new Response('Not found', { status:404 });
              if (!env.PROBE_TOKEN || request.headers.get('authorization') !== 'Bearer '+env.PROBE_TOKEN)
                return new Response('Forbidden', { status:403 });
              const result: Record<string,unknown> = {};
              let stage = 'pg_connect';
              const pg = new Client({connectionString:env.HD_PG.connectionString, ssl:false,
                connectionTimeoutMillis:10000});
              try {
                await pg.connect();
                stage = 'pg_select';
                const q = await pg.query('SELECT 1 AS probe, (SELECT ssl FROM pg_stat_ssl WHERE pid=pg_backend_pid()) AS tls');
                result.postgres = {read:q.rows[0]?.probe===1,tls:q.rows[0]?.tls===true};
              } catch(error) {
                const code = error && typeof error==='object' && 'code' in error ?
                  String((error as {code:unknown}).code) : 'unknown';
                result.postgres = {stage,read:false,code:/^[A-Z0-9_]{1,45}$/.test(code)?code:'unknown'};
              } finally { await pg.end().catch(()=>{}); }
              stage = 'mysql_connect';
              let connection: Awaited<ReturnType<typeof mysql.createConnection>> | undefined;
              try {
                connection = await mysql.createConnection({uri:env.HD_MYSQL.connectionString,connectTimeout:10000});
                stage = 'mysql_select';
                const [one] = await connection.query('SELECT 1 AS probe');
                const [tls] = await connection.query("SHOW SESSION STATUS LIKE 'Ssl_cipher'");
                const rows = one as Array<{probe:number}>;
                const cipher = tls as Array<{Value:string}>;
                result.mysql = {read:rows[0]?.probe===1,tls:Boolean(cipher[0]?.Value)};
              } catch(error) {
                const code = error && typeof error==='object' && 'code' in error ?
                  String((error as {code:unknown}).code) : 'unknown';
                result.mysql = {stage,read:false,code:/^[A-Z0-9_]{1,45}$/.test(code)?code:'unknown'};
              } finally { await connection?.end().catch(()=>{}); }
              return Response.json(result,{headers:{'Cache-Control':'no-store'}});
            }
          };
          TS
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {randomBytes} from 'node:crypto';
          const ids=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/db344-hd-ids.json','utf8'));
          const token=randomBytes(32).toString('hex');
          writeFileSync(process.env.RUNNER_TEMP+'/db344-hd-token',token,{mode:0o600});
          writeFileSync(process.env.RUNNER_TEMP+'/db344-hd-secret.json',
            JSON.stringify({PROBE_TOKEN:token}),{mode:0o600});
          writeFileSync('.wrangler-hyperdrive-proof.json',
            JSON.stringify({name:'db344-hd-proof-'+process.env.GITHUB_RUN_ID,
              main:'src/hyperdrive-proof-344.ts', compatibility_date:'2026-09-12',
              compatibility_flags:['nodejs_compat'],workers_dev:true,preview_urls:false,
              hyperdrive:[{binding:'HD_PG',id:ids.postgres},
                {binding:'HD_MYSQL',id:ids.mysql}]}),{mode:0o600});
          NODE
          pnpm exec wrangler deploy --config .wrangler-hyperdrive-proof.json \
            --secrets-file "$RUNNER_TEMP/db344-hd-secret.json" \
            > "$RUNNER_TEMP/db344-hd-deploy.log" 2>&1 || {
              echo 'Temporary Worker deployment failed (details redacted)'
              exit 1
            }
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const log=readFileSync(process.env.RUNNER_TEMP+'/db344-hd-deploy.log','utf8');
          const url=log.match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev\b/)?.[0];
          if(!url) throw Error('Temporary Worker URL missing');
          appendFileSync(process.env.GITHUB_ENV,'DB344_HD_PROBE_URL='+url+'\n');
          NODE
      - name: Verify both Aiven databases through real Cloudflare Workers Hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const token=readFileSync(process.env.RUNNER_TEMP+'/db344-hd-token','utf8');
          let body;
          for(let i=0;i<4;i++){
            const response=await fetch(process.env.DB344_HD_PROBE_URL+'/run',{
              method:'POST',headers:{authorization:'Bearer '+token},
              signal:AbortSignal.timeout(45000)});
            if(response.ok){body=await response.json();break;}
            if(![404,502,503].includes(response.status)) throw Error('Probe HTTP '+response.status);
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          if(!body) throw Error('Probe unreachable');
          for(const dialect of ['postgres','mysql']){
            const item=body[dialect];
            console.log(dialect,JSON.stringify(item));
            if(!item?.read || !item?.tls) process.exitCode=1;
          }
          NODE
      - name: Always remove disposable Worker and Hyperdrive configurations
        if: always()
        shell: bash
        run: |
          set +e
          cd apps/database-mcp-worker
          if [[ -f .wrangler-hyperdrive-proof.json ]]; then
            pnpm exec wrangler delete --config .wrangler-hyperdrive-proof.json \
              --name "db344-hd-proof-$GITHUB_RUN_ID" --force >/dev/null 2>&1 || \
              echo 'CLEANUP_WARNING: Worker deletion unverified'
          fi
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync,rmSync} from 'node:fs';
          const path=process.env.RUNNER_TEMP+'/db344-hd-ids.json';
          if(existsSync(path)){
            const ids=JSON.parse(readFileSync(path,'utf8'));
            for(const [name,id] of Object.entries(ids)){
              try{
                const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+
                  process.env.CLOUDFLARE_ACCOUNT_ID+'/hyperdrive/configs/'+id,{
                  method:'DELETE',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
                  signal:AbortSignal.timeout(20000)});
                console.log('cleanup '+name+': '+(r.ok?'deleted':'HTTP '+r.status));
              }catch{console.log('CLEANUP_WARNING: '+name+' deletion unverified');}
            }
          }
          for(const p of [path,process.env.RUNNER_TEMP+'/db344-hd-token',
            process.env.RUNNER_TEMP+'/db344-hd-secret.json',
            process.env.RUNNER_TEMP+'/db344-hd-deploy.log',
            '.wrangler-hyperdrive-proof.json','src/hyperdrive-proof-344.ts'])
              rmSync(p,{force:true});
          NODE
